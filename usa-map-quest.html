/* ============ SAVE ============ */
const SAVE_KEY = "usa-map-quest-v1";
let save = {pts:0, mastered:{}, deep:{}, bestFind:0, bestCapital:0, bestNick:0, bestNeighbor:0, bestCompare:0, bestRanger:0, certShown:false};
try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s && typeof s==="object") save = Object.assign(save, s); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
function addPts(n){ save.pts += n; persist(); renderScore(); }
function renderScore(){
  document.getElementById("pts").textContent = save.pts.toLocaleString();
  const m = Object.keys(save.mastered).length;
  document.getElementById("mast").textContent = m;
  document.getElementById("cert-chip").style.display = m >= KEYS.length ? "inline-flex" : "none";
}

/* ============ HELPERS ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function pickN(a,n,except){ return shuffle(a.filter(x=>x!==except)).slice(0,n); }
function ord(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function fmtPop(p){
  if(p>=1e6) return (Math.round(p/1e5)/10).toLocaleString()+" million";
  return (Math.round(p/1000)*1000).toLocaleString();
}
function fmtArea(a){ return a.toLocaleString()+" sq mi"; }
function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function confetti(){
  const colors=["#f5c542","#4f9cf9","#2ecc71","#e253a8","#8b5cf6","#e8913a"];
  for(let i=0;i<36;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=(Math.random()*100)+"vw";
    c.style.background=pick(colors);
    c.style.animationDuration=(1+Math.random()*1.4)+"s";
    c.style.animationDelay=(Math.random()*.3)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3000);
  }
}

/* ============ MAP SETUP ============ */
const svg = document.getElementById("usmap");
const tooltip = document.getElementById("tooltip");
let mode = "explore";

document.querySelectorAll(".st").forEach(p=>{
  const k = p.dataset.st;
  if(!S[k]) return;
  if(p.tagName==="path") p.style.fill = "var("+REGION_VAR[S[k].rg]+")";
  p.addEventListener("click", ()=>onStateClick(k, p));
  p.addEventListener("mousemove", e=>{
    if((mode==="find" || mode==="detective") && find){ tooltip.style.display="none"; return; }
    tooltip.style.display="block";
    tooltip.style.left=(e.clientX+14)+"px";
    tooltip.style.top=(e.clientY+14)+"px";
    tooltip.innerHTML = "<b>"+S[k].n+"</b><small>"+(k==="DC"?"Federal district":"Capital: "+S[k].c)+"</small>";
  });
  p.addEventListener("mouseleave", ()=>{ tooltip.style.display="none"; });
});

function markMastered(){
  const layer = document.getElementById("starlayer");
  layer.innerHTML = "";
  document.querySelectorAll(".st").forEach(p=>{
    const k=p.dataset.st;
    if(save.mastered[k]){
      p.classList.add("mastered");
      try{
        const b=p.getBBox();
        const t=document.createElementNS("http://www.w3.org/2000/svg","text");
        t.setAttribute("x", b.x+b.width/2); t.setAttribute("y", b.y+b.height/2+4);
        t.setAttribute("class","star-mark"); t.textContent="★";
        layer.appendChild(t);
      }catch(e){}
    } else p.classList.remove("mastered");
  });
}

/* ============ MODES ============ */
const hud = document.getElementById("hud");
function setMode(m){
  mode = m;
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active", b.dataset.mode===m));
  closePanel();
  clearMapFx();
  find = null; neighborGame = null; roadtrip = null; ranger = null;
  hud.classList.remove("show");
  // park markers are only clickable while exploring, and would give away
  // Park Ranger answers — hide them there
  const pl = document.getElementById("parklayer");
  pl.classList.toggle("no-click", m!=="explore");
  pl.style.display = (parksOn && m!=="ranger") ? "" : "none";
  if(m==="find") startFind("find");
  else if(m==="detective") startFind("detective");
  else if(m==="neighbor") startNeighborGame();
  else if(m==="roadtrip") startRoadTrip();
  else if(m==="ranger") startRanger();
}
function endModeEarly(){ setMode("explore"); }
function clearMapFx(){
  document.querySelectorAll(".st").forEach(p=>p.classList.remove(
    "dim","flash-good","flash-bad","pulse","target-hl","trip-start","trip-dest","trip-cur"));
}
function endBtn(){
  return " <button class='ghost-btn' style='padding:4px 10px;font-size:.75rem;margin-left:8px' onclick='endModeEarly()'>✕ End</button>";
}

function onStateClick(k, el){
  if((mode==="find" || mode==="detective") && find){ findClick(k, el); return; }
  if(mode==="neighbor" && neighborGame){ onNeighborMapClick(k, el); return; }
  if(mode==="roadtrip" && roadtrip){ onRoadTripMapClick(k, el); return; }
  if(mode==="ranger" && ranger){ rangerClick(k, el); return; }
  openPanel(k);
}

/* ============ EXPLORE PANEL ============ */
const panel = document.getElementById("panel");
let curState = null;
function openPanel(k){
  curState = k;
  panel.classList.add("show");
  document.getElementById("p-name").textContent = S[k].n + (save.mastered[k] ? " ★" : "");
  document.getElementById("p-sub").textContent =
    (k==="DC" ? "Federal District" : "“"+S[k].nk+"” • "+REGION_NAME[S[k].rg]+" region");
  document.getElementById("p-tabs").style.display = "flex";
  document.getElementById("quiz-tab").style.display = (k==="DC") ? "none" : "";
  showTab("learn");
  panel.scrollIntoView({behavior:"smooth", block:"nearest"});
}
function closePanel(){ panel.classList.remove("show"); curState=null; }
function showTab(t){
  document.querySelectorAll("#p-tabs .tab").forEach(b=>b.classList.toggle("active", b.dataset.tab===t));
  if(t==="learn") renderLearn(); else if(t==="story") renderStory(); else startStateQuiz();
}

function renderStory(){
  const d = S[curState], b = document.getElementById("p-body");
  const revealed = !!save.deep[curState];
  b.innerHTML =
    '<div class="big-idea">💡 ' + esc(d.big) + '</div>' +
    '<span class="pt-chip">' + esc(d.pt) + ' state</span>' +
    '<p class="story-p">' + esc(d.story) + '</p>' +
    '<div class="chain"><div class="cap">Cause → effect: how the pieces connect</div>' +
      d.chain.map(step=>'<div class="chain-step">'+esc(step)+'</div>')
        .join('<div class="chain-arrow">↓</div>') +
    '</div>' +
    '<div class="deep-box">' +
      '<div class="dq">🤔 ' + esc(d.dq) + '</div>' +
      (revealed
        ? '<div class="da">' + esc(d.da) + '</div>'
        : '<div style="font-size:.78rem;color:var(--muted);margin-bottom:8px">Think about it first — say your answer out loud. Then compare.</div>' +
          '<button class="ghost-btn" style="padding:7px 14px;font-size:.85rem" onclick="revealDeep()">💭 Reveal a strong answer (+5)</button>') +
    '</div>';
}
function revealDeep(){
  if(!save.deep[curState]){ save.deep[curState] = true; addPts(5); }
  renderStory();
}

/* ============ NATIONAL PARKS ============ */
let parksOn = false;
function toggleParks(){
  parksOn = !parksOn;
  document.getElementById("parklayer").style.display = (parksOn && mode!=="ranger") ? "" : "none";
  document.getElementById("parks-toggle").textContent = parksOn ? "🏞️ Hide national parks" : "🏞️ Show national parks";
}
function parkPos(p){
  if(p.abs) return p.abs;
  const el = document.querySelector('.st[data-st="'+p.st+'"]');
  if(!el) return null;
  const b = el.getBBox();
  return [b.x + p.fx*b.width, b.y + p.fy*b.height];
}
function buildParkMarkers(){
  const layer = document.getElementById("parklayer");
  const NS = "http://www.w3.org/2000/svg";
  PARKS.forEach((p,i)=>{
    const pos = parkPos(p);
    if(!pos) return;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", pos[0]); c.setAttribute("cy", pos[1]); c.setAttribute("r", 3.5);
    c.setAttribute("class", "park-dot");
    c.addEventListener("click", e=>{ e.stopPropagation(); if(mode==="explore") openParkPanel(i); });
    c.addEventListener("mousemove", e=>{
      tooltip.style.display="block";
      tooltip.style.left=(e.clientX+14)+"px"; tooltip.style.top=(e.clientY+14)+"px";
      tooltip.innerHTML = "<b>🏞️ "+esc(p.n)+" NP</b><small>"+esc(p.hl)+"</small>";
    });
    c.addEventListener("mouseleave", ()=>{ tooltip.style.display="none"; });
    layer.appendChild(c);
    if(p.abs){ // territory parks get a small label since they have no state shape
      const t = document.createElementNS(NS, "text");
      t.setAttribute("x", pos[0]+6); t.setAttribute("y", pos[1]+2.5);
      t.setAttribute("class", "park-label");
      t.textContent = p.n;
      layer.appendChild(t);
    }
  });
}
function openParkPanel(i){
  const p = PARKS[i];
  const stateName = p.abs ? (p.n==="Virgin Islands" ? "U.S. Virgin Islands (territory)" : "American Samoa (territory)")
    : (p.sts || [p.st]).map(s=>S[s].n).join(" / ");
  curState = null;
  panel.classList.add("show");
  document.getElementById("p-name").textContent = "🏞️ " + p.n;
  document.getElementById("p-sub").textContent = "National Park • " + stateName;
  document.getElementById("p-tabs").style.display = "none";
  document.getElementById("p-body").innerHTML =
    '<div class="stat-grid">' +
      '<div class="stat"><div class="k">Established</div><div class="v">'+p.yr+'</div></div>' +
      '<div class="stat"><div class="k">Location</div><div class="v">'+esc(stateName)+'</div></div>' +

/* ============ STATE QUIZ (6 questions) ============ */
let quiz = null;
function buildStateQuiz(k){
  const d = S[k];
  const others = KEYS.filter(x=>x!==k);
  const qs = [];
  // 1. capital
  qs.push({q:"What is the capital of "+d.n+"?",
    opts: shuffle([d.c, ...pickN(others.map(x=>S[x].c).filter(c=>c!==d.c), 3)]),
    a: d.c, why: d.c+" has been "+d.n+"'s capital."});
  // 2. nickname
  qs.push({q:"Which nickname belongs to "+d.n+"?",
    opts: shuffle([d.nk, ...pickN(others.map(x=>S[x].nk), 3)]),
    a: d.nk, why: d.n+" is “"+d.nk+"”."});
  // 3. largest city
  const cityPool = others.map(x=>S[x].lc).filter(c=>c!==d.lc && c!==d.c);
  const cityOpts = [d.lc, ...(d.lc!==d.c ? [d.c] : []), ...pickN(cityPool, d.lc!==d.c ? 2 : 3)];
  qs.push({q:"What is the largest city in "+d.n+"?",
    opts: shuffle(cityOpts), a: d.lc,
    why: d.lc + (d.lc===d.c ? " — the capital is also the biggest city." : " is bigger than the capital, "+d.c+".")});
  // 4. statehood year
  const yrPool = [...new Set(others.map(x=>S[x].yr).filter(y=>y!==d.yr))];
  yrPool.sort((a,b)=>Math.abs(a-d.yr)-Math.abs(b-d.yr));
  qs.push({q:"In what year did "+d.n+" become a state?",
    opts: shuffle([d.yr, ...shuffle(yrPool.slice(0,8)).slice(0,3)]).map(String),
    a: String(d.yr), why: d.n+" joined the Union in "+d.yr+" as the "+ord(d.ord)+" state."});
  // 5. population
  const popOpts = [fmtPop(d.pop)];
  [0.32, 2.6, 7.5].forEach(m=>{
    let v = fmtPop(d.pop*m), tries=0;
    while(popOpts.includes(v) && tries++<5) v = fmtPop(d.pop*m*1.6);
    popOpts.push(v);
  });
  qs.push({q:"About how many people live in "+d.n+"?",
    opts: shuffle(popOpts), a: fmtPop(d.pop),
    why: "About "+fmtPop(d.pop)+" — the "+ord(d.pr)+" most populous state."});
  // 6. area rank
  const rankOpts = new Set([d.ar]);
  while(rankOpts.size<4){ const r = d.ar + (Math.floor(Math.random()*30)-15); if(r>=1 && r<=50) rankOpts.add(r); }
  qs.push({q:"Where does "+d.n+" rank in total area among the 50 states?",
    opts: shuffle([...rankOpts]).map(r=>ord(r)+" largest"), a: ord(d.ar)+" largest",
    why: d.n+" covers "+fmtArea(d.area)+" — the "+ord(d.ar)+" largest state."});
  return qs;
}
function startStateQuiz(){
  quiz = {k:curState, qs:buildStateQuiz(curState), i:0, score:0};
  renderQuizQ();
}
function renderQuizQ(){
  const b = document.getElementById("p-body");
  if(quiz.i >= quiz.qs.length){ return renderQuizResult(); }
  const q = quiz.qs[quiz.i];
  b.innerHTML =
    '<div class="q-count">Question '+(quiz.i+1)+' of '+quiz.qs.length+' • Score: '+quiz.score+'</div>' +
    '<div class="q-text">'+esc(q.q)+'</div>' +
    q.opts.map(o=>'<button class="opt" data-v="'+esc(o)+'">'+esc(o)+'</button>').join("") +
    '<div class="feedback" id="q-fb"></div>';
  b.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>answerQuizQ(btn, q);
  });
}
function answerQuizQ(btn, q){
  const b = document.getElementById("p-body");
  const fb = document.getElementById("q-fb");
  const right = btn.dataset.v === q.a;
  b.querySelectorAll(".opt").forEach(o=>{
    o.disabled = true;
    if(o.dataset.v === q.a) o.classList.add("correct");
  });
  if(right){ quiz.score++; addPts(10); fb.textContent = "✅ +10 — " + q.why; fb.className="feedback good"; }
  else { btn.classList.add("wrong"); fb.textContent = "❌ " + q.why; fb.className="feedback bad"; }
  const nx = document.createElement("button");
  nx.className = "next-btn"; nx.textContent = (quiz.i+1 < quiz.qs.length) ? "Next →" : "See result";
  nx.onclick = ()=>{ quiz.i++; renderQuizQ(); };
  fb.after(nx);
}
function renderQuizResult(){
  const b = document.getElementById("p-body");
  const passed = quiz.score >= 5;
  const already = !!save.mastered[quiz.k];
  if(passed && !already){
    save.mastered[quiz.k] = true; save.pts += 25; persist(); renderScore(); markMastered(); confetti();
    checkCertificate();

  b.innerHTML =
    '<div class="result-box">' +

      '<p style="margin:8px 0 16px">'+
        (passed ? (already ? "Great — still mastered! 🏆" : "🎉 <b>"+S[quiz.k].n+" mastered!</b> +25 bonus points") :
          "Score 5 or more to master "+S[quiz.k].n+". Check the Learn tab and try again!") +
      '</p>' +
      '<button class="primary-btn" onclick="startStateQuiz()">🔁 Play again</button> ' +
      '<button class="ghost-btn" onclick="showTab(\'learn\')">📖 Learn</button>' +
    '</div>';

/* ============ ROAD TRIP ============ */
let roadtrip = null;
const ROAD_POOL = KEYS.filter(k => S[k].nb.length>0);
function bfsDist(a,b){
  if(a===b) return 0;
  const seen = new Set([a]); let frontier=[a], dist=0;
  while(frontier.length){
    dist++;
    const next=[];
    for(const s of frontier){
      for(const nb of S[s].nb){
        if(!seen.has(nb)){
          if(nb===b) return dist;
          seen.add(nb); next.push(nb);
        }
      }
    }
    frontier = next;
  }
  return Infinity;
}
function shortestPath(a,b){
  if(a===b) return [a];
  const prev={}; const seen=new Set([a]); let frontier=[a];
  while(frontier.length){
    const next=[];
    for(const s of frontier){
      for(const nb of S[s].nb){
        if(!seen.has(nb)){
          seen.add(nb); prev[nb]=s;
          if(nb===b){
            const p=[b]; let c=b; while(c!==a){ c=prev[c]; p.unshift(c); } return p;
          }
          next.push(nb);
        }
      }
    }
    frontier = next;
  }
  return [a,b];
}
function startRoadTrip(){
  let start, dest, dist, tries=0;
  do{
    start = pick(ROAD_POOL); dest = pick(ROAD_POOL);
    dist = bfsDist(start, dest);
    tries++;
  } while((dist<4 || dist===Infinity || start===dest) && tries<200);
  roadtrip = {start, dest, dist, path:[start]};
  hud.classList.add("show");
  renderRoadTrip();
}
function renderRoadTrip(){
  clearMapFx();
  const cur = roadtrip.path[roadtrip.path.length-1];
  [roadtrip.start].forEach(s=>{ const el=document.querySelector('.st[data-st="'+s+'"]'); if(el) el.classList.add("trip-start"); });
  [roadtrip.dest].forEach(s=>{ const el=document.querySelector('.st[data-st="'+s+'"]'); if(el) el.classList.add("trip-dest"); });
  const curEl = document.querySelector('.st[data-st="'+cur+'"]');
  if(curEl) curEl.classList.add("trip-cur");
  hud.innerHTML = "🚗 Road Trip — get from <b>"+S[roadtrip.start].n+"</b> to <b>"+S[roadtrip.dest].n+"</b>." +
    " You're in <span class='big'>"+S[cur].n+"</span>. Click a bordering state to drive there. Hops so far: "+(roadtrip.path.length-1) +
    endBtn() +
    " <button class='ghost-btn' style='padding:4px 10px;font-size:.75rem;margin-left:6px' onclick='giveUpRoadTrip()'>Show a route</button>";
}
function onRoadTripMapClick(k, el){
  const cur = roadtrip.path[roadtrip.path.length-1];
  if(k===cur) return;
  if(!S[cur].nb.includes(k)){
    el.classList.add("flash-bad");
    setTimeout(()=>el.classList.remove("flash-bad"), 500);
    return;
  }
  roadtrip.path.push(k);
  addPts(5);
  if(k===roadtrip.dest){ finishRoadTrip(); return; }
  renderRoadTrip();
}
function finishRoadTrip(){
  hud.classList.remove("show");
  const hops = roadtrip.path.length-1;
  const bonus = hops<=roadtrip.dist ? 30 : (hops<=roadtrip.dist+2 ? 15 : 0);
  if(bonus) addPts(bonus);
  const routeNames = roadtrip.path.map(s=>S[s].n).join(" → ");
  showOverlay(
    '<h2>🚗 Road Trip complete!</h2>' +
    '<div class="result-box">' +
      '<div class="score">'+hops+' hops</div>' +
      '<p style="margin:8px 0 10px">Shortest possible route: '+roadtrip.dist+' hops.'+(bonus?" +"+bonus+" efficiency bonus!":"")+'</p>' +
      '<p style="font-size:.82rem;color:var(--muted);margin-bottom:16px">'+esc(routeNames)+'</p>' +
      '<button class="primary-btn" onclick="hideOverlay(); startRoadTrip()">🔁 New trip</button> ' +
      '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button>' +
    '</div>'
  );
  confetti();
  roadtrip = null;
}
function giveUpRoadTrip(){
  const path = shortestPath(roadtrip.start, roadtrip.dest);
  hud.classList.remove("show");
  showOverlay(
    '<h2>🚗 Road Trip — a route</h2>' +
    '<div class="result-box"><p style="margin:10px 0 16px">'+esc(path.map(s=>S[s].n).join(" → "))+'</p>' +
    '<button class="primary-btn" onclick="hideOverlay(); startRoadTrip()">🔁 New trip</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button></div>'
  );
  roadtrip = null;
}

function renderCompareQ(){
  if(compare.i >= compare.rounds) return endCompare();
  const statKey = pick(["pop","area"]);
  let a,b;
  do{ a=pick(KEYS); b=pick(KEYS); } while(a===b);
  const av = S[a][statKey], bv = S[b][statKey];
  const correct = av>bv ? a : b;
  const label = statKey==="pop" ? "more people" : "more land area";
  showOverlay(

    '<h2>⚖️ Compare Battle</h2>' +
    '<div class="sub">Round '+(compare.i+1)+'/'+compare.rounds+' • Score '+compare.score+(compare.streak>=3?' • 🔥 streak '+compare.streak:'')+'</div>' +
    '<div class="q-text">Which state has '+label+'?</div>' +
    '<button class="opt" data-v="'+a+'">'+esc(S[a].n)+'</button>' +
    '<button class="opt" data-v="'+b+'">'+esc(S[b].n)+'</button>' +
    '<div class="feedback" id="cmp-fb"></div>'
  );
  const box = document.getElementById("ov-body");
  const fmt = statKey==="pop" ? fmtPop : fmtArea;
  box.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      box.querySelectorAll(".opt").forEach(o=>{ o.disabled=true; if(o.dataset.v===correct) o.classList.add("correct"); });
      const fb = document.getElementById("cmp-fb");
      const right = btn.dataset.v===correct;
      if(right){
        compare.streak++; const bonus = compare.streak>=3 ? 5 : 0;
        compare.score += 10+bonus; addPts(10+bonus);
        fb.textContent = "✅ +"+(10+bonus)+" — "+S[a].n+": "+fmt(av)+" • "+S[b].n+": "+fmt(bv);
        fb.className = "feedback good";
      } else {
        btn.classList.add("wrong"); compare.streak=0;
        fb.textContent = "❌ "+S[a].n+": "+fmt(av)+" • "+S[b].n+": "+fmt(bv);
        fb.className = "feedback bad";
      }
      const nx = document.createElement("button"); nx.className="next-btn";
      nx.textContent = compare.i+1<compare.rounds ? "Next →" : "See result";
      nx.onclick = ()=>{ compare.i++; renderCompareQ(); };
      box.appendChild(nx);
    };
  });
}
function quitCompare(){ compare=null; hideOverlay(); setMode("explore"); }
function endCompare(){
  if(compare.score > save.bestCompare){ save.bestCompare = compare.score; persist(); }
  showOverlay(
    '<h2>⚖️ Compare Battle — done!</h2>' +
    '<div class="result-box"><div class="score">'+compare.score+'</div>' +
    '<p style="margin:8px 0 16px">Best: '+save.bestCompare+'</p>' +
    '<button class="primary-btn" onclick="startCompare()">🔁 Play again</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button></div>'
  );
  if(compare.score >= 90) confetti();
  compare = null;
}

/* ============ CERTIFICATE ============ */
function checkCertificate(){
  if(Object.keys(save.mastered).length >= KEYS.length && !save.certShown){
    save.certShown = true; persist();
    showCertificate(true);
  }
}
function showCertificate(justEarned){
  showOverlay(
    '<div style="text-align:center">' +
    (justEarned ? '<h2>🎓 Congratulations!</h2><div class="sub">You mastered all 50 states!</div>' : '<h2>🎓 Your Certificate</h2>') +
    '<div style="border:2px solid var(--gold); border-radius:14px; padding:24px; margin:16px 0; background:var(--panel2)">' +
      '<div style="font-size:.75rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase">United States Explorer</div>' +
      '<div style="font-size:1.5rem;font-weight:800;color:var(--gold);margin:10px 0">Certificate of Completion</div>' +
      '<div style="font-size:.9rem;color:var(--muted)">Awarded for mastering all 50 U.S. states</div>' +
    '</div>' +
    '<button class="primary-btn" onclick="window.print()">🖨️ Print</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay()">Close</button>' +
    '</div>'
  );
  if(justEarned) confetti();
}

/* ============ SPRINTS (capital / nickname) ============ */
let sprint = null;
function startSprint(kind){
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active", b.dataset.mode===(kind==="capital"?"sprint":"nick")));
  hud.classList.remove("show"); find=null; neighborGame=null; roadtrip=null; ranger=null; closePanel(); clearMapFx();
  sprint = {kind, states: shuffle(KEYS).slice(0,10), i:0, score:0, streak:0};
  renderSprintQ();
}
function renderSprintQ(){
  if(sprint.i >= sprint.states.length) return endSprint();
  const k = sprint.states[sprint.i], d = S[k];
  const isCap = sprint.kind==="capital";
  const correct = isCap ? d.c : d.nk;
  const pool = KEYS.filter(x=>x!==k).map(x=> isCap ? S[x].c : S[x].nk).filter(v=>v!==correct);
  const opts = shuffle([correct, ...shuffle(pool).slice(0,3)]);
  showOverlay(
    '<button class="close" title="Exit sprint" onclick="quitSprint()">✕</button>' +
    '<h2>'+(isCap?'🏛️ Capital Sprint':'🏷️ Nickname Sprint')+'</h2>' +
    '<div class="sub">Question '+(sprint.i+1)+'/10 • Score '+sprint.score+
      (sprint.streak>=3 ? ' • 🔥 streak '+sprint.streak : '')+'</div>' +
    '<div class="q-text">'+esc(isCap ? "What is the capital of "+d.n+"?" : "What is the nickname of "+d.n+"?")+'</div>'
  );
  const box = document.getElementById("ov-body");
  opts.forEach(o=>{
    const btn = document.createElement("button");
    btn.className="opt"; btn.textContent=o;
    btn.onclick = ()=>{
      box.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.textContent===correct) b.classList.add("correct"); });
      const fb = document.createElement("div"); fb.className="feedback";
      if(o===correct){
        sprint.streak++; const bonus = sprint.streak>=3 ? 5 : 0;
        sprint.score += 10+bonus; addPts(10+bonus);
        fb.textContent = "✅ +"+(10+bonus)+(bonus?" (streak bonus!)":""); fb.className="feedback good";
      } else {
        btn.classList.add("wrong"); sprint.streak=0;
        fb.textContent = "❌ "+d.n+" → "+correct; fb.className="feedback bad";
      }
      box.appendChild(fb);
      const nx = document.createElement("button"); nx.className="next-btn";
      nx.textContent = sprint.i+1<10 ? "Next →" : "See result";
      nx.onclick = ()=>{ sprint.i++; renderSprintQ(); };
      box.appendChild(nx);
    };
    box.appendChild(btn);
  });
}
function quitSprint(){
  sprint = null;
  hideOverlay();
  setMode("explore");
}
function endSprint(){
  const isCap = sprint.kind==="capital";
  const bestKey = isCap ? "bestCapital" : "bestNick";
  if(sprint.score > save[bestKey]){ save[bestKey] = sprint.score; persist(); }
  showOverlay(
    '<h2>'+(isCap?'🏛️ Capital Sprint':'🏷️ Nickname Sprint')+' — done!</h2>' +
    '<div class="result-box"><div class="score">'+sprint.score+'</div>' +
    '<p style="margin:8px 0 16px">Best: '+save[bestKey]+'</p>' +
    '<button class="primary-btn" onclick="startSprint(\''+sprint.kind+'\')">🔁 Play again</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button></div>'
  );
  if(sprint.score >= 90) confetti();
  sprint = null;
}

/* ============ OVERLAY ============ */
function showOverlay(html){
  document.getElementById("ov-body").innerHTML = html;
  document.getElementById("overlay").classList.add("show");
}
function hideOverlay(){ document.getElementById("overlay").classList.remove("show"); }

/* ============ INIT ============ */
renderScore();
markMastered();
buildParkMarkers();
</script>
