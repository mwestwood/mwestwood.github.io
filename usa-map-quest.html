<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA Map Quest — Learn the 50 States</title>
<style>
:root{
  --bg:#0e1420; --panel:#161f30; --panel2:#1d2940; --line:#2a3a58;
  --text:#e8edf6; --muted:#93a4c3; --accent:#4f9cf9; --gold:#f5c542;
  --good:#2ecc71; --bad:#e74c5b;
  --ne:#8b5cf6; --se:#e8913a; --mw:#2fb380; --sw:#e05252; --we:#3f8cf2; --dc:#e253a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100%;
  background-image:radial-gradient(1200px 600px at 70% -10%, #16233c 0%, transparent 60%);
}
header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 20px; border-bottom:1px solid var(--line);
}
header h1{font-size:1.15rem; font-weight:700; letter-spacing:.2px}
header h1 span{color:var(--accent)}
.scorebar{display:flex; gap:10px; align-items:center; margin-left:auto; flex-wrap:wrap}
.chip{
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:5px 12px; font-size:.85rem; font-weight:600; white-space:nowrap;
}
.chip b{color:var(--gold)}
.modes{display:flex; gap:8px; padding:12px 20px; flex-wrap:wrap}
.mode-btn{
  background:var(--panel); color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:8px 14px; font-size:.9rem; font-weight:600; cursor:pointer;
  transition:all .15s;
}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn.active{background:var(--accent); border-color:var(--accent); color:#08111f}
#hud{
  display:none; margin:0 20px 6px; padding:10px 16px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line);
  font-size:1rem; font-weight:600; text-align:center;
}
#hud.show{display:block}
#hud .big{font-size:1.2rem; color:var(--gold)}
main{display:flex; gap:16px; padding:8px 20px 24px; align-items:flex-start}
#map-wrap{flex:1; min-width:0; position:relative}
#map-canvas{width:100%}
#map-wrap svg{width:100%; height:auto; display:block}
.st{cursor:pointer; transition:filter .12s, opacity .12s; stroke:#0e1420; stroke-width:.6}
.st:hover{filter:brightness(1.35) saturate(1.2)}
.st.dim{opacity:.35}
.st.flash-good{fill:var(--good) !important}
.st.flash-bad{fill:var(--bad) !important}
.st.pulse{animation:pulse .5s ease-in-out 3; fill:var(--gold) !important}
@keyframes pulse{50%{filter:brightness(1.8)}}
.st.mastered{stroke:var(--gold); stroke-width:1.4}
.st.target-hl{stroke:var(--gold); stroke-width:2.5}
.st.trip-start{stroke:var(--good); stroke-width:2.5}
.st.trip-dest{stroke:var(--gold); stroke-width:2.5}
.st.trip-cur{stroke:#fff; stroke-width:3}
.star-mark{pointer-events:none; font-size:11px; fill:#ffdf6b; text-anchor:middle;
  paint-order:stroke; stroke:#00000088; stroke-width:2px}
.legend{display:flex; gap:14px; flex-wrap:wrap; padding:10px 4px 0; font-size:.8rem; color:var(--muted)}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px}
#tooltip{
  position:fixed; pointer-events:none; z-index:50; display:none;
  background:#0a0f1a; border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; font-size:.85rem; font-weight:600;
}
#tooltip small{display:block; color:var(--muted); font-weight:400}
#panel{
  width:390px; flex-shrink:0; background:var(--panel); border:1px solid var(--line);
  border-radius:16px; padding:18px; display:none; max-height:calc(100vh - 140px);
  overflow-y:auto;
}
#panel.show{display:block}
.close{float:right; background:none; border:none; color:var(--muted);
  font-size:1.3rem; cursor:pointer; line-height:1}
.close:hover{color:var(--text)}
#panel h2{font-size:1.3rem; margin-bottom:2px}
#panel .sub{color:var(--muted); font-size:.85rem; margin-bottom:12px}
.tabs{display:flex; gap:6px; margin-bottom:14px}
.tab{flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:7px 0; font-weight:600; font-size:.85rem; cursor:pointer}
.tab.active{background:var(--accent); border-color:var(--accent); color:#08111f}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
.stat{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 11px}
.stat .k{font-size:.68rem; text-transform:uppercase; letter-spacing:.6px; color:var(--muted)}
.stat .v{font-size:.95rem; font-weight:700; margin-top:2px}
.fact{background:var(--panel2); border-left:3px solid var(--accent); border-radius:8px;
  padding:10px 12px; font-size:.88rem; line-height:1.5; margin-bottom:8px}
.mastered-note{color:var(--gold); font-weight:700; font-size:.9rem; margin:6px 0}
/* quiz */
.q-count{font-size:.8rem; color:var(--muted); margin-bottom:6px}
.q-text{font-size:1rem; font-weight:700; margin-bottom:12px; line-height:1.45}
.opt{
  display:block; width:100%; text-align:left; background:var(--panel2);
  border:1px solid var(--line); color:var(--text); border-radius:10px;
  padding:11px 13px; font-size:.92rem; cursor:pointer; margin-bottom:8px;
  transition:all .12s;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.correct{background:#173f2b; border-color:var(--good)}
.opt.wrong{background:#43202a; border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{min-height:24px; font-size:.88rem; font-weight:600; margin:4px 0 10px}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.next-btn,.primary-btn{
  background:var(--accent); color:#08111f; border:none; border-radius:10px;
  padding:10px 20px; font-size:.95rem; font-weight:700; cursor:pointer;
}
.next-btn:hover,.primary-btn:hover{filter:brightness(1.1)}
.ghost-btn{background:var(--panel2); color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:10px 20px; font-size:.95rem; font-weight:600; cursor:pointer}
.result-box{text-align:center; padding:16px 6px}
.result-box .score{font-size:2.4rem; font-weight:800; color:var(--gold)}
/* overlay (sprint + results) */
#overlay{
  position:fixed; inset:0; background:rgba(5,9,16,.78); z-index:100;
  display:none; align-items:center; justify-content:center; padding:18px;
}
#overlay.show{display:flex}
#overlay .box{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:24px; width:100%; max-width:480px; max-height:92vh; overflow-y:auto;
}
#overlay h2{margin-bottom:4px}
#overlay .sub{color:var(--muted); font-size:.85rem; margin-bottom:16px}
.confetti{position:fixed; top:-12px; z-index:200; pointer-events:none;
  width:9px; height:14px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.7}}
@media (max-width:860px){
  main{flex-direction:column}
  #panel{width:100%; max-height:none}
}
/* Fit the whole app to the viewport on desktop — no page scroll, map scales
   to whatever space is left after the header/mode bar/hud. */
@media (min-width:861px){
  body{display:flex; flex-direction:column; height:100vh; overflow:hidden}
  main{flex:1; min-height:0; align-items:stretch}
  #map-wrap{display:flex; flex-direction:column; min-height:0}
  #map-canvas{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden}
  #map-canvas svg{width:auto; height:auto; max-width:100%; max-height:100%}
  .legend{flex:0 0 auto}
  #panel{height:100%; max-height:100%}
}
</style>
</head>
<body>
<header>
  <h1>🗺️ USA Map <span>Quest</span></h1>
  <div class="scorebar">
    <div class="chip">⭐ <b id="pts">0</b> pts</div>
    <div class="chip">🏆 <b id="mast">0</b>/50 mastered</div>
    <button class="chip" id="cert-chip" style="display:none;cursor:pointer;border-color:var(--gold)" onclick="showCertificate(false)">🎓 Certificate</button>
  </div>
</header>

<div class="modes">
  <button class="mode-btn active" data-mode="explore" onclick="setMode('explore')">🔍 Explore &amp; Learn</button>
  <button class="mode-btn" data-mode="find" onclick="setMode('find')">📍 Find the State</button>
  <button class="mode-btn" data-mode="detective" onclick="setMode('detective')">🕵️ State Detective</button>
  <button class="mode-btn" data-mode="neighbor" onclick="setMode('neighbor')">🧭 Border Patrol</button>
  <button class="mode-btn" data-mode="roadtrip" onclick="setMode('roadtrip')">🚗 Road Trip</button>
  <button class="mode-btn" data-mode="compare" onclick="startCompare()">⚖️ Compare Battle</button>
  <button class="mode-btn" data-mode="sprint" onclick="startSprint('capital')">🏛️ Capital Sprint</button>
  <button class="mode-btn" data-mode="nick" onclick="startSprint('nick')">🏷️ Nickname Sprint</button>
</div>

<div id="hud"></div>

const SAVE_KEY = "usa-map-quest-v1";
let save = {pts:0, mastered:{}, bestFind:0, bestCapital:0, bestNick:0, bestNeighbor:0, bestCompare:0, certShown:false};
try{ const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if(s && typeof s==="object") save = Object.assign(save, s); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
function addPts(n){ save.pts += n; persist(); renderScore(); }

  document.getElementById("pts").textContent = save.pts.toLocaleString();

/* ============ HELPERS ============ */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function pickN(a,n,except){ return shuffle(a.filter(x=>x!==except)).slice(0,n); }
function ord(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function fmtPop(p){
  if(p>=1e6) return (Math.round(p/1e5)/10).toLocaleString()+" million";
  return (Math.round(p/1000)*1000).toLocaleString();
}
function fmtArea(a){ return a.toLocaleString()+" sq mi"; }
function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function confetti(){
  const colors=["#f5c542","#4f9cf9","#2ecc71","#e253a8","#8b5cf6","#e8913a"];
  for(let i=0;i<36;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=(Math.random()*100)+"vw";
    c.style.background=pick(colors);
    c.style.animationDuration=(1+Math.random()*1.4)+"s";
    c.style.animationDelay=(Math.random()*.3)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 3000);
  }
}

/* ============ STATE QUIZ (6 questions) ============ */
let quiz = null;
function buildStateQuiz(k){
  const d = S[k];
  const others = KEYS.filter(x=>x!==k);
  const qs = [];
  // 1. capital
  qs.push({q:"What is the capital of "+d.n+"?",
    opts: shuffle([d.c, ...pickN(others.map(x=>S[x].c).filter(c=>c!==d.c), 3)]),
    a: d.c, why: d.c+" has been "+d.n+"'s capital."});
  // 2. nickname
  qs.push({q:"Which nickname belongs to "+d.n+"?",
    opts: shuffle([d.nk, ...pickN(others.map(x=>S[x].nk), 3)]),
    a: d.nk, why: d.n+" is “"+d.nk+"”."});
  // 3. largest city
  const cityPool = others.map(x=>S[x].lc).filter(c=>c!==d.lc && c!==d.c);
  const cityOpts = [d.lc, ...(d.lc!==d.c ? [d.c] : []), ...pickN(cityPool, d.lc!==d.c ? 2 : 3)];
  qs.push({q:"What is the largest city in "+d.n+"?",
    opts: shuffle(cityOpts), a: d.lc,
    why: d.lc + (d.lc===d.c ? " — the capital is also the biggest city." : " is bigger than the capital, "+d.c+".")});
  // 4. statehood year
  const yrPool = [...new Set(others.map(x=>S[x].yr).filter(y=>y!==d.yr))];
  yrPool.sort((a,b)=>Math.abs(a-d.yr)-Math.abs(b-d.yr));
  qs.push({q:"In what year did "+d.n+" become a state?",
    opts: shuffle([d.yr, ...shuffle(yrPool.slice(0,8)).slice(0,3)]).map(String),
    a: String(d.yr), why: d.n+" joined the Union in "+d.yr+" as the "+ord(d.ord)+" state."});
  // 5. population
  const popOpts = [fmtPop(d.pop)];
  [0.32, 2.6, 7.5].forEach(m=>{
    let v = fmtPop(d.pop*m), tries=0;
    while(popOpts.includes(v) && tries++<5) v = fmtPop(d.pop*m*1.6);
    popOpts.push(v);
  });
  qs.push({q:"About how many people live in "+d.n+"?",
    opts: shuffle(popOpts), a: fmtPop(d.pop),
    why: "About "+fmtPop(d.pop)+" — the "+ord(d.pr)+" most populous state."});
  // 6. area rank
  const rankOpts = new Set([d.ar]);
  while(rankOpts.size<4){ const r = d.ar + (Math.floor(Math.random()*30)-15); if(r>=1 && r<=50) rankOpts.add(r); }
  qs.push({q:"Where does "+d.n+" rank in total area among the 50 states?",
    opts: shuffle([...rankOpts]).map(r=>ord(r)+" largest"), a: ord(d.ar)+" largest",
    why: d.n+" covers "+fmtArea(d.area)+" — the "+ord(d.ar)+" largest state."});
  return qs;
}
function startStateQuiz(){
  quiz = {k:curState, qs:buildStateQuiz(curState), i:0, score:0};
  renderQuizQ();
}
function renderQuizQ(){
  const b = document.getElementById("p-body");
  if(quiz.i >= quiz.qs.length){ return renderQuizResult(); }
  const q = quiz.qs[quiz.i];
  b.innerHTML =
    '<div class="q-count">Question '+(quiz.i+1)+' of '+quiz.qs.length+' • Score: '+quiz.score+'</div>' +
    '<div class="q-text">'+esc(q.q)+'</div>' +
    q.opts.map(o=>'<button class="opt" data-v="'+esc(o)+'">'+esc(o)+'</button>').join("") +
    '<div class="feedback" id="q-fb"></div>';
  b.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>answerQuizQ(btn, q);
  });
}
function answerQuizQ(btn, q){
  const b = document.getElementById("p-body");
  const fb = document.getElementById("q-fb");
  const right = btn.dataset.v === q.a;
  b.querySelectorAll(".opt").forEach(o=>{
    o.disabled = true;
    if(o.dataset.v === q.a) o.classList.add("correct");
  });
  if(right){ quiz.score++; addPts(10); fb.textContent = "✅ +10 — " + q.why; fb.className="feedback good"; }
  else { btn.classList.add("wrong"); fb.textContent = "❌ " + q.why; fb.className="feedback bad"; }
  const nx = document.createElement("button");
  nx.className = "next-btn"; nx.textContent = (quiz.i+1 < quiz.qs.length) ? "Next →" : "See result";
  nx.onclick = ()=>{ quiz.i++; renderQuizQ(); };
  fb.after(nx);
}
function renderQuizResult(){
  const b = document.getElementById("p-body");
  const passed = quiz.score >= 5;
  const already = !!save.mastered[quiz.k];
  if(passed && !already){
    save.mastered[quiz.k] = true; save.pts += 25; persist(); renderScore(); markMastered(); confetti();
    checkCertificate();
  }
  b.innerHTML =
    '<div class="result-box">' +
      '<div class="score">'+quiz.score+'/6</div>' +
      '<p style="margin:8px 0 16px">'+
        (passed ? (already ? "Great — still mastered! 🏆" : "🎉 <b>"+S[quiz.k].n+" mastered!</b> +25 bonus points") :
          "Score 5 or more to master "+S[quiz.k].n+". Check the Learn tab and try again!") +
      '</p>' +
      '<button class="primary-btn" onclick="startStateQuiz()">🔁 Play again</button> ' +
      '<button class="ghost-btn" onclick="showTab(\'learn\')">📖 Learn</button>' +
    '</div>';
}

/* ============ FIND THE STATE / STATE DETECTIVE ============ */
let find = null;
function clueBank(k){
  const d = S[k], nameLower = d.n.toLowerCase();
  const raw = [
    "I'm in the "+REGION_NAME[d.rg]+" region.",
    "My nickname is “"+d.nk+"”.",
    "My capital is "+d.c+".",
    d.lc!==d.c ? "My largest city is "+d.lc+"." : null,
    d.pr<=10 ? "I'm one of the 10 most populous states." : (d.pr>=41 ? "I'm one of the least populous states." : "My population ranks "+ord(d.pr)+" among all states."),
    d.ar<=10 ? "I'm one of the 10 largest states by area." : (d.ar>=41 ? "I'm one of the smallest states by area." : "My area ranks "+ord(d.ar)+" among all states."),
    "I became a state in "+d.yr+"."
  ];
  return raw.filter(l => l && !l.toLowerCase().includes(nameLower));
}
function startFind(kind){
  find = {kind: kind||"find", targets: shuffle(KEYS).slice(0,10), i:0, score:0, lock:false};
  hud.classList.add("show");
  renderFindHud();
}
function renderFindHud(){
  if(find.i >= find.targets.length) return endFind();
  const k = find.targets[find.i];
  if(find.kind==="detective"){
    const clues = shuffle(clueBank(k)).slice(0,3);
    hud.innerHTML = "🕵️ Round "+(find.i+1)+"/10<br>" +
      clues.map(c=>"<div style='font-weight:400;font-size:.92rem'>"+esc(c)+"</div>").join("") +
      "<div style='margin-top:4px'>Which state am I? Click it on the map. Score: "+find.score+"</div>" + endBtn();
  } else {
    hud.innerHTML = "Round "+(find.i+1)+"/10 — Click on: <span class='big'>"+S[k].n+"</span>" +
      " &nbsp;•&nbsp; Score: "+find.score + endBtn();
  }
}
function findClick(k, el){
  if(find.lock) return;
  const target = find.targets[find.i];
  find.lock = true;
  if(k === target){
    el.classList.add("flash-good");
    find.score += 10; addPts(10);
    hud.innerHTML = "✅ Yes! That's "+S[k].n+" — capital "+S[k].c+".";
  } else {
    el.classList.add("flash-bad");
    const correct = document.querySelector('.st[data-st="'+target+'"]');
    if(correct) correct.classList.add("pulse");
    hud.innerHTML = "❌ That's "+S[k].n+". <span class='big'>"+S[target].n+"</span> is flashing gold.";
  }
  setTimeout(()=>{ clearMapFx(); find.i++; find.lock=false; renderFindHud(); }, k===target ? 900 : 1900);
}
function endFind(){
  hud.classList.remove("show");
  const isDet = find.kind==="detective";
  if(find.score > save.bestFind){ save.bestFind = find.score; persist(); }
  showOverlay(
    '<h2>'+(isDet?'🕵️ State Detective':'📍 Find the State')+' — done!</h2>' +
    '<div class="result-box"><div class="score">'+find.score+'/100</div>' +
    '<p style="margin:8px 0 16px">Best: '+save.bestFind+'</p>' +
    '<button class="primary-btn" onclick="hideOverlay(); startFind(\''+find.kind+'\')">🔁 Play again</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button></div>'
  );
  if(find.score >= 80) confetti();
  find = null;
}

/* ============ BORDER PATROL (neighbor challenge) ============ */
let neighborGame = null;
function startNeighborGame(){
  const pool = KEYS.filter(k => S[k].nb.length>=2);
  neighborGame = {targets: shuffle(pool).slice(0,5), i:0, score:0, selected:new Set(), locked:false};
  hud.classList.add("show");
  renderNeighborRound();
}
function renderNeighborRound(){
  if(neighborGame.i >= neighborGame.targets.length) return endNeighborGame();
  clearMapFx();
  neighborGame.selected = new Set();
  neighborGame.locked = false;
  const k = neighborGame.targets[neighborGame.i], d = S[k];
  const el = document.querySelector('.st[data-st="'+k+'"]');
  if(el) el.classList.add("target-hl");
  hud.innerHTML = "🧭 Round "+(neighborGame.i+1)+"/5 — Click every state that borders <span class='big'>"+d.n+"</span> ("+d.nb.length+" total)" +
    " • Found: <span id='nb-found'>0</span>/"+d.nb.length+" • Score: "+neighborGame.score + endBtn() +
    " <button class='ghost-btn' style='padding:4px 10px;font-size:.75rem;margin-left:6px' onclick='revealNeighborRound()'>Reveal</button>";
}
function onNeighborMapClick(k, el){
  if(neighborGame.locked) return;
  const target = neighborGame.targets[neighborGame.i];
  if(k===target || neighborGame.selected.has(k)) return;
  const d = S[target];
  if(d.nb.includes(k)){
    neighborGame.selected.add(k);
    el.classList.add("flash-good");
    const found = document.getElementById("nb-found");
    if(found) found.textContent = neighborGame.selected.size;
    if(neighborGame.selected.size === d.nb.length){
      neighborGame.locked = true;
      neighborGame.score += 20; addPts(20);
      hud.innerHTML = "✅ All "+d.nb.length+" neighbors of "+d.n+" found! +20";
      setTimeout(()=>{ neighborGame.i++; renderNeighborRound(); }, 1400);
    }
  } else {
    el.classList.add("flash-bad");
    setTimeout(()=>el.classList.remove("flash-bad"), 500);
  }
}
function revealNeighborRound(){
  if(neighborGame.locked) return;
  const target = neighborGame.targets[neighborGame.i], d = S[target];
  d.nb.forEach(nk=>{
    if(!neighborGame.selected.has(nk)){
      const el = document.querySelector('.st[data-st="'+nk+'"]');
      if(el) el.classList.add("pulse");
    }
  });
  neighborGame.locked = true;
  hud.innerHTML = "The neighbors of "+d.n+" are flashing gold.";
  setTimeout(()=>{ neighborGame.i++; renderNeighborRound(); }, 2200);
}
function endNeighborGame(){
  hud.classList.remove("show");
  if(neighborGame.score > save.bestNeighbor){ save.bestNeighbor = neighborGame.score; persist(); }
  showOverlay(
    '<h2>🧭 Border Patrol — done!</h2>' +
    '<div class="result-box"><div class="score">'+neighborGame.score+'/100</div>' +
    '<p style="margin:8px 0 16px">Best: '+save.bestNeighbor+'</p>' +
    '<button class="primary-btn" onclick="hideOverlay(); startNeighborGame()">🔁 Play again</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button></div>'
  );
  if(neighborGame.score >= 80) confetti();
  neighborGame = null;
}

/* ============ ROAD TRIP ============ */
let roadtrip = null;
const ROAD_POOL = KEYS.filter(k => S[k].nb.length>0);
function bfsDist(a,b){
  if(a===b) return 0;
  const seen = new Set([a]); let frontier=[a], dist=0;
  while(frontier.length){
    dist++;
    const next=[];
    for(const s of frontier){
      for(const nb of S[s].nb){
        if(!seen.has(nb)){
          if(nb===b) return dist;
          seen.add(nb); next.push(nb);
        }
      }
    }
    frontier = next;
  }
  return Infinity;
}
function shortestPath(a,b){
  if(a===b) return [a];
  const prev={}; const seen=new Set([a]); let frontier=[a];
  while(frontier.length){
    const next=[];
    for(const s of frontier){
      for(const nb of S[s].nb){
        if(!seen.has(nb)){
          seen.add(nb); prev[nb]=s;
          if(nb===b){
            const p=[b]; let c=b; while(c!==a){ c=prev[c]; p.unshift(c); } return p;
          }
          next.push(nb);
        }
      }
    }
    frontier = next;
  }
  return [a,b];
}
function startRoadTrip(){
  let start, dest, dist, tries=0;
  do{
    start = pick(ROAD_POOL); dest = pick(ROAD_POOL);
    dist = bfsDist(start, dest);
    tries++;
  } while((dist<4 || dist===Infinity || start===dest) && tries<200);
  roadtrip = {start, dest, dist, path:[start]};
  hud.classList.add("show");
  renderRoadTrip();
}
function renderRoadTrip(){
  clearMapFx();
  const cur = roadtrip.path[roadtrip.path.length-1];
  [roadtrip.start].forEach(s=>{ const el=document.querySelector('.st[data-st="'+s+'"]'); if(el) el.classList.add("trip-start"); });
  [roadtrip.dest].forEach(s=>{ const el=document.querySelector('.st[data-st="'+s+'"]'); if(el) el.classList.add("trip-dest"); });
  const curEl = document.querySelector('.st[data-st="'+cur+'"]');
  if(curEl) curEl.classList.add("trip-cur");
  hud.innerHTML = "🚗 Road Trip — get from <b>"+S[roadtrip.start].n+"</b> to <b>"+S[roadtrip.dest].n+"</b>." +
    " You're in <span class='big'>"+S[cur].n+"</span>. Click a bordering state to drive there. Hops so far: "+(roadtrip.path.length-1) +
    endBtn() +
    " <button class='ghost-btn' style='padding:4px 10px;font-size:.75rem;margin-left:6px' onclick='giveUpRoadTrip()'>Show a route</button>";
}
function onRoadTripMapClick(k, el){
  const cur = roadtrip.path[roadtrip.path.length-1];
  if(k===cur) return;
  if(!S[cur].nb.includes(k)){
    el.classList.add("flash-bad");
    setTimeout(()=>el.classList.remove("flash-bad"), 500);
    return;
  }
  roadtrip.path.push(k);
  addPts(5);
  if(k===roadtrip.dest){ finishRoadTrip(); return; }
  renderRoadTrip();
}
function finishRoadTrip(){
  hud.classList.remove("show");
  const hops = roadtrip.path.length-1;
  const bonus = hops<=roadtrip.dist ? 30 : (hops<=roadtrip.dist+2 ? 15 : 0);
  if(bonus) addPts(bonus);
  const routeNames = roadtrip.path.map(s=>S[s].n).join(" → ");
  showOverlay(
    '<h2>🚗 Road Trip complete!</h2>' +
    '<div class="result-box">' +
      '<div class="score">'+hops+' hops</div>' +
      '<p style="margin:8px 0 10px">Shortest possible route: '+roadtrip.dist+' hops.'+(bonus?" +"+bonus+" efficiency bonus!":"")+'</p>' +
      '<p style="font-size:.82rem;color:var(--muted);margin-bottom:16px">'+esc(routeNames)+'</p>' +
      '<button class="primary-btn" onclick="hideOverlay(); startRoadTrip()">🔁 New trip</button> ' +
      '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button>' +
    '</div>'
  );
  confetti();
  roadtrip = null;
}
function giveUpRoadTrip(){
  const path = shortestPath(roadtrip.start, roadtrip.dest);
  hud.classList.remove("show");
  showOverlay(
    '<h2>🚗 Road Trip — a route</h2>' +
    '<div class="result-box"><p style="margin:10px 0 16px">'+esc(path.map(s=>S[s].n).join(" → "))+'</p>' +
    '<button class="primary-btn" onclick="hideOverlay(); startRoadTrip()">🔁 New trip</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button></div>'
  );
  roadtrip = null;
}

/* ============ COMPARE BATTLE ============ */
let compare = null;
function startCompare(){
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active", b.dataset.mode==="compare"));
  hud.classList.remove("show"); find=null; neighborGame=null; roadtrip=null; closePanel(); clearMapFx();
  compare = {i:0, score:0, streak:0, rounds:10};
  renderCompareQ();
}
function renderCompareQ(){
  if(compare.i >= compare.rounds) return endCompare();
  const statKey = pick(["pop","area"]);
  let a,b;
  do{ a=pick(KEYS); b=pick(KEYS); } while(a===b);
  const av = S[a][statKey], bv = S[b][statKey];
  const correct = av>bv ? a : b;
  const label = statKey==="pop" ? "more people" : "more land area";
  showOverlay(
    '<button class="close" title="Exit" onclick="quitCompare()">✕</button>' +
    '<h2>⚖️ Compare Battle</h2>' +
    '<div class="sub">Round '+(compare.i+1)+'/'+compare.rounds+' • Score '+compare.score+(compare.streak>=3?' • 🔥 streak '+compare.streak:'')+'</div>' +
    '<div class="q-text">Which state has '+label+'?</div>' +
    '<button class="opt" data-v="'+a+'">'+esc(S[a].n)+'</button>' +
    '<button class="opt" data-v="'+b+'">'+esc(S[b].n)+'</button>' +
    '<div class="feedback" id="cmp-fb"></div>'
  );
  const box = document.getElementById("ov-body");
  const fmt = statKey==="pop" ? fmtPop : fmtArea;
  box.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      box.querySelectorAll(".opt").forEach(o=>{ o.disabled=true; if(o.dataset.v===correct) o.classList.add("correct"); });
      const fb = document.getElementById("cmp-fb");
      const right = btn.dataset.v===correct;
      if(right){
        compare.streak++; const bonus = compare.streak>=3 ? 5 : 0;
        compare.score += 10+bonus; addPts(10+bonus);
        fb.textContent = "✅ +"+(10+bonus)+" — "+S[a].n+": "+fmt(av)+" • "+S[b].n+": "+fmt(bv);
        fb.className = "feedback good";
      } else {
        btn.classList.add("wrong"); compare.streak=0;
        fb.textContent = "❌ "+S[a].n+": "+fmt(av)+" • "+S[b].n+": "+fmt(bv);
        fb.className = "feedback bad";
      }
      const nx = document.createElement("button"); nx.className="next-btn";
      nx.textContent = compare.i+1<compare.rounds ? "Next →" : "See result";
      nx.onclick = ()=>{ compare.i++; renderCompareQ(); };
      box.appendChild(nx);
    };
  });
}
function quitCompare(){ compare=null; hideOverlay(); setMode("explore"); }
function endCompare(){
  if(compare.score > save.bestCompare){ save.bestCompare = compare.score; persist(); }
  showOverlay(
    '<h2>⚖️ Compare Battle — done!</h2>' +
    '<div class="result-box"><div class="score">'+compare.score+'</div>' +
    '<p style="margin:8px 0 16px">Best: '+save.bestCompare+'</p>' +
    '<button class="primary-btn" onclick="startCompare()">🔁 Play again</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button></div>'
  );
  if(compare.score >= 90) confetti();
  compare = null;
}

/* ============ CERTIFICATE ============ */
function checkCertificate(){
  if(Object.keys(save.mastered).length >= KEYS.length && !save.certShown){
    save.certShown = true; persist();
    showCertificate(true);
  }
}
function showCertificate(justEarned){
  showOverlay(
    '<div style="text-align:center">' +
    (justEarned ? '<h2>🎓 Congratulations!</h2><div class="sub">You mastered all 50 states!</div>' : '<h2>🎓 Your Certificate</h2>') +
    '<div style="border:2px solid var(--gold); border-radius:14px; padding:24px; margin:16px 0; background:var(--panel2)">' +
      '<div style="font-size:.75rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase">United States Explorer</div>' +
      '<div style="font-size:1.5rem;font-weight:800;color:var(--gold);margin:10px 0">Certificate of Completion</div>' +
      '<div style="font-size:.9rem;color:var(--muted)">Awarded for mastering all 50 U.S. states</div>' +
    '</div>' +
    '<button class="primary-btn" onclick="window.print()">🖨️ Print</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay()">Close</button>' +
    '</div>'
  );
  if(justEarned) confetti();
}

/* ============ SPRINTS (capital / nickname) ============ */
let sprint = null;
function startSprint(kind){
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active", b.dataset.mode===(kind==="capital"?"sprint":"nick")));
  hud.classList.remove("show"); find=null; neighborGame=null; roadtrip=null; closePanel(); clearMapFx();
  sprint = {kind, states: shuffle(KEYS).slice(0,10), i:0, score:0, streak:0};
  renderSprintQ();
}
function renderSprintQ(){
  if(sprint.i >= sprint.states.length) return endSprint();
  const k = sprint.states[sprint.i], d = S[k];
  const isCap = sprint.kind==="capital";
  const correct = isCap ? d.c : d.nk;
  const pool = KEYS.filter(x=>x!==k).map(x=> isCap ? S[x].c : S[x].nk).filter(v=>v!==correct);
  const opts = shuffle([correct, ...shuffle(pool).slice(0,3)]);
  showOverlay(
    '<button class="close" title="Exit sprint" onclick="quitSprint()">✕</button>' +
    '<h2>'+(isCap?'🏛️ Capital Sprint':'🏷️ Nickname Sprint')+'</h2>' +
    '<div class="sub">Question '+(sprint.i+1)+'/10 • Score '+sprint.score+
      (sprint.streak>=3 ? ' • 🔥 streak '+sprint.streak : '')+'</div>' +
    '<div class="q-text">'+esc(isCap ? "What is the capital of "+d.n+"?" : "What is the nickname of "+d.n+"?")+'</div>'
  );
  const box = document.getElementById("ov-body");
  opts.forEach(o=>{
    const btn = document.createElement("button");
    btn.className="opt"; btn.textContent=o;
    btn.onclick = ()=>{
      box.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; if(b.textContent===correct) b.classList.add("correct"); });
      const fb = document.createElement("div"); fb.className="feedback";
      if(o===correct){
        sprint.streak++; const bonus = sprint.streak>=3 ? 5 : 0;
        sprint.score += 10+bonus; addPts(10+bonus);
        fb.textContent = "✅ +"+(10+bonus)+(bonus?" (streak bonus!)":""); fb.className="feedback good";
      } else {
        btn.classList.add("wrong"); sprint.streak=0;
        fb.textContent = "❌ "+d.n+" → "+correct; fb.className="feedback bad";
      }
      box.appendChild(fb);
      const nx = document.createElement("button"); nx.className="next-btn";
      nx.textContent = sprint.i+1<10 ? "Next →" : "See result";
      nx.onclick = ()=>{ sprint.i++; renderSprintQ(); };
      box.appendChild(nx);
    };
    box.appendChild(btn);
  });
}
function quitSprint(){
  sprint = null;
  hideOverlay();
  setMode("explore");
}
function endSprint(){
  const isCap = sprint.kind==="capital";
  const bestKey = isCap ? "bestCapital" : "bestNick";
  if(sprint.score > save[bestKey]){ save[bestKey] = sprint.score; persist(); }
  showOverlay(
    '<h2>'+(isCap?'🏛️ Capital Sprint':'🏷️ Nickname Sprint')+' — done!</h2>' +
    '<div class="result-box"><div class="score">'+sprint.score+'</div>' +
    '<p style="margin:8px 0 16px">Best: '+save[bestKey]+'</p>' +
    '<button class="primary-btn" onclick="startSprint(\''+sprint.kind+'\')">🔁 Play again</button> ' +
    '<button class="ghost-btn" onclick="hideOverlay(); setMode(\'explore\')">Done</button></div>'
  );
  if(sprint.score >= 90) confetti();
  sprint = null;
}

/* ============ OVERLAY ============ */
function showOverlay(html){
  document.getElementById("ov-body").innerHTML = html;
  document.getElementById("overlay").classList.add("show");
}
function hideOverlay(){ document.getElementById("overlay").classList.remove("show"); }

/* ============ INIT ============ */
renderScore();
markMastered();
</script>
