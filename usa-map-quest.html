<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USA Map Quest — Learn the 50 States</title>
<style>
:root{
  --bg:#0e1420; --panel:#161f30; --panel2:#1d2940; --line:#2a3a58;
  --text:#e8edf6; --muted:#93a4c3; --accent:#4f9cf9; --gold:#f5c542;
  --good:#2ecc71; --bad:#e74c5b;
  --ne:#8b5cf6; --se:#e8913a; --mw:#2fb380; --sw:#e05252; --we:#3f8cf2; --dc:#e253a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); min-height:100%;
  background-image:radial-gradient(1200px 600px at 70% -10%, #16233c 0%, transparent 60%);
}
header{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:14px 20px; border-bottom:1px solid var(--line);
}
header h1{font-size:1.15rem; font-weight:700; letter-spacing:.2px}
header h1 span{color:var(--accent)}
.scorebar{display:flex; gap:10px; align-items:center; margin-left:auto; flex-wrap:wrap}
.chip{
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:5px 12px; font-size:.85rem; font-weight:600; white-space:nowrap;
}
.chip b{color:var(--gold)}
.modes{display:flex; gap:8px; padding:12px 20px; flex-wrap:wrap}
.mode-btn{
  background:var(--panel); color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:8px 14px; font-size:.9rem; font-weight:600; cursor:pointer;
  transition:all .15s;
}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn.active{background:var(--accent); border-color:var(--accent); color:#08111f}
#hud{
  display:none; margin:0 20px 6px; padding:10px 16px; border-radius:12px;
  background:var(--panel); border:1px solid var(--line);
  font-size:1rem; font-weight:600; text-align:center;
}
#hud.show{display:block}
#hud .big{font-size:1.2rem; color:var(--gold)}
main{display:flex; gap:16px; padding:8px 20px 24px; align-items:flex-start}
#map-wrap{flex:1; min-width:0; position:relative}
#map-canvas{width:100%}
#map-wrap svg{width:100%; height:auto; display:block}
.st{cursor:pointer; transition:filter .12s, opacity .12s; stroke:#0e1420; stroke-width:.6}
.st:hover{filter:brightness(1.35) saturate(1.2)}
.st.dim{opacity:.35}
.st.flash-good{fill:var(--good) !important}
.st.flash-bad{fill:var(--bad) !important}
.st.pulse{animation:pulse .5s ease-in-out 3; fill:var(--gold) !important}
@keyframes pulse{50%{filter:brightness(1.8)}}
.st.mastered{stroke:var(--gold); stroke-width:1.4}
.st.target-hl{stroke:var(--gold); stroke-width:2.5}
.st.trip-start{stroke:var(--good); stroke-width:2.5}
.st.trip-dest{stroke:var(--gold); stroke-width:2.5}
.st.trip-cur{stroke:#fff; stroke-width:3}
.star-mark{pointer-events:none; font-size:11px; fill:#ffdf6b; text-anchor:middle;
  paint-order:stroke; stroke:#00000088; stroke-width:2px}
.park-dot{fill:#35d07f; stroke:#0e1420; stroke-width:1.2; cursor:pointer; transition:r .1s}
.park-dot:hover{fill:#7fe8b5}
#parklayer.no-click{pointer-events:none}
.park-label{font-size:7px; fill:var(--muted); pointer-events:none}
/* story tab */
.big-idea{font-size:1.02rem; font-weight:800; margin-bottom:4px}
.pt-chip{display:inline-block; background:var(--panel2); border:1px solid var(--line);
  border-radius:999px; padding:3px 10px; font-size:.72rem; font-weight:700;
  color:var(--gold); margin-bottom:10px}
.story-p{font-size:.88rem; line-height:1.6; margin-bottom:14px}
.chain{margin-bottom:14px}
.chain .cap{font-size:.68rem; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:6px}
.chain-step{background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; font-size:.82rem}
.chain-arrow{text-align:center; color:var(--muted); font-size:.75rem; line-height:1.4}
.deep-box{background:#1c2438; border:1px solid var(--gold); border-radius:12px; padding:12px 14px}
.deep-box .dq{font-weight:700; font-size:.92rem; margin-bottom:10px; line-height:1.45}
.deep-box .da{font-size:.86rem; line-height:1.55; color:var(--text); border-top:1px solid var(--line); padding-top:10px; margin-top:4px}
.legend{display:flex; gap:14px; flex-wrap:wrap; padding:10px 4px 0; font-size:.8rem; color:var(--muted)}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px}
#tooltip{
  position:fixed; pointer-events:none; z-index:50; display:none;
  background:#0a0f1a; border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; font-size:.85rem; font-weight:600;
}
#tooltip small{display:block; color:var(--muted); font-weight:400}
#panel{
  width:390px; flex-shrink:0; background:var(--panel); border:1px solid var(--line);
  border-radius:16px; padding:18px; display:none; max-height:calc(100vh - 140px);
  overflow-y:auto;
}
#panel.show{display:block}
.close{float:right; background:none; border:none; color:var(--muted);
  font-size:1.3rem; cursor:pointer; line-height:1}
.close:hover{color:var(--text)}
#panel h2{font-size:1.3rem; margin-bottom:2px}
#panel .sub{color:var(--muted); font-size:.85rem; margin-bottom:12px}
.tabs{display:flex; gap:6px; margin-bottom:14px}
.tab{flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:7px 0; font-weight:600; font-size:.85rem; cursor:pointer}
.tab.active{background:var(--accent); border-color:var(--accent); color:#08111f}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
.stat{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 11px}
.stat .k{font-size:.68rem; text-transform:uppercase; letter-spacing:.6px; color:var(--muted)}
.stat .v{font-size:.95rem; font-weight:700; margin-top:2px}
.fact{background:var(--panel2); border-left:3px solid var(--accent); border-radius:8px;
  padding:10px 12px; font-size:.88rem; line-height:1.5; margin-bottom:8px}
.mastered-note{color:var(--gold); font-weight:700; font-size:.9rem; margin:6px 0}
/* quiz */
.q-count{font-size:.8rem; color:var(--muted); margin-bottom:6px}
.q-text{font-size:1rem; font-weight:700; margin-bottom:12px; line-height:1.45}
.opt{
  display:block; width:100%; text-align:left; background:var(--panel2);
  border:1px solid var(--line); color:var(--text); border-radius:10px;
  padding:11px 13px; font-size:.92rem; cursor:pointer; margin-bottom:8px;
  transition:all .12s;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.correct{background:#173f2b; border-color:var(--good)}
.opt.wrong{background:#43202a; border-color:var(--bad)}
.opt:disabled{cursor:default}
.feedback{min-height:24px; font-size:.88rem; font-weight:600; margin:4px 0 10px}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.next-btn,.primary-btn{
  background:var(--accent); color:#08111f; border:none; border-radius:10px;
  padding:10px 20px; font-size:.95rem; font-weight:700; cursor:pointer;
}
.next-btn:hover,.primary-btn:hover{filter:brightness(1.1)}
.ghost-btn{background:var(--panel2); color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:10px 20px; font-size:.95rem; font-weight:600; cursor:pointer}
.result-box{text-align:center; padding:16px 6px}
.result-box .score{font-size:2.4rem; font-weight:800; color:var(--gold)}
/* overlay (sprint + results) */
#overlay{
  position:fixed; inset:0; background:rgba(5,9,16,.78); z-index:100;
  display:none; align-items:center; justify-content:center; padding:18px;
}
#overlay.show{display:flex}
#overlay .box{
  background:var(--panel); border:1px solid var(--line); border-radius:18px;
  padding:24px; width:100%; max-width:480px; max-height:92vh; overflow-y:auto;
}
#overlay h2{margin-bottom:4px}
#overlay .sub{color:var(--muted); font-size:.85rem; margin-bottom:16px}
.confetti{position:fixed; top:-12px; z-index:200; pointer-events:none;
  width:9px; height:14px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg); opacity:.7}}
@media (max-width:860px){
  main{flex-direction:column}
  #panel{width:100%; max-height:none}
}
/* Fit the whole app to the viewport on desktop — no page scroll, map scales
   to whatever space is left after the header/mode bar/hud. */
@media (min-width:861px){
  body{display:flex; flex-direction:column; height:100vh; overflow:hidden}
  main{flex:1; min-height:0; align-items:stretch}
  #map-wrap{display:flex; flex-direction:column; min-height:0}
  #map-canvas{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden}
  #map-canvas svg{width:auto; height:auto; max-width:100%; max-height:100%}
  .legend{flex:0 0 auto}
  #panel{height:100%; max-height:100%}
}
</style>
</head>
<body>
<header>
  <h1>🗺️ USA Map <span>Quest</span></h1>
  <div class="scorebar">
    <div class="chip">⭐ <b id="pts">0</b> pts</div>
    <div class="chip">🏆 <b id="mast">0</b>/50 mastered</div>
    <button class="chip" id="cert-chip" style="display:none;cursor:pointer;border-color:var(--gold)" onclick="showCertificate(false)">🎓 Certificate</button>
  </div>
</header>

<div class="modes">
  <button class="mode-btn active" data-mode="explore" onclick="setMode('explore')">🔍 Explore &amp; Learn</button>
  <button class="mode-btn" data-mode="find" onclick="setMode('find')">📍 Find the State</button>
  <button class="mode-btn" data-mode="detective" onclick="setMode('detective')">🕵️ State Detective</button>
  <button class="mode-btn" data-mode="neighbor" onclick="setMode('neighbor')">🧭 Border Patrol</button>
  <button class="mode-btn" data-mode="roadtrip" onclick="setMode('roadtrip')">🚗 Road Trip</button>
  <button class="mode-btn" data-mode="ranger" onclick="setMode('ranger')">🏞️ Park Ranger</button>
  <button class="mode-btn" data-mode="compare" onclick="startCompare()">⚖️ Compare Battle</button>
  <button class="mode-btn" data-mode="sprint" onclick="startSprint('capital')">🏛️ Capital Sprint</button>
  <button class="mode-btn" data-mode="nick" onclick="startSprint('nick')">🏷️ Nickname Sprint</button>
</div>

<div id="hud"></div>

const S = {"AL":{"n":"Alabama","c":"Montgomery","nk":"Yellowhammer State","lc":"Huntsville","yr":1819,"ord":22,"pop":5024279,"pr":24,"area":52420,"ar":30,"rg":"SE","fx":["Huntsville is nicknamed 'Rocket City' — the Saturn V rocket that took astronauts to the Moon was developed there.","Montgomery had the world's first electric trolley system, back in 1886."],"nb":["FL","GA","MS","TN"],"big":"Cotton, civil rights, and rockets","pt":"Plantation South","story":"Creek, Cherokee, Choctaw, and Chickasaw homelands were taken through removal in the 1830s, and the rich Black Belt soil became a cotton kingdom built on slavery. After the Civil War came sharecropping and Jim Crow — and Alabama became the heart of the fight against them, from the Montgomery bus boycott to the Selma march. Today Huntsville builds rockets for NASA.","chain":["Rich Black Belt soil","Cotton plantations built on slavery","Civil War, then sharecropping and Jim Crow","Montgomery and Selma spark the civil rights movement","Federal space program lands in Huntsville"],"dq":"Why did the civil rights movement erupt in Alabama specifically?","da":"Because segregation there was among the harshest — and organized Black churches and colleges were strong. Rosa Parks in Montgomery and the Selma march forced the whole country to look."},"AK":{"n":"Alaska","c":"Juneau","nk":"The Last Frontier","lc":"Anchorage","yr":1959,"ord":49,"pop":733391,"pr":48,"area":665384,"ar":1,"rg":"W","fx":["Alaska is bigger than Texas, California, and Montana combined.","It has about 3 million lakes and 17 of the 20 highest peaks in the U.S., including Denali (20,310 ft)."],"nb":[],"big":"The resource frontier","pt":"Frontier/Resource","story":"Iñupiat, Yup'ik, Tlingit and other Native peoples lived here for thousands of years before Russian fur traders arrived. The U.S. bought Alaska in 1867 for $7.2 million — mocked as 'Seward's Folly' until gold, then oil, proved otherwise. The 1968 Prudhoe Bay strike brought the pipeline, and the state now pays residents an annual oil dividend.","chain":["Russian fur trade","U.S. buys Alaska for $7.2M (1867)","Gold rushes and WWII bases","Statehood in 1959","Oil found at Prudhoe Bay","Pipeline, Permanent Fund, and Native land claims"],"dq":"Who should control land with huge natural resources — local people, the state, the federal government, or companies?","da":"Alaska's answer is a compromise: Native corporations own land under the 1971 claims act, the state pays oil dividends, and vast federal parks stay protected. The tension never fully goes away."},"AZ":{"n":"Arizona","c":"Phoenix","nk":"Grand Canyon State","lc":"Phoenix","yr":1912,"ord":48,"pop":7151502,"pr":14,"area":113990,"ar":6,"rg":"SW","fx":["The Grand Canyon is 277 miles long and more than a mile deep.","Most of Arizona doesn't observe daylight saving time — clocks stay the same all year."],"nb":["CA","CO","NM","NV","UT"],"big":"Water makes the desert bloom — for now","pt":"Desert Southwest","story":"The Hohokam dug canals here a thousand years before Phoenix existed, and Navajo, Hopi, and Apache nations remain. Spain, then Mexico ruled until 1848. Copper mining built the early economy, but federal dams and canals made the desert livable — and Phoenix exploded into one of America's largest cities on water the Colorado River may not keep supplying.","chain":["Hohokam canals water the desert first","Spanish, then Mexican, then U.S. control","Copper mines drive early growth","Federal dams bring cheap water","Phoenix booms in the sunshine","Colorado River is promised more water than it carries"],"dq":"Phoenix sits in a desert. Should a city that big exist there?","da":"Dams and canals made it possible, and cheap land plus sunshine drew millions. But the river is over-promised — the city's future depends on hard water choices being made now."},"AR":{"n":"Arkansas","c":"Little Rock","nk":"The Natural State","lc":"Little Rock","yr":1836,"ord":25,"pop":3011524,"pr":33,"area":53179,"ar":29,"rg":"SE","fx":["Crater of Diamonds State Park is the only diamond site in the world where visitors keep what they find.","Hot Springs became a protected federal reservation in 1832 — 40 years before the first national park."],"nb":["LA","MO","MS","OK","TN","TX"],"big":"Between the South and the frontier","pt":"Plantation South","story":"Quapaw, Caddo, and Osage lands became a state split in two: Delta cotton plantations worked by enslaved people in the east, and independent Ozark hill farms in the west. In 1957 the Little Rock Nine tested school integration before the world. Later, a small-town merchant named Sam Walton built the world's largest retailer from Bentonville.","chain":["Delta cotton and slavery","Civil War and sharecropping","Rural poverty breeds self-reliance","Walmart opens in small towns rivals ignored (1962)","A global giant runs from Bentonville"],"dq":"Why did such a rural state produce the world's largest retailer?","da":"Sam Walton's strategy was to put big stores in small towns competitors wouldn't touch. Arkansas's rural weakness became the experiment that turned into an advantage."},"CA":{"n":"California","c":"Sacramento","nk":"The Golden State","lc":"Los Angeles","yr":1850,"ord":31,"pop":39538223,"pr":1,"area":163695,"ar":3,"rg":"W","fx":["If California were a country, its economy would rank among the world's top five.","It has both the highest point (Mount Whitney) and lowest point (Death Valley, −282 ft) in the contiguous U.S. — only about 85 miles apart."],"nb":["AZ","NV","OR"],"big":"Gold, growth, and the price of success","pt":"Gateway","story":"Before 1848 this was the most densely populated Native region in North America, then Spanish missions and Mexican ranchos. Gold changed everything: 300,000 people rushed in, statehood came in two years, and Native communities were devastated. Railroads, water projects, Hollywood, aerospace, and Silicon Valley kept the boom going — along with housing costs, drought, and wildfire.","chain":["Gold discovered (1848)","300,000 people rush in; Native peoples devastated","Statehood in just two years","Railroads link it east","Water projects let cities and farms explode","Hollywood, aerospace, then Silicon Valley","Success drives up housing, water, and fire risk"],"dq":"Is California the American dream, or a warning about success becoming too expensive?","da":"Both. It built world-changing industries and absorbed millions of newcomers — but wealth outran housing, water, and land. Success creates its own problems."},"CO":{"n":"Colorado","c":"Denver","nk":"Centennial State","lc":"Denver","yr":1876,"ord":38,"pop":5773714,"pr":21,"area":104094,"ar":8,"rg":"W","fx":["Colorado has 58 peaks over 14,000 feet — the most of any state.","Denver is exactly one mile (5,280 ft) above sea level — a step on the capitol stairs marks the spot."],"nb":["AZ","KS","NE","NM","OK","UT","WY"],"big":"The headwaters state","pt":"Mountain","story":"Ute, Cheyenne, and Arapaho lands drew miners after the 1859 gold rush — and the Sand Creek Massacre of 1864 remains one of the darkest chapters of expansion. Denver grew at the mountains' edge as the supply and rail hub. Today skiing, aerospace, and tech drive growth, and rivers born in Colorado's peaks supply 40 million people downstream.","chain":["Gold rush (1859) brings miners","Native peoples pushed out, Sand Creek Massacre (1864)","Denver grows where plains meet peaks","Railroads, ranching, then skiing and tourism","Aerospace and tech arrive","Colorado's rivers become the Southwest's water supply"],"dq":"Why can a state full of mountains become powerful even though mountains make travel difficult?","da":"Mountains hold minerals, water sources, tourism, and defense advantages. They make some things hard but create other kinds of wealth — Denver got rich sitting at their edge."},"CT":{"n":"Connecticut","c":"Hartford","nk":"Constitution State","lc":"Bridgeport","yr":1788,"ord":5,"pop":3605944,"pr":29,"area":5543,"ar":48,"rg":"NE","fx":["It's called the Constitution State for the Fundamental Orders of 1639, one of the first written constitutions.","Louis' Lunch in New Haven claims to have served America's first hamburger, in 1900."],"nb":["MA","NY","RI"],"big":"Yankee ingenuity to hedge funds","pt":"New England","story":"Pequot and Mohegan homelands saw one of the earliest colonial wars in 1637. The colony's Fundamental Orders pioneered written constitutions. Connecticut's small farms turned to precision manufacturing — clocks, firearms, submarines — and Hartford became the insurance capital. Today wealthy finance suburbs sit beside old factory cities still fighting to recover.","chain":["Early constitution (1639)","Precision manufacturing: clocks, guns, submarines","Hartford invents the insurance industry","Factories fade after WWII","Finance wealth clusters near NYC","Rich suburbs, struggling cities"],"dq":"How can one of the richest states also contain some of the poorest cities?","da":"Its wealth concentrated in finance suburbs while factory cities like Hartford and Bridgeport lost their industries. State averages hide the gap."},"DE":{"n":"Delaware","c":"Dover","nk":"The First State","lc":"Wilmington","yr":1787,"ord":1,"pop":989948,"pr":45,"area":2489,"ar":49,"rg":"SE","fx":["Delaware was the first state to ratify the U.S. Constitution — December 7, 1787.","The whole state is only about 30 miles across at its widest point."],"nb":["MD","NJ","PA"],"big":"First state, corporate capital","pt":"Crossroads","story":"Lenape country was settled by Swedes and Dutch before the English took over. Delaware ratified the Constitution first, earning its nickname. DuPont's gunpowder mills grew into a chemical empire — and the state built something stranger: a court system so trusted for business disputes that most Fortune 500 companies are legally 'based' in Delaware.","chain":["First to ratify the Constitution (1787)","DuPont gunpowder mills on the Brandywine","Chemicals become the economy","Business-friendly courts and laws","Most big U.S. companies incorporate here on paper"],"dq":"Why do most big American companies 'live' in tiny Delaware on paper?","da":"Its specialized business courts are fast and predictable, and its laws are flexible. Delaware shows that legal systems — not just land or factories — can be an economy."},"FL":{"n":"Florida","c":"Tallahassee","nk":"Sunshine State","lc":"Jacksonville","yr":1845,"ord":27,"pop":21538187,"pr":3,"area":65758,"ar":22,"rg":"SE","fx":["Florida has the longest coastline in the contiguous U.S. — about 1,350 miles.","Astronauts have launched into space from Cape Canaveral since 1961."],"nb":["AL","GA"],"big":"Sunshine and risk","pt":"Gateway","story":"Spain held Florida longer than the U.S. has, and the Seminole fought three wars rather than be removed — many never surrendered. Railroads opened the beaches to tourists, then came retirees, Cuban migration after 1959, Disney, and the Space Coast. The same warm, low, coastal geography that draws millions also delivers hurricanes and rising seas.","chain":["Spanish rule for three centuries","Seminole resistance in three wars","Railroads reach the beaches","Tourists, retirees, and Cuban migration","Disney and the Space Coast","Hurricanes and rising seas raise the stakes"],"dq":"Should people keep building in places vulnerable to hurricanes and flooding?","da":"It's a tradeoff: climate and coastline attract millions, and insurance spreads the cost to everyone. The real question is who should pay when the risk hits."},"GA":{"n":"Georgia","c":"Atlanta","nk":"Peach State","lc":"Atlanta","yr":1788,"ord":4,"pop":10711908,"pr":8,"area":59425,"ar":24,"rg":"SE","fx":["Atlanta's airport is the busiest in the world by passengers.","Georgia was the last of the original 13 colonies, founded in 1733."],"nb":["AL","FL","NC","SC","TN"],"big":"From cotton kingdom to capital of the South","pt":"Plantation South","story":"Gold found on Cherokee land in 1829 helped trigger the Trail of Tears. Cotton and slavery built the antebellum economy; Sherman's march burned its heart in 1864. Atlanta — founded as a rail junction — rebuilt fast, became headquarters of the civil rights movement under Dr. King, and now runs the world's busiest airport.","chain":["Gold on Cherokee land (1829)","Removal: the Trail of Tears","Cotton kingdom built on slavery","Civil War devastation","Atlanta rebuilds around railroads","Civil rights leadership, then a global airport"],"dq":"Why did Atlanta — not older, coastal Savannah — become the capital of the South?","da":"Railroads. Atlanta sat where rail lines crossed, and transportation networks beat coastal age. The airport is the same story in the air."},"HI":{"n":"Hawaii","c":"Honolulu","nk":"Aloha State","lc":"Honolulu","yr":1959,"ord":50,"pop":1455271,"pr":40,"area":10932,"ar":43,"rg":"W","fx":["Hawaii is the only state made entirely of islands — 137 of them.","Measured from its base on the ocean floor, Mauna Kea is taller than Mount Everest."],"nb":[],"big":"An island nation inside a nation","pt":"Pacific","story":"Polynesian voyagers crossed thousands of miles of open ocean to settle these islands, later unified as a kingdom under Kamehameha. American sugar planters helped overthrow Queen Lili'uokalani in 1893, and annexation followed. Pearl Harbor pulled America into WWII. Statehood came in 1959; tourism and the military now dominate, while Native Hawaiian culture experiences a strong revival.","chain":["Polynesian voyagers settle the islands","Kamehameha unifies the kingdom","Sugar planters gain power","U.S.-backed overthrow of the queen (1893)","Pearl Harbor and WWII","Statehood, tourism, and cultural revival"],"dq":"How does becoming a tourist paradise change the people who already live there?","da":"Tourism brings jobs but drives up prices until locals struggle to stay. Culture can be commodified — or revived on its own terms. Hawaii lives that tension daily."},"ID":{"n":"Idaho","c":"Boise","nk":"Gem State","lc":"Boise","yr":1890,"ord":43,"pop":1839106,"pr":38,"area":83569,"ar":14,"rg":"W","fx":["Idaho grows about a third of all potatoes in the United States.","Hells Canyon is deeper than the Grand Canyon — nearly 8,000 feet."],"nb":["MT","NV","OR","UT","WA","WY"],"big":"Wilderness, water, and potatoes","pt":"Mountain","story":"Nez Perce homeland — Chief Joseph's band made their famous 1,170-mile fighting retreat here in 1877. The Oregon Trail crossed the Snake River Plain, mining boomed in the Silver Valley, and irrigation turned volcanic desert soil into America's potato belt. Boise has quietly become a tech hub, and the wilderness remains among the largest in the lower 48.","chain":["Oregon Trail crosses the Snake Plain","Nez Perce resistance and removal (1877)","Silver and gold mining booms","Irrigation canals green the desert","Potatoes feed the nation","Boise adds tech to timber"],"dq":"Idaho's famous farms sit on a desert-like plain. How?","da":"Volcanic soil plus Snake River irrigation. Water engineering, not rainfall, feeds the state — geography set the table, but canals served the meal."},"IL":{"n":"Illinois","c":"Springfield","nk":"Prairie State","lc":"Chicago","yr":1818,"ord":21,"pop":12812508,"pr":6,"area":57914,"ar":25,"rg":"MW","fx":["The world's first skyscraper was built in Chicago in 1885.","Abraham Lincoln lived and practiced law in Springfield for about 24 years."],"nb":["IN","IA","KY","MO","WI"],"big":"The hinge of America","pt":"Industrial","story":"A short portage between the Great Lakes and the Mississippi watershed made Chicago inevitable. Canal, then railroads, funneled the interior's grain and cattle through the city; the 1871 fire cleared the way for the first skyscrapers. The Great Migration brought Black southerners north to jobs — and Chicago blues, jazz, and political power followed.","chain":["Portage links lake and river","Canal (1848), then railroads converge","Grain and meat flow through Chicago","Great Fire (1871), skyscrapers rise","Great Migration brings workers north","Finance capital of farm commodities"],"dq":"Why did Chicago become huge while most other Midwestern towns stayed small?","da":"It sat at the water link between East and interior, then every railroad met there. Geography gave the opening; canals, rails, and markets made it dominant."},"IN":{"n":"Indiana","c":"Indianapolis","nk":"Hoosier State","lc":"Indianapolis","yr":1816,"ord":19,"pop":6785528,"pr":17,"area":36420,"ar":38,"rg":"MW","fx":["The Indianapolis 500 is the world's largest single-day sporting event.","People from Indiana have been called 'Hoosiers' since the 1830s — and nobody is sure why."],"nb":["IL","KY","MI","OH"],"big":"The crossroads of America","pt":"Industrial","story":"Miami and Potawatomi lands became a state built on movement: the National Road, canals, then more interstate highway per square mile than almost anywhere. Gary's steel mills anchored the north; Indianapolis grew as a rail-and-road hub whose famous 500-mile race began as an automobile test track.","chain":["National Road crosses the state","Railroads and canals follow","Gary steel and auto parts","Indy 500 starts as a car test track","Interstates make logistics the business"],"dq":"Why does 'Crossroads of America' fit Indiana?","da":"Its location between eastern cities and Chicago made moving things its specialty. When your neighbors are the destinations, you become the route."},"IA":{"n":"Iowa","c":"Des Moines","nk":"Hawkeye State","lc":"Des Moines","yr":1846,"ord":29,"pop":3190369,"pr":31,"area":56273,"ar":26,"rg":"MW","fx":["Iowa produces more corn than any other state.","The Eskimo Pie ice cream bar was invented in Onawa, Iowa in 1920."],"nb":["IL","MN","MO","NE","SD","WI"],"big":"The state that feeds the system","pt":"Farm Belt","story":"Meskwaki and Sauk lands (taken after the Black Hawk War) held some of the deepest topsoil on Earth. Prairie became family farms, then mechanized corn, soybeans, hogs, and ethanol. Iowa's harvest quietly sets prices for food and fuel nationwide, its caucuses once opened presidential races, and its runoff feeds a dead zone in the Gulf.","chain":["Deepest prairie topsoil on Earth","Family farms mechanize","Corn and hogs at industrial scale","Ethanol ties corn to fuel","Farm runoff flows to the Gulf","Iowa politics shape farm policy"],"dq":"If Iowa's soil is so productive, how does that ripple through food prices, politics, and the environment?","da":"Cheap corn makes cheap meat, fuel, and sweeteners for the whole country; consolidation squeezes family farms; fertilizer runoff creates a Gulf dead zone; and caucus politics amplify farm interests. One state's soil, everyone's system."},"KS":{"n":"Kansas","c":"Topeka","nk":"Sunflower State","lc":"Wichita","yr":1861,"ord":34,"pop":2937880,"pr":35,"area":82278,"ar":15,"rg":"MW","fx":["Kansas grows more wheat than any other state — enough for billions of loaves of bread a year.","Dodge City is one of the windiest cities in the United States."],"nb":["CO","MO","NE","OK"],"big":"Where the Civil War started early","pt":"Farm Belt","story":"The 1854 Kansas-Nebraska Act let settlers vote on slavery — so both sides raced in, and 'Bleeding Kansas' turned violent years before Fort Sumter. It entered free in 1861. Cattle drives met the railroad at Abilene and Dodge City; Mennonite immigrants brought Turkey Red wheat; and Wichita became the small-plane capital of the world.","chain":["Kansas-Nebraska Act (1854)","Pro- and anti-slavery settlers race in","'Bleeding Kansas' violence","Free-state entry (1861)","Cattle trails meet the railroad","Wheat and aviation define the economy"],"dq":"Why did one territory become so important that people fought over it before it was even a state?","da":"Whichever side won Kansas would tip the Senate balance between slave and free states. Territory wasn't just land — it was national power."},"KY":{"n":"Kentucky","c":"Frankfort","nk":"Bluegrass State","lc":"Louisville","yr":1792,"ord":15,"pop":4505836,"pr":26,"area":40408,"ar":37,"rg":"SE","fx":["The Kentucky Derby has run every year since 1875 — the oldest continuously held major U.S. sporting event.","Mammoth Cave is the longest known cave system on Earth, with over 400 miles mapped."],"nb":["IL","IN","MO","OH","TN","VA","WV"],"big":"The border state","pt":"Upland South","story":"Shawnee and Cherokee hunting grounds beyond the Cumberland Gap became America's first West. As a slave state that stayed in the Union, Kentucky watched families split between armies. Bluegrass horse farms, bourbon, tobacco, and Appalachian coal each built a different Kentucky — which is why it can feel like several states at once.","chain":["Cumberland Gap opens the first West","Slave state that stays in the Union","Families split by the Civil War","Bourbon, tobacco, and horses","Appalachian coal towns rise and fall"],"dq":"Why did Lincoln reportedly say he hoped to have God on his side, but he had to have Kentucky?","da":"Border states controlled the rivers and invasion routes. Losing Kentucky might have lost the war — geography decides strategy."},"LA":{"n":"Louisiana","c":"Baton Rouge","nk":"Pelican State","lc":"New Orleans","yr":1812,"ord":18,"pop":4657757,"pr":25,"area":52378,"ar":31,"rg":"SE","fx":["The Lake Pontchartrain Causeway is nearly 24 miles long — one of the longest bridges over water in the world.","Louisiana is the only state divided into parishes instead of counties."],"nb":["AR","MS","TX"],"big":"River, empire, and water","pt":"River","story":"Whoever held New Orleans controlled the trade of half a continent — which is why France, Spain, and the U.S. all wanted it, and why Jefferson doubled the country to buy it in 1803. Sugar and cotton plantations made it a center of slavery; the cultural mix of African, French, Caribbean, and Native peoples made it the birthplace of jazz. Water made it rich, and water — Katrina, coastal land loss — keeps it in danger.","chain":["Mississippi's mouth = key to the continent","French and Spanish rule","Louisiana Purchase (1803) doubles the U.S.","Sugar, cotton, and the slave trade","Cultural gumbo births jazz","Oil and shipping wealth","Katrina and vanishing coastline"],"dq":"Why is Louisiana both powerful and vulnerable because of water?","da":"Water made it rich — trade, ports, fishing, oil. The same water floods it, erodes its coast, and strengthens its hurricanes. Its greatest asset is its greatest threat."},"ME":{"n":"Maine","c":"Augusta","nk":"Pine Tree State","lc":"Portland","yr":1820,"ord":23,"pop":1362359,"pr":42,"area":35380,"ar":39,"rg":"NE","fx":["Maine catches most of America's lobster and grows 99% of its wild blueberries.","It's the only state that borders exactly one other state (New Hampshire)."],"nb":["NH"],"big":"The edge of the woods","pt":"New England","story":"Wabanaki homeland, contested between France and England for a century, Maine was governed by Massachusetts until 1820 — when it entered the Union as the free-state half of the Missouri Compromise. Timber and shipbuilding gave way to lobster, blueberries, and tourism along the most jagged coastline in the country.","chain":["Wabanaki homeland, French-English battleground","Part of Massachusetts until 1820","Statehood via the Missouri Compromise","Timber and shipbuilding boom","Lobster and tourism take over"],"dq":"Maine became a state as one half of a bargain over slavery. What does that reveal about how states joined?","da":"Statehood was often about Senate power, not population. Maine's free-state entry balanced Missouri's slave-state entry — the map itself is politics."},"MD":{"n":"Maryland","c":"Annapolis","nk":"Old Line State","lc":"Baltimore","yr":1788,"ord":7,"pop":6177224,"pr":18,"area":12406,"ar":42,"rg":"SE","fx":["The U.S. national anthem was written during a battle in Baltimore Harbor in 1814.","The Chesapeake Bay is the largest estuary in the United States."],"nb":["DE","PA","VA","WV","DC"],"big":"The Chesapeake crossroads","pt":"Crossroads","story":"Piscataway country became a Catholic refuge colony, then a tobacco economy worked by enslaved people — Frederick Douglass and Harriet Tubman were both born enslaved here. A slave state that stayed in the Union, Maryland straddled North and South. Baltimore launched America's first railroad, and today federal agencies and research anchor the economy.","chain":["Catholic refuge colony (1634)","Tobacco and slavery on the Chesapeake","Douglass and Tubman escape to lead","Border state in the Civil War","B&O: America's first railroad","Federal government becomes the economy"],"dq":"Was Maryland Northern or Southern?","da":"Both — a slave state inside the Union, an industrial port atop a tobacco South. Its border identity shaped its politics ever after."},"MA":{"n":"Massachusetts","c":"Boston","nk":"Bay State","lc":"Boston","yr":1788,"ord":6,"pop":7029917,"pr":15,"area":10554,"ar":44,"rg":"NE","fx":["America's first public park (Boston Common, 1634), first public school, and first subway are all in Boston.","Basketball (1891) and volleyball (1895) were both invented in Massachusetts."],"nb":["CT","NH","NY","RI","VT"],"big":"The idea factory","pt":"New England","story":"Wampanoag country absorbed Plymouth's settlers, then endured King Philip's War, one of colonial America's bloodiest. Puritans founded schools obsessively — Harvard by 1636 — and the Revolution began at Lexington and Concord. Lowell's mills started American industrialization; when the factories left, the universities reinvented the economy around ideas: biotech, software, medicine.","chain":["Puritans found schools early","Harvard (1636) anchors learning","Revolution starts here (1775)","Lowell mills industrialize America","Factories leave for cheaper labor","Universities rebuild the economy on ideas"],"dq":"How did Massachusetts stay rich after its factories left?","da":"Education. It invested in ideas for four centuries, so when mills died, biotech and software grew from the universities. Places that invest in brains can reinvent themselves."},"MI":{"n":"Michigan","c":"Lansing","nk":"Great Lakes State","lc":"Detroit","yr":1837,"ord":26,"pop":10077331,"pr":10,"area":96714,"ar":11,"rg":"MW","fx":["Michigan touches four of the five Great Lakes and has the longest freshwater coastline in the country.","Anywhere in Michigan, you're never more than about 6 miles from a lake or stream."],"nb":["IN","OH","WI"],"big":"One industry's rise and fall","pt":"Industrial","story":"Anishinaabe homelands and French fur posts became a lumber and copper state — until Henry Ford's assembly line made Detroit the Motor City and drew the Great Migration north. Autoworkers' unions built the modern middle class. Then the industry moved and shrank, Detroit went bankrupt in 2013, and Michigan has been reinventing itself since — with the Great Lakes as its ace.","chain":["Fur trade, then lumber and copper","Ford's assembly line (1913)","Detroit becomes the Motor City","Great Migration and union power","The industry leaves; Detroit shrinks","Reinvention around water, tech, and autos again"],"dq":"What happens when a state depends too much on one industry?","da":"It rises and falls with it. The assembly line built the middle class; deindustrialization broke cities. Diversified economies bend — dependent ones break."},"MN":{"n":"Minnesota","c":"St. Paul","nk":"North Star State","lc":"Minneapolis","yr":1858,"ord":32,"pop":5706494,"pr":22,"area":86936,"ar":12,"rg":"MW","fx":["The license plates say 10,000 lakes — Minnesota actually has more than 11,800.","The mighty Mississippi River starts at Lake Itasca as a stream you can walk across."],"nb":["IA","ND","SD","WI"],"big":"North star of water and grain","pt":"River","story":"Dakota and Ojibwe homelands — the U.S.-Dakota War of 1862 ended in the largest mass execution in American history, a hard truth of the state's founding. St. Anthony Falls powered Minneapolis flour mills; the Mesabi Range shipped the iron that built America's steel. Scandinavian and German immigrants, then Hmong and Somali communities, kept remaking the state.","chain":["Dakota and Ojibwe homelands taken","U.S.-Dakota War (1862)","Waterfalls power flour milling","Mesabi iron feeds the steel age","Immigrant waves reshape the state","Medical and corporate hub today"],"dq":"Why did flour and iron make Minnesota matter?","da":"Waterfalls powered the mills and lake freighters carried the ore — natural energy plus water transport equals industry. The Twin Cities and Duluth grew where those forces met."},"MS":{"n":"Mississippi","c":"Jackson","nk":"Magnolia State","lc":"Jackson","yr":1817,"ord":20,"pop":2961279,"pr":34,"area":48432,"ar":32,"rg":"SE","fx":["The state is named for the Mississippi River, the second-longest river in North America.","Barq's root beer was created in Biloxi in 1898."],"nb":["AL","AR","LA","TN"],"big":"The deepest South","pt":"Plantation South","story":"Choctaw and Chickasaw removal opened the richest cotton land in the world; by 1860 most Mississippians were enslaved, and the state's white planters were among America's wealthiest. That wealth was extraction, not development — and its legacy is the nation's most stubborn poverty. From that same Delta soil came the blues, the root of most American music.","chain":["Choctaw and Chickasaw removal","Cotton kingdom; enslaved majority","Civil War and sharecropping","Jim Crow and the civil rights martyrs","The Delta births the blues","Poverty's long shadow remains"],"dq":"Mississippi was once among the richest states (for its white planters). Why is it among the poorest today?","da":"Its wealth was built on enslaved labor, not broad development. After emancipation, elites kept the land and starved education and industry — extraction economies leave thin foundations."},"MO":{"n":"Missouri","c":"Jefferson City","nk":"Show-Me State","lc":"Kansas City","yr":1821,"ord":24,"pop":6154913,"pr":19,"area":69707,"ar":21,"rg":"MW","fx":["The Gateway Arch in St. Louis is the tallest man-made monument in the U.S. — 630 feet.","The 1904 World's Fair in St. Louis made the ice cream cone famous."],"nb":["AR","IL","IA","KS","KY","NE","OK","TN"],"big":"The gateway to the West","pt":"River","story":"Osage and Missouria country at the meeting of two great rivers became the jumping-off point for a continent: steamboats could reach Missouri, and beyond it lay wagon country. The Oregon, Santa Fe, and California trails all started here; the Pony Express rode from St. Joseph. The Gateway Arch remembers exactly this: last stop before the frontier.","chain":["Two great rivers meet","Missouri Compromise (1820)","Steamboats end, wagons begin","Oregon and Santa Fe trails launch here","Kansas City rails and cattle","The Arch marks the gateway"],"dq":"Why did the westward trails all start in Missouri?","da":"Steamboats could get people and supplies that far; past it, you needed wagons. Missouri was the last river stop before the frontier — geography made it the doorway."},"MT":{"n":"Montana","c":"Helena","nk":"Treasure State","lc":"Billings","yr":1889,"ord":41,"pop":1084225,"pr":43,"area":147040,"ar":4,"rg":"W","fx":["Montana has more elk, deer, and antelope than people.","The Roe River near Great Falls is one of the shortest rivers in the world — about 201 feet."],"nb":["ID","ND","SD","WY"],"big":"Big land, few people, deep mines","pt":"Frontier/Resource","story":"Crow, Blackfeet, and Salish country saw Custer's defeat at Little Bighorn in 1876 — a Native victory that brought harsher retaliation. Butte's copper made it 'the richest hill on Earth,' and the Anaconda Company once owned the state's politics and newspapers outright. Homestead busts, cattle, coal, and now tourism each wrote a chapter.","chain":["Little Bighorn (1876)","Copper kings rule Butte","One company owns politics and press","Homestead boom, then bust","Cattle, coal, and oil","Tourism and the last best place"],"dq":"One company once controlled Montana's mines, politics, and newspapers. What does that do to a state?","da":"It brings jobs but captures the government. When copper crashed, Montana had little else — dependence on one owner is a deeper risk than dependence on one industry."},"NE":{"n":"Nebraska","c":"Lincoln","nk":"Cornhusker State","lc":"Omaha","yr":1867,"ord":37,"pop":1961504,"pr":37,"area":77348,"ar":16,"rg":"MW","fx":["Nebraska has more miles of river than any other state.","Kool-Aid was invented in Hastings, Nebraska in 1927."],"nb":["CO","IA","KS","MO","SD","WY"],"big":"The Platte River road west","pt":"Farm Belt","story":"Pawnee and Omaha country carried the Oregon Trail along the Platte — a river 'a mile wide and an inch deep' that pointed wagons west. The first Homestead Act claim was filed here in 1863, and the Union Pacific built west from Omaha. Center-pivot irrigation over the Ogallala Aquifer turned dry plains into cropland — spending ancient water to do it.","chain":["Oregon Trail follows the Platte","First homestead claim (1863)","Union Pacific builds west from Omaha","Dry-land farming busts many settlers","Ogallala Aquifer irrigation","Beef, corn, and insurance (Omaha)"],"dq":"The Homestead Act promised 'free land.' Free for whom, and at what cost?","da":"Free to settlers, but taken from Native nations — and dry-plains farming broke many homesteaders anyway. 'Free' land carried hidden prices for everyone involved."},"NV":{"n":"Nevada","c":"Carson City","nk":"Silver State","lc":"Las Vegas","yr":1864,"ord":36,"pop":3104614,"pr":32,"area":110572,"ar":7,"rg":"W","fx":["Nevada is the driest state, yet it has more mountain ranges than any other.","About 80% of Nevada's land is owned by the federal government."],"nb":["AZ","CA","ID","OR","UT"],"big":"What happens in the desert","pt":"Frontier/Resource","story":"Paiute and Shoshone country's Comstock Lode silver helped fund the Union — Lincoln rushed Nevada to statehood in 1864 partly for its votes. When mining busted, Nevada legalized what neighbors banned: gambling (1931), quick divorce, and more. Hoover Dam's water and power built Las Vegas, the atomic test site brought the Cold War, and lithium mines now feed electric cars.","chain":["Comstock silver funds the Union","Statehood rushed for Lincoln (1864)","Mines bust; state legalizes gambling (1931)","Hoover Dam powers Las Vegas","Tourism becomes the economy","Lithium for the battery age"],"dq":"Nevada built an economy on things that were illegal elsewhere. Clever strategy or fragile foundation?","da":"Both. Legalizing gambling turned empty desert into a world destination — but leisure economies crash hardest in recessions, as 2008 proved. Niches are powerful and fragile."},"NH":{"n":"New Hampshire","c":"Concord","nk":"Granite State","lc":"Manchester","yr":1788,"ord":9,"pop":1377529,"pr":41,"area":9349,"ar":46,"rg":"NE","fx":["New Hampshire declared independence from Britain six months before the Declaration of Independence.","Mount Washington once recorded a 231 mph wind gust — for decades the world record."],"nb":["ME","MA","VT"],"big":"Live free or die","pt":"New England","story":"Abenaki country became a colony of granite hills and mill towns — Manchester's Amoskeag was once the largest cotton mill complex on Earth. New Hampshire declared independence from Britain six months before the colonies did, and its 'Live Free or Die' identity survives in having no general income or sales tax — and in jealously guarding its first-in-the-nation primary.","chain":["Independent streak from 1776","Granite quarries and textile mills","Mills fade; Boston suburbs grow","No income or sales tax identity","First-in-the-nation primary power"],"dq":"How does a tiny state get outsized political power every four years?","da":"Its primary comes first, so every presidential candidate must campaign there in person. Rules and timing — not size — create power."},"NJ":{"n":"New Jersey","c":"Trenton","nk":"Garden State","lc":"Newark","yr":1787,"ord":3,"pop":9288994,"pr":11,"area":8723,"ar":47,"rg":"NE","fx":["New Jersey is the most densely populated state in the country.","The world's first drive-in movie theater opened in Camden in 1933."],"nb":["DE","NY","PA"],"big":"Small state, huge position","pt":"Gateway","story":"Lenape homeland between two great harbors became the corridor colony: Washington's army crossed it repeatedly because whoever held it linked New York and Philadelphia. Railroads, then factories, then Edison's Menlo Park lab — the first invention factory — lined the corridor. Today its container ports, pharmaceutical labs, and commuter rails make it the densest state in the nation.","chain":["Between New York and Philadelphia","Revolution's crossroads (Trenton, Princeton)","Railroads and factories line the corridor","Edison invents the invention lab","Highways, suburbs, and ports boom","Pharma and logistics hub today"],"dq":"New Jersey is small. So why is it important?","da":"Because importance isn't size — it's position. Its ports, highways, labs, and location between New York and Philadelphia made it more important than its acreage ever suggested."},"NM":{"n":"New Mexico","c":"Santa Fe","nk":"Land of Enchantment","lc":"Albuquerque","yr":1912,"ord":47,"pop":2117522,"pr":36,"area":121590,"ar":5,"rg":"SW","fx":["Santa Fe is the oldest state capital (founded 1610) and the highest, at 7,199 feet.","Carlsbad Caverns' Big Room is the largest cave chamber in North America."],"nb":["AZ","CO","OK","TX","UT"],"big":"The oldest and newest America","pt":"Desert Southwest","story":"Puebloan peoples built towns here — Acoma may be America's oldest continuously inhabited one — and in 1680 the Pueblo Revolt drove out Spanish rule for twelve years, the most successful Native uprising in North America. Santa Fe predates Plymouth. Three centuries later, scientists at Los Alamos built the atomic bomb in secret. Three cultures, four centuries, one state.","chain":["Puebloan towns (Chaco, Acoma)","Spanish capital at Santa Fe (1610)","Pueblo Revolt (1680)","Mexican rule, then U.S. conquest (1848)","Manhattan Project at Los Alamos","Art, oil, and three living cultures"],"dq":"Why does New Mexico feel like three cultures sharing one state?","da":"Puebloan, Hispanic, and Anglo layers are each centuries deep, and none erased the others. It's coexistence — not a melting pot — and it's visible in every town."},"NY":{"n":"New York","c":"Albany","nk":"Empire State","lc":"New York City","yr":1788,"ord":11,"pop":20201249,"pr":4,"area":54555,"ar":27,"rg":"NE","fx":["New York City was the first capital of the United States — George Washington was inaugurated there in 1789.","The NYC subway has 472 stations — the most of any system in the world."],"nb":["CT","MA","NJ","PA","VT"],"big":"The gateway","pt":"Gateway","story":"Haudenosaunee Confederacy country — whose league of nations impressed the founders — became Dutch New Amsterdam, then British New York. The Erie Canal (1825) linked the Atlantic to the Great Lakes and made NYC the port everything flowed through: goods, capital, and twelve million immigrants through Ellis Island. Finance and media made it a global capital even as upstate factories faded.","chain":["Great harbor + Hudson River","Erie Canal links the interior (1825)","NYC becomes THE port","Immigrants and capital concentrate","Wall Street and media rule","Upstate industry fades; the metro grows"],"dq":"Why did New York City become more powerful than most other American cities?","da":"A great harbor, the Hudson, then the Erie Canal gave it the interior's trade. Immigration, finance, and media stacked on top. Geography opened the door; human systems made it dominant."},"NC":{"n":"North Carolina","c":"Raleigh","nk":"Tar Heel State","lc":"Charlotte","yr":1789,"ord":12,"pop":10439388,"pr":9,"area":53819,"ar":28,"rg":"SE","fx":["The Wright brothers made the first airplane flight at Kitty Hawk in 1903 — it lasted 12 seconds.","The Biltmore Estate in Asheville is America's largest home, about 175,000 square feet."],"nb":["GA","SC","TN","VA"],"big":"Tobacco, textiles, and the tech pivot","pt":"Upland South","story":"Cherokee and Tuscarora country, site of the vanished Roanoke colony, grew into a state of tobacco fields and, later, textile and furniture mills. The Wright brothers flew at Kitty Hawk; Greensboro students launched the sit-in movement in 1960. When mills and tobacco declined, the Research Triangle's universities caught the falling economy — and banking made Charlotte second only to New York.","chain":["Tobacco wealth (Duke fortune)","Textile and furniture mills boom","Universities funded by tobacco money","Research Triangle Park (1959)","Mills move offshore","Banks and tech replace them"],"dq":"North Carolina lost textiles, furniture, and tobacco — and got richer. How?","da":"It invested in universities and research before the old industries died. The Research Triangle was planted in 1959, decades ahead of the decline. Transitions favor the prepared."},"ND":{"n":"North Dakota","c":"Bismarck","nk":"Peace Garden State","lc":"Fargo","yr":1889,"ord":39,"pop":779094,"pr":47,"area":70698,"ar":19,"rg":"MW","fx":["North Dakota produces more honey than any other state.","The geographic center of North America is near Rugby, North Dakota."],"nb":["MN","MT","SD"],"big":"Boom and bust on the northern plains","pt":"Frontier/Resource","story":"Mandan, Hidatsa, and Arikara villages on the Missouri hosted Lewis and Clark's coldest winter. Railroads sold 'bonanza farm' dreams; wheat and cattle followed. Oil came in the 1950s, then the Bakken fracking boom after 2008 doubled parts of the state overnight — and the Standing Rock pipeline protests of 2016 put an old question back on the map: whose land, whose water, whose risk?","chain":["Missouri River villages host Lewis & Clark","Railroads sell bonanza farms","Wheat economy, harsh climate","1950s oil, then the Bakken boom","Boomtowns strain and shrink","Standing Rock raises old questions"],"dq":"Oil booms bring money fast. What do they leave behind when they end?","da":"Paychecks and tax windfalls — then strained towns, scarred land, and dependence on prices set far away. Booms are loans from the future; busts are the repayment."},"OH":{"n":"Ohio","c":"Columbus","nk":"Buckeye State","lc":"Columbus","yr":1803,"ord":17,"pop":11799448,"pr":7,"area":44826,"ar":34,"rg":"MW","fx":["Astronauts Neil Armstrong and John Glenn — and both Wright brothers — were from Ohio.","Seven U.S. presidents were born in Ohio."],"nb":["IN","KY","MI","PA","WV"],"big":"The first West, the perennial mirror","pt":"Industrial","story":"Shawnee and Miami resistance under leaders like Tecumseh ended with removal, and the Northwest Ordinance made Ohio the model for every free state after: surveyed townships, public schools, no slavery. Canals and the lake built industry — Rockefeller's oil in Cleveland, rubber in Akron, steel in Youngstown. The Wright brothers, Neil Armstrong, and John Glenn all grew up here.","chain":["Northwest Ordinance sets the template","Canals link lake and river","Coal, oil (Rockefeller), rubber, steel","Aviation pioneers grow up here","Rust Belt decline","A political mirror of America"],"dq":"Why do presidential candidates obsess over Ohio?","da":"It's a miniature America — industrial cities, farms, suburbs, and Appalachian hills. A message that wins Ohio works almost everywhere, which is why it long picked presidents."},"OK":{"n":"Oklahoma","c":"Oklahoma City","nk":"Sooner State","lc":"Oklahoma City","yr":1907,"ord":46,"pop":3959353,"pr":28,"area":69899,"ar":20,"rg":"SW","fx":["Oklahoma's capitol grounds had working oil wells — one was nicknamed 'Petunia #1' for being drilled in a flower bed.","The parking meter was invented in Oklahoma City in 1935."],"nb":["AR","CO","KS","MO","NM","TX"],"big":"Indian Territory, then not","pt":"Frontier/Resource","story":"The Five Tribes were marched here on the Trail of Tears to land promised 'as long as grass grows and water runs.' Then the 1889 land runs opened it to settlers anyway, and statehood in 1907 dissolved the promise. Oil made Tulsa rich — including Greenwood, the 'Black Wall Street' destroyed by a white mob in 1921. In 2020, the Supreme Court's McGirt ruling affirmed that much of eastern Oklahoma remains reservation land.","chain":["Trail of Tears ends here","Indian Territory promised forever","Land runs open it anyway (1889)","Statehood dissolves the promise (1907)","Oil booms; Greenwood destroyed (1921)","Dust Bowl exodus","McGirt ruling revives the treaties (2020)"],"dq":"Is Oklahoma's story mostly 'empty land being settled' — or forced movement and broken agreements?","da":"The second. It was created from land promised permanently to removed nations, then opened to settlement anyway. The Supreme Court's McGirt decision acknowledged those promises still legally stand."},"OR":{"n":"Oregon","c":"Salem","nk":"Beaver State","lc":"Portland","yr":1859,"ord":33,"pop":4237256,"pr":27,"area":98379,"ar":9,"rg":"W","fx":["Crater Lake is the deepest lake in the U.S. — 1,943 feet, inside a collapsed volcano.","Oregon has no sales tax."],"nb":["CA","ID","NV","WA"],"big":"The trail's end","pt":"Pacific","story":"Chinook, Nez Perce, and Klamath homelands were the prize at the end of the Oregon Trail — 'free land' that came from Native dispossession, in a state whose early laws also excluded Black settlers entirely. Timber ruled for a century; Bonneville's cheap hydropower and Portland's port built industry; Nike and tech followed. The spotted-owl logging wars asked what the forests are actually for.","chain":["Oregon Trail promises free land","Native dispossession and exclusion laws","Timber capital of America","Cheap hydropower (Bonneville Dam)","Nike, Intel, and Portland grow","Logging vs. forests fight"],"dq":"Oregon was sold as a paradise at the end of the trail. Paradise for whom?","da":"For white settlers granted free land — land taken from Native peoples, in a state whose early constitution excluded Black Americans. 'Fresh starts' had gatekeepers."},"PA":{"n":"Pennsylvania","c":"Harrisburg","nk":"Keystone State","lc":"Philadelphia","yr":1787,"ord":2,"pop":13002700,"pr":5,"area":46054,"ar":33,"rg":"NE","fx":["The Declaration of Independence and the Constitution were both signed in Philadelphia.","Hershey, Pennsylvania is known as the Chocolate Capital of the U.S."],"nb":["DE","MD","NJ","NY","OH","WV"],"big":"Birthplace and factory","pt":"Industrial","story":"Penn's Quaker colony promised tolerance and drew the German, Scots-Irish, and later everyone. Philadelphia hosted the Declaration and the Constitution. Then Pennsylvania powered the industrial age: anthracite coal, the world's first oil well (1859), and Carnegie's steel — plus the labor wars, like Homestead, that forged American workers' rights. Meds-and-eds now stand where the mills did.","chain":["Quaker tolerance draws immigrants","Declaration and Constitution born here","Coal fields power the railroads","First oil well (1859); Carnegie steel","Labor wars forge workers' rights","Mills close; medicine and universities rebuild"],"dq":"How can one state symbolize both American liberty and hard industrial labor?","da":"Because both are American foundations. The documents were debated in Philadelphia; the country they created was physically built with Pennsylvania coal and steel — by workers who then fought for their own rights."},"RI":{"n":"Rhode Island","c":"Providence","nk":"Ocean State","lc":"Providence","yr":1790,"ord":13,"pop":1097379,"pr":44,"area":1545,"ar":50,"rg":"NE","fx":["Rhode Island is the smallest state — Alaska is over 400 times bigger.","Despite the name, most of Rhode Island is on the mainland."],"nb":["CT","MA"],"big":"Small, stubborn, first","pt":"New England","story":"Roger Williams fled Puritan Massachusetts and founded a colony on a radical idea: religious liberty and the separation of church and state. The same Newport that sheltered dissenters grew rich on the slave trade — Rhode Island ships carried a huge share of it. Slater Mill (1793) started the American Industrial Revolution, and stubborn little Rhode Island was the last state to ratify the Constitution.","chain":["Roger Williams founds a refuge (1636)","Religious liberty pioneered","Newport profits from the slave trade","Slater Mill starts U.S. industry (1793)","Last to ratify the Constitution","Textiles fade; services remain"],"dq":"Rhode Island preached liberty and profited from the slave trade at the same time. How do we hold both facts?","da":"Honestly. The same ports that sheltered religious dissenters financed slave voyages. History often carries both truths in one place — the point is to know them."},"SC":{"n":"South Carolina","c":"Columbia","nk":"Palmetto State","lc":"Charleston","yr":1788,"ord":8,"pop":5118425,"pr":23,"area":32020,"ar":40,"rg":"SE","fx":["The first shots of the Civil War were fired at Fort Sumter in Charleston Harbor in 1861.","South Carolina grows more peaches than Georgia, the 'Peach State'."],"nb":["GA","NC"],"big":"Where the Civil War began","pt":"Plantation South","story":"Rice and indigo plantations made colonial South Carolina rich — and made enslaved Africans the majority, whose Gullah culture survives on the Sea Islands. Its leaders led secession first, and the war's first shots hit Fort Sumter in Charleston Harbor. After a century of Jim Crow and textile mills, the coast now runs on tourism and the upstate builds BMWs and jets.","chain":["Rice wealth; enslaved majority","Gullah culture endures","First to secede (1860)","Fort Sumter: the war begins","Jim Crow and textile mills","Tourism and advanced manufacturing now"],"dq":"Why was South Carolina the first state to secede?","da":"Its wealth and politics were the most completely bound to slavery — enslaved people were the majority of its population. Its leaders saw any limit on slavery as an existential threat."},"SD":{"n":"South Dakota","c":"Pierre","nk":"Mount Rushmore State","lc":"Sioux Falls","yr":1889,"ord":40,"pop":886667,"pr":46,"area":77116,"ar":17,"rg":"MW","fx":["Mount Rushmore's presidential faces are 60 feet tall and took 14 years to carve.","The Badlands erode about an inch every year."],"nb":["IA","MN","MT","ND","NE","WY"],"big":"Sacred hills, sod houses","pt":"Frontier/Resource","story":"The 1868 treaty promised the Black Hills to the Lakota forever; gold was found in 1874, and the hills were seized. In 1980 the Supreme Court ruled the taking illegal and awarded money — the Lakota refuse it to this day, holding out for land. Homesteaders broke the prairie for wheat; Mount Rushmore was carved into the contested hills; and loose banking laws later made the state a credit-card capital.","chain":["Fort Laramie Treaty (1868)","Gold found; Black Hills seized","Wounded Knee (1890)","Homesteads and wheat","Rushmore carved into contested hills","Court rules the taking illegal (1980)"],"dq":"The Supreme Court ruled the Black Hills were taken illegally, and the Lakota refuse the payment. Why refuse money?","da":"Accepting it would legitimize the taking. For the Lakota, the hills are not for sale — the claim is for land, not compensation. Some things aren't priced."},"TN":{"n":"Tennessee","c":"Nashville","nk":"Volunteer State","lc":"Nashville","yr":1796,"ord":16,"pop":6910840,"pr":16,"area":42144,"ar":36,"rg":"SE","fx":["Nashville is 'Music City' — the Grand Ole Opry is the longest-running radio show in the U.S.","Great Smoky Mountains National Park is the most-visited national park in the country."],"nb":["AL","AR","GA","KY","MS","MO","NC","VA"],"big":"Music, rivers, and volunteers","pt":"Upland South","story":"Cherokee and Chickasaw removal cleared the state whose frontier volunteers gave it its nickname. The New Deal's TVA dams electrified the whole valley and changed the rural South forever; Oak Ridge secretly enriched uranium for the atomic bomb. Memphis mixed blues and soul on Beale Street — and lost Dr. King at the Lorraine Motel — while Nashville industrialized country music.","chain":["Trail of Tears begins here too","Frontier 'volunteers' win the nickname","TVA dams electrify the valley","Oak Ridge's secret atomic city","Memphis blues, Nashville country","Healthcare and logistics hubs today"],"dq":"How did a poor farm state end up with two of the world's music capitals?","da":"Rivers and railroads mixed Black and white musical traditions in Memphis and Nashville, then radio (the Grand Ole Opry) and recording studios industrialized the sound. Culture plus infrastructure equals industry."},"TX":{"n":"Texas","c":"Austin","nk":"Lone Star State","lc":"Houston","yr":1845,"ord":28,"pop":29145505,"pr":2,"area":268596,"ar":2,"rg":"SW","fx":["Texas was an independent country — the Republic of Texas — from 1836 to 1845.","Texas is larger than every country in Europe except Russia."],"nb":["AR","LA","NM","OK"],"big":"Land, border, oil, identity","pt":"Gateway","story":"The Comanche were the dominant power here long after Spain claimed it. Mexico invited Anglo settlers, who brought slavery Mexico had banned — one root of the 1836 revolution that made Texas an independent republic for nine years. Annexation triggered war with Mexico. Cattle drives, then Spindletop's 1901 gusher, then NASA and tech booms kept the legend growing — and the legend is part of the economy.","chain":["Comanche power, Spanish claims","Mexican Texas invites settlers","Revolution: an independent republic (1836)","Annexation brings war with Mexico","Cattle drives build the cowboy myth","Spindletop gusher (1901): the oil age","NASA, tech, and endless growth"],"dq":"Is Texas's identity based more on history, myth, geography, or economics?","da":"All four, braided together: real history (an actual republic), myth that magnifies it, land and border that shape it, and oil money that bankrolls the confidence."},"UT":{"n":"Utah","c":"Salt Lake City","nk":"Beehive State","lc":"Salt Lake City","yr":1896,"ord":45,"pop":3271616,"pr":30,"area":84897,"ar":13,"rg":"W","fx":["The Great Salt Lake is much saltier than the ocean — you float without trying.","Utah's Rainbow Bridge is one of the largest natural bridges in the world."],"nb":["AZ","CO","ID","NV","NM","WY"],"big":"The place that was supposed to be left alone","pt":"Mountain","story":"Ute, Shoshone, and Paiute country became the destination of the Mormon exodus of 1847 — refugees seeking isolation who made the desert bloom with cooperative irrigation. Isolation lasted 22 years: the transcontinental railroad's golden spike was driven in Utah in 1869. Statehood waited until the church ended plural marriage in 1896. Today the 'Silicon Slopes' and five national parks drive growth.","chain":["Mormon exodus seeks isolation (1847)","Cooperative irrigation greens the desert","Golden spike ends isolation (1869)","Polygamy conflict delays statehood","Compromise: statehood in 1896","Ski, parks, and tech boom"],"dq":"The Mormons went to Utah to be left alone — and the railroad arrived 22 years later. Can any place stay apart?","da":"Not for long. Isolation ended, and the community adapted — ending plural marriage to gain statehood. Eventually every place negotiates its terms with the nation."},"VT":{"n":"Vermont","c":"Montpelier","nk":"Green Mountain State","lc":"Burlington","yr":1791,"ord":14,"pop":643077,"pr":49,"area":9616,"ar":45,"rg":"NE","fx":["Vermont makes more maple syrup than any other state.","Montpelier is the smallest state capital — about 8,000 people."],"nb":["MA","NH","NY"],"big":"Contrary by nature","pt":"New England","story":"Abenaki country became a self-declared independent republic from 1777 to 1791, with a constitution that banned adult slavery before any other place in America. Merino sheep, then dairy, shaped its hills; granite and marble its towns. Its town-meeting tradition and small scale keep making it first — civil unions in 2000 — a laboratory the size of a county.","chain":["Independent republic (1777–91)","First constitution to ban adult slavery","Sheep boom, then dairy farms","Granite and marble quarries","Back-to-the-landers arrive (1970s)","First-in-the-nation reforms continue"],"dq":"Vermont was its own republic and joined the Union on its own terms. How does that echo today?","da":"In a stubborn independent streak: town meetings, first-in-the-nation laws, skepticism of bigness. Small scale makes experiments possible — Vermont runs them."},"VA":{"n":"Virginia","c":"Richmond","nk":"Old Dominion","lc":"Virginia Beach","yr":1788,"ord":10,"pop":8631393,"pr":12,"area":42775,"ar":35,"rg":"SE","fx":["Eight U.S. presidents were born in Virginia — more than any other state.","Jamestown (1607) was the first permanent English settlement in America."],"nb":["KY","MD","NC","TN","WV","DC"],"big":"Where American history keeps happening","pt":"Plantation South","story":"The Powhatan confederacy met England's first permanent colony at Jamestown in 1607; the first enslaved Africans arrived in 1619. Tobacco built a planter elite that wrote the founding documents — and held people in bondage while writing about liberty. The Civil War's capital and bloodiest battlefields were here. Today the Pentagon, the CIA, and the internet's data centers make the federal government Virginia's economy.","chain":["Jamestown (1607); first enslaved Africans (1619)","Tobacco builds the planter elite","That elite writes the founding documents","Civil War fought across its soil","Massive resistance to integration","Federal government becomes the economy"],"dq":"Virginia produced the authors of American liberty and the capital of the Confederacy. What does that tell us?","da":"That the contradiction is the American story in miniature: liberty and slavery grew in the same soil, written by some of the same hands. Understanding both is understanding the country."},"WA":{"n":"Washington","c":"Olympia","nk":"Evergreen State","lc":"Seattle","yr":1889,"ord":42,"pop":7705281,"pr":13,"area":71298,"ar":18,"rg":"W","fx":["Washington grows more apples than any other state.","It's the only state named after a president."],"nb":["ID","OR"],"big":"Timber, planes, and code","pt":"Pacific","story":"Coast Salish peoples' salmon-rich waters drew Hudson's Bay traders, then timber barons — Seattle got rich outfitting Klondike gold miners, not mining. Boeing's WWII bombers and jets built an engineering culture; Grand Coulee Dam's cheap power ran the aluminum and aircraft plants. Microsoft came home to it, Amazon grew inside it, and Asia trade flows through its ports.","chain":["Salmon and timber economies","Seattle outfits the Klondike rush","Boeing's wartime boom","Grand Coulee: cheapest power in America","Engineers cluster; Microsoft arrives","Amazon and the cloud"],"dq":"Why did software giants land in rainy Seattle instead of somewhere sunny?","da":"Talent and power: Boeing's engineers, a strong university, cheap hydropower — and Bill Gates coming home. Industries grow where skilled people already are, then attract more."},"WV":{"n":"West Virginia","c":"Charleston","nk":"Mountain State","lc":"Charleston","yr":1863,"ord":35,"pop":1793716,"pr":39,"area":24230,"ar":41,"rg":"SE","fx":["West Virginia was born when it split from Virginia during the Civil War in 1863.","The New River Gorge Bridge was for decades the world's longest single-arch steel bridge."],"nb":["KY","MD","OH","PA","VA"],"big":"Rich land, poor state","pt":"Mountain","story":"Shawnee and Cherokee frontier country split from Virginia in 1863 — mountain farmers refusing a planters' secession. Coal came to own it: company towns paid in scrip, and the mine wars climaxed at Blair Mountain in 1921, the largest armed labor uprising in U.S. history. The coal wealth mostly left the state; the risks stayed. Its gorges and forests are now the newest bet.","chain":["Mountain farmers split from Virginia (1863)","Coal companies own the towns","Mine wars: Blair Mountain (1921)","Wealth flows out; risk stays","Coal declines; jobs vanish","Outdoor recreation as the new hope"],"dq":"Can a place be rich in resources but still have many poor communities?","da":"Yes — when the resource is owned elsewhere. Coal built fortunes mostly outside West Virginia while miners bore the danger. Who owns the wealth matters more than who digs it."},"WI":{"n":"Wisconsin","c":"Madison","nk":"Badger State","lc":"Milwaukee","yr":1848,"ord":30,"pop":5893718,"pr":20,"area":65496,"ar":23,"rg":"MW","fx":["Wisconsin makes about a quarter of all the cheese in America.","The ice cream sundae is said to have been invented in Two Rivers, Wisconsin in 1881."],"nb":["IL","IA","MI","MN"],"big":"Dairy, beer, and the laboratory of democracy","pt":"Farm Belt","story":"Ho-Chunk, Menominee, and Ojibwe homelands drew lead miners (the 'badgers') and then waves of German immigrants who brought beer and progressive politics. When wheat exhausted the soil, Wisconsin reinvented itself as America's Dairyland. Its 'Wisconsin Idea' pioneered reforms the nation later copied: direct primaries, workers' compensation, unemployment insurance.","chain":["Lead miners: the original 'badgers'","German immigration; brewing capital","Wheat exhausts the soil","The dairy reinvention","Progressive 'Wisconsin Idea' reforms","Manufacturing and paper industries"],"dq":"Why is Wisconsin called a 'laboratory of democracy'?","da":"It tested reforms first — direct primaries, workers' comp, unemployment insurance — and the nation adopted what worked. States can be experiments; Wisconsin ran the boldest ones."},"WY":{"n":"Wyoming","c":"Cheyenne","nk":"Equality State","lc":"Cheyenne","yr":1890,"ord":44,"pop":576851,"pr":50,"area":97813,"ar":10,"rg":"W","fx":["Wyoming has the fewest people of any state — but it was the first to give women the vote, in 1869.","Yellowstone, mostly in Wyoming, was the world's first national park (1872)."],"nb":["CO","ID","MT","NE","SD","UT"],"big":"Empty and essential","pt":"Frontier/Resource","story":"Cheyenne, Arapaho, and Shoshone country held South Pass — the one easy gate through the Rockies, which is why the trails, the telegraph, and the railroad all came through Wyoming. It gave women the vote
