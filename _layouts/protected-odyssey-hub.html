---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 40vh; padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px; padding: 2.5rem 2rem; max-width: 400px; width: 100%;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── Word Odyssey · Voyage Map (hub) ─────────────────────────────────── */
  #odyssey-root { display: none; }

  .wo {
    --sea: #38bdf8; --gold: #fbbf24; --vio: #c084fc; --fire: #fb923c;
    --good: #4ade80;
    --card: rgba(255,255,255,0.05); --card2: rgba(56,189,248,0.09);
    --line: rgba(255,255,255,0.14);
    max-width: 820px;
  }
  .wo, .wo * { box-sizing: border-box; }
  .wo button, .wo a.btn {
    font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .wo-top {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .wo-spacer { flex: 1; }
  .wo-pill {
    font-size: 0.92rem; padding: 0.35rem 0.8rem; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    white-space: nowrap; color: inherit;
  }
  .wo-pill.rank { border-color: var(--gold); color: var(--gold);
                  font-weight: 700; }
  .wo-pill.xp { border-color: var(--sea); color: var(--sea);
                font-weight: 700; }
  .wo-pill.streak { border-color: var(--fire); color: var(--fire);
                    font-weight: 700; }

  .wo-hero {
    text-align: center; margin: 0.3rem 0 1.2rem;
    padding: 1.4rem 1rem 1.5rem;
    background: linear-gradient(180deg, var(--card2), transparent);
    border: 1px solid var(--line); border-radius: 18px;
  }
  .wo-hero h1 {
    margin: 0 0 0.3rem; font-size: 2.1rem;
    font-family: Georgia, 'Times New Roman', serif; letter-spacing: 0.01em;
  }
  .wo-hero .sub { margin: 0 0 1rem; opacity: 0.8; font-size: 1.02rem; }
  .wo-rank { max-width: 500px; margin: 0.5rem auto 0; }
  .wo-rank .lab {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.9rem; margin-bottom: 0.32rem;
  }
  .wo-rank .lab b { font-size: 1.08rem; color: var(--gold); }
  .wo-rank .lab span { opacity: 0.72; }
  .wo-bar {
    height: 14px; border-radius: 999px; background: rgba(255,255,255,0.08);
    overflow: hidden; border: 1px solid var(--line);
  }
  .wo-bar > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--sea), var(--vio), var(--gold));
  }

  .wo-sect {
    font-size: 1.1rem; font-weight: 700; margin: 1.6rem 0 0.7rem;
    display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;
  }
  .wo-sect .desc { font-size: 0.82rem; opacity: 0.62; font-weight: 400; }

  /* three halls */
  .wo-halls {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(216px, 1fr));
    gap: 0.75rem;
  }
  .wo-hall {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 1.1rem 1rem; text-align: center;
    line-height: 1.4; transition: transform 0.12s, border-color 0.12s;
  }
  .wo-hall:hover { transform: translateY(-2px); text-decoration: none; }
  .wo-hall.read:hover { border-color: var(--sea); }
  .wo-hall.write:hover { border-color: var(--fire); }
  .wo-hall.speak:hover { border-color: var(--vio); }
  .wo-hall .em { font-size: 2.5rem; display: block; }
  .wo-hall .nm {
    font-size: 1.15rem; font-weight: 700; display: block;
    margin: 0.3rem 0 0.2rem; font-family: Georgia, serif;
  }
  .wo-hall.read .nm { color: var(--sea); }
  .wo-hall.write .nm { color: var(--fire); }
  .wo-hall.speak .nm { color: var(--vio); }
  .wo-hall .dc { font-size: 0.85rem; opacity: 0.72; display: block; }
  .wo-hall .prog {
    font-size: 0.8rem; opacity: 0.8; display: block; margin-top: 0.5rem;
    padding-top: 0.5rem; border-top: 1px solid var(--line);
  }

  /* daily quest */
  .wo-quest {
    background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(192,132,252,0.08));
    border: 1px solid var(--gold); border-radius: 16px;
    padding: 1.1rem 1.2rem;
  }
  .wo-quest h3 {
    margin: 0 0 0.35rem; font-size: 1.2rem; font-family: Georgia, serif;
    color: var(--gold);
  }
  .wo-quest p { margin: 0 0 0.7rem; opacity: 0.85; font-size: 0.98rem;
                line-height: 1.55; }
  .wo-quest .steps { display: flex; flex-direction: column; gap: 0.4rem;
                     margin-bottom: 0.8rem; }
  .wo-quest .step {
    display: flex; gap: 0.6rem; align-items: center;
    background: rgba(0,0,0,0.15); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.55rem 0.8rem; font-size: 0.98rem;
  }
  .wo-quest .step.done { border-color: var(--good);
                         background: rgba(74,222,128,0.10); }
  .wo-quest .step .ic { font-size: 1.1rem; flex: none; }
  .wo-quest .step a { color: inherit; font-weight: 600; }
  .wo-quest .done-note {
    color: var(--good); font-weight: 700; text-align: center;
    font-size: 1.05rem;
  }

  /* powers grid */
  .wo-powers {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 0.5rem;
  }
  .wo-power {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 0.6rem 0.4rem; text-align: center;
    line-height: 1.25;
  }
  .wo-power .em { font-size: 1.35rem; }
  .wo-power .nm { font-size: 0.73rem; font-weight: 600; margin-top: 0.15rem; }
  .wo-power .md { font-size: 0.92rem; margin-top: 0.15rem; min-height: 1.1em; }
  .wo-power .ct { font-size: 0.68rem; opacity: 0.55; }
  .wo-power.due { border-color: var(--gold); }

  .wo-note {
    background: var(--card); border: 1px solid var(--line);
    border-left: 3px solid var(--sea); border-radius: 0 10px 10px 0;
    padding: 0.8rem 1rem; font-size: 0.93rem; line-height: 1.6;
    opacity: 0.9;
  }
  .wo-note a { font-weight: 600; }

  .wo-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.5rem;
  }
  .wo-stat {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 0.7rem 0.5rem; text-align: center;
  }
  .wo-stat b { display: block; font-size: 1.5rem; color: var(--gold);
               font-family: Georgia, serif; }
  .wo-stat span { font-size: 0.78rem; opacity: 0.7; }

  @media (max-width: 500px) {
    .wo-hero h1 { font-size: 1.65rem; }
  }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="odyssey-root"><div class="wo" id="wo"></div></div>

<script>
(function () {
  'use strict';

  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};
  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const key = await deriveKey(passphrase, blob.slice(0, 16));
    const plaintext = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: blob.slice(16, 28) }, key, blob.slice(28));
    return new TextDecoder().decode(plaintext);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('odyssey-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }
  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }
  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse hub data.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Hub.boot(data);
  }
  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) {
        try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {}
      }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }
  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true;
        input.disabled = true;
        try { reveal(await decrypt(cached)); return; }
        catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false;
          input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }
  btn.addEventListener('click', function () {
    if (!input.value) { input.focus(); return; }
    tryUnlock(input.value, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ═══════════════════ Word Odyssey · The Voyage Map ═══════════════════
     The hub that turns three separate halls into one continuous-
     improvement system. It owns nothing but the shared save
     (`word-odyssey-v1`) — it reads the XP/rank/streak/skill records the
     halls write and shows the whole journey in one place:
       - unified rank + XP bar across all three halls
       - a DAILY QUEST (one task from each hall) that bumps a streak
       - the Powers board with mastery medals + what is due for review
         (spaced repetition surfaced where he can see it)
       - links into each hall
     Deliberately has no games of its own — everything is a link, so this
     page can never drift out of sync with the halls.
  ═══════════════════════════════════════════════════════════════════════ */

  const Hub = (function () {

    const el = document.getElementById('wo');
    let DATA = null;

    const HALLS = [
      { key: 'read', cls: 'read', em: '🔮', name: 'The Oracle',
        sub: 'Reading Hall', url: '/teaching/english/odyssey-reading/',
        dc: 'Read like a detective — clues, evidence, and meaning.' },
      { key: 'write', cls: 'write', em: '⚒️', name: 'The Forge',
        sub: 'Writing Hall', url: '/teaching/english/odyssey-writing/',
        dc: 'Hammer sentences into shape. Then write your own.' },
      { key: 'speak', cls: 'speak', em: '🏛️', name: 'The Agora',
        sub: 'Speaking Hall', url: '/teaching/english/odyssey-speaking/',
        dc: 'Say what you think — clearly, with a reason, out loud.' }
    ];

    /* Powers across all three halls. Reading powers are bare keys (the
       Oracle wrote them first); writing/speaking are prefixed w_/s_. */
    const POWERS = [
      { k: 'infer',     em: '🔍', nm: 'Inference' },
      { k: 'cite',      em: '📜', nm: 'Evidence' },
      { k: 'craft',     em: '🎨', nm: "Author's Craft" },
      { k: 'gist',      em: '🎯', nm: 'Main Idea' },
      { k: 'structure', em: '🧱', nm: 'Text Structure' },
      { k: 'pov',       em: '👓', nm: 'Point of View' },
      { k: 'vocab',     em: '🗝️', nm: 'Word Clues' },
      { k: 'w_bcs',     em: '⚡', nm: 'Because/But/So' },
      { k: 'w_combine', em: '🔗', nm: 'Combining' },
      { k: 'w_expand',  em: '🌱', nm: 'Expanding' },
      { k: 'w_appos',   em: '💎', nm: 'Appositives' },
      { k: 'w_frag',    em: '🧱', nm: 'Sentences' },
      { k: 'w_show',    em: '🎭', nm: "Show Don't Tell" },
      { k: 'w_verb',    em: '🔥', nm: 'Strong Verbs' },
      { k: 'w_trans',   em: '🧭', nm: 'Transitions' },
      { k: 'w_para',    em: '🏛️', nm: 'Paragraphs' },
      { k: 's_prep',    em: '🗣️', nm: 'Impromptu' },
      { k: 's_cer',     em: '🔬', nm: 'Claim/Evidence' },
      { k: 's_stems',   em: '💬', nm: 'Talk Moves' },
      { k: 's_story',   em: '📖', nm: 'Storytelling' },
      { k: 's_read',    em: '🎭', nm: 'Expression' },
      { k: 's_script',  em: '🛡️', nm: 'Speaking Up' }
    ];

    const RANKS = [
      { xp: 0,    em: '🪶', name: 'Apprentice' },
      { xp: 80,   em: '⚓', name: 'Voyager' },
      { xp: 220,  em: '🧭', name: 'Navigator' },
      { xp: 450,  em: '🛡️', name: 'Champion' },
      { xp: 800,  em: '🏛️', name: 'Orator' },
      { xp: 1300, em: '⚔️', name: 'Hero' },
      { xp: 2000, em: '🌟', name: 'Legend' }
    ];
    function rankInfo(xp) {
      let cur = RANKS[0], nxt = null;
      for (let i = 0; i < RANKS.length; i++) {
        if (xp >= RANKS[i].xp) { cur = RANKS[i]; nxt = RANKS[i + 1] || null; }
      }
      const span = nxt ? (nxt.xp - cur.xp) : 1;
      const pct = nxt
        ? Math.max(4, Math.min(100, Math.round((xp - cur.xp) / span * 100)))
        : 100;
      return { cur: cur, nxt: nxt, pct: pct };
    }

    /* ── shared save ─────────────────────────────────────────────────── */
    const PKEY = 'word-odyssey-v1';
    let P = {};
    try { P = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.v = P.v || 1;
    P.xp = P.xp || 0;
    P.skills = P.skills || {};
    P.read = P.read || {}; P.read.stars = P.read.stars || {};
    P.write = P.write || {};
    P.write.stars = P.write.stars || {};
    P.write.pieces = P.write.pieces || [];
    P.speak = P.speak || {};
    P.speak.stars = P.speak.stars || {};
    P.speak.talks = P.speak.talks || 0;
    P.quest = P.quest || {};      /* {day:'YYYY-MM-DD', read:0, write:0, speak:0} */
    P.streak = P.streak || 0;
    P.lastQuestDay = P.lastQuestDay || '';
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }

    function today() { return new Date().toISOString().slice(0, 10); }
    function yesterday() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().slice(0, 10);
    }

    /* The daily quest tracks whether he has DONE something in each hall
       today. The halls don't know about the quest, so the hub infers
       progress from snapshots taken at the start of the day: any XP gain
       plus a change in that hall's own counters marks it done. Simple and
       robust — no cross-page messaging needed. */
    function ensureQuestDay() {
      const t = today();
      if (P.quest.day !== t) {
        P.quest = {
          day: t,
          xp0: P.xp,
          readStars0: Object.keys(P.read.stars).length,
          writeStars0: Object.keys(P.write.stars).length,
          pieces0: P.write.pieces.length,
          talks0: P.speak.talks,
          speakStars0: Object.keys(P.speak.stars).length
        };
        save();
      }
    }
    function questState() {
      ensureQuestDay();
      const q = P.quest;
      return {
        read: Object.keys(P.read.stars).length > q.readStars0,
        write: (Object.keys(P.write.stars).length > q.writeStars0) ||
               (P.write.pieces.length > q.pieces0),
        speak: (P.speak.talks > q.talks0) ||
               (Object.keys(P.speak.stars).length > q.speakStars0),
        xpToday: Math.max(0, P.xp - q.xp0)
      };
    }
    function updateStreak(allDone) {
      if (!allDone) return false;
      const t = today();
      if (P.lastQuestDay === t) return false;
      P.streak = (P.lastQuestDay === yesterday()) ? P.streak + 1 : 1;
      P.lastQuestDay = t;
      P.xp += 25;
      save();
      return true;
    }

    function medal(k) {
      const r = P.skills[k];
      if (!r || !r.s) return '';
      if (r.b >= 6) return '🥇';
      if (r.b >= 4) return '🥈';
      if (r.b >= 2) return '🥉';
      return '⚪';
    }
    function isDue(k) {
      const r = P.skills[k];
      return !!(r && r.s && r.due && r.due <= Date.now());
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                 '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    /* ── render ──────────────────────────────────────────────────────── */
    function render() {
      const q = questState();
      const allDone = q.read && q.write && q.speak;
      const bumped = updateStreak(allDone);

      el.innerHTML = '';

      const ri = rankInfo(P.xp);

      /* top pills */
      const bar = document.createElement('div');
      bar.className = 'wo-top';
      const sp = document.createElement('div');
      sp.className = 'wo-spacer';
      bar.appendChild(sp);
      const rk = document.createElement('span');
      rk.className = 'wo-pill rank';
      rk.textContent = ri.cur.em + ' ' + ri.cur.name;
      bar.appendChild(rk);
      const xp = document.createElement('span');
      xp.className = 'wo-pill xp';
      xp.textContent = '⭐ ' + P.xp + ' XP';
      bar.appendChild(xp);
      if (P.streak > 0) {
        const st = document.createElement('span');
        st.className = 'wo-pill streak';
        st.textContent = '🔥 ' + P.streak + ' day' + (P.streak === 1 ? '' : 's');
        bar.appendChild(st);
      }
      el.appendChild(bar);

      /* hero */
      const hero = document.createElement('div');
      hero.className = 'wo-hero';
      hero.innerHTML =
        '<h1>🗺️ Word Odyssey</h1>' +
        '<p class="sub">Every hero needs three powers: to <b>read</b> deeply, ' +
        'to <b>write</b> clearly, and to <b>speak</b> with purpose. ' +
        'Train all three and become a Legend.</p>' +
        '<div class="wo-rank">' +
          '<div class="lab"><b>' + ri.cur.em + ' ' + esc(ri.cur.name) +
          '</b><span>' + (ri.nxt
            ? (ri.nxt.xp - P.xp) + ' XP to ' + esc(ri.nxt.name) + ' ' + ri.nxt.em
            : 'Highest rank reached!') + '</span></div>' +
          '<div class="wo-bar"><i style="width:' + ri.pct + '%"></i></div>' +
        '</div>';
      el.appendChild(hero);

      /* daily quest */
      const qh = document.createElement('div');
      qh.className = 'wo-sect';
      qh.innerHTML = '🎯 Today\'s Quest ' +
        '<span class="desc">One thing in each hall. Finish all three to ' +
        'keep your streak alive.</span>';
      el.appendChild(qh);

      const quest = document.createElement('div');
      quest.className = 'wo-quest';
      let stepsHtml = '';
      HALLS.forEach(function (h) {
        const done = q[h.key];
        stepsHtml += '<div class="step' + (done ? ' done' : '') + '">' +
          '<span class="ic">' + (done ? '✅' : h.em) + '</span>' +
          '<span>' + (done ? 'Done — ' : '') +
          '<a href="' + h.url + '">' +
          (h.key === 'read' ? 'Read a passage in The Oracle'
           : h.key === 'write' ? 'Forge sentences (or write something) in The Forge'
           : 'Speak out loud in The Agora') +
          '</a></span></div>';
      });
      quest.innerHTML = '<h3>' + (allDone ? '🏆 Quest complete!' : '⚔️ Three tasks') +
        '</h3><p>' + (allDone
          ? 'You read, you wrote, and you spoke today. That is exactly how ' +
            'a Legend is built — a little of all three, every day.'
          : 'Do one thing in each hall today. It does not have to be long — ' +
            'ten minutes total is enough to keep getting better.') +
        '</p><div class="steps">' + stepsHtml + '</div>' +
        (q.xpToday ? '<p style="text-align:center;margin:0">⭐ <b>' +
          q.xpToday + ' XP</b> earned today</p>' : '') +
        (bumped ? '<p class="done-note">🔥 Streak now ' + P.streak +
          ' day' + (P.streak === 1 ? '' : 's') + ' — +25 XP bonus!</p>' : '');
      el.appendChild(quest);

      /* three halls */
      const hh = document.createElement('div');
      hh.className = 'wo-sect';
      hh.innerHTML = '🏛️ The Three Halls';
      el.appendChild(hh);

      const halls = document.createElement('div');
      halls.className = 'wo-halls';
      HALLS.forEach(function (h) {
        const a = document.createElement('a');
        a.className = 'wo-hall ' + h.cls;
        a.href = h.url;
        let prog = '';
        /* pluralise every count — "1 pieces written" shipped once on this
           site and was caught in testing; keep the ternaries */
        if (h.key === 'read') {
          const n = Object.keys(P.read.stars).length;
          prog = n + (n === 1 ? ' passage read' : ' passages read');
        } else if (h.key === 'write') {
          const f = Object.keys(P.write.stars).length;
          const w = P.write.pieces.length;
          prog = f + (f === 1 ? ' forge tried · ' : ' forges tried · ') +
                 w + (w === 1 ? ' piece written' : ' pieces written');
        } else {
          const t = P.speak.talks;
          prog = t + (t === 1 ? ' time spoken out loud'
                              : ' times spoken out loud');
        }
        a.innerHTML = '<span class="em">' + h.em + '</span>' +
          '<span class="nm">' + esc(h.name) + '</span>' +
          '<span class="dc">' + esc(h.dc) + '</span>' +
          '<span class="prog">' + esc(prog) + '</span>';
        halls.appendChild(a);
      });
      el.appendChild(halls);

      /* powers board */
      const seen = POWERS.filter(function (p) {
        const r = P.skills[p.k];
        return r && r.s;
      });
      const due = seen.filter(function (p) { return isDue(p.k); });

      const ph = document.createElement('div');
      ph.className = 'wo-sect';
      ph.innerHTML = '⚡ Your Powers ' +
        '<span class="desc">' + seen.length + ' of ' + POWERS.length +
        ' started' + (due.length
          ? ' · ' + due.length + ' ready to practise again (gold border)'
          : '') + '</span>';
      el.appendChild(ph);

      const pg = document.createElement('div');
      pg.className = 'wo-powers';
      POWERS.forEach(function (p) {
        const r = P.skills[p.k];
        const d = document.createElement('div');
        d.className = 'wo-power' + (isDue(p.k) ? ' due' : '');
        d.style.opacity = (r && r.s) ? '1' : '0.42';
        d.innerHTML = '<div class="em">' + p.em + '</div>' +
          '<div class="nm">' + esc(p.nm) + '</div>' +
          '<div class="md">' + (medal(p.k) || '·') + '</div>' +
          '<div class="ct">' + (r && r.s ? r.r + '/' + r.s : 'not yet') + '</div>';
        pg.appendChild(d);
      });
      el.appendChild(pg);

      /* stats */
      const sh = document.createElement('div');
      sh.className = 'wo-sect';
      sh.innerHTML = '📊 The Journey So Far';
      el.appendChild(sh);
      const stats = document.createElement('div');
      stats.className = 'wo-stats';
      const golds = POWERS.filter(function (p) {
        const r = P.skills[p.k];
        return r && r.b >= 4;
      }).length;
      [
        [P.xp, 'total XP'],
        [P.streak, 'day streak'],
        [Object.keys(P.read.stars).length, 'passages read'],
        [P.write.pieces.length, 'pieces written'],
        [P.speak.talks, 'talks given'],
        [golds, 'powers mastered']
      ].forEach(function (row) {
        const d = document.createElement('div');
        d.className = 'wo-stat';
        d.innerHTML = '<b>' + row[0] + '</b><span>' + row[1] + '</span>';
        stats.appendChild(d);
      });
      el.appendChild(stats);

      /* grown-up note */
      const nh = document.createElement('div');
      nh.className = 'wo-sect';
      nh.innerHTML = '📚 For grown-ups';
      el.appendChild(nh);
      const note = document.createElement('div');
      note.className = 'wo-note';
      note.innerHTML = DATA.note;
      el.appendChild(note);

      window.scrollTo(0, 0);
    }

    function boot(data) {
      DATA = data;
      render();
    }
    return { boot: boot };
  })();

  init();
})();
</script>
