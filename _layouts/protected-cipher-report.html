---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 40vh; padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px; padding: 2.5rem 2rem; max-width: 400px; width: 100%;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── CIPHER · Report Craft ───────────────────────────────────────────── */
  #cipher-root { display: none; }

  .cf {
    --sig: #22d3ee; --amber: #fbbf24; --stamp: #f87171; --ok: #4ade80;
    --paper: rgba(255,255,255,0.045); --paper2: rgba(251,191,36,0.08);
    --line: rgba(255,255,255,0.15);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-width: 820px;
  }
  .cf, .cf * { box-sizing: border-box; }
  .cf button, .cf input, .cf textarea {
    font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .cf-top {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .cf-back {
    background: var(--paper); border: 1px solid var(--line); color: inherit;
    border-radius: 6px; padding: 0.45rem 1rem; font-size: 0.95rem;
    cursor: pointer;
  }
  .cf-back:hover { border-color: var(--amber); }
  .cf-spacer { flex: 1; }
  .cf-pill {
    font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em;
    padding: 0.35rem 0.7rem; border-radius: 4px;
    background: var(--paper); border: 1px solid var(--line);
    white-space: nowrap; color: inherit;
  }
  /* Just the Docs colours every .main-content anchor via
     `.main-content a:not(.btn):not(.anchor-heading)` (specificity 0,3,1),
     which nothing we can write here beats — force the pill back. */
  .cf a.cf-pill { color: inherit !important; text-decoration: none; }

  button.cf-pill { cursor: pointer; }
  button.cf-pill.off { opacity: 0.42; }

  .cf-hero {
    border: 1px solid var(--line); border-left: 4px solid var(--amber);
    border-radius: 4px; padding: 1rem 1.2rem; margin-bottom: 1.2rem;
    background: linear-gradient(180deg, var(--paper2), transparent);
  }
  .cf-hero .tag {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.22em;
    color: var(--amber); text-transform: uppercase;
  }
  .cf-hero h1 { margin: 0.25rem 0 0.3rem; font-size: 1.75rem; }
  .cf-hero p { margin: 0; opacity: 0.78; font-size: 0.98rem; line-height: 1.6; }

  .cf-statbar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr));
    gap: 0.5rem; margin-top: 0.9rem;
  }
  .cf-stat {
    background: rgba(0,0,0,0.18); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.5rem 0.4rem; text-align: center;
  }
  .cf-stat b { display: block; font-family: var(--mono); font-size: 1.25rem;
               color: var(--amber); }
  .cf-stat span { font-size: 0.7rem; opacity: 0.7; letter-spacing: 0.04em; }

  .cf-sect {
    font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.18em;
    text-transform: uppercase; opacity: 0.62;
    margin: 1.6rem 0 0.6rem; display: flex; align-items: baseline;
    gap: 0.6rem; flex-wrap: wrap;
  }
  .cf-sect .n { color: var(--amber); }

  .cf-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
    gap: 0.55rem;
  }
  .cf-drill {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.8rem 0.7rem; cursor: pointer;
    color: inherit; text-align: left; line-height: 1.35;
  }
  .cf-drill:hover { border-color: var(--amber); }
  .cf-drill .em { font-size: 1.4rem; }
  .cf-drill .nm { display: block; font-weight: 700; font-size: 0.95rem;
                  margin: 0.2rem 0 0.15rem; }
  .cf-drill .dc { display: block; font-size: 0.76rem; opacity: 0.62; }
  .cf-drill .st { font-family: var(--mono); font-size: 0.7rem;
                  letter-spacing: 0.1em; color: var(--ok); }

  .cf-panel {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 1rem 1.1rem; margin-bottom: 0.9rem;
    line-height: 1.65;
  }
  .cf-panel.quote {
    border-left: 3px solid var(--amber); background: var(--paper2);
    font-size: 1.08rem;
  }
  .cf-label {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em;
    text-transform: uppercase; opacity: 0.6; display: block;
    margin-bottom: 0.35rem;
  }
  .cf-lesson { border-left: 3px solid var(--sig); }
  .cf-lesson b { color: var(--sig); }

  .cf-qnum { font-family: var(--mono); font-size: 0.72rem; opacity: 0.55;
             letter-spacing: 0.1em; margin-bottom: 0.4rem; }
  .cf-prompt { font-size: 1.16rem; font-weight: 700; line-height: 1.5;
               margin-bottom: 0.7rem; }

  .cf-opts { display: flex; flex-direction: column; gap: 0.5rem; }
  .cf-opt {
    background: var(--paper); border: 2px solid var(--line); color: inherit;
    border-radius: 4px; padding: 0.7rem 0.95rem; font-size: 1.02rem;
    cursor: pointer; text-align: left; line-height: 1.5;
  }
  .cf-opt:hover:not(:disabled) { border-color: var(--amber); }
  .cf-opt:disabled { cursor: default; }
  .cf-opt.dim { opacity: 0.32; }
  .cf-opt.yes { border-color: var(--ok); background: rgba(74,222,128,0.12); }
  .cf-opt.no { border-color: var(--stamp); animation: cfNudge 0.35s; }

  .cf-feedback { margin-top: 0.85rem; font-size: 1.02rem; line-height: 1.6; }
  .cf-feedback .teach {
    display: block; margin-top: 0.4rem; padding: 0.6rem 0.8rem;
    background: rgba(0,0,0,0.2); border-left: 3px solid var(--sig);
    border-radius: 0 4px 4px 0; font-size: 0.98rem;
  }
  .cf-built {
    margin-top: 0.8rem; padding: 0.75rem 0.95rem; border-radius: 4px;
    background: rgba(74,222,128,0.09); border: 1px solid var(--ok);
    font-size: 1.05rem; line-height: 1.65;
  }
  .cf-built b { color: var(--ok); }

  .cf-slotlab {
    display: inline-block; font-family: var(--mono); font-size: 0.85rem;
    font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 0.3rem 0.8rem; border-radius: 3px; margin-bottom: 0.6rem;
    border: 1px solid var(--sig); color: var(--sig);
    background: rgba(34,211,238,0.1);
  }
  .cf-stem {
    font-size: 1.16rem; font-weight: 700; line-height: 1.55;
    background: var(--paper); border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 0 4px 4px 0; padding: 0.8rem 1rem; margin-bottom: 0.9rem;
  }

  /* paragraph ordering */
  .cf-slots { display: flex; flex-direction: column; gap: 0.4rem;
              margin-bottom: 0.9rem; }
  .cf-slot {
    display: flex; align-items: flex-start; gap: 0.6rem;
    background: var(--paper); border: 1px dashed var(--line);
    border-radius: 4px; padding: 0.6rem 0.8rem; min-height: 2.9rem;
    font-size: 1rem; line-height: 1.55;
  }
  .cf-slot .n {
    flex: none; width: 1.65rem; height: 1.65rem; border-radius: 3px;
    background: rgba(0,0,0,0.25); display: flex; align-items: center;
    justify-content: center; font-family: var(--mono); font-size: 0.8rem;
  }
  .cf-slot .role { font-family: var(--mono); font-size: 0.66rem;
                   letter-spacing: 0.1em; opacity: 0.55; display: block;
                   text-transform: uppercase; }
  .cf-slot.ok { border-style: solid; border-color: var(--ok);
                background: rgba(74,222,128,0.09); }
  .cf-slot.bad { border-color: var(--stamp); animation: cfNudge 0.35s; }
  .cf-parts { display: flex; flex-direction: column; gap: 0.45rem; }
  .cf-part {
    background: var(--paper); border: 2px solid var(--line); color: inherit;
    border-radius: 4px; padding: 0.65rem 0.9rem; font-size: 1rem;
    cursor: pointer; text-align: left; line-height: 1.5;
  }
  .cf-part:hover { border-color: var(--amber); }
  .cf-part.used { display: none; }

  /* studio */
  .cf textarea, .cf input[type=text] {
    width: 100%; background: rgba(0,0,0,0.22); color: inherit;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 0.65rem 0.8rem; font-size: 1.04rem; line-height: 1.7;
    font-family: inherit;
  }
  .cf textarea { min-height: 190px; resize: vertical; }
  .cf textarea:focus, .cf input[type=text]:focus {
    outline: none; border-color: var(--amber);
  }
  .cf-count { font-family: var(--mono); font-size: 0.76rem; opacity: 0.6;
              text-align: right; margin: 0.35rem 0 0.9rem; }
  .cf-check { display: flex; flex-direction: column; gap: 0.4rem; }
  .cf-check label {
    display: flex; gap: 0.6rem; align-items: flex-start;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.55rem 0.75rem; font-size: 0.98rem;
    cursor: pointer; line-height: 1.5;
  }
  .cf-check input { margin-top: 0.28rem; flex: none;
                    width: 1.02rem; height: 1.02rem; }
  .cf-check label.on { border-color: var(--ok);
                       background: rgba(74,222,128,0.09); }

  .cf-saved {
    background: var(--paper); border: 1px solid var(--line);
    border-left: 3px solid var(--amber); border-radius: 0 4px 4px 0;
    padding: 0.75rem 0.95rem; margin-bottom: 0.5rem; line-height: 1.65;
  }
  .cf-saved .meta {
    font-family: var(--mono); font-size: 0.72rem; opacity: 0.6;
    letter-spacing: 0.05em; margin-bottom: 0.35rem;
  }
  .cf-saved .body { white-space: pre-wrap; }

  .cf-microw { display: flex; gap: 0.4rem; align-items: center;
               margin-top: 0.35rem; flex-wrap: wrap; }
  .cf-mic {
    background: none; border: 1px solid var(--line); color: inherit;
    border-radius: 999px; padding: 0.32rem 0.8rem; font-size: 0.84rem;
    cursor: pointer;
  }
  .cf-mic:hover { border-color: var(--sig); }
  .cf-mic.live { border-color: var(--stamp); color: var(--stamp);
                 animation: cfPulse 1.1s infinite; }
  .cf-hint { font-size: 0.8rem; opacity: 0.6; line-height: 1.5; }

  .cf-btn {
    background: var(--amber); color: #2a1c02; border: none;
    border-radius: 4px; padding: 0.7rem 1.6rem; font-size: 1.02rem;
    font-weight: 700; cursor: pointer;
  }
  .cf-btn:hover { opacity: 0.9; }
  .cf-btn.ghost { background: none; color: inherit;
                  border: 1px solid var(--line); font-weight: 400; }
  .cf-btn.ghost:hover { border-color: var(--amber); }
  .cf-btn.danger { background: none; border: 1px solid var(--stamp);
                   color: var(--stamp); font-weight: 400; }
  .cf-row { display: flex; gap: 0.5rem; flex-wrap: wrap;
            align-items: center; margin-top: 0.9rem; }

  .cf-recap { text-align: center; padding: 1.4rem 0; }
  .cf-recap .big { font-size: 3rem; }
  .cf-recap h2 { margin: 0.3rem 0; font-size: 1.35rem; }
  .cf-recap .code2 { font-family: var(--mono); font-size: 0.8rem;
                     letter-spacing: 0.18em; color: var(--ok); }
  .cf-recap p { opacity: 0.82; margin: 0.35rem 0; }

  @keyframes cfNudge {
    25% { transform: translateX(-4px); } 75% { transform: translateX(4px); }
  }
  @keyframes cfPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.55); }
    50% { box-shadow: 0 0 0 10px rgba(248,113,113,0); }
  }

  @media (max-width: 520px) {
    .cf-hero h1 { font-size: 1.4rem; }
    .cf-opt, .cf-part { font-size: 0.96rem; }
    .cf-prompt { font-size: 1.06rem; }
  }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="cipher-root"><div class="cf" id="cf"></div></div>

<script>
(function () {
  'use strict';

  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};
  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const key = await deriveKey(passphrase, blob.slice(0, 16));
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: blob.slice(16, 28) }, key, blob.slice(28));
    return new TextDecoder().decode(pt);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('cipher-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }
  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }
  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse drill bank.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Report.boot(data);
  }
  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) { try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {} }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }
  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true; input.disabled = true;
        try { reveal(await decrypt(cached)); return; }
        catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false; input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }
  btn.addEventListener('click', function () {
    if (!input.value) { input.focus(); return; }
    tryUnlock(input.value, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ═══════════════════ CIPHER · Report Craft ═══════════════════════════
     Sentence-level writing, on the Hochman Method (The Writing
     Revolution). Unlike comprehension strategies — which plateau after
     roughly 10 hours — writing is generative and keeps improving with
     practice, so this bank is NOT capped and repeat drilling is the
     point.

     Ten drills. The three that carry the most weight:
       ⚡ because / but / so  — one stem, three logical relationships
       🔗 subordinating conjunctions — although / unless / if openers
       🏛️ single-paragraph build — topic -> support -> conclusion

     Plus the Writing Desk: a prompt, a blank page, and a rubric he
     grades himself against (self-assessment is itself a taught skill).

     Save: `cipher-v1` under P.report, shared with the other CIPHER
     pages. Two tries then teach, no failure state, nothing auto-advances.
  ═══════════════════════════════════════════════════════════════════════ */

  const Report = (function () {

    const el = document.getElementById('cf');
    let DATA = null;

    const DRILLS = [
      { kind: 'bcs', em: '⚡', name: 'Because / But / So',
        desc: 'One idea, three ways',
        lesson: 'The signature drill. Finish one stem three different ways: ' +
                '<b>because</b> gives the REASON, <b>but</b> gives the ' +
                'SURPRISE, <b>so</b> gives the RESULT. It forces you to think ' +
                'about one idea from three angles.' },
      { kind: 'subord', em: '🔗', name: 'Although / Unless / If',
        desc: 'Start with the twist',
        lesson: 'Sentences that OPEN with <b>although</b>, <b>unless</b> or ' +
                '<b>if</b>. The first half cannot stand alone — so it needs a ' +
                'comma and then a real sentence. Starting this way instantly ' +
                'makes writing sound older.' },
      { kind: 'combine', em: '🪢', name: 'Sentence Combining',
        desc: 'Choppy → one strong sentence',
        lesson: 'Short choppy sentences make writing sound young. Joining them ' +
                'properly is the single most researched writing exercise there ' +
                'is.' },
      { kind: 'expand', em: '🌱', name: 'Sentence Expanding',
        desc: 'Grow a bare sentence',
        lesson: 'Take a bare kernel and grow it by answering question words: ' +
                '<b>who, what, when, where, why, how</b>. Real information ' +
                'beats piling on adjectives.' },
      { kind: 'appos', em: '💎', name: 'Appositives',
        desc: 'Rename a noun, in commas',
        lesson: 'An <b>appositive</b> renames a noun between two commas: ' +
                '"Athena, <i>the goddess of wisdom</i>, helped him." No "who ' +
                'was" needed — that is what makes it tight.' },
      { kind: 'frag', em: '🧱', name: 'Fragment or Sentence?',
        desc: 'Spot the incomplete ones',
        lesson: 'A sentence needs a <b>subject</b> and a <b>verb</b> and must ' +
                'feel finished. Fragments and comma splices are the most ' +
                'common mistakes at this level — learn to hear them.' },
      { kind: 'show', em: '🎭', name: "Show, Don't Tell",
        desc: 'Give evidence, not labels',
        lesson: 'Do not TELL the reader "he was nervous." SHOW something they ' +
                'can see — shaking hands, a re-read line — and let them ' +
                'conclude it.' },
      { kind: 'verb', em: '🔥', name: 'Precise Verbs',
        desc: 'One right verb beats two words',
        lesson: 'Weak verb + adverb ("walked quietly") loses to one precise ' +
                'verb ("crept"). Hunt <b>was, were, there was, went, got</b> ' +
                'in your own writing.' },
      { kind: 'trans', em: '🧭', name: 'Transitions',
        desc: 'Name the logical move',
        lesson: 'Transitions tell the reader what move you are making: ' +
                'sequence, contrast, cause, example, conclusion.' },
      { kind: 'para', em: '🏛️', name: 'Paragraph Build',
        desc: 'Topic → support → conclusion',
        lesson: 'A paragraph has a shape: a <b>topic sentence</b> that makes ' +
                'the point, <b>supporting details</b> that prove it, and a ' +
                '<b>conclusion</b> that closes it. Tap them into order.' }
    ];

    function slotRole(i, n) {
      if (i === 0) return 'Topic sentence';
      if (i === n - 1) return 'Conclusion';
      return 'Support ' + i;
    }

    const RUBRIC = [
      'My first sentence tells the reader what this is about.',
      'I used a <b>because</b>, <b>but</b> or <b>so</b> sentence.',
      'I started one sentence with <b>although</b>, <b>unless</b> or <b>if</b>.',
      'I SHOWED a feeling instead of naming it.',
      'I used a precise verb instead of "was" or "went".',
      'I used a transition word (then, however, as a result…).',
      'Every sentence starts with a capital and ends with punctuation.',
      'I read it out loud and fixed what sounded wrong.'
    ];

    const PROMPTS = [
      'Write about a time you practised something until you finally got it.',
      'You find a door in your house that was never there before. Open it.',
      'Describe a song WITHOUT naming it — make me hear it.',
      'Write the best goal, race or match you have ever seen or played in.',
      'You wake up on the deck of a ship far from land. What do you see and hear?',
      'Argue: should kids choose what they read in school? Give three reasons.',
      'Write the moment a plan goes badly wrong.',
      'Describe building something with your hands, step by step.',
      'Something small goes missing at home. Write it like a mystery.',
      'Convince someone to learn your instrument. Use because, but and so.'
    ];

    /* ── save ─────────────────────────────────────────────────────────── */
    const PKEY = 'cipher-v1';
    let P = {};
    try { P = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.v = P.v || 1;
    P.report = P.report || {};
    P.report.done = P.report.done || {};     /* kind -> times completed */
    P.report.best = P.report.best || {};     /* kind -> best score 0..1 */
    P.report.pieces = P.report.pieces || [];
    P.settings = P.settings || {};
    if (P.settings.voice === undefined) P.settings.voice = true;
    if (P.settings.sound === undefined) P.settings.sound = true;
    if (P.settings.mic === undefined) P.settings.mic = true;
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }
    function today() { return new Date().toISOString().slice(0, 10); }

    /* ── speech (same rules as every engine on this site) ─────────────── */
    const VOICE_KEY = 'mwestwood-voice-name';
    let voiceName = localStorage.getItem(VOICE_KEY) || '';
    const JOKE_VOICES = ['Albert', 'Bad News', 'Bahh', 'Bells', 'Boing',
      'Bubbles', 'Cellos', 'Good News', 'Jester', 'Organ', 'Superstar',
      'Trinoids', 'Whisper', 'Wobble', 'Zarvox', 'Deranged', 'Hysterical'];
    const NICE_NAMES = /^(Samantha|Ava|Allison|Susan|Zoe|Karen|Daniel|Moira|Tessa|Fiona|Serena|Kate)\b/;
    let VOICES = [], chosenVoice = null;

    function rankVoice(v) {
      const n = v.name;
      let r = 60;
      if (n === 'Google US English') r = -100;
      else if (/natural|neural/i.test(n)) r = 0;
      else if (/enhanced|premium/i.test(n)) r = 10;
      else if (NICE_NAMES.test(n)) r = 20;
      else if (/^Google/i.test(n)) r = 30;
      else if (v.localService) r = 40;
      if (/^en[-_]US/i.test(v.lang)) r -= 5;
      else if (/^en/i.test(v.lang)) r -= 2;
      return r;
    }
    function loadVoices() {
      try {
        if (!window.speechSynthesis) return;
        const all = speechSynthesis.getVoices().filter(function (v) {
          if (!/^en/i.test(v.lang)) return false;
          return JOKE_VOICES.indexOf(v.name.replace(/\s*\(.*\)$/, '')) === -1;
        });
        if (!all.length) return;
        all.sort(function (a, b) {
          return rankVoice(a) - rankVoice(b) || a.name.localeCompare(b.name);
        });
        VOICES = all;
        chosenVoice = voiceName
          ? (all.find(function (v) { return v.name === voiceName; }) || all[0])
          : all[0];
      } catch (_) {}
    }
    loadVoices();
    try { speechSynthesis.onvoiceschanged = loadVoices; } catch (_) {}
    setTimeout(loadVoices, 300);

    const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const CAN_DEFER_SPEECH = !IS_IOS;

    function speak(text) {
      if (!P.settings.voice) return;
      try {
        if (!window.speechSynthesis) return;
        const was = speechSynthesis.speaking;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(
          String(text).replace(/[⚡🔗🪢🌱💎🧱🎭🔥🧭🏛️✅…]/g, ''));
        u.rate = 0.92;
        if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; u.pitch = 1; }
        if (was && CAN_DEFER_SPEECH) {
          setTimeout(function () { try { speechSynthesis.speak(u); } catch (_) {} }, 50);
        } else { speechSynthesis.speak(u); }
      } catch (_) {}
    }

    let audioCtx = null;
    function tone(f, s, d, v) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, audioCtx.currentTime + s);
      g.gain.linearRampToValueAtTime(v, audioCtx.currentTime + s + 0.02);
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + s + d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + s);
      o.stop(audioCtx.currentTime + s + d + 0.05);
    }
    function sfx(kind) {
      if (!P.settings.sound) return;
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (kind === 'good') { tone(523, 0, 0.13, 0.06); tone(784, 0.11, 0.18, 0.06); }
        else if (kind === 'soft') { tone(233, 0, 0.17, 0.04); }
        else if (kind === 'badge') { tone(659, 0, 0.11, 0.055); tone(784, 0.09, 0.11, 0.055); tone(1047, 0.19, 0.24, 0.055); }
      } catch (_) {}
    }

    /* dictation into a textarea (same helper as Field Craft) */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const MIC_OK = !!SR;
    function attachMic(textarea, host) {
      if (!MIC_OK || !P.settings.mic) return;
      const row = document.createElement('div');
      row.className = 'cf-microw';
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cf-mic';
      b.textContent = '🎙️ Say it instead';
      row.appendChild(b);
      const note = document.createElement('span');
      note.className = 'cf-hint';
      row.appendChild(note);
      host.appendChild(row);
      let rec = null;
      b.addEventListener('click', function () {
        if (rec) { try { rec.stop(); } catch (_) {} return; }
        try { rec = new SR(); } catch (_) { note.textContent = 'Mic unavailable.'; return; }
        rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
        const base = textarea.value ? textarea.value.replace(/\s+$/, '') + ' ' : '';
        let finalText = '';
        b.classList.add('live'); b.textContent = '⏹ Stop';
        note.textContent = 'listening…';
        rec.onresult = function (e) {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) finalText += r[0].transcript + ' ';
            else interim += r[0].transcript;
          }
          textarea.value = base + finalText + interim;
        };
        function done(msg) {
          rec = null;
          b.classList.remove('live'); b.textContent = '🎙️ Say it instead';
          note.textContent = msg || '';
          textarea.dispatchEvent(new Event('input'));
        }
        rec.onerror = function (e) {
          const c = (e && e.error) || 'error';
          done(c === 'not-allowed' ? 'Mic blocked — just type it.'
             : c === 'no-speech' ? "Didn't catch that." : '');
        };
        rec.onend = function () { done(''); };
        try { rec.start(); } catch (_) { done('Could not start mic.'); }
      });
    }

    /* ── helpers ─────────────────────────────────────────────────────── */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                 '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function shuffle(a) {
      const arr = a.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    function topBar(backLabel, backFn) {
      const bar = document.createElement('div');
      bar.className = 'cf-top';
      if (backFn) {
        const b = document.createElement('button');
        b.className = 'cf-back';
        b.textContent = '← ' + (backLabel || 'Back');
        b.addEventListener('click', function () {
          try { speechSynthesis.cancel(); } catch (_) {}
          backFn();
        });
        bar.appendChild(b);
      }
      const sp = document.createElement('div');
      sp.className = 'cf-spacer';
      bar.appendChild(sp);

      const hub = document.createElement('a');
      hub.className = 'cf-pill';
      hub.href = '/teaching/english/cipher/';
      hub.textContent = 'AGENT FILE';
      hub.style.textDecoration = 'none';
      bar.appendChild(hub);

      const snd = document.createElement('button');
      snd.className = 'cf-pill' + (P.settings.sound ? '' : ' off');
      snd.textContent = '🔔';
      snd.title = 'Sounds on/off';
      snd.addEventListener('click', function () {
        P.settings.sound = !P.settings.sound; save();
        snd.classList.toggle('off', !P.settings.sound);
      });
      bar.appendChild(snd);

      const vc = document.createElement('button');
      vc.className = 'cf-pill' + (P.settings.voice ? '' : ' off');
      vc.textContent = '🗣️';
      vc.title = 'Read-aloud on/off';
      vc.addEventListener('click', function () {
        P.settings.voice = !P.settings.voice; save();
        vc.classList.toggle('off', !P.settings.voice);
        if (!P.settings.voice) { try { speechSynthesis.cancel(); } catch (_) {} }
      });
      bar.appendChild(vc);
      return bar;
    }

    /* ── home ─────────────────────────────────────────────────────────── */
    function home() {
      el.innerHTML = '';
      el.appendChild(topBar(null, null));

      const totalDone = Object.keys(P.report.done).reduce(function (a, k) {
        return a + P.report.done[k];
      }, 0);

      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML =
        '<div class="tag">Cipher // Report Craft</div>' +
        '<h1>✍️ Report Craft</h1>' +
        '<p>Agents write clearly or people get hurt. Ten drills that build ' +
        'sentences, then a desk to write your own.</p>' +
        '<div class="cf-statbar">' +
          '<div class="cf-stat"><b>' + totalDone + '</b><span>DRILLS RUN</span></div>' +
          '<div class="cf-stat"><b>' + Object.keys(P.report.done).length +
            '/' + DRILLS.length + '</b><span>TYPES TRIED</span></div>' +
          '<div class="cf-stat"><b>' + P.report.pieces.length +
            '</b><span>REPORTS FILED</span></div>' +
        '</div>';
      el.appendChild(hero);

      const h1 = document.createElement('div');
      h1.className = 'cf-sect';
      h1.innerHTML = '<span class="n">01</span> Sentence drills';
      el.appendChild(h1);

      const grid = document.createElement('div');
      grid.className = 'cf-grid';
      DRILLS.forEach(function (g) {
        const n = DATA.ex.filter(function (e) { return e.kind === g.kind; }).length;
        if (!n) return;
        const runs = P.report.done[g.kind] || 0;
        const best = P.report.best[g.kind];
        const b = document.createElement('button');
        b.className = 'cf-drill';
        b.innerHTML = '<span class="em">' + g.em + '</span>' +
          '<span class="nm">' + esc(g.name) + '</span>' +
          '<span class="dc">' + esc(g.desc) + '</span>' +
          '<span class="st">' + (runs
            ? '✓ ' + runs + ' run' + (runs === 1 ? '' : 's') +
              (best != null ? ' · best ' + Math.round(best * 100) + '%' : '')
            : 'START →') + '</span>';
        b.addEventListener('click', function () { playDrill(g); });
        grid.appendChild(b);
      });
      el.appendChild(grid);

      const h2 = document.createElement('div');
      h2.className = 'cf-sect';
      h2.innerHTML = '<span class="n">02</span> The writing desk';
      el.appendChild(h2);

      const g2 = document.createElement('div');
      g2.className = 'cf-grid';
      const w = document.createElement('button');
      w.className = 'cf-drill';
      w.innerHTML = '<span class="em">📝</span>' +
        '<span class="nm">Write a report</span>' +
        '<span class="dc">A prompt, a blank page, a checklist</span>' +
        '<span class="st">' + P.report.pieces.length + ' filed</span>';
      w.addEventListener('click', studio);
      g2.appendChild(w);
      if (P.report.pieces.length) {
        const a = document.createElement('button');
        a.className = 'cf-drill';
        a.innerHTML = '<span class="em">🗄️</span>' +
          '<span class="nm">Filed reports</span>' +
          '<span class="dc">Everything you have written</span>' +
          '<span class="st">' + P.report.pieces.length + ' on file</span>';
        a.addEventListener('click', archive);
        g2.appendChild(a);
      }
      el.appendChild(g2);

      window.scrollTo(0, 0);
    }

    /* ── a drill run: up to 5 items of one kind ───────────────────────── */
    function playDrill(g) {
      const pool = shuffle(DATA.ex.filter(function (e) { return e.kind === g.kind; }));
      const round = pool.slice(0, Math.min(5, pool.length));
      let idx = 0, firstTry = 0;

      function screen() {
        el.innerHTML = '';
        el.appendChild(topBar('Report Craft', home));

        const hero = document.createElement('div');
        hero.className = 'cf-hero';
        hero.innerHTML = '<div class="tag">Drill ' + (idx + 1) + ' of ' +
          round.length + '</div><h1>' + g.em + ' ' + esc(g.name) + '</h1>';
        el.appendChild(hero);

        const lesson = document.createElement('div');
        lesson.className = 'cf-panel cf-lesson';
        lesson.innerHTML = g.lesson;
        el.appendChild(lesson);

        const body = document.createElement('div');
        el.appendChild(body);

        const ex = round[idx];
        if (ex.kind === 'bcs') renderBcs(ex, body);
        else if (ex.kind === 'subord') renderSubord(ex, body);
        else if (ex.kind === 'para') renderPara(ex, body);
        else renderMcq(ex, body);

        window.scrollTo(0, 0);
      }

      function nextBtn(host) {
        const row = document.createElement('div');
        row.className = 'cf-row';
        const b = document.createElement('button');
        b.className = 'cf-btn';
        b.textContent = idx + 1 < round.length ? 'Next drill ▸' : 'Finish ▸';
        b.addEventListener('click', function () {
          idx++;
          if (idx < round.length) screen();
          else recap();
        });
        row.appendChild(b);
        host.appendChild(row);
      }

      /* — plain MCQ kinds — */
      function renderMcq(ex, host) {
        const p = document.createElement('div');
        p.className = 'cf-prompt';
        p.textContent = ex.prompt;
        host.appendChild(p);
        if (ex.ctx) {
          const c = document.createElement('div');
          c.className = 'cf-panel quote';
          c.textContent = ex.ctx;
          host.appendChild(c);
        }
        const opts = document.createElement('div');
        opts.className = 'cf-opts';
        const fb = document.createElement('div');
        fb.className = 'cf-feedback';
        let tries = 0;
        shuffle(ex.opts).forEach(function (o) {
          const b = document.createElement('button');
          b.className = 'cf-opt';
          b.textContent = o[0];
          b.addEventListener('click', function () {
            if (o[1]) {
              if (tries === 0) firstTry++;
              Array.prototype.forEach.call(opts.children, function (x) { x.disabled = true; });
              b.classList.add('yes');
              sfx('good');
              fb.innerHTML = (tries === 0 ? '✅ <b>Clean.</b>' : '✅ <b>Got it.</b>') +
                '<span class="teach">' + esc(ex.teach) + '</span>';
              nextBtn(fb);
            } else {
              tries++;
              if (tries === 1) {
                b.classList.add('no');
                setTimeout(function () {
                  b.classList.remove('no'); b.classList.add('dim'); b.disabled = true;
                }, 350);
                sfx('soft');
                fb.textContent = 'Not that one — try again.';
              } else {
                let correct = '';
                ex.opts.forEach(function (o2) { if (o2[1]) correct = o2[0]; });
                Array.prototype.forEach.call(opts.children, function (x) {
                  x.disabled = true;
                  if (x.textContent === correct) x.classList.add('yes');
                });
                sfx('soft');
                fb.innerHTML = 'The strong one is highlighted.' +
                  '<span class="teach">' + esc(ex.teach) + '</span>';
                nextBtn(fb);
              }
            }
          });
          opts.appendChild(b);
        });
        host.appendChild(opts);
        host.appendChild(fb);
      }

      /* — because / but / so — */
      function renderBcs(ex, host) {
        const stem = document.createElement('div');
        stem.className = 'cf-stem';
        stem.textContent = ex.stem + ' …';
        host.appendChild(stem);

        const slots = ['because', 'but', 'so'];
        const labels = { because: 'because — the REASON',
                         but: 'but — the SURPRISE',
                         so: 'so — the RESULT' };
        let si = 0, got = 0;
        const chosen = {};
        const area = document.createElement('div');
        const fb = document.createElement('div');
        fb.className = 'cf-feedback';
        host.appendChild(area);
        host.appendChild(fb);

        function slot() {
          area.innerHTML = ''; fb.innerHTML = '';
          const key = slots[si];
          const lab = document.createElement('div');
          lab.className = 'cf-slotlab';
          lab.textContent = labels[key];
          area.appendChild(lab);
          const opts = document.createElement('div');
          opts.className = 'cf-opts';
          let tries = 0;
          shuffle(ex[key]).forEach(function (o) {
            const b = document.createElement('button');
            b.className = 'cf-opt';
            b.textContent = o[0];
            b.addEventListener('click', function () {
              if (o[1]) {
                if (tries === 0) got++;
                chosen[key] = o[0];
                Array.prototype.forEach.call(opts.children, function (x) { x.disabled = true; });
                b.classList.add('yes');
                sfx('good');
                show(key, o[0]);
              } else {
                tries++;
                if (tries === 1) {
                  b.classList.add('no');
                  setTimeout(function () {
                    b.classList.remove('no'); b.classList.add('dim'); b.disabled = true;
                  }, 350);
                  sfx('soft');
                  fb.textContent = key === 'because'
                    ? '"Because" needs a REASON — why did it happen?'
                    : key === 'but'
                    ? '"But" needs a SURPRISE — something that cuts against it.'
                    : '"So" needs a RESULT — what happened because of it?';
                } else {
                  let correct = '';
                  ex[key].forEach(function (o2) { if (o2[1]) correct = o2[0]; });
                  chosen[key] = correct;
                  Array.prototype.forEach.call(opts.children, function (x) {
                    x.disabled = true;
                    if (x.textContent === correct) x.classList.add('yes');
                  });
                  sfx('soft');
                  show(key, correct);
                }
              }
            });
            opts.appendChild(b);
          });
          area.appendChild(opts);
        }

        function show(key, text) {
          const built = document.createElement('div');
          built.className = 'cf-built';
          built.innerHTML = esc(ex.stem) + ' <b>' + key + '</b> ' + esc(text);
          fb.appendChild(built);
          speak(ex.stem + ' ' + key + ' ' + text);
          const row = document.createElement('div');
          row.className = 'cf-row';
          const b = document.createElement('button');
          b.className = 'cf-btn';
          b.textContent = si < 2 ? 'Next: …' + slots[si + 1] + ' ▸' : 'See all three ▸';
          b.addEventListener('click', function () {
            si++;
            if (si < 3) slot();
            else finish();
          });
          row.appendChild(b);
          fb.appendChild(row);
        }

        function finish() {
          area.innerHTML = ''; fb.innerHTML = '';
          if (got === 3) firstTry++;
          const all = document.createElement('div');
          all.className = 'cf-built';
          all.innerHTML = '<span class="cf-label">One idea, three ways</span>' +
            '• ' + esc(ex.stem) + ' <b>because</b> ' + esc(chosen.because) + '<br>' +
            '• ' + esc(ex.stem) + ' <b>but</b> ' + esc(chosen['but']) + '<br>' +
            '• ' + esc(ex.stem) + ' <b>so</b> ' + esc(chosen.so);
          fb.appendChild(all);
          sfx('badge');
          nextBtn(fb);
        }
        slot();
      }

      /* — although / unless / if (subordinating conjunctions) — */
      function renderSubord(ex, host) {
        const stem = document.createElement('div');
        stem.className = 'cf-stem';
        stem.innerHTML = '<span class="cf-label">Your half-sentence</span>' +
          '… ' + esc(ex.base) + ', …';
        host.appendChild(stem);

        let si = 0, got = 0;
        const chosen = [];
        const area = document.createElement('div');
        const fb = document.createElement('div');
        fb.className = 'cf-feedback';
        host.appendChild(area);
        host.appendChild(fb);

        function slot() {
          area.innerHTML = ''; fb.innerHTML = '';
          const s = ex.slots[si];
          const lab = document.createElement('div');
          lab.className = 'cf-slotlab';
          lab.textContent = s.word + ' …';
          area.appendChild(lab);

          const open = document.createElement('div');
          open.className = 'cf-panel quote';
          open.innerHTML = '<b>' + esc(s.word) + ' ' + esc(ex.base) +
            ',</b> <span style="opacity:0.6">…finish it</span>';
          area.appendChild(open);

          const opts = document.createElement('div');
          opts.className = 'cf-opts';
          let tries = 0;
          shuffle(s.opts).forEach(function (o) {
            const b = document.createElement('button');
            b.className = 'cf-opt';
            b.textContent = o[0];
            b.addEventListener('click', function () {
              if (o[1]) {
                if (tries === 0) got++;
                chosen[si] = { w: s.word, t: o[0] };
                Array.prototype.forEach.call(opts.children, function (x) { x.disabled = true; });
                b.classList.add('yes');
                sfx('good');
                show(s.word, o[0]);
              } else {
                tries++;
                if (tries === 1) {
                  b.classList.add('no');
                  setTimeout(function () {
                    b.classList.remove('no'); b.classList.add('dim'); b.disabled = true;
                  }, 350);
                  sfx('soft');
                  fb.textContent = s.word === 'Although'
                    ? '"Although" sets up a surprise — the ending should go AGAINST the first half.'
                    : s.word === 'Unless'
                    ? '"Unless" means "if not" — what happens if it does NOT happen?'
                    : '"If" sets up a condition — what follows when it IS true?';
                } else {
                  let correct = '';
                  s.opts.forEach(function (o2) { if (o2[1]) correct = o2[0]; });
                  chosen[si] = { w: s.word, t: correct };
                  Array.prototype.forEach.call(opts.children, function (x) {
                    x.disabled = true;
                    if (x.textContent === correct) x.classList.add('yes');
                  });
                  sfx('soft');
                  show(s.word, correct);
                }
              }
            });
            opts.appendChild(b);
          });
          area.appendChild(opts);
        }

        function show(word, text) {
          const built = document.createElement('div');
          built.className = 'cf-built';
          built.innerHTML = '<b>' + esc(word) + '</b> ' + esc(ex.base) +
            ', ' + esc(text);
          fb.appendChild(built);
          speak(word + ' ' + ex.base + ', ' + text);
          const row = document.createElement('div');
          row.className = 'cf-row';
          const b = document.createElement('button');
          b.className = 'cf-btn';
          b.textContent = si < ex.slots.length - 1
            ? 'Next: ' + ex.slots[si + 1].word + ' ▸' : 'Compare them ▸';
          b.addEventListener('click', function () {
            si++;
            if (si < ex.slots.length) slot();
            else finish();
          });
          row.appendChild(b);
          fb.appendChild(row);
        }

        function finish() {
          area.innerHTML = ''; fb.innerHTML = '';
          if (got === ex.slots.length) firstTry++;
          const all = document.createElement('div');
          all.className = 'cf-built';
          all.innerHTML = '<span class="cf-label">Same half-sentence, ' +
            'different opener, different meaning</span>' +
            chosen.map(function (c) {
              return '• <b>' + esc(c.w) + '</b> ' + esc(ex.base) + ', ' + esc(c.t);
            }).join('<br>');
          fb.appendChild(all);
          sfx('badge');
          nextBtn(fb);
        }
        slot();
      }

      /* — paragraph ordering — */
      function renderPara(ex, host) {
        const p = document.createElement('div');
        p.className = 'cf-prompt';
        p.textContent = ex.topic;
        host.appendChild(p);

        const n = ex.parts.length;
        let placed = 0, wrong = 0;
        const slotWrap = document.createElement('div');
        slotWrap.className = 'cf-slots';
        for (let i = 0; i < n; i++) {
          const s = document.createElement('div');
          s.className = 'cf-slot';
          s.innerHTML = '<span class="n">' + (i + 1) + '</span>' +
            '<span class="txt"><span class="role">' +
            esc(slotRole(i, n)) + '</span></span>';
          slotWrap.appendChild(s);
        }
        host.appendChild(slotWrap);

        const parts = document.createElement('div');
        parts.className = 'cf-parts';
        const fb = document.createElement('div');
        fb.className = 'cf-feedback';

        shuffle(ex.parts.map(function (t, i) { return { t: t, i: i }; }))
          .forEach(function (o) {
            const b = document.createElement('button');
            b.className = 'cf-part';
            b.textContent = o.t;
            b.addEventListener('click', function () {
              if (b.classList.contains('used')) return;
              const slot = slotWrap.children[placed];
              if (o.i === placed) {
                b.classList.add('used');
                slot.classList.add('ok');
                slot.querySelector('.txt').innerHTML =
                  '<span class="role">' + esc(slotRole(placed, n)) + '</span>' +
                  esc(o.t);
                placed++;
                sfx('good');
                if (placed === n) {
                  if (wrong === 0) firstTry++;
                  sfx('badge');
                  fb.innerHTML = '🏛️ <b>Paragraph built.</b>' +
                    '<span class="teach">The shape: the first sentence makes ' +
                    'the point, the middle ones prove it, the last one closes ' +
                    'it. Use this every time you write a paragraph.</span>';
                  nextBtn(fb);
                }
              } else {
                wrong++;
                slot.classList.add('bad');
                setTimeout(function () { slot.classList.remove('bad'); }, 400);
                sfx('soft');
                fb.textContent = placed === 0
                  ? 'Start with the TOPIC SENTENCE — the one that states the point.'
                  : placed === n - 1
                  ? 'Save the CONCLUSION for last.'
                  : 'Not that one yet — which comes next in the argument?';
              }
            });
            parts.appendChild(b);
          });
        host.appendChild(parts);
        host.appendChild(fb);
      }

      function recap() {
        const score = firstTry / round.length;
        P.report.done[g.kind] = (P.report.done[g.kind] || 0) + 1;
        if (P.report.best[g.kind] == null || score > P.report.best[g.kind]) {
          P.report.best[g.kind] = score;
        }
        save();
        sfx('badge');

        el.innerHTML = '';
        el.appendChild(topBar('Report Craft', home));
        const r = document.createElement('div');
        r.className = 'cf-recap';
        r.innerHTML = '<div class="big">' + g.em + '</div>' +
          '<div class="code2">DRILL COMPLETE</div>' +
          '<h2>' + esc(g.name) + '</h2>' +
          '<p>' + firstTry + ' of ' + round.length + ' clean on the first try.</p>';
        el.appendChild(r);
        const row = document.createElement('div');
        row.className = 'cf-row';
        row.style.justifyContent = 'center';
        const again = document.createElement('button');
        again.className = 'cf-btn';
        again.textContent = '↻ Run it again';
        again.addEventListener('click', function () { playDrill(g); });
        row.appendChild(again);
        const back = document.createElement('button');
        back.className = 'cf-btn ghost';
        back.textContent = 'Other drills';
        back.addEventListener('click', home);
        row.appendChild(back);
        el.appendChild(row);
        window.scrollTo(0, 0);
      }

      screen();
    }

    /* ── the writing desk ─────────────────────────────────────────────── */
    function studio() {
      el.innerHTML = '';
      el.appendChild(topBar('Report Craft', home));

      let prompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];

      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML = '<div class="tag">Cipher // Writing desk</div>' +
        '<h1>📝 Write a report</h1>';
      el.appendChild(hero);

      const pc = document.createElement('div');
      pc.className = 'cf-panel quote';
      el.appendChild(pc);
      function paintPrompt() {
        pc.innerHTML = '<span class="cf-label">Assignment</span>' + esc(prompt);
        const row = document.createElement('div');
        row.className = 'cf-row';
        const nb = document.createElement('button');
        nb.className = 'cf-btn ghost';
        nb.textContent = '🎲 Different assignment';
        nb.addEventListener('click', function () {
          prompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
          paintPrompt();
        });
        row.appendChild(nb);
        const rb = document.createElement('button');
        rb.className = 'cf-btn ghost';
        rb.textContent = '🔊 Read it to me';
        rb.addEventListener('click', function () { speak(prompt); });
        row.appendChild(rb);
        pc.appendChild(row);
      }
      paintPrompt();

      const wrap = document.createElement('div');
      const ta = document.createElement('textarea');
      ta.placeholder = 'Start writing…';
      wrap.appendChild(ta);
      const count = document.createElement('div');
      count.className = 'cf-count';
      count.textContent = '0 words';
      wrap.appendChild(count);
      ta.addEventListener('input', function () {
        const w = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
        count.textContent = w + (w === 1 ? ' word' : ' words');
      });
      attachMic(ta, wrap);
      el.appendChild(wrap);

      const ch = document.createElement('div');
      ch.className = 'cf-sect';
      ch.innerHTML = '<span class="n">✓</span> Check your own work ' +
        '<span style="text-transform:none;letter-spacing:0;opacity:0.8">' +
        'real writers edit themselves</span>';
      el.appendChild(ch);

      const check = document.createElement('div');
      check.className = 'cf-check';
      RUBRIC.forEach(function (r) {
        const lab = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        const sp = document.createElement('span');
        sp.innerHTML = r;
        lab.appendChild(cb); lab.appendChild(sp);
        cb.addEventListener('change', function () {
          lab.classList.toggle('on', cb.checked);
        });
        check.appendChild(lab);
      });
      el.appendChild(check);

      const fb = document.createElement('div');
      fb.className = 'cf-feedback';

      const row = document.createElement('div');
      row.className = 'cf-row';
      const file = document.createElement('button');
      file.className = 'cf-btn';
      file.textContent = '🗄️ File this report';
      file.addEventListener('click', function () {
        const text = ta.value.trim();
        if (!text) { fb.textContent = 'Write something first.'; return; }
        const ticked = Array.prototype.filter.call(
          check.querySelectorAll('input'), function (c) { return c.checked; }).length;
        const words = text.split(/\s+/).length;
        P.report.pieces.unshift({
          t: prompt, x: text, w: words, c: ticked, d: today()
        });
        if (P.report.pieces.length > 80) P.report.pieces.length = 80;
        save();
        sfx('badge');
        fb.innerHTML = '🗄️ <b>Filed.</b> ' + words +
          (words === 1 ? ' word' : ' words') + ' · ' + ticked + ' / ' +
          RUBRIC.length + ' checks ticked.';
        const r2 = document.createElement('div');
        r2.className = 'cf-row';
        const go = document.createElement('button');
        go.className = 'cf-btn ghost';
        go.textContent = 'See filed reports';
        go.addEventListener('click', archive);
        r2.appendChild(go);
        fb.appendChild(r2);
      });
      row.appendChild(file);
      el.appendChild(row);
      el.appendChild(fb);
      window.scrollTo(0, 0);
    }

    function archive() {
      el.innerHTML = '';
      el.appendChild(topBar('Report Craft', home));
      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML = '<div class="tag">Cipher // Archive</div>' +
        '<h1>🗄️ Filed reports</h1>' +
        '<p>' + P.report.pieces.length +
        (P.report.pieces.length === 1 ? ' report' : ' reports') +
        ' on file. Read an old one — you will see how far you have come.</p>';
      el.appendChild(hero);

      P.report.pieces.forEach(function (pc, i) {
        const d = document.createElement('div');
        d.className = 'cf-saved';
        d.innerHTML = '<div class="meta">' + esc(pc.d) + ' · ' + pc.w +
          (pc.w === 1 ? ' word' : ' words') + ' · ✓ ' + pc.c + '/' +
          RUBRIC.length + '</div>' +
          '<div class="meta" style="opacity:0.8"><i>' + esc(pc.t) + '</i></div>' +
          '<div class="body">' + esc(pc.x) + '</div>';
        const row = document.createElement('div');
        row.className = 'cf-row';
        const hear = document.createElement('button');
        hear.className = 'cf-btn ghost';
        hear.style.padding = '0.3rem 0.8rem';
        hear.style.fontSize = '0.85rem';
        hear.textContent = '🔊 Hear it';
        hear.addEventListener('click', function () { speak(pc.x); });
        row.appendChild(hear);
        const del = document.createElement('button');
        del.className = 'cf-btn danger';
        del.style.padding = '0.3rem 0.8rem';
        del.style.fontSize = '0.85rem';
        del.textContent = 'Delete';
        del.addEventListener('click', function () {
          P.report.pieces.splice(i, 1);
          save();
          archive();
        });
        row.appendChild(del);
        d.appendChild(row);
        el.appendChild(d);
      });
      window.scrollTo(0, 0);
    }

    function boot(data) { DATA = data; home(); }
    return { boot: boot };
  })();

  init();
})();
</script>
