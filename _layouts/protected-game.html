---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 40vh;
    padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px;
    padding: 2.5rem 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── Arcade ──────────────────────────────────────────────────────────── */
  #arcade-root { display: none; }

  .va { --acc: #e2b04a; --good: #4ade80; --bad: #f87171;
        --card: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.12);
        max-width: 780px; }
  .va, .va * { box-sizing: border-box; }
  .va button { font-family: inherit; }

  .va-top {
    display: flex; align-items: center; gap: 0.6rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .va-back {
    background: var(--card); border: 1px solid var(--line);
    color: inherit; border-radius: 999px; padding: 0.3rem 0.85rem;
    font-size: 0.85rem; cursor: pointer;
  }
  .va-back:hover { border-color: var(--acc); }
  .va-crumb { font-weight: 700; font-size: 1.05rem; }
  .va-spacer { flex: 1; }
  .va-pill {
    font-size: 0.8rem; padding: 0.25rem 0.7rem; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); white-space: nowrap;
  }
  .va-pill.acc { border-color: var(--acc); color: var(--acc); font-weight: 600; }

  .va-hero { text-align: center; margin: 0.5rem 0 1.6rem; }
  .va-hero h1 { margin: 0 0 0.3rem; font-size: 2rem; }
  .va-hero p { margin: 0; opacity: 0.7; font-size: 0.95rem; }

  .va-levels { display: grid; gap: 0.9rem; }
  .va-level {
    display: flex; align-items: center; gap: 1rem; width: 100%;
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 1.1rem 1.25rem; color: inherit;
    cursor: pointer; transition: transform 0.12s, border-color 0.12s;
  }
  .va-level:hover { transform: translateY(-2px); border-color: var(--lc); }
  .va-level .em { font-size: 2.2rem; }
  .va-level .body { flex: 1; min-width: 0; }
  .va-level .name { font-weight: 700; font-size: 1.15rem; }
  .va-level .tag { font-size: 0.85rem; opacity: 0.65; margin-top: 0.1rem; }
  .va-level .meta { font-size: 0.78rem; opacity: 0.55; margin-top: 0.35rem; }
  .va-level .side { text-align: right; font-size: 0.85rem; white-space: nowrap; }
  .va-level .stars { color: #facc15; font-weight: 700; }
  .va-level .xp { opacity: 0.65; margin-top: 0.25rem; }

  .va-bar {
    height: 6px; border-radius: 3px; background: rgba(255,255,255,0.09);
    overflow: hidden; margin-top: 0.5rem;
  }
  .va-bar i { display: block; height: 100%; background: var(--lc, var(--acc));
              border-radius: 3px; transition: width 0.4s; }

  .va-tabs { display: flex; gap: 0.5rem; margin: 0 0 0.9rem; flex-wrap: wrap; }
  .va-tab {
    border: 1px solid var(--line); background: var(--card); color: inherit;
    border-radius: 999px; padding: 0.3rem 0.9rem; font-size: 0.85rem;
    cursor: pointer;
  }
  .va-tab.on { background: var(--acc); border-color: var(--acc); color: #fff;
               font-weight: 600; }
  .va-search {
    flex: 1; min-width: 140px; border: 1px solid var(--line);
    background: var(--card); color: inherit; border-radius: 999px;
    padding: 0.3rem 0.9rem; font-size: 0.85rem; outline: none;
  }
  .va-search:focus { border-color: var(--acc); }

  .va-grid {
    display: grid; gap: 0.7rem;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .va-theme {
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 0.85rem 1rem; color: inherit; cursor: pointer;
    transition: transform 0.12s, border-color 0.12s;
    display: flex; flex-direction: column; gap: 0.4rem;
  }
  .va-theme:hover { transform: translateY(-2px); border-color: var(--acc); }
  .va-theme .kind { font-size: 0.72rem; opacity: 0.6;
                    display: flex; justify-content: space-between; }
  .va-theme .kind .st { color: #facc15; font-weight: 700; opacity: 1; }
  .va-theme .name { font-weight: 650; font-size: 0.95rem; line-height: 1.35; }
  .va-theme .words { font-size: 0.78rem; opacity: 0.55; line-height: 1.4; }
  .va-theme.mix { border-style: dashed; }

  .va-blurb { opacity: 0.75; font-size: 0.92rem; margin: 0.2rem 0 1rem; }
  .va-chiprow { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .va-chip {
    background: var(--card); border: 1px solid var(--line); color: inherit;
    border-radius: 999px; padding: 0.25rem 0.75rem; font-size: 0.85rem;
    cursor: pointer;
  }
  .va-chip:hover { border-color: var(--acc); }

  .va-games { display: grid; gap: 0.7rem;
              grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .va-game {
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 1rem; color: inherit; cursor: pointer;
    transition: transform 0.12s, border-color 0.12s;
  }
  .va-game:hover { transform: translateY(-2px); border-color: var(--acc); }
  .va-game .em { font-size: 1.6rem; }
  .va-game .name { font-weight: 700; margin-top: 0.3rem; }
  .va-game .desc { font-size: 0.82rem; opacity: 0.65; margin-top: 0.2rem;
                   line-height: 1.4; }
  .va-game .st { font-size: 0.8rem; color: #facc15; margin-top: 0.4rem;
                 min-height: 1em; }

  /* play screens */
  .va-hud { display: flex; align-items: center; gap: 0.5rem;
            margin-bottom: 0.6rem; flex-wrap: wrap; }
  .va-hud .va-pill.hot { border-color: #fb923c; color: #fb923c;
                         animation: vaPulse 0.35s; }
  .va-qlabel { text-align: center; font-size: 0.82rem; letter-spacing: 0.08em;
               text-transform: uppercase; opacity: 0.55; margin: 1.1rem 0 0.5rem; }
  .va-q { text-align: center; margin-bottom: 1.3rem; }
  .va-q .word { font-size: 2rem; font-weight: 800; }
  .va-q .say { opacity: 0.6; font-size: 0.9rem; margin-top: 0.15rem; }
  .va-q .mean { font-size: 1.15rem; line-height: 1.55; max-width: 560px;
                margin: 0 auto; }
  .va-say-btn {
    background: none; border: none; cursor: pointer; font-size: 1.1rem;
    vertical-align: middle; padding: 0 0.2rem; opacity: 0.7;
  }
  .va-say-btn:hover { opacity: 1; }

  .va-opts { display: grid; gap: 0.6rem; max-width: 560px; margin: 0 auto; }
  .va-opt {
    width: 100%; text-align: left; background: var(--card);
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 0.75rem 1rem; color: inherit; font-size: 0.98rem;
    line-height: 1.45; cursor: pointer; transition: border-color 0.12s;
    display: flex; gap: 0.7rem; align-items: baseline;
  }
  .va-opt:hover:not(:disabled) { border-color: var(--acc); }
  .va-opt:disabled { cursor: default; opacity: 0.9; }
  .va-opt .key { font-size: 0.72rem; opacity: 0.45; border: 1px solid var(--line);
                 border-radius: 4px; padding: 0 0.35rem; flex: none; }
  .va-opt.good { border-color: var(--good);
                 background: rgba(74, 222, 128, 0.13); }
  .va-opt.bad { border-color: var(--bad); background: rgba(248, 113, 113, 0.13);
                animation: vaShake 0.3s; }
  .va-after { text-align: center; font-size: 0.88rem; opacity: 0.75;
              margin-top: 1rem; min-height: 1.4em; max-width: 560px;
              margin-left: auto; margin-right: auto; }

  .va-opts.two { grid-template-columns: 1fr 1fr; }
  .va-opt.big { justify-content: center; text-align: center; font-size: 1.15rem;
                font-weight: 700; padding: 1.1rem 1rem; }
  .va-opt.big .key { align-self: center; }

  .va-blank { color: var(--acc); font-weight: 800; letter-spacing: 0.08em;
              border-bottom: 2px dashed var(--acc); padding: 0 0.15rem; }

  /* word scramble */
  .va-slots, .va-tiles { display: flex; flex-wrap: wrap; gap: 0.4rem;
                         justify-content: center; }
  .va-slots { margin: 1.1rem 0 0.9rem; }
  .va-slot {
    width: 2.4rem; height: 2.9rem; border: 1.5px solid var(--line);
    border-radius: 8px; background: var(--card); font-size: 1.25rem;
    font-weight: 800; display: flex; align-items: center;
    justify-content: center; text-transform: lowercase;
  }
  .va-slot.fill { border-color: var(--acc); cursor: pointer; }
  .va-slot.hinted { border-color: #facc15; color: #facc15; }
  .va-slots.won .va-slot { border-color: var(--good);
                           background: rgba(74,222,128,0.13);
                           animation: vaPop 0.4s; }
  .va-slots.lost { animation: vaShake 0.3s; }
  .va-tile {
    width: 2.6rem; height: 3rem; border: 1.5px solid var(--line);
    border-radius: 8px; background: var(--card); color: inherit;
    font-size: 1.2rem; font-weight: 700; cursor: pointer;
    text-transform: lowercase;
  }
  .va-tile:hover:not(:disabled) { border-color: var(--acc); }
  .va-tile:disabled { opacity: 0.2; cursor: default; }
  .va-scr-btns { display: flex; gap: 0.6rem; justify-content: center;
                 margin-top: 1.2rem; flex-wrap: wrap; }
  .va-clue { text-align: center; opacity: 0.8; font-size: 1rem;
             max-width: 540px; margin: 0 auto; line-height: 1.5; }

  /* echo spell */
  .va-hear {
    display: block; margin: 1.2rem auto 0; background: var(--card);
    border: 1.5px solid var(--acc); color: inherit; border-radius: 14px;
    padding: 1rem 2.2rem; font-size: 1.3rem; font-weight: 700; cursor: pointer;
  }
  .va-hear:hover { background: rgba(255,255,255,0.09); }
  .va-spell-row { display: flex; gap: 0.6rem; justify-content: center;
                  margin-top: 1.2rem; }
  .va-spell-input {
    width: 260px; max-width: 60vw; padding: 0.7rem 1rem; font-size: 1.15rem;
    text-align: center; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--card); color: inherit; outline: none;
    font-family: inherit;
  }
  .va-spell-input:focus { border-color: var(--acc); }
  .va-spell-input.good { border-color: var(--good); }
  .va-spell-input.bad { border-color: var(--bad); animation: vaShake 0.3s; }

  /* flashcards */
  .va-flip { perspective: 1200px; cursor: pointer; max-width: 560px;
             margin: 0 auto; }
  .va-flip-inner { position: relative; height: 380px;
                   transform-style: preserve-3d; transition: transform 0.5s; }
  .va-flip.flipped .va-flip-inner { transform: rotateY(180deg); }
  .va-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    -webkit-backface-visibility: hidden; border-radius: 16px;
    border: 1px solid var(--line); background: var(--card); padding: 1.4rem;
  }
  .va-face.front { display: flex; flex-direction: column; align-items: center;
                   justify-content: center; text-align: center; }
  .va-face.back { transform: rotateY(180deg); overflow: auto;
                  font-size: 0.93rem; line-height: 1.55; }
  .va-face .hint { position: absolute; bottom: 0.8rem; font-size: 0.75rem;
                   opacity: 0.4; }
  .va-face.back h4 { margin: 0 0 0.2rem; font-size: 0.78rem; letter-spacing: 0.06em;
                     text-transform: uppercase; opacity: 0.55; }
  .va-face.back .sec { margin-bottom: 0.8rem; }
  .va-flash-btns { display: flex; gap: 0.7rem; justify-content: center;
                   margin-top: 1.1rem; }

  .va-btn {
    background: var(--acc); border: 1px solid var(--acc); color: #fff;
    border-radius: 10px; padding: 0.6rem 1.4rem; font-size: 0.95rem;
    font-weight: 600; cursor: pointer;
  }
  .va-btn:hover { opacity: 0.9; }
  .va-btn.ghost { background: var(--card); border-color: var(--line);
                  color: inherit; }
  .va-btn.ghost:hover { border-color: var(--acc); opacity: 1; }

  /* memory */
  .va-mem { display: grid; gap: 0.6rem; grid-template-columns: repeat(4, 1fr);
            max-width: 640px; margin: 0 auto; }
  @media (max-width: 560px) { .va-mem { grid-template-columns: repeat(2, 1fr); } }
  .va-mem-card { perspective: 800px; cursor: pointer; height: 110px; }
  .va-mem-in { position: relative; width: 100%; height: 100%;
               transform-style: preserve-3d; transition: transform 0.35s; }
  .va-mem-card.up .va-mem-in { transform: rotateY(180deg); }
  .va-mem-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    -webkit-backface-visibility: hidden; border-radius: 10px;
    border: 1.5px solid var(--line); display: flex; align-items: center;
    justify-content: center; padding: 0.45rem; text-align: center;
  }
  .va-mem-face.f { background: var(--card); font-size: 1.5rem; }
  .va-mem-face.b { background: rgba(255,255,255,0.08);
                   transform: rotateY(180deg); font-size: 0.8rem;
                   line-height: 1.3; overflow: hidden; }
  .va-mem-face.b .w { font-weight: 800; font-size: 1.05rem; }
  .va-mem-card.won .va-mem-face.b { border-color: var(--good);
                                    background: rgba(74,222,128,0.13);
                                    animation: vaPop 0.4s; }

  /* results */
  .va-results { text-align: center; padding: 1.5rem 0; }
  .va-results .big { font-size: 3rem; }
  .va-results h2 { margin: 0.4rem 0 1rem; }
  .va-starrow { font-size: 2.7rem; letter-spacing: 0.4rem; margin: 0.4rem 0 1rem; }
  .va-starrow span { opacity: 0.22; display: inline-block; }
  .va-starrow span.on { opacity: 1; color: #facc15; animation: vaPop 0.5s both; }
  .va-starrow span.on:nth-child(2) { animation-delay: 0.18s; }
  .va-starrow span.on:nth-child(3) { animation-delay: 0.36s; }
  .va-statrow { display: flex; gap: 0.6rem; justify-content: center;
                flex-wrap: wrap; margin-bottom: 1.4rem; }
  .va-resbtns { display: flex; gap: 0.7rem; justify-content: center;
                flex-wrap: wrap; }

  .va-burst { position: fixed; inset: 0; pointer-events: none; z-index: 999;
              overflow: hidden; }
  .va-burst span { position: absolute; top: -6vh; font-size: 1.4rem;
                   animation: vaFall linear forwards; }

  @keyframes vaFall { to { transform: translateY(115vh) rotate(680deg); } }
  @keyframes vaShake {
    20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
  }
  @keyframes vaPop {
    0% { transform: scale(0.3); } 70% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  @keyframes vaPulse { 50% { transform: scale(1.18); } }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="arcade-root"><div class="va" id="va"></div></div>

<script>
(function () {
  'use strict';

  /* Encrypted blob injected by Jekyll from front matter field `encrypted` */
  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};

  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const salt = blob.slice(0, 16);
    const iv = blob.slice(16, 28);
    const ct = blob.slice(28);
    const key = await deriveKey(passphrase, salt);
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return new TextDecoder().decode(plaintext);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('arcade-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }

  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }

  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse word bank.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Arcade.boot(data);
  }

  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) {
        try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {}
      }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }

  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true;
        input.disabled = true;
        try {
          const text = await decrypt(cached);
          reveal(text);
          return;
        } catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false;
          input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }

  btn.addEventListener('click', function () {
    const pw = input.value;
    if (!pw) { input.focus(); return; }
    tryUnlock(pw, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ═══════════════════════ Vocabulary Arcade ═══════════════════════════ */

  const Arcade = (function () {

    const el = document.getElementById('va');

    const LMETA = {
      basic:        { name: 'Basic', emoji: '🌱', color: '#4ade80',
                      tag: 'Strong everyday words' },
      intermediate: { name: 'Intermediate', emoji: '🚀', color: '#fbbf24',
                      tag: 'Essay-grade words' },
      advanced:     { name: 'Advanced', emoji: '🏆', color: '#a78bfa',
                      tag: 'Words that make teachers reread' }
    };
    const LEVELS = ['basic', 'intermediate', 'advanced'];

    const GAMES = [
      { id: 'flash', name: 'Flashcards', emoji: '🃏', starred: false,
        desc: 'Flip, learn, repeat until every card is yours.' },
      { id: 'quiz', name: 'Meaning Match', emoji: '🎯', starred: true,
        desc: 'Pick the right meaning — or the right word.' },
      { id: 'blank', name: 'Blank Buster', emoji: '✏️', starred: true,
        desc: 'Drop the missing word into a real sentence.' },
      { id: 'scr', name: 'Word Scramble', emoji: '🔤', starred: true,
        desc: 'Unscramble the letters — the meaning is your clue.' },
      { id: 'spell', name: 'Echo Spell', emoji: '🔊', starred: true,
        desc: 'Hear the word, then type it letter-perfect.' },
      { id: 'odd', name: 'Odd One Out', emoji: '🕵️', starred: true,
        desc: 'Three belong together. Catch the impostor.' },
      { id: 'syn', name: 'Synonym Sprint', emoji: '⚡', starred: true,
        desc: '45 seconds. Grab every synonym you can.' },
      { id: 'ant', name: 'Antonym Attack', emoji: '🙃', starred: true,
        desc: 'Pick the opposite — and dodge the look-alike trap.' },
      { id: 'tf', name: 'Fact or Fake', emoji: '🎭', starred: true,
        desc: '30 seconds of rapid-fire true or false.' },
      { id: 'mem', name: 'Memory Flip', emoji: '🧠', starred: true,
        desc: 'Match each word to its meaning in as few moves as you can.' },
      { id: 'root', name: 'Root Rally', emoji: '🌿', starred: true, rootOnly: true,
        desc: 'Spot the root hiding inside each word.' },
      { id: 'duel', name: 'Word Duel', emoji: '⚔️', starred: true,
        desc: 'Two words enter one sentence. Pick the one that truly fits.' },
      { id: 'fool', name: 'Don’t Get Fooled', emoji: '🪤', starred: true,
        desc: 'Every wrong answer is a close cousin. Precision only.' },
      { id: 'boss', name: 'Boss Battle', emoji: '🐉', starred: false, boss: true,
        desc: 'Ten mixed questions, every game at once. Score 80% to win the crown.' },
      { id: 'mission', name: 'Today’s Mission', emoji: '📬', starred: false,
        hidden: true, desc: 'Weak, due, old and new words — served by the memory engine.' }
    ];

    /* ── helpers ──────────────────────────────────────────────────────── */

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    /* tiny markdown: **bold**, *italic*, `code` (data uses nothing else) */
    function md(s) {
      return esc(s)
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/\*(.+?)\*/g, '<i>$1</i>')
        .replace(/`(.+?)`/g, '<code>$1</code>');
    }
    function plain(s) {
      return String(s == null ? '' : s).replace(/[*`_]/g, '');
    }
    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
    function splitList(s) {
      return String(s || '').split(',').map(function (x) { return x.trim(); })
        .filter(Boolean);
    }
    function slugify(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }
    function speak(text) {
      try {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.85;
        speechSynthesis.speak(u);
      } catch (_) {}
    }
    function shortMean(w) {
      let m = plain(w.mean).split(/[;(—]/)[0].trim();
      if (m.length > 64) m = m.slice(0, 61).replace(/\s+\S*$/, '') + '…';
      return m;
    }

    /* ── progress (localStorage) ──────────────────────────────────────── */

    const PKEY = 'vocab-arcade-v1';
    let P = null;
    try { P = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.xp = P.xp || {};       /* per level (+ 'mission') */
    P.stars = P.stars || {}; /* themeId|gameId -> 0..3 */
    P.done = P.done || {};   /* themeId|flash -> true */
    P.words = P.words || {}; /* wordKey -> {b,due,s,r,x} (box, due-ts, seen, right, wrong) */
    P.crowns = P.crowns || {}; /* themeId -> true (boss battle won) */
    P.streak = P.streak || { cur: 0, best: 0, last: '' }; /* daily mission streak */
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }

    /* ── per-word memory (Leitner boxes) ──────────────────────────────────
       Every answered question feeds a word's record. box 0-6 decides the
       review interval; a wrong answer knocks the word back to box 1. */
    const BOX_DAYS = [0, 1, 2, 4, 7, 14, 30];
    const DAY = 86400000;
    function wkey(w) { return w._lvl + '|' + w.w.toLowerCase(); }
    function wrec(w) { return P.words[wkey(w)] || null; }
    function wstat(w) {
      let r = P.words[wkey(w)];
      if (!r) r = P.words[wkey(w)] = { b: 0, due: 0, s: 0, r: 0, x: 0 };
      return r;
    }
    function recordAnswer(w, ok) {
      if (!w) return;
      const r = wstat(w);
      r.s++;
      if (ok) { r.r++; r.b = Math.min(6, r.b + 1); }
      else { r.x++; r.b = r.b > 1 ? 1 : 0; }
      r.due = Date.now() + BOX_DAYS[r.b] * DAY;
      save();
    }
    function touchWord(w) { /* introduced (flashcard / memory match) */
      if (!w) return;
      wstat(w).s++;
      save();
    }
    function medal(w) {
      const r = wrec(w);
      if (!r || !r.s) return '';
      if (r.b >= 6) return '🥇'; if (r.b >= 4) return '🥈'; if (r.b >= 2) return '🥉';
      return '';
    }
    /* fresh: never met · weak: recently missed / just introduced ·
       due: scheduled for review · strong: old solid words · rest: learning */
    function buckets(words) {
      /* a word text can live in several themes of one level (e.g. a root
         family and a confusion family) — they share one record, so only
         count the first occurrence */
      const now = Date.now();
      const B = { fresh: [], weak: [], due: [], strong: [], rest: [] };
      const seenK = {};
      words.forEach(function (w) {
        const k = wkey(w);
        if (seenK[k]) return;
        seenK[k] = true;
        const r = wrec(w);
        if (!r || !r.s) B.fresh.push(w);
        else if (r.b <= 1) B.weak.push(w);
        else if (r.due <= now) B.due.push(w);
        else if (r.b >= 5) B.strong.push(w);
        else B.rest.push(w);
      });
      return B;
    }
    function bumpStreak() {
      const today = new Date().toISOString().slice(0, 10);
      if (P.streak.last === today) return;
      const yest = new Date(Date.now() - DAY).toISOString().slice(0, 10);
      P.streak.cur = P.streak.last === yest ? P.streak.cur + 1 : 1;
      if (P.streak.cur > P.streak.best) P.streak.best = P.streak.cur;
      P.streak.last = today;
    }
    function starKey(t, g) { return t.id + '|' + g; }
    function themeStars(t) {
      let n = 0;
      GAMES.forEach(function (g) {
        if (g.starred) n += P.stars[starKey(t, g.id)] || 0;
      });
      return n;
    }
    function themeMaxStars(t) {
      let n = 0;
      GAMES.forEach(function (g) {
        if (g.starred && (!g.rootOnly || t.kind === 'root')) n += 3;
      });
      return n;
    }
    function levelStars(l) {
      let n = 0;
      D[l].themes.forEach(function (t) { n += themeStars(t); });
      return n;
    }
    function levelMaxStars(l) {
      let n = 0;
      D[l].themes.forEach(function (t) { n += themeMaxStars(t); });
      return n;
    }

    /* ── data prep ────────────────────────────────────────────────────── */

    let D = null; /* per-level: { themes, words, synPool, antPool, roots } */

    function prep(data) {
      D = {};
      LEVELS.forEach(function (l) {
        D[l] = { themes: [], words: [], synPool: [], antPool: [], roots: [] };
      });
      const seen = {};
      data.groups.forEach(function (g) {
        const L = D[g.level];
        if (!L) return;
        let id = g.level + '-' + slugify(g.title);
        while (seen[id]) id += '-x';
        seen[id] = true;
        const t = {
          id: id, level: g.level, kind: g.kind, title: g.title,
          blurb: g.blurb || '', root: g.root || null,
          rootMeans: g.root_means || null, words: g.words
        };
        L.themes.push(t);
        g.words.forEach(function (w) {
          w._t = t;
          w._lvl = g.level;
          w._syn = splitList(w.syn);
          w._ant = splitList(w.ant);
          L.words.push(w);
          w._syn.forEach(function (v) { L.synPool.push({ v: v, w: w }); });
          w._ant.forEach(function (v) { L.antPool.push({ v: v, w: w }); });
        });
        if (g.kind === 'root') {
          L.roots.push({ root: g.root, means: g.root_means, theme: t });
        }
      });
    }

    /* ── state / navigation ───────────────────────────────────────────── */

    const S = { level: null, theme: null, tab: 'all', q: '', game: null,
                sess: null, timer: null };

    function clearTimer() {
      if (S.timer) { clearInterval(S.timer); S.timer = null; }
    }
    function render(html) {
      clearTimer();
      el.innerHTML = html;
      const y = el.getBoundingClientRect().top + window.pageYOffset - 80;
      if (window.pageYOffset > y) window.scrollTo(0, Math.max(0, y));
    }
    function setAccent(color) { el.style.setProperty('--acc', color); }
    function on(sel, ev, fn) {
      el.querySelectorAll(sel).forEach(function (n) {
        n.addEventListener(ev, fn);
      });
    }

    /* ── screen: home / level select ──────────────────────────────────── */

    function goHome() {
      S.level = null; S.theme = null; S.sess = null;
      setAccent('#e2b04a');
      const B = buckets(allWords());
      const recs = Object.keys(P.words).map(function (k) { return P.words[k]; });
      const nowTs = Date.now();
      const seenN = recs.filter(function (r) { return r.s > 0; }).length;
      const masteredN = recs.filter(function (r) { return r.b >= 6; }).length;
      const crownsN = Object.keys(P.crowns).length;
      const reviewN = recs.filter(function (r) {
        return r.s > 0 && (r.b <= 1 || r.due <= nowTs);
      }).length;
      const today = new Date().toISOString().slice(0, 10);
      const streakLive = P.streak.last === today ||
        P.streak.last === new Date(Date.now() - DAY).toISOString().slice(0, 10);
      const streakN = streakLive ? P.streak.cur : 0;
      const missionDone = P.streak.last === today;
      let cards =
        '<button class="va-level" data-mission style="--lc:#60a5fa">' +
          '<span class="em">📬</span>' +
          '<span class="body">' +
            '<div class="name">Today’s Mission' +
              (missionDone ? ' <span style="font-size:.8rem;color:#4ade80">✓ done today</span>' : '') +
            '</div>' +
            '<div class="tag">The memory engine picks the words: weak + due + old + new</div>' +
            '<div class="meta">' +
              (reviewN ? '⏰ ' + reviewN + ' to review · ' : '') +
              '🌱 ' + B.fresh.length + ' never seen</div>' +
          '</span>' +
          '<span class="side">' +
            '<div class="stars">🔥 ' + streakN + '<span style="opacity:.5;font-weight:400"> day' +
              (streakN === 1 ? '' : 's') + '</span></div>' +
            '<div class="xp">⚡ ' + (P.xp.mission || 0) + ' XP</div>' +
          '</span>' +
        '</button>';
      LEVELS.forEach(function (l) {
        const m = LMETA[l];
        const st = levelStars(l), mx = levelMaxStars(l);
        const pct = mx ? Math.round(100 * st / mx) : 0;
        cards +=
          '<button class="va-level" data-l="' + l + '" style="--lc:' + m.color + '">' +
            '<span class="em">' + m.emoji + '</span>' +
            '<span class="body">' +
              '<div class="name">' + m.name + '</div>' +
              '<div class="tag">' + m.tag + '</div>' +
              '<div class="meta">' + D[l].themes.length + ' themes · ' +
                 D[l].words.length + ' words</div>' +
              '<div class="va-bar"><i style="width:' + pct + '%"></i></div>' +
            '</span>' +
            '<span class="side">' +
              '<div class="stars">★ ' + st + '<span style="opacity:.5;font-weight:400"> / ' + mx + '</span></div>' +
              '<div class="xp">⚡ ' + (P.xp[l] || 0) + ' XP</div>' +
            '</span>' +
          '</button>';
      });
      render(
        '<div class="va-hero">' +
          '<h1>🕹️ Vocabulary Arcade</h1>' +
          '<p>Run the mission, then pick a theme. Words come back until you own them.</p>' +
        '</div>' +
        '<div class="va-statrow" style="margin-bottom:1.1rem">' +
          '<span class="va-pill">📖 ' + seenN + ' words met</span>' +
          '<span class="va-pill">🥇 ' + masteredN + ' mastered</span>' +
          '<span class="va-pill">⏰ ' + reviewN + ' to review</span>' +
          '<span class="va-pill">👑 ' + crownsN + ' crowns</span>' +
          '<span class="va-pill">🏅 best streak ' + P.streak.best + '</span>' +
        '</div>' +
        '<div class="va-levels">' + cards + '</div>'
      );
      on('[data-mission]', 'click', startMission);
      on('.va-level[data-l]', 'click', function (e) {
        goLevel(e.currentTarget.dataset.l);
      });
    }

    /* ── screen: theme select ─────────────────────────────────────────── */

    function themeCard(t) {
      const st = themeStars(t);
      const kindLabel = t.kind === 'root' ? '🌿 Root family' : '🫂 Word family';
      const preview = t.words.map(function (w) { return w.w; }).join(' · ');
      return '<button class="va-theme" data-t="' + t.id + '">' +
        '<span class="kind"><span>' + kindLabel + '</span>' +
          '<span class="st">' + (P.crowns[t.id] ? '👑 ' : '') +
          (st ? '★ ' + st : '☆') +
          '<span style="opacity:.5;font-weight:400"> / ' + themeMaxStars(t) + '</span></span></span>' +
        '<span class="name">' + md(t.title) + '</span>' +
        '<span class="words">' + esc(preview) + '</span>' +
      '</button>';
    }

    function goLevel(l) {
      S.level = l; S.theme = null; S.sess = null;
      const m = LMETA[l];
      setAccent(m.color);
      const L = D[l];
      const q = S.q.toLowerCase();
      const themes = L.themes.filter(function (t) {
        if (S.tab === 'family' && t.kind !== 'meaning') return false;
        if (S.tab === 'root' && t.kind !== 'root') return false;
        if (q && t.title.toLowerCase().indexOf(q) < 0 &&
            !t.words.some(function (w) { return w.w.toLowerCase().indexOf(q) >= 0; }))
          return false;
        return true;
      });
      function tab(id, label) {
        return '<button class="va-tab' + (S.tab === id ? ' on' : '') +
               '" data-tab="' + id + '">' + label + '</button>';
      }
      render(
        '<div class="va-top">' +
          '<button class="va-back" data-nav="home">‹ Levels</button>' +
          '<span class="va-crumb">' + m.emoji + ' ' + m.name + '</span>' +
          '<span class="va-spacer"></span>' +
          '<span class="va-pill">★ ' + levelStars(l) + '</span>' +
          '<span class="va-pill">⚡ ' + (P.xp[l] || 0) + ' XP</span>' +
        '</div>' +
        '<div class="va-tabs">' +
          tab('all', 'All') + tab('family', '🫂 Word families') +
          tab('root', '🌿 Roots') +
          '<input class="va-search" placeholder="Find a theme or word…" value="' + esc(S.q) + '">' +
        '</div>' +
        '<div class="va-grid">' +
          '<button class="va-theme mix" data-t="__mix">' +
            '<span class="kind"><span>🎲 Smart practice</span><span></span></span>' +
            '<span class="name">Shuffle Mix</span>' +
            '<span class="words">10 words the memory engine says you need: weak + due + old + new</span>' +
          '</button>' +
          themes.map(themeCard).join('') +
        '</div>' +
        (themes.length ? '' : '<p style="opacity:.6;margin-top:1rem">No themes match.</p>')
      );
      on('.va-back', 'click', goHome);
      on('.va-tab', 'click', function (e) {
        S.tab = e.currentTarget.dataset.tab; goLevel(l);
      });
      const search = el.querySelector('.va-search');
      search.addEventListener('input', function () {
        S.q = search.value;
        goLevel(l);
        const s2 = el.querySelector('.va-search');
        s2.focus();
        s2.setSelectionRange(s2.value.length, s2.value.length);
      });
      on('.va-theme', 'click', function (e) {
        const id = e.currentTarget.dataset.t;
        if (id === '__mix') {
          goTheme(makeMix(l));
        } else {
          goTheme(L.themes.find(function (t) { return t.id === id; }));
        }
      });
    }

    function makeMix(l) {
      /* not random: weak + due + old strong + never-seen, in that priority */
      const B = buckets(D[l].words);
      let ws = shuffle(B.weak).slice(0, 3)
        .concat(shuffle(B.due).slice(0, 3),
                shuffle(B.strong).slice(0, 2),
                shuffle(B.fresh).slice(0, 2));
      if (ws.length < 10) {
        const extra = shuffle(D[l].words.filter(function (w) {
          return ws.indexOf(w) < 0;
        }));
        ws = ws.concat(extra.slice(0, 10 - ws.length));
      }
      return {
        id: '__mix', level: l, kind: 'mix', title: '🎲 Shuffle Mix',
        blurb: 'Ten ' + LMETA[l].name.toLowerCase() + ' words picked by the ' +
               'memory engine — the ones about to fade, plus a couple of new ' +
               'ones. Practice only; stars are earned inside real themes.',
        root: null, words: shuffle(ws)
      };
    }

    /* ── screen: game select ──────────────────────────────────────────── */

    function rootWordsOf(t) {
      return t.words.filter(function (w) { return w._t.kind === 'root'; });
    }

    function goTheme(t) {
      S.theme = t; S.sess = null;
      const chips = t.words.map(function (w) {
        const m = medal(w);
        return '<button class="va-chip" data-w="' + esc(w.w) + '" title="' +
               esc(w.say) + '">' + esc(w.w) + (m ? ' ' + m : '') + ' 🔈</button>';
      }).join('');
      const canRoot = rootWordsOf(t).length >= 4;
      const games = GAMES.filter(function (g) {
        return !g.hidden && (!g.rootOnly || canRoot);
      }).map(function (g) {
        let st = '';
        if (t.id !== '__mix') {
          if (g.boss) {
            st = P.crowns[t.id] ? '👑 crown won' : '';
          } else if (g.starred) {
            const n = P.stars[starKey(t, g.id)] || 0;
            st = '★'.repeat(n) + '<span style="opacity:.3">' + '★'.repeat(3 - n) + '</span>';
          } else if (P.done[starKey(t, 'flash')]) {
            st = '✓ learned';
          }
        }
        return '<button class="va-game" data-g="' + g.id + '">' +
          '<div class="em">' + g.emoji + '</div>' +
          '<div class="name">' + g.name + '</div>' +
          '<div class="desc">' + g.desc + '</div>' +
          '<div class="st">' + st + '</div>' +
        '</button>';
      }).join('');
      render(
        '<div class="va-top">' +
          '<button class="va-back" data-nav="level">‹ Themes</button>' +
          '<span class="va-crumb">' + md(t.title) + '</span>' +
        '</div>' +
        '<p class="va-blurb">' + md(t.blurb) + '</p>' +
        '<div class="va-chiprow">' + chips + '</div>' +
        '<div class="va-games">' + games + '</div>'
      );
      on('.va-back', 'click', function () { goLevel(t.level); });
      on('.va-chip', 'click', function (e) { speak(e.currentTarget.dataset.w); });
      on('.va-game', 'click', function (e) { startGame(e.currentTarget.dataset.g); });
    }

    /* ── question builders ────────────────────────────────────────────── */

    function distractorWords(w, n) {
      const pool = D[w._lvl].words.filter(function (o) {
        return o !== w && o._t !== w._t && o.w !== w.w && o.mean !== w.mean;
      });
      const same = shuffle(pool.filter(function (o) { return o.pos === w.pos; }));
      const diff = shuffle(pool.filter(function (o) { return o.pos !== w.pos; }));
      return same.concat(diff).slice(0, n);
    }

    function optRow(list, correctIdx) {
      return shuffle(list.map(function (o, i) {
        return { html: o, ok: i === correctIdx };
      }));
    }

    /* after every answer, reinforce the word's mini-network */
    function network(w) {
      const bits = [];
      if (w.syn) bits.push('🟢 ' + esc(w.syn));
      if (w.ant) bits.push('🔴 ' + esc(w.ant));
      return bits.length
        ? '<br><span style="opacity:.72;font-size:.82rem">' +
          bits.join(' &nbsp;·&nbsp; ') + '</span>'
        : '';
    }

    function wordPrompt(w, sayBtn) {
      return '<div class="word">' + esc(w.w) +
        (sayBtn ? ' <button class="va-say-btn" data-say="' + esc(w.w) + '">🔈</button>' : '') +
        '</div>' +
        '<div class="say">' + esc(w.say) + ' · ' + esc(w.pos) + '</div>';
    }

    function quizQFor(w, dir) {
      const others = distractorWords(w, 3);
      if (others.length < 3) return null;
      if (dir === 'w2m') {
        return {
          word: w,
          label: 'What does it mean?',
          prompt: wordPrompt(w, true),
          options: optRow([w].concat(others).map(function (o) { return md(o.mean); }), 0),
          after: '💡 ' + md(w.story) + network(w)
        };
      }
      return {
        word: w,
        label: 'Which word is it?',
        prompt: '<div class="mean">' + md(w.mean) + '</div>',
        options: optRow([w].concat(others).map(function (o) { return esc(o.w); }), 0),
        after: '💡 ' + md(w.story) + network(w)
      };
    }

    function quizQs(t) {
      const both = t.words.length <= 6;
      const qs = [];
      t.words.forEach(function (w) {
        const dirs = both ? ['w2m', 'm2w'] : [pick(['w2m', 'm2w'])];
        dirs.forEach(function (dir) {
          const q = quizQFor(w, dir);
          if (q) qs.push(q);
        });
      });
      return shuffle(qs);
    }

    function synOptions(w, kind) {
      /* kind 'syn': correct from w._syn, trap from w._ant, fillers from pool
         kind 'ant': correct from w._ant, trap from w._syn, fillers from pool */
      const mine = kind === 'syn' ? w._syn : w._ant;
      const trapList = kind === 'syn' ? w._ant : w._syn;
      const pool = kind === 'syn' ? D[w._lvl].synPool : D[w._lvl].antPool;
      if (!mine.length) return null;
      const correct = pick(mine);
      const bothMine = {};
      w._syn.concat(w._ant).concat([w.w]).forEach(function (v) {
        bothMine[v.toLowerCase()] = true;
      });
      const used = {}; used[correct.toLowerCase()] = true;
      const opts = [correct];
      if (trapList.length) {
        const trap = pick(trapList);
        if (!used[trap.toLowerCase()]) { opts.push(trap); used[trap.toLowerCase()] = true; }
      }
      const fillers = shuffle(pool);
      for (let i = 0; i < fillers.length && opts.length < 4; i++) {
        const f = fillers[i];
        const lo = f.v.toLowerCase();
        if (f.w === w || bothMine[lo] || used[lo]) continue;
        opts.push(f.v); used[lo] = true;
      }
      if (opts.length < 4) return null;
      return optRow(opts.map(esc), 0);
    }

    function synQFor(w, kind) {
      const options = synOptions(w, kind);
      if (!options) return null;
      if (kind === 'syn') {
        return {
          word: w, label: 'Grab a synonym of', prompt: wordPrompt(w),
          options: options,
          after: '🟢 Synonyms of <b>' + esc(w.w) + '</b>: ' + esc(w.syn)
        };
      }
      return {
        word: w, label: 'Pick the OPPOSITE of', prompt: wordPrompt(w),
        options: options,
        after: '🙃 Opposites of <b>' + esc(w.w) + '</b>: ' + esc(w.ant)
      };
    }

    function antQs(t) {
      const passes = t.words.length <= 5 ? 2 : 1;
      const qs = [];
      for (let p = 0; p < passes; p++) {
        t.words.forEach(function (w) {
          const q = synQFor(w, 'ant');
          if (q) qs.push(q);
        });
      }
      return shuffle(qs);
    }

    function rootQs(t) {
      const words = rootWordsOf(t);
      const allRoots = D[S.level].roots;
      const qs = [];
      words.forEach(function (w) {
        const myRoot = w._t;
        const otherRoots = shuffle(allRoots.filter(function (r) {
          return r.theme !== myRoot;
        })).slice(0, 3);
        if (otherRoots.length < 3) return;
        function rootLabel(root, means) {
          return '<b>' + esc(root) + '</b> <span style="opacity:.6">— ' +
                 esc(means) + '</span>';
        }
        qs.push({
          word: w,
          label: 'Which root is hiding inside…',
          prompt: '<div class="word">' + esc(w.w) + '</div>' +
                  '<div class="say">' + esc(w.say) + '</div>',
          options: optRow(
            [rootLabel(myRoot.root, myRoot.rootMeans)].concat(
              otherRoots.map(function (r) { return rootLabel(r.root, r.means); })), 0),
          after: '🌿 ' + md(w.story)
        });
        /* reverse direction: root -> word */
        const otherWords = shuffle(D[S.level].words.filter(function (o) {
          return o._t.kind === 'root' && o._t !== myRoot;
        })).slice(0, 3);
        if (otherWords.length === 3) {
          qs.push({
            word: w,
            label: 'Which word is built from…',
            prompt: '<div class="word" style="font-size:1.5rem">' +
                    esc(myRoot.root) + '</div>' +
                    '<div class="say">meaning “' + esc(myRoot.rootMeans) + '”</div>',
            options: optRow([w].concat(otherWords).map(function (o) {
              return esc(o.w);
            }), 0),
            after: '🌿 <b>' + esc(w.w) + '</b>: ' + md(w.mean)
          });
        }
      });
      return shuffle(qs);
    }

    function boldExs(w) {
      return (w.ex || []).filter(function (e) { return /\*\*(.+?)\*\*/.test(e); });
    }
    function blankSentence(raw) {
      return md(raw.replace(/\*\*(.+?)\*\*/g, '\u0001')).split('\u0001')
        .join('<span class="va-blank">_____</span>');
    }

    function blankQFromEx(w, raw) {
      const others = distractorWords(w, 3);
      if (others.length < 3) return null;
      return {
        word: w,
        label: 'Which word completes it?',
        prompt: '<div class="mean">' + blankSentence(raw) + '</div>',
        options: optRow([w].concat(others).map(function (o) {
          return esc(o.w);
        }), 0),
        after: '💡 <b>' + esc(w.w) + '</b>: ' + md(w.mean) + network(w)
      };
    }
    function blankQFor(w) {
      const exs = boldExs(w);
      return exs.length ? blankQFromEx(w, pick(exs)) : null;
    }

    function blankQs(t) {
      /* the word's own example sentences with the **bold** word blanked out */
      const passes = t.words.length <= 6 ? 2 : 1;
      const qs = [];
      t.words.forEach(function (w) {
        const exs = shuffle(boldExs(w));
        for (let p = 0; p < passes && p < exs.length; p++) {
          const q = blankQFromEx(w, exs[p]);
          if (q) qs.push(q);
        }
      });
      return shuffle(qs);
    }

    /* ── word duel: the right word vs a tempting foil, one sentence ────── */

    function duelQFor(w) {
      const exs = boldExs(w);
      if (!exs.length) return null;
      let foil = null;
      if (w._ant.length) {
        const f = pick(w._ant);
        if (f.toLowerCase() !== w.w.toLowerCase()) foil = f;
      }
      if (!foil) {
        const o = distractorWords(w, 1)[0];
        if (!o) return null;
        foil = o.w;
      }
      return {
        word: w,
        label: 'Word duel — which one truly fits?',
        prompt: '<div class="mean">' + blankSentence(pick(exs)) + '</div>',
        options: optRow([esc(w.w), esc(foil)], 0),
        after: '⚔️ <b>' + esc(w.w) + '</b>: ' + md(w.mean) + network(w)
      };
    }

    function duelQs(t) {
      const qs = [];
      t.words.forEach(function (w) {
        const q = duelQFor(w);
        if (q) qs.push(q);
      });
      return shuffle(qs);
    }

    /* ── don't get fooled: every option comes from the same family ─────── */

    function foolQs(t) {
      if (t.words.length < 4) return [];
      const qs = [];
      t.words.forEach(function (w) {
        const sibs = shuffle(t.words.filter(function (o) {
          return o !== w && o.w !== w.w;
        })).slice(0, 3);
        if (sibs.length < 3) return;
        qs.push({
          word: w,
          label: 'Don’t get fooled — which word means…',
          prompt: '<div class="mean">' + md(w.mean) + '</div>',
          options: optRow([w].concat(sibs).map(function (o) { return esc(o.w); }), 0),
          after: '🪤 <b>' + esc(w.w) + '</b> — ' + md(w.story)
        });
        qs.push({
          word: w,
          label: 'Don’t get fooled — what does it mean?',
          prompt: wordPrompt(w, true),
          options: optRow([w].concat(sibs).map(function (o) { return md(o.mean); }), 0),
          after: '🪤 ' + md(w.story) + network(w)
        });
      });
      return shuffle(qs);
    }

    /* ── boss battle: every question type at once, 80% wins the crown ──── */

    function bossQs(t) {
      let pool = quizQs(t).concat(blankQs(t), antQs(t), duelQs(t), foolQs(t),
                                  oddQs(t));
      if (rootWordsOf(t).length >= 4) pool = pool.concat(rootQs(t));
      return shuffle(pool).slice(0, 10);
    }

    function oddQs(t) {
      /* three words from one family + one impostor from elsewhere */
      const L = D[S.level];
      const bases = t.id === '__mix'
        ? shuffle(t.words).slice(0, 6).map(function (w) { return w._t; })
        : [t, t, t, t, t, t];
      const qs = [];
      bases.forEach(function (bt) {
        if (bt.words.length < 3) return;
        const three = shuffle(bt.words).slice(0, 3);
        let pool = L.words.filter(function (o) {
          return o._t !== bt && o.pos === three[0].pos;
        });
        if (!pool.length) {
          pool = L.words.filter(function (o) { return o._t !== bt; });
        }
        if (!pool.length) return;
        const intr = pick(pool);
        const why = bt.kind === 'root'
          ? 'The other three are built from <b>' + esc(bt.root) + '</b> (' +
            esc(bt.rootMeans) + ').'
          : 'The other three belong to “' + md(bt.title) + '”.';
        qs.push({
          label: 'Which word does NOT belong?',
          prompt: '<div class="word" style="font-size:1.6rem">🕵️</div>' +
                  '<div class="say">three of these share a family — one is an impostor</div>',
          options: optRow(three.map(function (o) { return esc(o.w); })
            .concat([esc(intr.w)]), 3),
          after: '🕵️ <b>' + esc(intr.w) + '</b> is the impostor. ' + why
        });
      });
      return qs;
    }

    /* ── quiz-style game loop ─────────────────────────────────────────── */

    function startGame(gid) {
      S.game = gid;
      const t = S.theme;
      if (gid === 'flash') return flashStart(t);
      if (gid === 'mem') return memStart(t);
      if (gid === 'syn') return sprintStart(t);
      if (gid === 'tf') return tfStart(t);
      if (gid === 'scr') return scrStart(t);
      if (gid === 'spell') return spellStart(t);
      let qs = [];
      if (gid === 'quiz') qs = quizQs(t);
      if (gid === 'ant') qs = antQs(t);
      if (gid === 'root') qs = rootQs(t);
      if (gid === 'blank') qs = blankQs(t);
      if (gid === 'odd') qs = oddQs(t);
      if (gid === 'duel') qs = duelQs(t);
      if (gid === 'fool') qs = foolQs(t);
      if (gid === 'boss') qs = bossQs(t);
      if (!qs.length) return;
      S.sess = { gid: gid, qs: qs, i: 0, score: 0, correct: 0, streak: 0,
                 best: 0, answered: false, boss: gid === 'boss' };
      renderQ();
    }

    function quitSession() {
      if (S.theme && S.theme.id === '__mission') return goHome();
      goTheme(S.theme);
    }

    function hud(mid) {
      const s = S.sess;
      return '<div class="va-hud">' +
        '<button class="va-back" data-nav="quit">✕</button>' +
        '<span class="va-pill"' + (s.timed ? ' data-clock' : '') + '>' + mid + '</span>' +
        '<span class="va-spacer"></span>' +
        '<span class="va-pill' + (s.streak >= 3 ? ' hot' : '') + '">🔥 ' +
          s.streak + '</span>' +
        '<span class="va-pill acc">⚡ ' + s.score + '</span>' +
      '</div>';
    }

    /* wall-clock countdown for timed games — restarted after every render()
       (render clears intervals); drift-free because it derives the remaining
       seconds from s.deadline instead of counting ticks */
    function startClock() {
      clearTimer();
      S.timer = setInterval(function () {
        const s = S.sess;
        if (!s || !s.timed) { clearTimer(); return; }
        const left = Math.max(0, Math.ceil((s.deadline - Date.now()) / 1000));
        const c = el.querySelector('[data-clock]');
        if (c) c.textContent = '⏱ ' + left + 's';
        if (left <= 0) { clearTimer(); s.onTime(); }
      }, 250);
    }

    function clockLabel() {
      const s = S.sess;
      return '⏱ ' + Math.max(0, Math.ceil((s.deadline - Date.now()) / 1000)) + 's';
    }

    function progressBar(frac) {
      return '<div class="va-bar" style="margin-bottom:.4rem"><i style="width:' +
             Math.round(frac * 100) + '%"></i></div>';
    }

    function renderQ() {
      const s = S.sess;
      if (s.i >= s.qs.length) return finishQuiz();
      const q = s.qs[s.i];
      s.answered = false;
      const two = q.options.length === 2;
      const opts = q.options.map(function (o, i) {
        return '<button class="va-opt' + (two ? ' big' : '') + '" data-i="' + i + '">' +
          '<span class="key">' + (i + 1) + '</span><span>' + o.html + '</span>' +
        '</button>';
      }).join('');
      render(
        hud(s.timed ? clockLabel() : (s.i + 1) + ' / ' + s.qs.length) +
        (s.timed ? '' : progressBar(s.i / s.qs.length)) +
        '<div class="va-qlabel">' + q.label + '</div>' +
        '<div class="va-q">' + q.prompt + '</div>' +
        '<div class="va-opts' + (two ? ' two' : '') + '">' + opts + '</div>' +
        '<div class="va-after"></div>'
      );
      if (s.timed) startClock();
      on('[data-nav="quit"]', 'click', quitSession);
      on('.va-say-btn', 'click', function (e) {
        e.stopPropagation(); speak(e.currentTarget.dataset.say);
      });
      on('.va-opt', 'click', function (e) { answer(+e.currentTarget.dataset.i); });
    }

    function answer(i) {
      const s = S.sess;
      if (s.answered) return;
      s.answered = true;
      const q = s.qs[s.i];
      const btns = el.querySelectorAll('.va-opt');
      btns.forEach(function (b) { b.disabled = true; });
      const okIdx = q.options.findIndex(function (o) { return o.ok; });
      const ok = q.options[i].ok;
      recordAnswer(q.word, ok);
      if (ok) {
        btns[i].classList.add('good');
        s.streak++;
        if (s.streak > s.best) s.best = s.streak;
        s.correct++;
        s.score += 10 + 2 * Math.min(s.streak - 1, 5);
      } else {
        btns[i].classList.add('bad');
        btns[okIdx].classList.add('good');
        s.streak = 0;
      }
      const hudPills = el.querySelectorAll('.va-hud .va-pill');
      hudPills[1].textContent = '🔥 ' + s.streak;
      hudPills[1].classList.toggle('hot', s.streak >= 3);
      hudPills[2].textContent = '⚡ ' + s.score;
      el.querySelector('.va-after').innerHTML = q.after || '';
      setTimeout(function () {
        if (S.sess !== s) return;
        s.i++;
        (s.next || renderQ)();
      }, ok ? (s.delayOk || 900) : (s.delayBad || 1900));
    }

    function finishQuiz() {
      const s = S.sess;
      const acc = s.qs.length ? s.correct / s.qs.length : 0;
      if (s.boss) {
        const win = acc >= 0.8;
        let firstCrown = false;
        if (win && S.theme.id !== '__mix' && !P.crowns[S.theme.id]) {
          P.crowns[S.theme.id] = true;
          firstCrown = true;
        }
        return results({
          stars: 0, score: s.score, crown: win,
          title: win
            ? (firstCrown ? 'Boss defeated — crown won! 👑' : 'Crown defended! 👑')
            : 'The boss survived… 🐉',
          line: s.correct + ' / ' + s.qs.length + ' correct' +
                (win ? '' : ' — you need 80% to take the crown')
        });
      }
      if (s.gid === 'mission') {
        return results({
          stars: 0, score: s.score,
          title: acc >= 0.9 ? 'Mission crushed! 🚀'
               : acc >= 0.6 ? 'Mission complete! ✅'
               : 'Mission done — every word logged 📬',
          line: s.correct + ' / ' + s.qs.length + ' correct · best streak 🔥' + s.best
        });
      }
      const stars = acc >= 0.9 ? 3 : acc >= 0.65 ? 2 : 1;
      results({
        stars: stars, score: s.score,
        line: s.correct + ' / ' + s.qs.length + ' correct · best streak 🔥' + s.best
      });
    }

    /* ── synonym sprint (timed) ───────────────────────────────────────── */

    function sprintStart(t) {
      const usable = t.words.filter(function (w) { return w._syn.length; });
      if (!usable.length) return;
      S.sess = { gid: 'syn', queue: shuffle(usable), qi: 0, qs: [], i: 0,
                 score: 0, correct: 0, streak: 0, best: 0, answered: false,
                 timed: true, deadline: Date.now() + 45000,
                 delayOk: 700, delayBad: 1500, next: nextSprintQ,
                 onTime: function () {
                   const s = S.sess;
                   const stars = s.correct >= 12 ? 3 : s.correct >= 7 ? 2 : 1;
                   results({
                     stars: stars, score: s.score,
                     line: s.correct + ' synonyms in 45s · best streak 🔥' + s.best
                   });
                 } };
      nextSprintQ();
    }

    function nextSprintQ() {
      const s = S.sess;
      if (!s || Date.now() >= s.deadline) return;
      let q = null, guard = 0;
      while (!q && guard++ < 20) {
        const w = s.queue[s.qi % s.queue.length];
        s.qi++;
        q = synQFor(w, 'syn');
        if (q) q.after = '';
      }
      if (!q) return;
      s.qs = [q]; s.i = 0;
      renderQ();
    }

    /* ── fact or fake (timed true/false) ──────────────────────────────── */

    function tfStart(t) {
      S.sess = { gid: 'tf', queue: shuffle(t.words), qi: 0, qs: [], i: 0,
                 score: 0, correct: 0, streak: 0, best: 0, answered: false,
                 timed: true, deadline: Date.now() + 30000,
                 delayOk: 550, delayBad: 1300, next: nextTfQ,
                 onTime: function () {
                   const s = S.sess;
                   const stars = s.correct >= 14 ? 3 : s.correct >= 8 ? 2 : 1;
                   results({
                     stars: stars, score: s.score,
                     line: s.correct + ' verdicts in 30s · best streak 🔥' + s.best
                   });
                 } };
      nextTfQ();
    }

    function nextTfQ() {
      const s = S.sess;
      if (!s || Date.now() >= s.deadline) return;
      const w = s.queue[s.qi % s.queue.length];
      s.qi++;
      const truth = Math.random() < 0.5;
      let shownMean = w.mean, after = '';
      if (!truth) {
        const other = distractorWords(w, 1)[0];
        if (!other) return;
        shownMean = other.mean;
        after = '🎭 Really: ' + md(w.mean);
      }
      s.qs = [{
        word: w,
        label: 'Fact or fake?',
        prompt: '<div class="word" style="font-size:1.6rem">' + esc(w.w) + '</div>' +
                '<div class="mean" style="margin-top:.4rem">“' + md(shownMean) + '”</div>',
        options: [
          { html: '✅ Fact', ok: truth },
          { html: '❌ Fake', ok: !truth }
        ],
        after: after
      }];
      s.i = 0;
      renderQ();
    }

    /* ── today's mission: the reinforcement engine picks the words ─────── */

    function allWords() {
      return LEVELS.reduce(function (a, l) { return a.concat(D[l].words); }, []);
    }

    /* 4 weak + 4 due + 2 old strong + 2 never-seen; filled up to 12 */
    function missionWords() {
      const B = buckets(allWords());
      let sel = shuffle(B.weak).slice(0, 4)
        .concat(shuffle(B.due).slice(0, 4),
                shuffle(B.strong).slice(0, 2),
                shuffle(B.fresh).slice(0, 2));
      if (sel.length < 12) {
        const extra = shuffle(B.fresh.concat(B.rest, B.due, B.weak, B.strong)
          .filter(function (w) { return sel.indexOf(w) < 0; }));
        sel = sel.concat(extra.slice(0, 12 - sel.length));
      }
      return shuffle(sel);
    }

    function missionQs(words) {
      const qs = [];
      words.forEach(function (w) {
        const types = ['w2m', 'm2w'];
        if (boldExs(w).length) { types.push('blank', 'duel'); }
        if (w._syn.length) types.push('syn');
        if (w._ant.length) types.push('ant');
        const ty = pick(types);
        let q = null;
        if (ty === 'w2m' || ty === 'm2w') q = quizQFor(w, ty);
        else if (ty === 'blank') q = blankQFor(w);
        else if (ty === 'duel') q = duelQFor(w);
        else q = synQFor(w, ty);
        if (!q) q = quizQFor(w, 'w2m');
        if (q) qs.push(q);
      });
      return shuffle(qs);
    }

    function startMission() {
      const words = missionWords();
      const qs = missionQs(words);
      if (!qs.length) return;
      S.level = null;
      S.theme = { id: '__mission', level: null, kind: 'mix',
                  title: '📬 Today’s Mission', words: words };
      S.game = 'mission';
      setAccent('#60a5fa');
      S.sess = { gid: 'mission', qs: qs, i: 0, score: 0, correct: 0,
                 streak: 0, best: 0, answered: false };
      renderQ();
    }

    /* ── flashcards ───────────────────────────────────────────────────── */

    function flashStart(t) {
      S.sess = { gid: 'flash', deck: shuffle(t.words), got: 0,
                 total: t.words.length };
      flashRender();
    }

    function flashRender() {
      const s = S.sess;
      if (!s.deck.length) {
        P.done[starKey(S.theme, 'flash')] = true;
        P.xp[S.level] = (P.xp[S.level] || 0) + 2 * s.total;
        save();
        return results({
          stars: 0, score: 2 * s.total,
          line: 'Deck complete — all ' + s.total + ' words flipped to ✅',
          title: 'Deck cleared! ✨'
        });
      }
      const w = s.deck[0];
      const ex = pick(w.ex || ['']);
      render(
        '<div class="va-hud">' +
          '<button class="va-back" data-nav="quit">✕</button>' +
          '<span class="va-pill">🃏 ' + s.got + ' / ' + s.total + ' learned</span>' +
          '<span class="va-spacer"></span>' +
          '<span class="va-pill">' + s.deck.length + ' to go</span>' +
        '</div>' +
        progressBar(s.got / s.total) +
        '<div class="va-flip" id="flip">' +
          '<div class="va-flip-inner">' +
            '<div class="va-face front">' +
              '<div style="font-size:.85rem;opacity:.55">' + esc(w.say) + '</div>' +
              '<div style="font-size:2.4rem;font-weight:800;margin:.3rem 0">' +
                esc(w.w) +
                ' <button class="va-say-btn" data-say="' + esc(w.w) + '">🔈</button></div>' +
              '<div style="opacity:.55;font-style:italic">' + esc(w.pos) + '</div>' +
              '<div class="hint">tap to flip</div>' +
            '</div>' +
            '<div class="va-face back">' +
              '<div class="sec"><h4>Meaning</h4>' + md(w.mean) + '</div>' +
              '<div class="sec"><h4>💡 Story</h4>' + md(w.story) + '</div>' +
              (ex ? '<div class="sec"><h4>✏️ Example</h4>' + md(ex) + '</div>' : '') +
              '<div class="sec"><h4>🟢 Similar</h4>' + esc(w.syn) + '</div>' +
              '<div class="sec"><h4>🔴 Opposite</h4>' + esc(w.ant) + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="va-flash-btns">' +
          '<button class="va-btn ghost" data-a="again">🔁 Again</button>' +
          '<button class="va-btn" data-a="got">✅ Got it</button>' +
        '</div>'
      );
      const flip = el.querySelector('#flip');
      flip.addEventListener('click', function () {
        flip.classList.toggle('flipped');
      });
      on('.va-say-btn', 'click', function (e) {
        e.stopPropagation(); speak(e.currentTarget.dataset.say);
      });
      on('[data-nav="quit"]', 'click', function () { goTheme(S.theme); });
      on('[data-a="again"]', 'click', function () {
        s.deck.push(s.deck.shift());
        flashRender();
      });
      on('[data-a="got"]', 'click', function () {
        touchWord(w); /* introduced — enters the review pipeline */
        s.deck.shift();
        s.got++;
        flashRender();
      });
    }

    /* ── word scramble ────────────────────────────────────────────────── */

    function scrStart(t) {
      S.sess = { gid: 'scr', words: shuffle(t.words), wi: 0, score: 0,
                 clean: 0, total: t.words.length };
      scrSetup();
    }

    function scrSetup() {
      const s = S.sess;
      if (s.wi >= s.words.length) {
        const acc = s.clean / s.total;
        const stars = acc >= 0.9 ? 3 : acc >= 0.65 ? 2 : 1;
        return results({
          stars: stars, score: s.score,
          line: s.clean + ' of ' + s.total + ' solved without help'
        });
      }
      const w = s.words[s.wi];
      s.letters = w.w.split('');
      let order = shuffle(s.letters.map(function (_, i) { return i; }));
      for (let tries = 0; tries < 6; tries++) {
        const same = order.every(function (v, i) {
          return s.letters[v] === s.letters[i];
        });
        if (!same || s.letters.length < 3) break;
        order = shuffle(order);
      }
      s.tiles = order.map(function (li) {
        return { ch: s.letters[li], used: false };
      });
      s.placed = [];   /* entries: { ch, tile (index|null), hinted } */
      s.hints = 0;
      s.fails = 0;
      s.locked = false;
      scrRender();
    }

    function scrRender(extra) {
      const s = S.sess;
      const w = s.words[s.wi];
      const slots = s.letters.map(function (_, i) {
        const p = s.placed[i];
        return '<div class="va-slot' + (p ? ' fill' : '') +
               (p && p.hinted ? ' hinted' : '') + '" data-slot>' +
               (p ? esc(p.ch) : '') + '</div>';
      }).join('');
      const tiles = s.tiles.map(function (tl, i) {
        return '<button class="va-tile" data-i="' + i + '"' +
               (tl.used || s.locked ? ' disabled' : '') + '>' +
               esc(tl.ch) + '</button>';
      }).join('');
      render(
        '<div class="va-hud">' +
          '<button class="va-back" data-nav="quit">✕</button>' +
          '<span class="va-pill">🔤 ' + (s.wi + 1) + ' / ' + s.total + '</span>' +
          '<span class="va-spacer"></span>' +
          '<span class="va-pill acc">⚡ ' + s.score + '</span>' +
        '</div>' +
        progressBar(s.wi / s.total) +
        '<div class="va-qlabel">Unscramble the word</div>' +
        '<div class="va-clue">' + md(w.mean) +
          ' <span style="opacity:.55">(' + esc(w.pos) + ')</span></div>' +
        '<div class="va-slots" data-slots>' + slots + '</div>' +
        '<div class="va-tiles">' + tiles + '</div>' +
        '<div class="va-scr-btns">' +
          '<button class="va-btn ghost" data-a="undo">⌫ Undo</button>' +
          '<button class="va-btn ghost" data-a="hint">💡 Hint (−5)</button>' +
        '</div>' +
        '<div class="va-after">' + (extra || '') + '</div>'
      );
      on('[data-nav="quit"]', 'click', function () { goTheme(S.theme); });
      on('.va-tile', 'click', function (e) { scrPlace(+e.currentTarget.dataset.i); });
      on('[data-a="undo"]', 'click', scrUndo);
      on('[data-a="hint"]', 'click', scrHint);
    }

    function scrPlace(ti) {
      const s = S.sess;
      if (s.locked || s.tiles[ti].used ||
          s.placed.length >= s.letters.length) return;
      s.tiles[ti].used = true;
      s.placed.push({ ch: s.tiles[ti].ch, tile: ti, hinted: false });
      if (s.placed.length === s.letters.length) return scrCheck();
      scrRender();
    }

    function scrUndo() {
      const s = S.sess;
      if (s.locked) return;
      for (let i = s.placed.length - 1; i >= 0; i--) {
        if (!s.placed[i].hinted) {
          s.tiles[s.placed[i].tile].used = false;
          s.placed.splice(i, 1);
          return scrRender();
        }
      }
    }

    function scrHint() {
      /* clear guesses, then reveal one more leading letter than last time */
      const s = S.sess;
      if (s.locked) return;
      s.hints++;
      s.score = Math.max(0, s.score - 5);
      const reveal = Math.min(
        s.placed.filter(function (p) { return p.hinted; }).length + 1,
        s.letters.length);
      s.tiles.forEach(function (tl) { tl.used = false; });
      s.placed = [];
      for (let i = 0; i < reveal; i++) {
        const ti = s.tiles.findIndex(function (tl) {
          return !tl.used && tl.ch === s.letters[i];
        });
        s.tiles[ti].used = true;
        s.placed.push({ ch: s.letters[i], tile: ti, hinted: true });
      }
      if (s.placed.length === s.letters.length) return scrCheck();
      scrRender();
    }

    function scrCheck() {
      const s = S.sess;
      const w = s.words[s.wi];
      const guess = s.placed.map(function (p) { return p.ch; }).join('');
      const win = guess.toLowerCase() === w.w.toLowerCase();
      if (win) {
        s.locked = true;
        if (!s.hints && !s.fails) s.clean++;
        s.score += Math.max(5, 15 - 5 * s.hints);
        recordAnswer(w, true);
        scrRender('💡 ' + md(w.story));
        const box = el.querySelector('[data-slots]');
        if (box) box.classList.add('won');
        setTimeout(function () {
          if (S.sess !== s) return;
          s.wi++;
          scrSetup();
        }, 1800);
        return;
      }
      s.fails++;
      if (s.fails >= 3) {
        /* reveal and move on */
        s.locked = true;
        recordAnswer(w, false);
        s.tiles.forEach(function (tl) { tl.used = true; });
        s.placed = s.letters.map(function (ch) {
          return { ch: ch, tile: null, hinted: true };
        });
        scrRender('❌ It was <b>' + esc(w.w) + '</b> — ' + md(w.mean));
        setTimeout(function () {
          if (S.sess !== s) return;
          s.wi++;
          scrSetup();
        }, 2200);
        return;
      }
      scrRender('Not quite — tiles are back, try again.');
      const box = el.querySelector('[data-slots]');
      if (box) box.classList.add('lost');
      const sHold = s;
      setTimeout(function () {
        if (S.sess !== sHold || sHold.locked) return;
        sHold.tiles.forEach(function (tl) { tl.used = false; });
        const keep = sHold.placed.filter(function (p) { return p.hinted; });
        keep.forEach(function (p) {
          const ti = sHold.tiles.findIndex(function (tl) {
            return !tl.used && tl.ch === p.ch;
          });
          if (ti >= 0) { sHold.tiles[ti].used = true; p.tile = ti; }
        });
        sHold.placed = keep;
        scrRender();
      }, 900);
    }

    /* ── echo spell ───────────────────────────────────────────────────── */

    function spellStart(t) {
      S.sess = { gid: 'spell', words: shuffle(t.words), wi: 0, score: 0,
                 firstTry: 0, total: t.words.length, tries: 0 };
      spellRender();
      spellSpeak();
    }

    function spellSpeak() {
      const s = S.sess;
      if (s.wi < s.words.length) speak(s.words[s.wi].w);
    }

    function spellRender(extra, lock) {
      const s = S.sess;
      if (s.wi >= s.words.length) {
        const acc = s.firstTry / s.total;
        const stars = acc >= 0.9 ? 3 : acc >= 0.65 ? 2 : 1;
        return results({
          stars: stars, score: s.score,
          line: s.firstTry + ' of ' + s.total + ' spelled right first try'
        });
      }
      const w = s.words[s.wi];
      const hasVoice = !!window.speechSynthesis;
      render(
        '<div class="va-hud">' +
          '<button class="va-back" data-nav="quit">✕</button>' +
          '<span class="va-pill">🔊 ' + (s.wi + 1) + ' / ' + s.total + '</span>' +
          '<span class="va-spacer"></span>' +
          '<span class="va-pill acc">⚡ ' + s.score + '</span>' +
        '</div>' +
        progressBar(s.wi / s.total) +
        '<div class="va-qlabel">' +
          (hasVoice ? 'Listen, then spell it' : 'Read the clue, then spell it') +
        '</div>' +
        (hasVoice
          ? '<button class="va-hear" data-a="hear">🔊 Hear the word</button>'
          : '<div class="va-q"><div class="word" style="font-size:1.3rem">“' +
            esc(w.say) + '”</div></div>') +
        '<div class="va-clue" style="margin-top:1rem">' + md(w.mean) +
          ' <span style="opacity:.55">(' + esc(w.pos) + ')</span></div>' +
        '<div class="va-spell-row">' +
          '<input class="va-spell-input" data-spell type="text" ' +
            'autocomplete="off" autocapitalize="none" autocorrect="off" ' +
            'spellcheck="false" placeholder="type the word…"' +
            (lock ? ' disabled' : '') + '>' +
          '<button class="va-btn" data-a="go"' + (lock ? ' disabled' : '') +
            '>Check</button>' +
        '</div>' +
        '<div class="va-after">' + (extra || '') + '</div>'
      );
      on('[data-nav="quit"]', 'click', function () { goTheme(S.theme); });
      on('[data-a="hear"]', 'click', spellSpeak);
      const inp = el.querySelector('[data-spell]');
      if (!lock) {
        inp.focus();
        inp.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') spellCheck();
        });
        on('[data-a="go"]', 'click', spellCheck);
      }
    }

    function spellCheck() {
      const s = S.sess;
      const w = s.words[s.wi];
      const inp = el.querySelector('[data-spell]');
      const guess = (inp.value || '').trim().toLowerCase();
      if (!guess) { inp.focus(); return; }
      if (guess === w.w.toLowerCase()) {
        if (s.tries === 0) { s.firstTry++; s.score += 15; }
        else s.score += 8;
        recordAnswer(w, true);
        spellRender('✅ <b>' + esc(w.w) + '</b> — ' + md(w.mean), true);
        const done = el.querySelector('[data-spell]');
        done.value = w.w; done.classList.add('good');
        setTimeout(function () {
          if (S.sess !== s) return;
          s.wi++; s.tries = 0;
          spellRender();
          spellSpeak();
        }, 1400);
        return;
      }
      s.tries++;
      if (s.tries >= 2) {
        recordAnswer(w, false);
        spellRender('❌ It’s spelled <b>' + esc(w.w) + '</b> (' +
                    esc(w.say) + ')', true);
        const done = el.querySelector('[data-spell]');
        done.value = guess; done.classList.add('bad');
        setTimeout(function () {
          if (S.sess !== s) return;
          s.wi++; s.tries = 0;
          spellRender();
          spellSpeak();
        }, 2200);
        return;
      }
      inp.classList.add('bad');
      inp.select();
      el.querySelector('.va-after').innerHTML =
        '🔁 One more try — it sounds like “' + esc(w.say) + '”';
      spellSpeak();
      setTimeout(function () { inp.classList.remove('bad'); }, 400);
    }

    /* ── memory flip ──────────────────────────────────────────────────── */

    function memStart(t) {
      const words = shuffle(t.words).slice(0, 4);
      let cards = [];
      words.forEach(function (w, i) {
        cards.push({ pid: i, html: '<span class="w">' + esc(w.w) + '</span>' });
        cards.push({ pid: i, html: esc(shortMean(w)) });
      });
      cards = shuffle(cards);
      S.sess = { gid: 'mem', cards: cards, open: [], lock: false, moves: 0,
                 matched: 0, pairs: words.length, wordlist: words };
      const grid = cards.map(function (c, i) {
        return '<div class="va-mem-card" data-i="' + i + '">' +
          '<div class="va-mem-in">' +
            '<div class="va-mem-face f">❔</div>' +
            '<div class="va-mem-face b">' + c.html + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      render(
        '<div class="va-hud">' +
          '<button class="va-back" data-nav="quit">✕</button>' +
          '<span class="va-pill">🧠 Match word ↔ meaning</span>' +
          '<span class="va-spacer"></span>' +
          '<span class="va-pill" data-moves>Moves: 0</span>' +
        '</div>' +
        '<div class="va-mem">' + grid + '</div>'
      );
      on('[data-nav="quit"]', 'click', function () { goTheme(S.theme); });
      on('.va-mem-card', 'click', function (e) { memFlip(e.currentTarget); });
    }

    function memFlip(node) {
      const s = S.sess;
      if (s.lock || node.classList.contains('up') ||
          node.classList.contains('won')) return;
      node.classList.add('up');
      s.open.push(node);
      if (s.open.length < 2) return;
      s.moves++;
      const m = el.querySelector('[data-moves]');
      if (m) m.textContent = 'Moves: ' + s.moves;
      const a = s.open[0], b = s.open[1];
      const pa = s.cards[+a.dataset.i].pid, pb = s.cards[+b.dataset.i].pid;
      if (pa === pb) {
        a.classList.add('won'); b.classList.add('won');
        s.open = [];
        s.matched++;
        touchWord(s.wordlist[pa]);
        if (s.matched === s.pairs) {
          const stars = s.moves <= s.pairs + 1 ? 3 : s.moves <= s.pairs + 4 ? 2 : 1;
          const score = 30 + Math.max(0, (s.pairs + 6 - s.moves)) * 5;
          setTimeout(function () {
            results({ stars: stars, score: score,
                      line: 'All pairs found in ' + s.moves + ' moves' });
          }, 700);
        }
      } else {
        s.lock = true;
        setTimeout(function () {
          if (S.sess !== s) return;
          a.classList.remove('up'); b.classList.remove('up');
          s.open = []; s.lock = false;
        }, 950);
      }
    }

    /* ── results ──────────────────────────────────────────────────────── */

    function results(r) {
      clearTimer();
      S.sess = null;
      const t = S.theme, gid = S.game;
      const isMix = t.id === '__mix';
      const isMission = gid === 'mission';
      const game = GAMES.find(function (g) { return g.id === gid; });
      let newBest = false;
      if (!isMix && !isMission && game.starred && r.stars > 0) {
        const k = starKey(t, gid);
        if (r.stars > (P.stars[k] || 0)) { P.stars[k] = r.stars; newBest = true; }
      }
      if (isMission) {
        P.xp.mission = (P.xp.mission || 0) + r.score;
        bumpStreak();
      } else if (gid !== 'flash') {
        P.xp[S.level] = (P.xp[S.level] || 0) + r.score;
      }
      save();
      const titles = r.title ? [r.title] :
        r.stars === 3 ? ['Legendary! 🏆', 'Flawless-ish! 💎', 'On fire! 🔥'] :
        r.stars === 2 ? ['Strong run! 💪', 'Almost perfect! 🎯'] :
        ['Warmed up! 🌤️', 'Good start — run it back! 🔁'];
      let starRow = '';
      if (game.starred) {
        starRow = '<div class="va-starrow">' +
          [1, 2, 3].map(function (n) {
            return '<span class="' + (n <= r.stars ? 'on' : '') + '">★</span>';
          }).join('') + '</div>';
      }
      render(
        '<div class="va-results">' +
          '<div class="big">' + game.emoji + '</div>' +
          '<h2>' + pick(titles) + '</h2>' +
          starRow +
          '<div class="va-statrow">' +
            '<span class="va-pill acc">⚡ +' + r.score + ' XP</span>' +
            '<span class="va-pill">' + esc(r.line) + '</span>' +
            (newBest ? '<span class="va-pill" style="border-color:#facc15;color:#facc15">New best! 🎉</span>' : '') +
            (r.crown ? '<span class="va-pill" style="border-color:#facc15;color:#facc15">👑 Crowned</span>' : '') +
            (isMix ? '<span class="va-pill">practice mode — no stars</span>' : '') +
            (isMission ? '<span class="va-pill">🔥 streak: ' + P.streak.cur + ' day' +
              (P.streak.cur === 1 ? '' : 's') + '</span>' : '') +
          '</div>' +
          '<div class="va-resbtns">' +
            '<button class="va-btn" data-a="replay">🔁 ' +
              (isMission ? 'New mission' : 'Play again') + '</button>' +
            (isMission ? '' :
              '<button class="va-btn ghost" data-a="games">🎮 More games</button>' +
              '<button class="va-btn ghost" data-a="themes">📚 Themes</button>') +
            (isMission ? '<button class="va-btn ghost" data-a="home">🏠 Home</button>' : '') +
          '</div>' +
        '</div>'
      );
      if (r.stars === 3 || newBest || r.crown) confetti();
      on('[data-a="replay"]', 'click', function () {
        if (isMission) return startMission();
        startGame(gid);
      });
      on('[data-a="games"]', 'click', function () { goTheme(t); });
      on('[data-a="themes"]', 'click', function () { goLevel(S.level); });
      on('[data-a="home"]', 'click', goHome);
    }

    function confetti() {
      const box = document.createElement('div');
      box.className = 'va-burst';
      const em = ['🎉', '⭐', '✨', '🎊', '💫', '🏅'];
      let spans = '';
      for (let i = 0; i < 34; i++) {
        spans += '<span style="left:' + (Math.random() * 100) + 'vw;' +
          'animation-duration:' + (2 + Math.random() * 2) + 's;' +
          'animation-delay:' + (Math.random() * 0.8) + 's">' +
          pick(em) + '</span>';
      }
      box.innerHTML = spans;
      document.body.appendChild(box);
      setTimeout(function () { box.remove(); }, 5000);
    }

    /* ── keyboard: 1–4 answers current question ───────────────────────── */

    document.addEventListener('keydown', function (e) {
      if (!S.sess || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      if (S.sess.gid === 'scr') {
        if (e.key === 'Backspace') { e.preventDefault(); scrUndo(); return; }
        if (/^[a-zA-Z-]$/.test(e.key)) {
          const s = S.sess;
          const ti = s.tiles.findIndex(function (tl) {
            return !tl.used && tl.ch.toLowerCase() === e.key.toLowerCase();
          });
          if (ti >= 0) scrPlace(ti);
          return;
        }
      }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 4) {
        const btns = el.querySelectorAll('.va-opt:not(:disabled)');
        if (btns[n - 1]) btns[n - 1].click();
      }
    });

    return {
      boot: function (data) {
        prep(data);
        goHome();
      }
    };
  })();

  init();
})();
</script>
