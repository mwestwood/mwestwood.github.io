---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 40vh;
    padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px;
    padding: 2.5rem 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── Word Tetris ─────────────────────────────────────────────────────── */
  #tetris-root { display: none; }

  .vt { --acc: #22d3ee; --good: #4ade80; --bad: #f87171;
        --card: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.12);
        max-width: 780px; }
  .vt, .vt * { box-sizing: border-box; }
  .vt button {
    font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .vt-speedrow { display: flex; align-items: center; gap: 0.4rem;
                 justify-content: center; margin: 0 0 1.2rem; flex-wrap: wrap; }
  .vt-speedrow .lbl { font-size: 0.82rem; opacity: 0.6; }
  .vt-spd {
    background: var(--card); border: 1px solid var(--line); color: inherit;
    border-radius: 999px; padding: 0.3rem 0.85rem; font-size: 0.82rem;
    cursor: pointer;
  }
  .vt-spd.on { background: var(--acc); border-color: var(--acc); color: #10222a;
               font-weight: 700; }

  .vt-top {
    display: flex; align-items: center; gap: 0.6rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .vt-back {
    background: var(--card); border: 1px solid var(--line);
    color: inherit; border-radius: 999px; padding: 0.3rem 0.85rem;
    font-size: 0.85rem; cursor: pointer;
  }
  .vt-back:hover { border-color: var(--acc); }
  .vt-crumb { font-weight: 700; font-size: 1.05rem; }
  .vt-spacer { flex: 1; }
  .vt-pill {
    font-size: 0.8rem; padding: 0.25rem 0.7rem; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); white-space: nowrap;
  }
  .vt-pill.acc { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .vt-pill.btn { cursor: pointer; }

  .vt-hero { text-align: center; margin: 0.5rem 0 1.6rem; }
  .vt-hero h1 { margin: 0 0 0.3rem; font-size: 2rem; }
  .vt-hero p { margin: 0; opacity: 0.7; font-size: 0.95rem; }

  .vt-levels { display: grid; gap: 0.9rem; }
  .vt-level {
    display: flex; align-items: center; gap: 1rem; width: 100%;
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 1rem 1.2rem; color: inherit;
    cursor: pointer; transition: transform 0.12s, border-color 0.12s;
  }
  .vt-level:hover:not(:disabled) { transform: translateY(-2px);
                                   border-color: var(--lc, var(--acc)); }
  .vt-level .em { font-size: 2rem; }
  .vt-level .body { flex: 1; min-width: 0; }
  .vt-level .name { font-weight: 700; font-size: 1.1rem; }
  .vt-level .meta { font-size: 0.8rem; opacity: 0.6; margin-top: 0.2rem; }
  .vt-level .side { text-align: right; font-size: 0.95rem; white-space: nowrap; }
  .vt-level .stars { color: #facc15; font-weight: 700; letter-spacing: 0.1em; }

  /* review deck (learn the words before playing) */
  .vt-review { max-width: 560px; margin: 0 auto; text-align: center; }
  .vt-review h2 { margin: 0.4rem 0 0.2rem; }
  .vt-review .sub { opacity: 0.7; font-size: 0.92rem; margin-bottom: 1.1rem; }
  .vt-card {
    background: var(--card); border: 1px solid var(--lc, var(--acc));
    border-radius: 16px; padding: 1.4rem 1.3rem; text-align: left;
    min-height: 200px;
  }
  .vt-card .w { font-size: 1.7rem; font-weight: 800; color: var(--lc, var(--acc)); }
  .vt-card .m { font-size: 1.05rem; line-height: 1.55; margin-top: 0.4rem; }
  .vt-card .ex { font-style: italic; opacity: 0.78; margin-top: 0.6rem;
                 line-height: 1.5; }
  .vt-card .extra { font-size: 0.85rem; opacity: 0.7; margin-top: 0.5rem; }
  .vt-card .say {
    background: none; border: 1px solid var(--line); color: inherit;
    border-radius: 999px; padding: 0.15rem 0.6rem; font-size: 0.8rem;
    cursor: pointer; margin-left: 0.5rem; vertical-align: middle;
  }
  .vt-dots { margin: 0.9rem 0 0.3rem; letter-spacing: 0.35em; font-size: 0.8rem; }
  .vt-dots .on { color: var(--lc, var(--acc)); }
  .vt-dots .off { opacity: 0.3; }

  /* play screen */
  .vt-playwrap { display: flex; justify-content: center; gap: 1rem;
                 align-items: flex-start; flex-wrap: wrap; }
  .vt-cwrap { position: relative; }
  #vt-canvas {
    border: 1px solid var(--line); border-radius: 10px;
    background: #28262f; touch-action: none; max-width: 100%;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .vt-quiz {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(20,19,24,0.78);
    border-radius: 10px; padding: 0.8rem;
  }
  .vt-quizcard {
    background: #26252c; border: 1px solid var(--acc); border-radius: 14px;
    padding: 1rem 1.1rem; width: 100%; max-width: 340px; text-align: center;
  }
  .vt-quizcard .lbl { font-size: 0.72rem; letter-spacing: 0.08em;
                      text-transform: uppercase; opacity: 0.6; }
  .vt-quizcard .mean { font-size: 1rem; font-weight: 600; line-height: 1.45;
                       margin: 0.35rem 0 0.8rem; }
  .vt-opt {
    display: block; width: 100%; margin-top: 0.45rem;
    background: var(--card); border: 1px solid var(--line); color: inherit;
    border-radius: 10px; padding: 0.55rem 0.8rem; font-size: 1rem;
    font-weight: 700; cursor: pointer;
  }
  .vt-opt:hover { border-color: var(--acc); }
  .vt-quizcard .fb { font-size: 0.9rem; line-height: 1.5; }
  .vt-quizcard .fb.good b { color: var(--good); }
  .vt-quizcard .fb.bad b { color: var(--bad); }
  .vt-help { text-align: center; font-size: 0.8rem; opacity: 0.55;
             margin-top: 0.5rem; width: 100%; }

  .vt-dpad {
    display: grid; grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 48px); gap: 0.4rem;
    justify-content: center; margin-top: 0.9rem; width: 100%;
  }
  .vt-dpad button {
    background: var(--card); border: 1px solid var(--line); color: inherit;
    border-radius: 10px; font-size: 1.1rem; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .vt-dpad button:active { background: rgba(255,255,255,0.14); }
  .vt-dpad .rot { grid-column: 2; grid-row: 1; }
  .vt-dpad .left { grid-column: 1; grid-row: 2; }
  .vt-dpad .down { grid-column: 2; grid-row: 2; }
  .vt-dpad .right { grid-column: 3; grid-row: 2; }

  /* end screens */
  .vt-win { text-align: center; padding: 1rem 0; }
  .vt-win .em { font-size: 3.2rem; }
  .vt-win h2 { margin: 0.4rem 0 0.2rem; }
  .vt-win .stars { font-size: 2rem; color: #facc15; letter-spacing: 0.15em; }
  .vt-win .sub { opacity: 0.7; font-size: 0.92rem; margin-top: 0.2rem; }
  .vt-recap {
    text-align: left; max-width: 520px; margin: 1.2rem auto 0;
    display: grid; gap: 0.5rem;
  }
  .vt-recap .r {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.9rem;
    line-height: 1.5;
  }
  .vt-recap .r b { color: var(--acc); }
  .vt-recap .extra { font-size: 0.82rem; opacity: 0.7; margin-top: 0.15rem; }
  .wlink { display: inline-block; margin-top: 0.4rem; font-size: 0.82rem;
           color: var(--acc); text-decoration: none; }
  .wlink:hover { text-decoration: underline; }
  .vt-actions { display: flex; justify-content: center; gap: 0.6rem;
                margin-top: 1.4rem; flex-wrap: wrap; }
  .vt-btn {
    background: var(--acc); border: none; color: #10222a; font-weight: 700;
    border-radius: 999px; padding: 0.5rem 1.3rem; font-size: 0.95rem;
    cursor: pointer;
  }
  .vt-btn:hover { opacity: 0.88; }
  .vt-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .vt-btn.ghost { background: var(--card); color: inherit;
                  border: 1px solid var(--line); }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="tetris-root"><div class="vt" id="vt"></div></div>

<script>
(function () {
  'use strict';

  /* Encrypted blob injected by Jekyll from front matter field `encrypted` */
  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};

  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const salt = blob.slice(0, 16);
    const iv = blob.slice(16, 28);
    const ct = blob.slice(28);
    const key = await deriveKey(passphrase, salt);
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return new TextDecoder().decode(plaintext);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('tetris-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }

  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }

  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse word bank.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Tetris.boot(data);
  }

  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) {
        try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {}
      }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }

  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true;
        input.disabled = true;
        try {
          const text = await decrypt(cached);
          reveal(text);
          return;
        } catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false;
          input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }

  btn.addEventListener('click', function () {
    const pw = input.value;
    if (!pw) { input.focus(); return; }
    tryUnlock(pw, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ═════════════════════════ Word Tetris ════════════════════════════════ */

  const Tetris = (function () {

    const el = document.getElementById('vt');

    const COLS = 9, ROWS = 14;

    /* Each level sets the scene (hero + canvas color) and the word load.
       `gravity` is ms per row fall at Fast; the speed setting divides it. */
    const LEVELS = [
      { name: 'Meadow Blocks',    emoji: '🌼', hero: '🐰', tier: 'intermediate', words: 6, gravity: 800, bg: '#242b21', lc: '#4ade80' },
      { name: 'Sandy Shore',      emoji: '🏖️', hero: '🦀', tier: 'intermediate', words: 6, gravity: 760, bg: '#2f2a1c', lc: '#fbbf24' },
      { name: 'Treehouse Build',  emoji: '🌳', hero: '🐿️', tier: 'intermediate', words: 6, gravity: 720, bg: '#26301f', lc: '#a3e635' },
      { name: 'River Dock',       emoji: '🏞️', hero: '🦫', tier: 'intermediate', words: 7, gravity: 690, bg: '#1a2b33', lc: '#22d3ee' },
      { name: 'Coral Tower',      emoji: '🌊', hero: '🐬', tier: 'intermediate', words: 7, gravity: 660, bg: '#16283a', lc: '#38bdf8' },
      { name: 'Beehive Stack',    emoji: '🍯', hero: '🐝', tier: 'mixed',        words: 7, gravity: 630, bg: '#332818', lc: '#facc15' },
      { name: 'Canyon Wall',      emoji: '🏜️', hero: '🦎', tier: 'mixed',        words: 7, gravity: 600, bg: '#33231a', lc: '#fb923c' },
      { name: 'Ice Castle',       emoji: '❄️', hero: '🐧', tier: 'mixed',        words: 8, gravity: 570, bg: '#1e2a36', lc: '#93c5fd' },
      { name: 'Jungle Temple',    emoji: '🌴', hero: '🐒', tier: 'mixed',        words: 8, gravity: 545, bg: '#1a2e28', lc: '#5eead4' },
      { name: 'Mushroom Grotto',  emoji: '🍄', hero: '🐌', tier: 'mixed',        words: 8, gravity: 520, bg: '#2b2233', lc: '#e879f9' },
      { name: 'Windmill Heights', emoji: '🌬️', hero: '🦉', tier: 'advanced',     words: 8, gravity: 500, bg: '#2a2f3a', lc: '#60a5fa' },
      { name: 'Bat Belfry',       emoji: '🦇', hero: '🕷️', tier: 'advanced',     words: 8, gravity: 480, bg: '#231f2b', lc: '#a78bfa' },
      { name: 'Thunder Spire',    emoji: '⛈️', hero: '🐺', tier: 'advanced',     words: 8, gravity: 460, bg: '#252a3d', lc: '#818cf8' },
      { name: 'Crystal Mine',     emoji: '💎', hero: '🦔', tier: 'advanced',     words: 9, gravity: 440, bg: '#2b2438', lc: '#c084fc' },
      { name: 'Sunken Wreck',     emoji: '🚢', hero: '🐙', tier: 'advanced',     words: 9, gravity: 420, bg: '#132433', lc: '#2dd4bf' },
      { name: 'Lava Foundry',     emoji: '🌋', hero: '🐉', tier: 'advanced',     words: 9, gravity: 400, bg: '#2e1712', lc: '#fb923c' },
      { name: 'Frozen Abyss',     emoji: '🧊', hero: '🐋', tier: 'advanced',     words: 9, gravity: 385, bg: '#152430', lc: '#38bdf8' },
      { name: 'Sky Fortress',     emoji: '☁️', hero: '🦅', tier: 'advanced',     words: 9, gravity: 370, bg: '#232b3d', lc: '#93c5fd' },
      { name: 'Comet Workshop',   emoji: '☄️', hero: '👽', tier: 'advanced',     words: 10, gravity: 355, bg: '#1c1830', lc: '#d8b4fe' },
      { name: 'Galactic Dock',    emoji: '🛸', hero: '🤖', tier: 'advanced',     words: 10, gravity: 340, bg: '#14101f', lc: '#f0abfc' }
    ];
    const TIER_LABEL = { intermediate: '🚀 Intermediate words',
                         mixed: '🚀🏆 Mixed words', advanced: '🏆 Advanced words' };

    /* Overall game-speed control (home screen). `gravity` is ms per row,
       so dividing by the multiplier keeps "higher = faster" consistent
       with the other real-time vocabulary games. */
    const SPEED_MULT = { slow: 0.32, normal: 0.65, fast: 1.15 };
    const SPEED_OPTS = [{ k: 'slow', t: '🐢 Slow' }, { k: 'normal', t: '🚶 Normal' },
                        { k: 'fast', t: '🐇 Fast' }];

    /* The seven classic pieces as rotation states of [x, y] offsets. */
    const PIECES = [
      { c: '#22d3ee', r: [ [[0,1],[1,1],[2,1],[3,1]], [[2,0],[2,1],[2,2],[2,3]] ] },                                     /* I */
      { c: '#facc15', r: [ [[1,0],[2,0],[1,1],[2,1]] ] },                                                                 /* O */
      { c: '#c084fc', r: [ [[1,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[2,1],[1,2]],
                           [[0,1],[1,1],[2,1],[1,2]], [[1,0],[0,1],[1,1],[1,2]] ] },                                      /* T */
      { c: '#4ade80', r: [ [[1,0],[2,0],[0,1],[1,1]], [[1,0],[1,1],[2,1],[2,2]] ] },                                      /* S */
      { c: '#f87171', r: [ [[0,0],[1,0],[1,1],[2,1]], [[2,0],[1,1],[2,1],[1,2]] ] },                                      /* Z */
      { c: '#fb923c', r: [ [[2,0],[0,1],[1,1],[2,1]], [[1,0],[1,1],[1,2],[2,2]],
                           [[0,1],[1,1],[2,1],[0,2]], [[0,0],[1,0],[1,1],[1,2]] ] },                                      /* L */
      { c: '#60a5fa', r: [ [[0,0],[0,1],[1,1],[2,1]], [[1,0],[2,0],[1,1],[1,2]],
                           [[0,1],[1,1],[2,1],[2,2]], [[1,0],[1,1],[0,2],[1,2]] ] }                                       /* J */
    ];
    const GARBAGE = '#6b7280';
    /* a word check opens after this many locked pieces (or any line clear) */
    const QUIZ_EVERY = 2;

    let TIERS = null;
    let S = null;

    /* ── helpers ──────────────────────────────────────────────────────── */

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    /* recap row: meaning + example + (if the word bank supplied them)
       synonyms/antonyms and a link straight back to the word's full card
       on the site's Intermediate/Advanced Word List page */
    function wordRowHtml(w) {
      let h = '<div class="r"><b>' + esc(w.w) + '</b> — ' + esc(w.mean) +
        (w.ex ? '<br><i style="opacity:0.75">“' + esc(w.ex) + '”</i>' : '');
      if (w.syn) h += '<div class="extra">Similar: ' + esc(w.syn) + '</div>';
      if (w.ant) h += '<div class="extra">Opposite: ' + esc(w.ant) + '</div>';
      if (w.url) {
        h += '<a class="wlink" href="' + esc(w.url) +
          '" target="_blank" rel="noopener">📖 Full word card ↗</a>';
      }
      return h + '</div>';
    }
    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function speak(text) {
      try {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.85;
        speechSynthesis.speak(u);
      } catch (_) {}
    }

    let AC = null;
    /* iOS/iPadOS Safari only allows audio to start (or resume) from inside
       a direct user gesture — a setInterval/rAF tick doesn't count. Call
       this from the keydown/tap handlers themselves so the AudioContext is
       already running by the time a tick later wants to play a tone. */
    function unlockAudio() {
      try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') AC.resume();
      } catch (_) {}
    }
    function tone(freq, at, dur) {
      if (!P.sound) return;
      try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        const o = AC.createOscillator(), g = AC.createGain();
        o.frequency.value = freq; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, AC.currentTime + at);
        g.gain.linearRampToValueAtTime(0.12, AC.currentTime + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + at + dur);
        o.connect(g); g.connect(AC.destination);
        o.start(AC.currentTime + at); o.stop(AC.currentTime + at + dur + 0.05);
      } catch (_) {}
    }
    function sGood() { tone(660, 0, 0.12); tone(880, 0.12, 0.2); }
    function sBad() { tone(220, 0, 0.1); tone(160, 0.1, 0.22); }
    function sLine() { tone(523, 0, 0.1); tone(784, 0.1, 0.18); }
    function sWin() { tone(523, 0, 0.14); tone(659, 0.14, 0.14); tone(784, 0.28, 0.3); }
    function sOver() { tone(300, 0, 0.15); tone(220, 0.15, 0.15); tone(140, 0.3, 0.35); }

    /* ── progress (localStorage) ──────────────────────────────────────── */

    const PKEY = 'vocab-tetris-v1';
    let P = null;
    try { P = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.stars = P.stars || {};
    P.learned = P.learned || {};
    if (P.sound === undefined) P.sound = true;
    if (!SPEED_MULT[P.speed]) P.speed = 'slow';
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }

    function tierWords(tier) {
      if (tier === 'mixed') return TIERS.intermediate.concat(TIERS.advanced);
      return TIERS[tier];
    }
    function buildPool(tier) {
      const words = shuffle(tierWords(tier));
      const fresh = [], seen = [];
      words.forEach(function (w) { (P.learned[w.w] ? seen : fresh).push(w); });
      return fresh.concat(seen);
    }

    /* ── screens ──────────────────────────────────────────────────────── */

    function home() {
      stopTimer();
      S = null;
      const learnedCount = Object.keys(P.learned).length;
      let h = '<div class="vt-hero"><h1>🧱 Word Tetris</h1>' +
        '<p>Review the level’s words, then stack falling blocks — ' +
        'word checks pop up as you build, and wrong answers raise the ' +
        'floor!</p></div>';
      if (learnedCount) {
        h += '<div style="text-align:center;margin-bottom:1.2rem">' +
          '<span class="vt-pill acc">📚 ' + learnedCount +
          ' words mastered</span></div>';
      }
      h += '<div class="vt-speedrow"><span class="lbl">Falling speed:</span>';
      SPEED_OPTS.forEach(function (o) {
        h += '<button class="vt-spd' + (P.speed === o.k ? ' on' : '') +
          '" data-spd="' + o.k + '">' + o.t + '</button>';
      });
      h += '</div>';
      h += '<div class="vt-levels">';
      LEVELS.forEach(function (lv, i) {
        const st = P.stars[i] || 0;
        h += '<button class="vt-level" data-l="' + i + '" style="--lc:' +
          lv.lc + '">' +
          '<span class="em">' + lv.emoji + lv.hero + '</span>' +
          '<span class="body"><span class="name">Level ' + (i + 1) + ' — ' +
          esc(lv.name) + '</span>' +
          '<span class="meta" style="display:block">' + lv.words +
          ' words to master · ' + TIER_LABEL[lv.tier] + '</span></span>' +
          '<span class="side"><span class="stars">' +
          '★★★'.slice(0, st) + '<span style="opacity:0.25">' +
          '★★★'.slice(0, 3 - st) + '</span></span></span></button>';
      });
      h += '</div>';
      el.innerHTML = h;
      el.querySelectorAll('.vt-level').forEach(function (b) {
        b.addEventListener('click', function () { start(+b.dataset.l); });
      });
      el.querySelectorAll('.vt-spd').forEach(function (b) {
        b.addEventListener('click', function () {
          P.speed = b.dataset.spd; save(); home();
        });
      });
    }

    /* ── review deck: learn the words BEFORE the blocks fall ──────────── */

    function start(li) {
      stopTimer();
      const lv = LEVELS[li];
      const set = buildPool(lv.tier).slice(0, lv.words);
      S = { li: li, level: lv, set: set, phase: 'review',
            card: 0, seen: 1 };
      reviewScreen();
    }

    function reviewScreen() {
      const lv = S.level;
      const w = S.set[S.card];
      const last = S.card === S.set.length - 1;
      const allSeen = S.seen >= S.set.length;
      let h = '<div class="vt-top">' +
        '<button class="vt-back" id="vt-quit">← All levels</button>' +
        '<span class="vt-crumb">' + lv.emoji + ' Level ' + (S.li + 1) +
        ' — ' + esc(lv.name) + '</span></div>' +
        '<div class="vt-review" style="--lc:' + lv.lc + '">' +
        '<h2>📖 Learn your ' + S.set.length + ' words</h2>' +
        '<div class="sub">Read every card — then the blocks start falling. ' +
        'These are the words the game will ask about.</div>' +
        '<div class="vt-card"><span class="w">' + esc(w.w) + '</span>' +
        '<button class="say" id="vt-say">🔊 Hear it</button>' +
        '<div class="m">' + esc(w.mean) + '</div>' +
        (w.ex ? '<div class="ex">“' + esc(w.ex) + '”</div>' : '') +
        (w.syn ? '<div class="extra">Similar: ' + esc(w.syn) + '</div>' : '') +
        (w.ant ? '<div class="extra">Opposite: ' + esc(w.ant) + '</div>' : '') +
        (w.url ? '<a class="wlink" href="' + esc(w.url) +
          '" target="_blank" rel="noopener">📖 Full word card ↗</a>' : '') +
        '</div><div class="vt-dots">';
      S.set.forEach(function (_, i) {
        h += '<span class="' + (i <= S.card ? 'on' : 'off') + '">●</span>';
      });
      h += '</div><div class="vt-actions">' +
        '<button class="vt-btn ghost" id="vt-prev"' +
        (S.card === 0 ? ' disabled' : '') + '>← Back</button>' +
        (last
          ? '<button class="vt-btn" id="vt-go"' + (allSeen ? '' : ' disabled') +
            '>▶ Start the blocks!</button>'
          : '<button class="vt-btn" id="vt-nextc">Next word →</button>') +
        '</div><div class="vt-help">Card ' + (S.card + 1) + ' of ' +
        S.set.length + '</div></div>';
      el.innerHTML = h;
      document.getElementById('vt-quit').addEventListener('click', home);
      document.getElementById('vt-say').addEventListener('click', function () {
        speak(w.w + '. ' + w.mean);
      });
      document.getElementById('vt-prev').addEventListener('click', function () {
        if (S.card > 0) { S.card--; reviewScreen(); }
      });
      if (last) {
        document.getElementById('vt-go').addEventListener('click', play);
      } else {
        document.getElementById('vt-nextc').addEventListener('click', function () {
          S.card++;
          S.seen = Math.max(S.seen, S.card + 1);
          reviewScreen();
        });
      }
    }

    /* ── play ─────────────────────────────────────────────────────────── */

    function play() {
      const lv = S.level;
      S.phase = 'play';
      S.board = [];
      for (let y = 0; y < ROWS; y++) S.board.push(new Array(COLS).fill(null));
      S.piece = null;
      S.queue = shuffle(S.set.slice());
      S.review = [];
      S.done = [];
      S.right = 0; S.wrong = 0;
      S.locks = 0; S.lines = 0;
      S.quiz = null; S.paused = false; S.over = false; S.started = false;
      S.tickMs = Math.round(lv.gravity / SPEED_MULT[P.speed]);
      S.cell = Math.floor(Math.min(360, (el.clientWidth || 360) - 20) / COLS);

      el.innerHTML =
        '<div class="vt-top">' +
        '<button class="vt-back" id="vt-quit">← All levels</button>' +
        '<span class="vt-crumb">' + lv.emoji + ' Level ' + (S.li + 1) + ' — ' +
        esc(lv.name) + '</span><span class="vt-spacer"></span>' +
        '<span class="vt-pill acc" id="vt-words">📚 0/' + S.set.length + '</span>' +
        '<span class="vt-pill" id="vt-lines">🧱 0 lines</span>' +
        '<span class="vt-pill btn" id="vt-pause">⏸️</span>' +
        '<span class="vt-pill btn" id="vt-sound">' +
        (P.sound ? '🔊' : '🔇') + '</span></div>' +
        '<div class="vt-playwrap">' +
        '<div class="vt-cwrap"><canvas id="vt-canvas"></canvas></div>' +
        '<div class="vt-help">◀ ▶ move · ▼ down · ▲ rotate · space = drop · ' +
        'answer the word checks to win!</div>' +
        '<div class="vt-dpad">' +
        '<button class="rot" data-d="rot" aria-label="Rotate">🔄</button>' +
        '<button class="left" data-d="left" aria-label="Left">◀</button>' +
        '<button class="down" data-d="down" aria-label="Down">▼</button>' +
        '<button class="right" data-d="right" aria-label="Right">▶</button>' +
        '</div></div>';

      document.getElementById('vt-quit').addEventListener('click', home);
      document.getElementById('vt-sound').addEventListener('click', function () {
        P.sound = !P.sound; save();
        this.textContent = P.sound ? '🔊' : '🔇';
      });
      document.getElementById('vt-pause').addEventListener('click', togglePause);
      el.querySelectorAll('.vt-dpad button').forEach(function (b) {
        b.addEventListener('click', function () { input2(b.dataset.d); });
      });

      const cv = document.getElementById('vt-canvas');
      cv.style.background = lv.bg;
      cv.width = S.cell * COLS;
      cv.height = S.cell * ROWS;

      /* touch: swipe left/right = move, swipe down = soft drop, tap = rotate */
      let t0 = null;
      cv.addEventListener('touchstart', function (e) {
        t0 = [e.touches[0].clientX, e.touches[0].clientY];
      }, { passive: true });
      cv.addEventListener('touchend', function (e) {
        if (!t0) return;
        const dx = e.changedTouches[0].clientX - t0[0];
        const dy = e.changedTouches[0].clientY - t0[1];
        t0 = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) { input2('rot'); return; }
        if (Math.abs(dx) > Math.abs(dy)) input2(dx > 0 ? 'right' : 'left');
        else if (dy > 0) input2('down');
        else input2('rot');
      }, { passive: true });

      spawn();
      draw();
      startTimer();
    }

    function togglePause() {
      if (!S || S.phase !== 'play' || S.over || S.quiz) return;
      S.paused = !S.paused;
      draw();
    }

    let timer = null;
    function startTimer() {
      stopTimer();
      timer = setInterval(tick, S.tickMs);
    }
    function stopTimer() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    /* ── piece mechanics ─────────────────────────────────────────────── */

    function cells(piece, rot, px, py) {
      const shape = piece.def.r[rot % piece.def.r.length];
      return shape.map(function (c) { return [px + c[0], py + c[1]]; });
    }

    function fits(piece, rot, px, py) {
      return cells(piece, rot, px, py).every(function (c) {
        const x = c[0], y = c[1];
        if (x < 0 || x >= COLS || y >= ROWS) return false;
        if (y < 0) return true;
        return !S.board[y][x];
      });
    }

    function spawn() {
      const def = PIECES[Math.floor(Math.random() * PIECES.length)];
      const p = { def: def, rot: 0, x: Math.floor((COLS - 4) / 2), y: -1 };
      if (!fits(p, p.rot, p.x, p.y)) { gameOver(); return; }
      S.piece = p;
    }

    function input2(d) {
      if (!S || S.phase !== 'play' || S.over || S.quiz || S.paused) return;
      unlockAudio();
      if (!S.started) { S.started = true; draw(); }
      const p = S.piece;
      if (!p) return;
      if (d === 'left' && fits(p, p.rot, p.x - 1, p.y)) p.x--;
      else if (d === 'right' && fits(p, p.rot, p.x + 1, p.y)) p.x++;
      else if (d === 'down') { if (fits(p, p.rot, p.x, p.y + 1)) p.y++; else lock(); }
      else if (d === 'drop') { while (fits(p, p.rot, p.x, p.y + 1)) p.y++; lock(); }
      else if (d === 'rot') {
        const nr = p.rot + 1;
        /* simple wall kicks: in place, then one/two cells sideways */
        const kicks = [0, -1, 1, -2, 2];
        for (let i = 0; i < kicks.length; i++) {
          if (fits(p, nr, p.x + kicks[i], p.y)) {
            p.rot = nr; p.x += kicks[i]; break;
          }
        }
      }
      draw();
    }

    document.addEventListener('keydown', function (e) {
      if (!S || S.phase !== 'play' || S.over) return;
      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        e.preventDefault(); togglePause(); return;
      }
      if (S.quiz) return;
      const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down',
                    ArrowUp: 'rot', ' ': 'drop', a: 'left', d: 'right',
                    s: 'down', w: 'rot', A: 'left', D: 'right', S: 'down',
                    W: 'rot' };
      const d = map[e.key];
      if (!d) return;
      e.preventDefault();
      input2(d);
    });

    function tick() {
      if (!S || S.phase !== 'play' || S.over || S.paused || S.quiz || !S.started) return;
      const p = S.piece;
      if (!p) return;
      if (fits(p, p.rot, p.x, p.y + 1)) p.y++;
      else lock();
      draw();
    }

    function lock() {
      const p = S.piece;
      let topped = false;
      cells(p, p.rot, p.x, p.y).forEach(function (c) {
        if (c[1] < 0) { topped = true; return; }
        S.board[c[1]][c[0]] = p.def.c;
      });
      S.piece = null;
      if (topped) { gameOver(); return; }

      /* clear full lines */
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (S.board[y].every(function (c) { return c; })) {
          S.board.splice(y, 1);
          S.board.unshift(new Array(COLS).fill(null));
          cleared++;
          y++;
        }
      }
      if (cleared) {
        S.lines += cleared;
        sLine();
        const lp = document.getElementById('vt-lines');
        if (lp) lp.textContent = '🧱 ' + S.lines + (S.lines === 1 ? ' line' : ' lines');
      }

      S.locks++;
      if (cleared || S.locks >= QUIZ_EVERY) {
        S.locks = 0;
        openQuiz();
        return;
      }
      spawn();
    }

    /* ── word checks ──────────────────────────────────────────────────── */

    function nextWord() {
      if (S.queue.length) return S.queue.shift();
      return S.review.shift() || null;
    }

    function openQuiz() {
      const word = nextWord();
      if (!word) { spawn(); return; }
      const others = shuffle(S.set.filter(function (w) { return w.w !== word.w; }))
        .slice(0, 2);
      S.quiz = { word: word, opts: shuffle([word].concat(others)), answered: false };
      renderQuiz();
    }

    function renderQuiz() {
      const q = S.quiz;
      let box = document.getElementById('vt-quiz');
      if (!box) {
        box = document.createElement('div');
        box.id = 'vt-quiz';
        box.className = 'vt-quiz';
        document.querySelector('.vt-cwrap').appendChild(box);
      }
      let h = '<div class="vt-quizcard"><div class="lbl">🧠 Word check!</div>' +
        '<div class="mean">Which word means:<br>“' + esc(q.word.mean) + '”</div>';
      q.opts.forEach(function (w, i) {
        h += '<button class="vt-opt" data-i="' + i + '">' + esc(w.w) + '</button>';
      });
      h += '</div>';
      box.innerHTML = h;
      box.querySelectorAll('.vt-opt').forEach(function (b) {
        b.addEventListener('click', function () { answer(+b.dataset.i); });
      });
    }

    function answer(i) {
      const q = S.quiz;
      if (!q || q.answered) return;
      q.answered = true;
      unlockAudio();
      const picked = q.opts[i];
      const word = q.word;
      const box = document.getElementById('vt-quiz');
      const card = box.querySelector('.vt-quizcard');
      /* the game stays frozen while the feedback is up — give the example
         sentence enough time to actually be read */
      let pauseMs;
      if (picked.w === word.w) {
        sGood();
        S.right++;
        S.done.push(word);
        P.learned[word.w] = 1; save();
        document.getElementById('vt-words').textContent =
          '📚 ' + S.done.length + '/' + S.set.length;
        card.innerHTML = '<div class="fb good">✅ <b>' + esc(word.w) +
          '</b> — ' + esc(word.mean) +
          (word.ex ? '<br><i>“' + esc(word.ex) + '”</i>' : '') + '</div>';
        pauseMs = 1800;
        if (!S.queue.length && !S.review.length) {
          setTimeout(win, 1400);
          return;
        }
      } else {
        sBad();
        S.wrong++;
        S.review.push(word);
        card.innerHTML = '<div class="fb bad">❌ That’s <b>' +
          esc(picked.w) + '</b> — ' + esc(picked.mean) +
          '<br>The answer was: <b>' + esc(word.w) + '</b>' +
          (word.ex ? '<br><i>“' + esc(word.ex) + '”</i>' : '') +
          '<br>⬆️ The floor rises one row!</div>';
        pauseMs = 2600;
      }
      setTimeout(function () {
        if (!S || S.over || S.phase !== 'play') return;
        S.quiz = null;
        const b = document.getElementById('vt-quiz');
        if (b) b.remove();
        if (picked.w !== word.w && addGarbage()) return;
        spawn();
        draw();
      }, pauseMs);
    }

    /* returns true if the rising floor ended the game */
    function addGarbage() {
      if (S.board[0].some(function (c) { return c; })) { gameOver(); return true; }
      S.board.shift();
      const row = new Array(COLS).fill(GARBAGE);
      row[Math.floor(Math.random() * COLS)] = null;
      S.board.push(row);
      return false;
    }

    /* ── drawing ──────────────────────────────────────────────────────── */

    function draw() {
      if (!S || S.phase !== 'play') return;
      const cv = document.getElementById('vt-canvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const c = S.cell;
      ctx.fillStyle = S.level.bg;
      ctx.fillRect(0, 0, cv.width, cv.height);

      /* faint grid */
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let x = 1; x < COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * c, 0); ctx.lineTo(x * c, cv.height); ctx.stroke();
      }
      for (let y = 1; y < ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * c); ctx.lineTo(cv.width, y * c); ctx.stroke();
      }

      /* settled blocks */
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (S.board[y][x]) block(ctx, x, y, S.board[y][x], c);
        }
      }
      /* active piece */
      if (S.piece) {
        cells(S.piece, S.piece.rot, S.piece.x, S.piece.y).forEach(function (cc) {
          if (cc[1] >= 0) block(ctx, cc[0], cc[1], S.piece.def.c, c);
        });
      }
      /* the level's hero watches from the top corner */
      ctx.font = Math.floor(c * 0.8) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText(S.level.hero, cv.width - 4, 4);

      if (!S.started) {
        ctx.fillStyle = 'rgba(20,19,24,0.55)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#f3f1f5';
        ctx.font = '700 16px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Press an arrow key', cv.width / 2, cv.height / 2 - 12);
        ctx.fillText('to start', cv.width / 2, cv.height / 2 + 14);
      } else if (S.paused) {
        ctx.fillStyle = 'rgba(20,19,24,0.55)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#f3f1f5';
        ctx.font = '700 22px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('⏸️ Paused', cv.width / 2, cv.height / 2);
      }
    }

    function block(ctx, x, y, color, c) {
      const pad = Math.max(1, c * 0.06);
      ctx.fillStyle = color;
      roundRect(ctx, x * c + pad, y * c + pad, c - pad * 2, c - pad * 2, c * 0.2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      roundRect(ctx, x * c + pad, y * c + pad, c - pad * 2, (c - pad * 2) * 0.4, c * 0.2);
      ctx.fill();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    /* ── end states ───────────────────────────────────────────────────── */

    function gameOver() {
      if (!S || S.over) return;
      S.over = true;
      stopTimer();
      sOver();
      const li = S.li;
      const done = S.done, total = S.set.length;
      const b = document.getElementById('vt-quiz');
      if (b) b.remove();
      S = null;

      let h = '<div class="vt-win"><div class="em">💥🧱</div>' +
        '<h2>The tower toppled!</h2>' +
        '<div class="sub">' + done.length + ' of ' + total +
        ' words mastered before the blocks reached the top</div>' +
        '<div class="vt-recap">';
      done.forEach(function (w) { h += wordRowHtml(w); });
      h += '</div><div class="vt-actions">' +
        '<button class="vt-btn" id="vt-again">↻ Try again</button>' +
        '<button class="vt-btn ghost" id="vt-home">All levels</button>' +
        '</div></div>';
      el.innerHTML = h;
      document.getElementById('vt-again').addEventListener('click', function () { start(li); });
      document.getElementById('vt-home').addEventListener('click', home);
    }

    function win() {
      if (!S || S.over) return;
      S.over = true;
      stopTimer();
      sWin();
      const acc = S.right / Math.max(1, S.right + S.wrong);
      const stars = acc >= 0.85 ? 3 : acc >= 0.6 ? 2 : 1;
      if ((P.stars[S.li] || 0) < stars) P.stars[S.li] = stars;
      save();

      const lv = S.level;
      const li = S.li;
      const done = S.done;
      const lines = S.lines;
      const hasNext = li + 1 < LEVELS.length;
      const b = document.getElementById('vt-quiz');
      if (b) b.remove();
      S = null;

      let h = '<div class="vt-win"><div class="em">' + lv.emoji + '🎉</div>' +
        '<h2>Level cleared!</h2>' +
        '<div class="stars">' + '★★★'.slice(0, stars) +
        '<span style="opacity:0.25">' + '★★★'.slice(0, 3 - stars) +
        '</span></div>' +
        '<div class="sub">' + done.length +
        (done.length === 1 ? ' word' : ' words') + ' mastered · ' +
        lines + (lines === 1 ? ' line' : ' lines') + ' cleared</div>' +
        '<div class="vt-recap">';
      done.forEach(function (w) { h += wordRowHtml(w); });
      h += '</div><div class="vt-actions">' +
        '<button class="vt-btn ghost" id="vt-again">↻ Play again</button>' +
        (hasNext ? '<button class="vt-btn" id="vt-next">Next level →</button>' : '') +
        '<button class="vt-btn ghost" id="vt-home">All levels</button>' +
        '</div></div>';
      el.innerHTML = h;
      document.getElementById('vt-again').addEventListener('click', function () { start(li); });
      if (hasNext) {
        document.getElementById('vt-next').addEventListener('click', function () { start(li + 1); });
      }
      document.getElementById('vt-home').addEventListener('click', home);
    }

    /* ── boot ─────────────────────────────────────────────────────────── */

    function boot(data) {
      TIERS = data.tiers;
      home();
    }

    return { boot: boot };
  })();

  init();
})();
</script>
