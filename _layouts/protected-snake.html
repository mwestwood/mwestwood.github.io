---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 40vh;
    padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px;
    padding: 2.5rem 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── Word Snake ──────────────────────────────────────────────────────── */
  #snake-root { display: none; }

  .vs { --acc: #4ade80; --good: #4ade80; --bad: #f87171;
        --card: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.12);
        max-width: 780px; }
  .vs, .vs * { box-sizing: border-box; }
  .vs button { font-family: inherit; }

  .vs-top {
    display: flex; align-items: center; gap: 0.6rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .vs-back {
    background: var(--card); border: 1px solid var(--line);
    color: inherit; border-radius: 999px; padding: 0.3rem 0.85rem;
    font-size: 0.85rem; cursor: pointer;
  }
  .vs-back:hover { border-color: var(--acc); }
  .vs-crumb { font-weight: 700; font-size: 1.05rem; }
  .vs-spacer { flex: 1; }
  .vs-pill {
    font-size: 0.8rem; padding: 0.25rem 0.7rem; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); white-space: nowrap;
  }
  .vs-pill.acc { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .vs-pill.hearts { color: #f87171; border-color: rgba(248,113,113,0.4); }
  .vs-pill.btn { cursor: pointer; }

  .vs-hero { text-align: center; margin: 0.5rem 0 1.6rem; }
  .vs-hero h1 { margin: 0 0 0.3rem; font-size: 2rem; }
  .vs-hero p { margin: 0; opacity: 0.7; font-size: 0.95rem; }

  .vs-levels { display: grid; gap: 0.9rem; }
  .vs-level {
    display: flex; align-items: center; gap: 1rem; width: 100%;
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 1rem 1.2rem; color: inherit;
    cursor: pointer; transition: transform 0.12s, border-color 0.12s;
  }
  .vs-level:hover:not(:disabled) { transform: translateY(-2px);
                                   border-color: var(--lc, var(--acc)); }
  .vs-level:disabled { cursor: not-allowed; opacity: 0.45; }
  .vs-level .em { font-size: 2rem; }
  .vs-level .body { flex: 1; min-width: 0; }
  .vs-level .name { font-weight: 700; font-size: 1.1rem; }
  .vs-level .meta { font-size: 0.8rem; opacity: 0.6; margin-top: 0.2rem; }
  .vs-level .side { text-align: right; font-size: 0.95rem; white-space: nowrap; }
  .vs-level .stars { color: #facc15; font-weight: 700; letter-spacing: 0.1em; }

  /* play screen */
  .vs-prompt { text-align: center; margin: 0 0 0.7rem; min-height: 2.6em; }
  .vs-prompt .lbl { font-size: 0.75rem; letter-spacing: 0.08em;
                    text-transform: uppercase; opacity: 0.55; }
  .vs-prompt .mean { font-size: 1.1rem; font-weight: 600; line-height: 1.4;
                      max-width: 560px; margin: 0.15rem auto 0; }
  .vs-cwrap { display: flex; justify-content: center; position: relative; }
  #vs-canvas {
    border: 1px solid var(--line); border-radius: 10px;
    background: #28262f; touch-action: none; max-width: 100%;
  }
  .vs-toast {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #26252c; border: 1px solid var(--line); border-radius: 12px;
    padding: 0.8rem 1.1rem; max-width: 90%; text-align: center;
    font-size: 0.92rem; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .vs-toast.good { border-color: var(--good); }
  .vs-toast.bad { border-color: var(--bad); }
  .vs-toast b { font-size: 1.05rem; }
  .vs-help { text-align: center; font-size: 0.8rem; opacity: 0.55;
             margin-top: 0.5rem; }

  .vs-dpad {
    display: grid; grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 48px); gap: 0.4rem;
    justify-content: center; margin-top: 0.9rem;
  }
  .vs-dpad button {
    background: var(--card); border: 1px solid var(--line); color: inherit;
    border-radius: 10px; font-size: 1.1rem; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .vs-dpad button:active { background: rgba(255,255,255,0.14); }
  .vs-dpad .up { grid-column: 2; grid-row: 1; }
  .vs-dpad .left { grid-column: 1; grid-row: 2; }
  .vs-dpad .down { grid-column: 2; grid-row: 2; }
  .vs-dpad .right { grid-column: 3; grid-row: 2; }

  /* end screens */
  .vs-win { text-align: center; padding: 1rem 0; }
  .vs-win .em { font-size: 3.2rem; }
  .vs-win h2 { margin: 0.4rem 0 0.2rem; }
  .vs-win .stars { font-size: 2rem; color: #facc15; letter-spacing: 0.15em; }
  .vs-win .sub { opacity: 0.7; font-size: 0.92rem; margin-top: 0.2rem; }
  .vs-recap {
    text-align: left; max-width: 520px; margin: 1.2rem auto 0;
    display: grid; gap: 0.5rem;
  }
  .vs-recap .r {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.9rem;
    line-height: 1.5;
  }
  .vs-recap .r b { color: var(--acc); }
  .vs-actions { display: flex; justify-content: center; gap: 0.6rem;
                margin-top: 1.4rem; flex-wrap: wrap; }
  .vs-btn {
    background: var(--acc); border: none; color: #14141a; font-weight: 700;
    border-radius: 999px; padding: 0.5rem 1.3rem; font-size: 0.95rem;
    cursor: pointer;
  }
  .vs-btn:hover { opacity: 0.88; }
  .vs-btn.ghost { background: var(--card); color: inherit;
                  border: 1px solid var(--line); }

  .vs-pausewrap {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(20,19,24,0.55);
    border-radius: 10px; font-size: 1.3rem; font-weight: 700;
  }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="snake-root"><div class="vs" id="vs"></div></div>

<script>
(function () {
  'use strict';

  /* Encrypted blob injected by Jekyll from front matter field `encrypted` */
  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};

  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const salt = blob.slice(0, 16);
    const iv = blob.slice(16, 28);
    const ct = blob.slice(28);
    const key = await deriveKey(passphrase, salt);
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return new TextDecoder().decode(plaintext);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('snake-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }

  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }

  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse word bank.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Snake.boot(data);
  }

  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) {
        try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {}
      }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }

  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true;
        input.disabled = true;
        try {
          const text = await decrypt(cached);
          reveal(text);
          return;
        } catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false;
          input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }

  btn.addEventListener('click', function () {
    const pw = input.value;
    if (!pw) { input.focus(); return; }
    tryUnlock(pw, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ══════════════════════════ Word Snake ════════════════════════════════ */

  const Snake = (function () {

    const el = document.getElementById('vs');

    const LEVELS = [
      { name: 'Sprout',       emoji: '🌱', tier: 'intermediate', cols: 6, rows: 7, speed: 620, target: 8,  lc: '#4ade80' },
      { name: 'Sapling',      emoji: '🌿', tier: 'intermediate', cols: 7, rows: 7, speed: 540, target: 10, lc: '#34d399' },
      { name: 'Bramble',      emoji: '🌳', tier: 'mixed',        cols: 7, rows: 8, speed: 480, target: 11, lc: '#38bdf8' },
      { name: 'Thicket',      emoji: '🌲', tier: 'advanced',     cols: 8, rows: 8, speed: 420, target: 12, lc: '#fbbf24' },
      { name: 'Ancient Grove',emoji: '🌴', tier: 'advanced',     cols: 8, rows: 9, speed: 360, target: 14, lc: '#a78bfa' }
    ];
    const TIER_LABEL = { intermediate: '🚀 Intermediate words',
                         mixed: '🚀🏆 Mixed words', advanced: '🏆 Advanced words' };
    const START_LIVES = 3;

    let TIERS = null;
    let S = null;

    /* ── helpers ──────────────────────────────────────────────────────── */

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
    function speak(text) {
      try {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.rate = 0.85;
        speechSynthesis.speak(u);
      } catch (_) {}
    }

    let AC = null;
    function tone(freq, at, dur) {
      if (!P.sound) return;
      try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        const o = AC.createOscillator(), g = AC.createGain();
        o.frequency.value = freq; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, AC.currentTime + at);
        g.gain.linearRampToValueAtTime(0.12, AC.currentTime + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + at + dur);
        o.connect(g); g.connect(AC.destination);
        o.start(AC.currentTime + at); o.stop(AC.currentTime + at + dur + 0.05);
      } catch (_) {}
    }
    function sGood() { tone(660, 0, 0.12); tone(880, 0.12, 0.2); }
    function sBad() { tone(220, 0, 0.1); tone(160, 0.1, 0.22); }
    function sWin() { tone(523, 0, 0.14); tone(659, 0.14, 0.14); tone(784, 0.28, 0.3); }
    function sOver() { tone(300, 0, 0.15); tone(220, 0.15, 0.15); tone(140, 0.3, 0.35); }

    /* ── progress (localStorage) ──────────────────────────────────────── */

    const PKEY = 'vocab-snake-v1';
    let P = null;
    try { P = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.stars = P.stars || {};
    P.learned = P.learned || {};
    if (P.sound === undefined) P.sound = true;
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }
    function unlocked(i) { return i === 0 || (P.stars[i - 1] || 0) > 0; }

    function tierWords(tier) {
      if (tier === 'mixed') return TIERS.intermediate.concat(TIERS.advanced);
      return TIERS[tier];
    }
    function buildPool(tier) {
      const words = shuffle(tierWords(tier));
      const fresh = [], seen = [];
      words.forEach(function (w) { (P.learned[w.w] ? seen : fresh).push(w); });
      return fresh.concat(seen);
    }

    /* ── screens ──────────────────────────────────────────────────────── */

    function home() {
      stopTimer();
      S = null;
      const learnedCount = Object.keys(P.learned).length;
      let h = '<div class="vs-hero"><h1>🐍 Word Snake</h1>' +
        '<p>Steer with the arrow keys and eat the word that matches the ' +
        'meaning — but watch your tail!</p></div>';
      if (learnedCount) {
        h += '<div style="text-align:center;margin-bottom:1.2rem">' +
          '<span class="vs-pill acc">📚 ' + learnedCount +
          ' words mastered</span></div>';
      }
      h += '<div class="vs-levels">';
      LEVELS.forEach(function (lv, i) {
        const st = P.stars[i] || 0;
        const open = unlocked(i);
        h += '<button class="vs-level" data-l="' + i + '" style="--lc:' +
          lv.lc + '"' + (open ? '' : ' disabled') + '>' +
          '<span class="em">' + (open ? lv.emoji : '🔒') + '</span>' +
          '<span class="body"><span class="name">Level ' + (i + 1) + ' — ' +
          esc(lv.name) + '</span>' +
          '<span class="meta" style="display:block">' + lv.target +
          ' correct words to win · ' + TIER_LABEL[lv.tier] + '</span></span>' +
          '<span class="side"><span class="stars">' +
          '★★★'.slice(0, st) + '<span style="opacity:0.25">' +
          '★★★'.slice(0, 3 - st) + '</span></span></span></button>';
      });
      h += '</div>';
      el.innerHTML = h;
      el.querySelectorAll('.vs-level').forEach(function (b) {
        b.addEventListener('click', function () { start(+b.dataset.l); });
      });
    }

    function start(li) {
      const lv = LEVELS[li];
      const cell = Math.floor(Math.min(560, (el.clientWidth || 560)) / lv.cols);
      S = {
        li: li, level: lv, cols: lv.cols, rows: lv.rows, cell: cell,
        snake: [[Math.floor(lv.cols / 2), Math.floor(lv.rows / 2)]],
        dir: 'right', nextDir: 'right',
        pellets: [], target: null,
        caught: 0, lives: START_LIVES, misses: 0,
        pool: buildPool(lv.tier), review: [],
        used: [], toast: null, paused: false, over: false, started: false
      };

      el.innerHTML =
        '<div class="vs-top">' +
        '<button class="vs-back" id="vs-quit">← All levels</button>' +
        '<span class="vs-crumb">' + lv.emoji + ' Level ' + (li + 1) + ' — ' +
        esc(lv.name) + '</span><span class="vs-spacer"></span>' +
        '<span class="vs-pill acc" id="vs-score">🍎 0/' + lv.target + '</span>' +
        '<span class="vs-pill hearts" id="vs-lives">' +
        '❤️'.repeat(START_LIVES) + '</span>' +
        '<span class="vs-pill btn" id="vs-pause">⏸️</span>' +
        '<span class="vs-pill btn" id="vs-sound">' +
        (P.sound ? '🔊' : '🔇') + '</span></div>' +
        '<div class="vs-prompt"><div class="lbl">Find the word that means…</div>' +
        '<div class="mean" id="vs-mean">—</div></div>' +
        '<div class="vs-cwrap"><canvas id="vs-canvas"></canvas></div>' +
        '<div class="vs-help">Arrow keys / WASD to steer · avoid your own tail</div>' +
        '<div class="vs-dpad">' +
        '<button class="up" data-d="up" aria-label="Up">▲</button>' +
        '<button class="left" data-d="left" aria-label="Left">◀</button>' +
        '<button class="down" data-d="down" aria-label="Down">▼</button>' +
        '<button class="right" data-d="right" aria-label="Right">▶</button>' +
        '</div>';

      document.getElementById('vs-quit').addEventListener('click', home);
      document.getElementById('vs-sound').addEventListener('click', function () {
        P.sound = !P.sound; save();
        this.textContent = P.sound ? '🔊' : '🔇';
      });
      document.getElementById('vs-pause').addEventListener('click', togglePause);
      el.querySelectorAll('.vs-dpad button').forEach(function (b) {
        b.addEventListener('click', function () { queueDir(b.dataset.d); });
      });

      const cv = document.getElementById('vs-canvas');
      cv.width = S.cell * S.cols;
      cv.height = S.cell * S.rows;

      let t0 = null;
      cv.addEventListener('touchstart', function (e) {
        t0 = [e.touches[0].clientX, e.touches[0].clientY];
      }, { passive: true });
      cv.addEventListener('touchend', function (e) {
        if (!t0) return;
        const dx = e.changedTouches[0].clientX - t0[0];
        const dy = e.changedTouches[0].clientY - t0[1];
        t0 = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 'right' : 'left');
        else queueDir(dy > 0 ? 'down' : 'up');
      }, { passive: true });

      nextRound();
      draw();
      startTimer();
    }

    function togglePause() {
      if (!S || S.over) return;
      S.paused = !S.paused;
      draw();
    }

    let timer = null;
    function startTimer() {
      stopTimer();
      timer = setInterval(tick, S.level.speed);
    }
    function stopTimer() {
      if (timer) { clearInterval(timer); timer = null; }
    }

    function queueDir(d) {
      if (!S || S.over) return;
      const opp = { up: 'down', down: 'up', left: 'right', right: 'left' };
      if (S.snake.length > 1 && opp[d] === S.dir) return;
      S.nextDir = d;
      if (!S.started) { S.started = true; draw(); }
    }

    document.addEventListener('keydown', function (e) {
      if (!S || S.over) return;
      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        e.preventDefault(); togglePause(); return;
      }
      const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left',
                    ArrowRight: 'right', w: 'up', s: 'down', a: 'left',
                    d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
      const dir = map[e.key];
      if (!dir) return;
      e.preventDefault();
      queueDir(dir);
    });

    /* ── round setup ─────────────────────────────────────────────────── */

    function nextWord() {
      if (S.review.length) return S.review.shift();
      return S.pool.shift() || pick(tierWords(S.level.tier));
    }

    function freeCell() {
      for (let tries = 0; tries < 200; tries++) {
        const x = Math.floor(Math.random() * S.cols);
        const y = Math.floor(Math.random() * S.rows);
        const onSnake = S.snake.some(function (c) { return c[0] === x && c[1] === y; });
        const onPellet = S.pellets.some(function (p) { return p.x === x && p.y === y; });
        if (!onSnake && !onPellet) return [x, y];
      }
      return null;
    }

    function nextRound() {
      const word = nextWord();
      S.target = word;
      const others = shuffle(tierWords(S.level.tier)
        .filter(function (w) { return w.w !== word.w; })).slice(0, 2);
      const set = shuffle([word].concat(others));
      S.pellets = [];
      set.forEach(function (w) {
        const c = freeCell();
        if (c) S.pellets.push({ x: c[0], y: c[1], w: w, ok: w.w === word.w });
      });
      const meanEl = document.getElementById('vs-mean');
      if (meanEl) meanEl.textContent = word.mean;
    }

    /* ── tick / collision ────────────────────────────────────────────── */

    function tick() {
      if (!S || S.over || S.paused || !S.started) return;
      S.dir = S.nextDir;
      const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[S.dir];
      const head = S.snake[0];
      const nx = head[0] + d[0], ny = head[1] + d[1];

      if (nx < 0 || ny < 0 || nx >= S.cols || ny >= S.rows) { gameOver(); return; }
      if (S.snake.some(function (c) { return c[0] === nx && c[1] === ny; })) {
        gameOver(); return;
      }

      const hit = S.pellets.find(function (p) { return p.x === nx && p.y === ny; });
      S.snake.unshift([nx, ny]);

      if (hit) {
        handleCatch(hit);
      } else {
        S.snake.pop();
      }
      draw();
    }

    function handleCatch(hit) {
      const w = hit.w;
      S.pellets = [];
      if (hit.ok) {
        sGood();
        S.caught++;
        if (S.used.indexOf(w) === -1) S.used.push(w);
        P.learned[w.w] = 1; save();
        document.getElementById('vs-score').textContent =
          '🍎 ' + S.caught + '/' + S.level.target;
        showToast('good', '✅ <b>' + esc(w.w) + '</b> — ' + esc(w.mean));
        if (S.caught >= S.level.target) { setTimeout(win, 650); return; }
      } else {
        sBad();
        S.misses++;
        S.lives--;
        S.snake.pop(); /* wrong catch doesn't grow the snake */
        S.review.push(S.target);
        document.getElementById('vs-lives').textContent =
          '❤️'.repeat(Math.max(0, S.lives)) + '🖤'.repeat(START_LIVES - S.lives);
        showToast('bad', '❌ That\'s <b>' + esc(w.w) + '</b> — ' + esc(w.mean) +
          '<br>Look for: <b>' + esc(S.target.w) + '</b>');
        if (S.lives <= 0) { setTimeout(gameOver, 900); return; }
      }
      S.paused = true;
      setTimeout(function () {
        if (!S || S.over) return;
        S.toast = null;
        S.paused = false;
        nextRound();
        draw();
      }, 900);
    }

    function showToast(kind, html) {
      S.toast = { kind: kind, html: html };
      draw();
    }

    /* ── drawing ──────────────────────────────────────────────────────── */

    function draw() {
      if (!S) return;
      const cv = document.getElementById('vs-canvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      const c = S.cell;
      ctx.fillStyle = '#28262f';
      ctx.fillRect(0, 0, cv.width, cv.height);

      /* snake */
      S.snake.forEach(function (seg, i) {
        ctx.fillStyle = i === 0 ? '#4ade80' : 'rgba(74,222,128,0.65)';
        const pad = c * 0.09;
        roundRect(ctx, seg[0] * c + pad, seg[1] * c + pad, c - pad * 2, c - pad * 2, c * 0.28);
        ctx.fill();
      });
      if (S.snake.length) {
        const h = S.snake[0];
        ctx.font = Math.floor(c * 0.55) + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(eyeEmoji(S.dir), h[0] * c + c / 2, h[1] * c + c / 2);
      }

      /* pellets */
      S.pellets.forEach(function (p) {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 1;
        roundRect(ctx, p.x * c + 3, p.y * c + 3, c - 6, c - 6, 8);
        ctx.fill(); ctx.stroke();
        fitText(ctx, p.w.w, p.x * c + c / 2, p.y * c + c / 2, c - 10);
      });

      if (!S.started) {
        ctx.fillStyle = 'rgba(20,19,24,0.55)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#f3f1f5';
        ctx.font = '700 16px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Press an arrow key', cv.width / 2, cv.height / 2 - 12);
        ctx.fillText('to start', cv.width / 2, cv.height / 2 + 14);
      } else if (S.paused && !S.toast) {
        ctx.fillStyle = 'rgba(20,19,24,0.55)';
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = '#f3f1f5';
        ctx.font = '700 22px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('⏸️ Paused', cv.width / 2, cv.height / 2);
      }

      renderToast();
    }

    function eyeEmoji(dir) {
      return { up: '🔼', down: '🔽', left: '◀️', right: '▶️' }[dir] || '🟢';
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function fitText(ctx, text, cx, cy, maxW) {
      let size = 13;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      while (size > 7) {
        ctx.font = '600 ' + size + 'px system-ui, sans-serif';
        if (ctx.measureText(text).width <= maxW) break;
        size--;
      }
      ctx.fillStyle = '#f3f1f5';
      ctx.fillText(text, cx, cy);
    }

    function renderToast() {
      let box = document.getElementById('vs-toast');
      if (S.toast) {
        if (!box) {
          box = document.createElement('div');
          box.id = 'vs-toast';
          box.className = 'vs-toast';
          document.querySelector('.vs-cwrap').appendChild(box);
        }
        box.className = 'vs-toast ' + S.toast.kind;
        box.innerHTML = S.toast.html;
      } else if (box) {
        box.remove();
      }
    }

    /* ── end states ───────────────────────────────────────────────────── */

    function gameOver() {
      if (!S || S.over) return;
      S.over = true;
      stopTimer();
      sOver();
      const lv = S.level;
      const li = S.li;
      const used = S.used, caught = S.caught, target = lv.target;
      S = null;

      let h = '<div class="vs-win"><div class="em">💥🐍</div>' +
        '<h2>The snake stumbled!</h2>' +
        '<div class="sub">' + caught + ' of ' + target +
        ' words caught before running out of lives</div><div class="vs-recap">';
      used.forEach(function (w) {
        h += '<div class="r"><b>' + esc(w.w) + '</b> — ' + esc(w.mean) + '</div>';
      });
      h += '</div><div class="vs-actions">' +
        '<button class="vs-btn" id="vs-again">↻ Try again</button>' +
        '<button class="vs-btn ghost" id="vs-home">All levels</button>' +
        '</div></div>';
      el.innerHTML = h;
      document.getElementById('vs-again').addEventListener('click', function () { start(li); });
      document.getElementById('vs-home').addEventListener('click', home);
    }

    function win() {
      if (!S || S.over) return;
      S.over = true;
      stopTimer();
      sWin();
      const stars = S.lives === START_LIVES ? 3 : S.lives >= 1 ? 2 : 1;
      if ((P.stars[S.li] || 0) < stars) P.stars[S.li] = stars;
      save();

      const lv = S.level;
      const li = S.li;
      const used = S.used;
      const hasNext = li + 1 < LEVELS.length;
      S = null;

      let h = '<div class="vs-win"><div class="em">' + lv.emoji + '🎉</div>' +
        '<h2>Level cleared!</h2>' +
        '<div class="stars">' + '★★★'.slice(0, stars) +
        '<span style="opacity:0.25">' + '★★★'.slice(0, 3 - stars) +
        '</span></div>' +
        '<div class="sub">' + used.length +
        (used.length === 1 ? ' word' : ' words') + ' mastered this run</div>' +
        '<div class="vs-recap">';
      used.forEach(function (w) {
        h += '<div class="r"><b>' + esc(w.w) + '</b> — ' + esc(w.mean) + '</div>';
      });
      h += '</div><div class="vs-actions">' +
        '<button class="vs-btn ghost" id="vs-again">↻ Play again</button>' +
        (hasNext ? '<button class="vs-btn" id="vs-next">Next level →</button>' : '') +
        '<button class="vs-btn ghost" id="vs-home">All levels</button>' +
        '</div></div>';
      el.innerHTML = h;
      document.getElementById('vs-again').addEventListener('click', function () { start(li); });
      if (hasNext) {
        document.getElementById('vs-next').addEventListener('click', function () { start(li + 1); });
      }
      document.getElementById('vs-home').addEventListener('click', home);
    }

    /* ── boot ─────────────────────────────────────────────────────────── */

    function boot(data) {
      TIERS = data.tiers;
      home();
    }

    return { boot: boot };
  })();

  init();
})();
</script>
