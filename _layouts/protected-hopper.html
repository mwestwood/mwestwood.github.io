---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 40vh;
    padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px;
    padding: 2.5rem 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── Word Hopper ─────────────────────────────────────────────────────── */
  #hopper-root { display: none; }

  .vh { --acc: #34d399; --good: #4ade80; --bad: #f87171;
        --card: rgba(255,255,255,0.05); --line: rgba(255,255,255,0.12);
        max-width: 780px; }
  .vh, .vh * { box-sizing: border-box; }
  .vh button { font-family: inherit; }

  .vh-top {
    display: flex; align-items: center; gap: 0.6rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .vh-back {
    background: var(--card); border: 1px solid var(--line);
    color: inherit; border-radius: 999px; padding: 0.3rem 0.85rem;
    font-size: 0.85rem; cursor: pointer;
  }
  .vh-back:hover { border-color: var(--acc); }
  .vh-crumb { font-weight: 700; font-size: 1.05rem; }
  .vh-spacer { flex: 1; }
  .vh-pill {
    font-size: 0.8rem; padding: 0.25rem 0.7rem; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); white-space: nowrap;
  }
  .vh-pill.acc { border-color: var(--acc); color: var(--acc); font-weight: 600; }
  .vh-pill.hearts { color: #f87171; border-color: rgba(248,113,113,0.4); }
  .vh-pill.btn { cursor: pointer; }

  .vh-hero { text-align: center; margin: 0.5rem 0 1.6rem; }
  .vh-hero h1 { margin: 0 0 0.3rem; font-size: 2rem; }
  .vh-hero p { margin: 0; opacity: 0.7; font-size: 0.95rem; }

  .vh-levels { display: grid; gap: 0.9rem; }
  .vh-level {
    display: flex; align-items: center; gap: 1rem; width: 100%;
    text-align: left; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 1rem 1.2rem; color: inherit;
    cursor: pointer; transition: transform 0.12s, border-color 0.12s;
  }
  .vh-level:hover { transform: translateY(-2px);
                    border-color: var(--lc, var(--acc)); }
  .vh-level .em { font-size: 2rem; }
  .vh-level .body { flex: 1; min-width: 0; }
  .vh-level .name { font-weight: 700; font-size: 1.1rem; }
  .vh-level .meta { font-size: 0.8rem; opacity: 0.6; margin-top: 0.2rem; }
  .vh-level .side { text-align: right; font-size: 0.95rem; white-space: nowrap; }
  .vh-level .stars { color: #facc15; font-weight: 700; letter-spacing: 0.1em; }

  /* play screen */
  .vh-prompt { text-align: center; margin: 0 0 0.7rem; min-height: 2.6em; }
  .vh-prompt .lbl { font-size: 0.75rem; letter-spacing: 0.08em;
                    text-transform: uppercase; opacity: 0.55; }
  .vh-prompt .mean { font-size: 1.1rem; font-weight: 600; line-height: 1.4;
                      max-width: 560px; margin: 0.15rem auto 0; }
  .vh-cwrap { display: flex; justify-content: center; position: relative; }
  #vh-canvas {
    border: 1px solid var(--line); border-radius: 10px;
    background: #1b3028; touch-action: none; max-width: 100%;
  }
  .vh-toast {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: #26252c; border: 1px solid var(--line); border-radius: 12px;
    padding: 0.8rem 1.1rem; max-width: 90%; text-align: center;
    font-size: 0.92rem; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .vh-toast.good { border-color: var(--good); }
  .vh-toast.bad { border-color: var(--bad); }
  .vh-toast b { font-size: 1.05rem; }
  .vh-help { text-align: center; font-size: 0.8rem; opacity: 0.55;
             margin-top: 0.5rem; }

  .vh-dpad {
    display: grid; grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 48px); gap: 0.4rem;
    justify-content: center; margin-top: 0.9rem;
  }
  .vh-dpad button {
    background: var(--card); border: 1px solid var(--line); color: inherit;
    border-radius: 10px; font-size: 1.1rem; cursor: pointer;
    -webkit-user-select: none; user-select: none;
  }
  .vh-dpad button:active { background: rgba(255,255,255,0.14); }
  .vh-dpad .up { grid-column: 2; grid-row: 1; }
  .vh-dpad .left { grid-column: 1; grid-row: 2; }
  .vh-dpad .down { grid-column: 2; grid-row: 2; }
  .vh-dpad .right { grid-column: 3; grid-row: 2; }

  /* end screens */
  .vh-win { text-align: center; padding: 1rem 0; }
  .vh-win .em { font-size: 3.2rem; }
  .vh-win h2 { margin: 0.4rem 0 0.2rem; }
  .vh-win .stars { font-size: 2rem; color: #facc15; letter-spacing: 0.15em; }
  .vh-win .sub { opacity: 0.7; font-size: 0.92rem; margin-top: 0.2rem; }
  .vh-recap {
    text-align: left; max-width: 520px; margin: 1.2rem auto 0;
    display: grid; gap: 0.5rem;
  }
  .vh-recap .r {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.9rem;
    line-height: 1.5;
  }
  .vh-recap .r b { color: var(--acc); }
  .vh-actions { display: flex; justify-content: center; gap: 0.6rem;
                margin-top: 1.4rem; flex-wrap: wrap; }
  .vh-btn {
    background: var(--acc); border: none; color: #0d1a14; font-weight: 700;
    border-radius: 999px; padding: 0.5rem 1.3rem; font-size: 0.95rem;
    cursor: pointer;
  }
  .vh-btn:hover { opacity: 0.88; }
  .vh-btn.ghost { background: var(--card); color: inherit;
                  border: 1px solid var(--line); }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="hopper-root"><div class="vh" id="vh"></div></div>

<script>
(function () {
  'use strict';

  /* Encrypted blob injected by Jekyll from front matter field `encrypted` */
  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};

  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const salt = blob.slice(0, 16);
    const iv = blob.slice(16, 28);
    const ct = blob.slice(28);
    const key = await deriveKey(passphrase, salt);
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return new TextDecoder().decode(plaintext);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('hopper-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }

  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }

  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse word bank.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Hopper.boot(data);
  }

  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) {
        try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {}
      }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }

  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true;
        input.disabled = true;
        try {
          const text = await decrypt(cached);
          reveal(text);
          return;
        } catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false;
          input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }

  btn.addEventListener('click', function () {
    const pw = input.value;
    if (!pw) { input.focus(); return; }
    tryUnlock(pw, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ══════════════════════════ Word Hopper ═══════════════════════════════ */

  const Hopper = (function () {

    const el = document.getElementById('vh');

    const COLS = 7, ROWS = 7, CELL = 60;
    const CANVAS_W = COLS * CELL, CANVAS_H = ROWS * CELL;
    const PAD_COLS = [1, 3, 5];   /* word pads sit in row 0 at these columns */
    const START = [3, 6];
    const START_LIVES = 3;

    /* Each level sets the hopping character, the traffic that must be
       dodged, and the scene colors — so the creature fits the setting
       (frog on the pond, dolphin in the reef, penguin on the ice). */
    const LEVELS = [
      { name: 'Lily Pond',      emoji: '🪷', hero: '🐸', obs: ['🦢', '🦆'], tier: 'intermediate',
        speed: 45,  roads: 2, target: 6,  bg: '#1b3028', road: 'rgba(0,0,0,0.22)', lc: '#34d399' },
      { name: 'Country Lane',   emoji: '🌾', hero: '🐔', obs: ['🚜', '🐄'], tier: 'intermediate',
        speed: 55,  roads: 2, target: 6,  bg: '#2b2b1a', road: 'rgba(0,0,0,0.22)', lc: '#facc15' },
      { name: 'Busy Street',    emoji: '🚦', hero: '🐱', obs: ['🚗', '🚌'], tier: 'intermediate',
        speed: 65,  roads: 2, target: 7,  bg: '#26242c', road: 'rgba(0,0,0,0.25)', lc: '#93c5fd' },
      { name: 'Harbor Hop',     emoji: '🐚', hero: '🐢', obs: ['⛵', '🚤'], tier: 'mixed',
        speed: 72,  roads: 3, target: 7,  bg: '#16283a', road: 'rgba(255,255,255,0.05)', lc: '#38bdf8' },
      { name: 'Coral Crossing', emoji: '🌊', hero: '🐬', obs: ['🦈', '🐙'], tier: 'mixed',
        speed: 80,  roads: 3, target: 8,  bg: '#132433', road: 'rgba(255,255,255,0.05)', lc: '#2dd4bf' },
      { name: 'Icy River',      emoji: '❄️', hero: '🐧', obs: ['🧊', '🦭'], tier: 'advanced',
        speed: 88,  roads: 3, target: 8,  bg: '#1e2a36', road: 'rgba(255,255,255,0.06)', lc: '#67e8f9' },
      { name: 'Jungle Trail',   emoji: '🌴', hero: '🐒', obs: ['🐊', '🦏'], tier: 'advanced',
        speed: 96,  roads: 3, target: 9,  bg: '#1d2417', road: 'rgba(0,0,0,0.25)', lc: '#a3e635' },
      { name: 'Lava Field',     emoji: '🌋', hero: '🦎', obs: ['🔥', '☄️'], tier: 'advanced',
        speed: 104, roads: 3, target: 9,  bg: '#2e1712', road: 'rgba(0,0,0,0.28)', lc: '#fb923c' },
      { name: 'Night Highway',  emoji: '🌃', hero: '🦊', obs: ['🚚', '🏎️'], tier: 'advanced',
        speed: 112, roads: 4, target: 10, bg: '#191c27', road: 'rgba(0,0,0,0.3)', lc: '#c4b5fd' },
      { name: 'Meteor Belt',    emoji: '🌌', hero: '🚀', obs: ['☄️', '🛸'], tier: 'advanced',
        speed: 120, roads: 4, target: 10, bg: '#191327', road: 'rgba(255,255,255,0.05)', lc: '#c084fc' }
    ];
    const TIER_LABEL = { intermediate: '🚀 Intermediate words',
                         mixed: '🚀🏆 Mixed words', advanced: '🏆 Advanced words' };

    let TIERS = null;
    let S = null;
    let rafId = null;

    /* ── helpers ──────────────────────────────────────────────────────── */

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

    let AC = null;
    function tone(freq, at, dur) {
      if (!P.sound) return;
      try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        const o = AC.createOscillator(), g = AC.createGain();
        o.frequency.value = freq; o.type = 'sine';
        g.gain.setValueAtTime(0.0001, AC.currentTime + at);
        g.gain.linearRampToValueAtTime(0.12, AC.currentTime + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + at + dur);
        o.connect(g); g.connect(AC.destination);
        o.start(AC.currentTime + at); o.stop(AC.currentTime + at + dur + 0.05);
      } catch (_) {}
    }
    function sGood() { tone(660, 0, 0.12); tone(880, 0.12, 0.2); }
    function sBad() { tone(220, 0, 0.1); tone(160, 0.1, 0.22); }
    function sWin() { tone(523, 0, 0.14); tone(659, 0.14, 0.14); tone(784, 0.28, 0.3); }
    function sOver() { tone(300, 0, 0.15); tone(220, 0.15, 0.15); tone(140, 0.3, 0.35); }

    /* ── progress (localStorage) ──────────────────────────────────────── */

    const PKEY = 'vocab-hopper-v1';
    let P = null;
    try { P = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.stars = P.stars || {};
    P.learned = P.learned || {};
    if (P.sound === undefined) P.sound = true;
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }

    function tierWords(tier) {
      if (tier === 'mixed') return TIERS.intermediate.concat(TIERS.advanced);
      return TIERS[tier];
    }
    function buildPool(tier) {
      const words = shuffle(tierWords(tier));
      const fresh = [], seen = [];
      words.forEach(function (w) { (P.learned[w.w] ? seen : fresh).push(w); });
      return fresh.concat(seen);
    }

    /* ── screens ──────────────────────────────────────────────────────── */

    function home() {
      stopLoop();
      S = null;
      const learnedCount = Object.keys(P.learned).length;
      let h = '<div class="vh-hero"><h1>🐸 Word Hopper</h1>' +
        '<p>Hop with all four arrows — dodge the traffic, then land on the ' +
        'word that matches the meaning. Every level is open.</p></div>';
      if (learnedCount) {
        h += '<div style="text-align:center;margin-bottom:1.2rem">' +
          '<span class="vh-pill acc">📚 ' + learnedCount +
          ' words mastered</span></div>';
      }
      h += '<div class="vh-levels">';
      LEVELS.forEach(function (lv, i) {
        const st = P.stars[i] || 0;
        h += '<button class="vh-level" data-l="' + i + '" style="--lc:' +
          lv.lc + '">' +
          '<span class="em">' + lv.emoji + lv.hero + '</span>' +
          '<span class="body"><span class="name">Level ' + (i + 1) + ' — ' +
          esc(lv.name) + '</span>' +
          '<span class="meta" style="display:block">' + lv.target +
          ' safe crossings to win · ' + lv.roads + ' lanes of ' +
          lv.obs.join('') + ' · ' + TIER_LABEL[lv.tier] + '</span></span>' +
          '<span class="side"><span class="stars">' +
          '★★★'.slice(0, st) + '<span style="opacity:0.25">' +
          '★★★'.slice(0, 3 - st) + '</span></span></span></button>';
      });
      h += '</div>';
      el.innerHTML = h;
      el.querySelectorAll('.vh-level').forEach(function (b) {
        b.addEventListener('click', function () { start(+b.dataset.l); });
      });
    }

    function trafficRows(lv) {
      /* traffic occupies rows 2..(1+roads); row 1 is the calm bank under
         the pads, the rows below the traffic are safe grass */
      const rows = [];
      for (let r = 0; r < lv.roads; r++) rows.push(2 + r);
      return rows;
    }

    function start(li) {
      const lv = LEVELS[li];
      S = {
        li: li, level: lv,
        fx: START[0], fy: START[1],
        pads: [], target: null,
        obstacles: [],           /* { row, x, speed, emoji } */
        caught: 0, lives: START_LIVES, misses: 0,
        pool: buildPool(lv.tier),
        used: [], toast: null, paused: false, over: false, started: false,
        lastT: null
      };

      /* two obstacles per traffic lane, alternating direction per lane,
         each lane a little faster than the one before */
      trafficRows(lv).forEach(function (row, r) {
        const dir = r % 2 === 0 ? 1 : -1;
        const speed = dir * lv.speed * (1 + r * 0.18);
        for (let k = 0; k < 2; k++) {
          S.obstacles.push({
            row: row,
            x: k * (CANVAS_W / 2) + r * 40,
            speed: speed,
            emoji: lv.obs[k % lv.obs.length]
          });
        }
      });

      el.innerHTML =
        '<div class="vh-top">' +
        '<button class="vh-back" id="vh-quit">← All levels</button>' +
        '<span class="vh-crumb">' + lv.emoji + ' Level ' + (li + 1) + ' — ' +
        esc(lv.name) + '</span><span class="vh-spacer"></span>' +
        '<span class="vh-pill acc" id="vh-score">' + lv.hero + ' 0/' +
        lv.target + '</span>' +
        '<span class="vh-pill hearts" id="vh-lives">' +
        '❤️'.repeat(START_LIVES) + '</span>' +
        '<span class="vh-pill btn" id="vh-sound">' +
        (P.sound ? '🔊' : '🔇') + '</span></div>' +
        '<div class="vh-prompt"><div class="lbl">Hop to the word that means…</div>' +
        '<div class="mean" id="vh-mean">—</div></div>' +
        '<div class="vh-cwrap"><canvas id="vh-canvas"></canvas></div>' +
        '<div class="vh-help">All four arrows / WASD to hop · dodge the ' +
        'traffic · land on the right word</div>' +
        '<div class="vh-dpad">' +
        '<button class="up" data-d="up" aria-label="Up">▲</button>' +
        '<button class="left" data-d="left" aria-label="Left">◀</button>' +
        '<button class="down" data-d="down" aria-label="Down">▼</button>' +
        '<button class="right" data-d="right" aria-label="Right">▶</button>' +
        '</div>';

      document.getElementById('vh-quit').addEventListener('click', home);
      document.getElementById('vh-sound').addEventListener('click', function () {
        P.sound = !P.sound; save();
        this.textContent = P.sound ? '🔊' : '🔇';
      });
      el.querySelectorAll('.vh-dpad button').forEach(function (b) {
        b.addEventListener('click', function () { hop(b.dataset.d); });
      });

      const cv = document.getElementById('vh-canvas');
      cv.style.background = lv.bg;
      cv.width = CANVAS_W; cv.height = CANVAS_H;

      let t0 = null;
      cv.addEventListener('touchstart', function (e) {
        t0 = [e.touches[0].clientX, e.touches[0].clientY];
      }, { passive: true });
      cv.addEventListener('touchend', function (e) {
        if (!t0) return;
        const dx = e.changedTouches[0].clientX - t0[0];
        const dy = e.changedTouches[0].clientY - t0[1];
        t0 = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) hop(dx > 0 ? 'right' : 'left');
        else hop(dy > 0 ? 'down' : 'up');
      }, { passive: true });

      nextRound(false);
      draw();
      startLoop();
    }

    /* ── movement ─────────────────────────────────────────────────────── */

    function hop(dir) {
      if (!S || S.over || S.paused) return;
      const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir];
      if (!d) return;
      if (!S.started) S.started = true;
      const nx = S.fx + d[0], ny = S.fy + d[1];
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;
      /* row 0 can only be entered where a pad sits — the rest is hedge */
      if (ny === 0 && PAD_COLS.indexOf(nx) === -1) return;
      S.fx = nx; S.fy = ny;
      if (ny === 0) landOnPad(nx);
      draw();
    }

    document.addEventListener('keydown', function (e) {
      if (!S || S.over) return;
      const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left',
                    ArrowRight: 'right', w: 'up', s: 'down', a: 'left',
                    d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
      const dir = map[e.key];
      if (!dir) return;
      e.preventDefault();
      hop(dir);
    });

    /* ── game loop (traffic) ──────────────────────────────────────────── */

    let loopActive = false;
    function startLoop() {
      loopActive = true;
      S.lastT = null;
      rafId = requestAnimationFrame(frame);
    }
    function stopLoop() {
      loopActive = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    function frame(t) {
      if (!loopActive || !S) return;
      if (S.lastT == null) S.lastT = t;
      const dt = Math.min(0.05, (t - S.lastT) / 1000);
      S.lastT = t;
      if (S.started && !S.paused && !S.over) {
        S.obstacles.forEach(function (o) {
          o.x += o.speed * dt;
          if (o.x > CANVAS_W + CELL) o.x = -CELL;
          if (o.x < -CELL) o.x = CANVAS_W + CELL;
        });
        checkCollision();
      }
      draw();
      rafId = requestAnimationFrame(frame);
    }

    function checkCollision() {
      const fLeft = S.fx * CELL + 10, fRight = (S.fx + 1) * CELL - 10;
      for (let i = 0; i < S.obstacles.length; i++) {
        const o = S.obstacles[i];
        if (o.row !== S.fy) continue;
        if (o.x < fRight && o.x + CELL > fLeft) { hitByTraffic(o); return; }
      }
    }

    function hitByTraffic(o) {
      sBad();
      S.lives--;
      document.getElementById('vh-lives').textContent =
        '❤️'.repeat(Math.max(0, S.lives)) + '🖤'.repeat(START_LIVES - S.lives);
      S.fx = START[0]; S.fy = START[1];
      showToast('bad', '💥 ' + o.emoji + ' got you! Back to the start.');
      if (S.lives <= 0) { S.paused = true; setTimeout(gameOver, 1200); return; }
      pauseThen(1200, false);
    }

    /* ── word pads ────────────────────────────────────────────────────── */

    function nextRound(keepTarget) {
      if (!keepTarget || !S.target) {
        S.target = S.pool.shift() || pick(tierWords(S.level.tier));
      }
      const word = S.target;
      const others = shuffle(tierWords(S.level.tier)
        .filter(function (w) { return w.w !== word.w; })).slice(0, PAD_COLS.length - 1);
      const set = shuffle([word].concat(others));
      S.pads = PAD_COLS.map(function (col, i) {
        return { col: col, w: set[i], ok: set[i].w === word.w };
      });
      const meanEl = document.getElementById('vh-mean');
      if (meanEl) meanEl.textContent = word.mean;
    }

    function landOnPad(col) {
      const pad = S.pads.find(function (p) { return p.col === col; });
      if (!pad) return;
      const w = S.target;
      S.fx = START[0]; S.fy = START[1];
      if (pad.ok) {
        sGood();
        S.caught++;
        if (S.used.indexOf(w) === -1) S.used.push(w);
        P.learned[w.w] = 1; save();
        document.getElementById('vh-score').textContent =
          S.level.hero + ' ' + S.caught + '/' + S.level.target;
        showToast('good', '✅ <b>' + esc(w.w) + '</b> — ' + esc(w.mean) +
          (w.ex ? '<br><i>“' + esc(w.ex) + '”</i>' : ''));
        if (S.caught >= S.level.target) {
          S.paused = true; setTimeout(win, 1400); return;
        }
        pauseThen(1800, false);
      } else {
        sBad();
        S.misses++;
        S.lives--;
        document.getElementById('vh-lives').textContent =
          '❤️'.repeat(Math.max(0, S.lives)) + '🖤'.repeat(START_LIVES - S.lives);
        showToast('bad', '❌ That\'s <b>' + esc(pad.w.w) + '</b> — ' +
          esc(pad.w.mean) + '<br>Look for: <b>' + esc(w.w) + '</b>' +
          (w.ex ? '<br><i>“' + esc(w.ex) + '”</i>' : ''));
        if (S.lives <= 0) { S.paused = true; setTimeout(gameOver, 2200); return; }
        /* same word again, pads reshuffled — it must be answered right */
        pauseThen(2600, true);
      }
    }

    function pauseThen(ms, keepTarget) {
      S.paused = true;
      setTimeout(function () {
        if (!S || S.over) return;
        S.toast = null;
        S.paused = false;
        nextRound(keepTarget ? true : false);
        draw();
      }, ms);
    }

    function showToast(kind, html) { S.toast = { kind: kind, html: html }; }

    /* ── drawing ──────────────────────────────────────────────────────── */

    function draw() {
      if (!S) return;
      const cv = document.getElementById('vh-canvas');
      if (!cv) return;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = S.level.bg;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      /* traffic lanes */
      trafficRows(S.level).forEach(function (row) {
        ctx.fillStyle = S.level.road;
        ctx.fillRect(0, row * CELL, CANVAS_W, CELL);
      });

      /* hedge row with word pads */
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(0, 0, CANVAS_W, CELL);
      S.pads.forEach(function (p) {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        roundRect(ctx, p.col * CELL + 3, 6, CELL - 6, CELL - 12, 9);
        ctx.fill(); ctx.stroke();
        fitText(ctx, p.w.w, p.col * CELL + CELL / 2, CELL / 2, CELL - 10);
      });

      /* obstacles */
      ctx.font = '34px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      S.obstacles.forEach(function (o) {
        ctx.fillText(o.emoji, o.x + CELL / 2, o.row * CELL + CELL / 2 + 2);
      });

      /* the hopper */
      ctx.font = '34px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.fillText(S.level.hero, S.fx * CELL + CELL / 2, S.fy * CELL + CELL / 2 + 2);

      if (!S.started) {
        ctx.fillStyle = 'rgba(20,19,24,0.55)';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.fillStyle = '#f3f1f5';
        ctx.font = '700 16px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('Press an arrow key', CANVAS_W / 2, CANVAS_H / 2 - 12);
        ctx.fillText('to hop', CANVAS_W / 2, CANVAS_H / 2 + 14);
      }

      renderToast();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function fitText(ctx, text, cx, cy, maxW) {
      let size = 12;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      while (size > 6) {
        ctx.font = '600 ' + size + 'px system-ui, sans-serif';
        if (ctx.measureText(text).width <= maxW) break;
        size--;
      }
      ctx.fillStyle = '#f3f1f5';
      ctx.fillText(text, cx, cy);
    }

    function renderToast() {
      let box = document.getElementById('vh-toast');
      if (S.toast) {
        if (!box) {
          box = document.createElement('div');
          box.id = 'vh-toast';
          box.className = 'vh-toast';
          document.querySelector('.vh-cwrap').appendChild(box);
        }
        box.className = 'vh-toast ' + S.toast.kind;
        box.innerHTML = S.toast.html;
      } else if (box) {
        box.remove();
      }
    }

    /* ── end states ───────────────────────────────────────────────────── */

    function gameOver() {
      if (!S || S.over) return;
      S.over = true;
      stopLoop();
      sOver();
      const lv = S.level, li = S.li, used = S.used, caught = S.caught, target = lv.target;
      S = null;

      let h = '<div class="vh-win"><div class="em">💥' + lv.hero + '</div>' +
        '<h2>Squished!</h2>' +
        '<div class="sub">' + caught + ' of ' + target +
        ' crossings made before running out of lives</div><div class="vh-recap">';
      used.forEach(function (w) {
        h += '<div class="r"><b>' + esc(w.w) + '</b> — ' + esc(w.mean) +
          (w.ex ? '<br><i style="opacity:0.75">“' + esc(w.ex) + '”</i>' : '') +
          '</div>';
      });
      h += '</div><div class="vh-actions">' +
        '<button class="vh-btn" id="vh-again">↻ Try again</button>' +
        '<button class="vh-btn ghost" id="vh-home">All levels</button>' +
        '</div></div>';
      el.innerHTML = h;
      document.getElementById('vh-again').addEventListener('click', function () { start(li); });
      document.getElementById('vh-home').addEventListener('click', home);
    }

    function win() {
      if (!S || S.over) return;
      S.over = true;
      stopLoop();
      sWin();
      const stars = S.lives === START_LIVES ? 3 : S.lives >= 1 ? 2 : 1;
      if ((P.stars[S.li] || 0) < stars) P.stars[S.li] = stars;
      save();

      const lv = S.level, li = S.li, used = S.used;
      const hasNext = li + 1 < LEVELS.length;
      S = null;

      let h = '<div class="vh-win"><div class="em">' + lv.emoji + '🎉</div>' +
        '<h2>Crossing complete!</h2>' +
        '<div class="stars">' + '★★★'.slice(0, stars) +
        '<span style="opacity:0.25">' + '★★★'.slice(0, 3 - stars) +
        '</span></div>' +
        '<div class="sub">' + used.length +
        (used.length === 1 ? ' word' : ' words') + ' mastered this run</div>' +
        '<div class="vh-recap">';
      used.forEach(function (w) {
        h += '<div class="r"><b>' + esc(w.w) + '</b> — ' + esc(w.mean) +
          (w.ex ? '<br><i style="opacity:0.75">“' + esc(w.ex) + '”</i>' : '') +
          '</div>';
      });
      h += '</div><div class="vh-actions">' +
        '<button class="vh-btn ghost" id="vh-again">↻ Play again</button>' +
        (hasNext ? '<button class="vh-btn" id="vh-next">Next level →</button>' : '') +
        '<button class="vh-btn ghost" id="vh-home">All levels</button>' +
        '</div></div>';
      el.innerHTML = h;
      document.getElementById('vh-again').addEventListener('click', function () { start(li); });
      if (hasNext) {
        document.getElementById('vh-next').addEventListener('click', function () { start(li + 1); });
      }
      document.getElementById('vh-home').addEventListener('click', home);
    }

    /* ── boot ─────────────────────────────────────────────────────────── */

    function boot(data) {
      TIERS = data.tiers;
      home();
    }

    return { boot: boot };
  })();

  init();
})();
</script>
