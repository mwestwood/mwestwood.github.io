---
layout: default
---

<style>
  #pa-gate { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:40vh; padding:2rem 1rem; }
  .pa-card { background:var(--sidebar-color,#f5f6fa); border:1px solid var(--border-color,#e0e0e0); border-radius:8px; padding:2.5rem 2rem; max-width:400px; width:100%; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .pa-lock { font-size:2.5rem; margin-bottom:.75rem; line-height:1; }
  .pa-title { font-size:1.25rem; font-weight:600; margin:0 0 .5rem; color:var(--body-text-color,#27262b); }
  .pa-sub { font-size:.875rem; opacity:.75; margin:0 0 1.5rem; color:var(--body-text-color,#5c5962); }
  .pa-row { display:flex; gap:.5rem; width:100%; }
  #pa-pw { flex:1; padding:.5rem .75rem; border:1px solid var(--border-color,#d0d0d0); border-radius:4px; font-size:1rem; background:var(--body-background-color,#fff); color:var(--body-text-color,#27262b); outline:none; }
  #pa-go { padding:.5rem 1.1rem; background:var(--links-color,#7253ed); color:#fff; border:none; border-radius:4px; font-size:.95rem; font-weight:600; cursor:pointer; white-space:nowrap; }
  #pa-go:disabled { opacity:.5; cursor:not-allowed; }
  #pa-err { margin-top:.85rem; font-size:.875rem; color:#c0392b; min-height:1.25rem; display:none; }
  #pa-status { margin-top:.85rem; font-size:.875rem; opacity:.7; min-height:1.25rem; display:none; }
  #pa-app { display:none; }
  #pa-bar { display:flex; justify-content:flex-end; font-size:.85rem; padding:0 0 .4rem; }
  #pa-frame { width:100%; height:calc(100vh - 150px); min-height:520px; border:1px solid var(--border-color,#e0e0e0); border-radius:6px; background:#fff; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>

<div id="pa-gate">
  <div class="pa-card">
    <div class="pa-lock" aria-hidden="true">🔒</div>
    <p class="pa-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="pa-sub">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="pa-row">
      <label for="pa-pw" class="sr-only">Passphrase</label>
      <input id="pa-pw" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="pa-go">Unlock</button>
    </div>
    <div id="pa-err" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="pa-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="pa-app">
  <div id="pa-bar"><a id="pa-full" href="#" target="_blank" rel="noopener">Open full page ↗</a></div>
  <iframe id="pa-frame" title="{{ page.title }}"></iframe>
</div>

<script>
(function () {
  'use strict';

  /* Encrypted blob lives in a separate static file (gzip, then AES-GCM:
     salt[16] + iv[12] + ciphertext+tag) — too large to inline in front matter. */
  var BLOB_URL = {{ page.blob | relative_url | jsonify }};
  var STORAGE_KEY = 'mwestwood-passphrase';

  var gate = document.getElementById('pa-gate');
  var app = document.getElementById('pa-app');
  var frame = document.getElementById('pa-frame');
  var full = document.getElementById('pa-full');
  var input = document.getElementById('pa-pw');
  var btn = document.getElementById('pa-go');
  var errEl = document.getElementById('pa-err');
  var statusEl = document.getElementById('pa-status');
  var cipherPromise = null;

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.disabled = false;
    input.select();
  }

  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }

  function fetchCipher() {
    if (!cipherPromise) {
      cipherPromise = fetch(BLOB_URL).then(function (r) {
        if (!r.ok) throw new Error('Could not load content (' + r.status + ')');
        return r.arrayBuffer();
      });
    }
    return cipherPromise;
  }

  async function decrypt(passphrase) {
    var blob = new Uint8Array(await fetchCipher());
    var salt = blob.slice(0, 16);
    var iv = blob.slice(16, 28);
    var ct = blob.slice(28);
    var mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      mat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('This browser cannot decompress the content (DecompressionStream missing)');
    }
    var stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).blob();
  }

  function reveal(htmlBlob) {
    var url = URL.createObjectURL(new Blob([htmlBlob], { type: 'text/html' }));
    frame.src = url;
    full.href = url;
    gate.style.display = 'none';
    app.style.display = 'block';
  }

  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      var out = await decrypt(passphrase);
      if (cache) { try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {} }
      reveal(out);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && /subtle/.test(e.message)) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }

  async function init() {
    var cached = null;
    try { cached = localStorage.getItem(STORAGE_KEY); } catch (_) {}
    if (!cached) return;
    showStatus('Unlocking…');
    btn.disabled = true;
    input.disabled = true;
    try {
      reveal(await decrypt(cached));
    } catch (_) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (__) {}
      btn.disabled = false;
      input.disabled = false;
      statusEl.style.display = 'none';
    }
  }

  btn.addEventListener('click', function () {
    if (!input.value) { input.focus(); return; }
    tryUnlock(input.value, true);
  });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') btn.click(); });

  init();
})();
</script>
