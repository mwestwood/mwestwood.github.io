---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 40vh; padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px; padding: 2.5rem 2rem; max-width: 400px; width: 100%;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── CIPHER · Field Craft ────────────────────────────────────────────── */
  #cipher-root { display: none; }

  .cf {
    --sig: #22d3ee; --amber: #fbbf24; --stamp: #f87171; --ok: #4ade80;
    --paper: rgba(255,255,255,0.045); --paper2: rgba(34,211,238,0.07);
    --line: rgba(255,255,255,0.15);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-width: 820px;
  }
  .cf, .cf * { box-sizing: border-box; }
  .cf button, .cf input, .cf textarea, .cf select {
    font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .cf-top {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .cf-back {
    background: var(--paper); border: 1px solid var(--line); color: inherit;
    border-radius: 6px; padding: 0.45rem 1rem; font-size: 0.95rem;
    cursor: pointer;
  }
  .cf-back:hover { border-color: var(--sig); }
  .cf-spacer { flex: 1; }
  .cf-pill {
    font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em;
    padding: 0.35rem 0.7rem; border-radius: 4px;
    background: var(--paper); border: 1px solid var(--line);
    white-space: nowrap; color: inherit;
  }
  /* Just the Docs colours every .main-content anchor via
     `.main-content a:not(.btn):not(.anchor-heading)` (specificity 0,3,1),
     which nothing we can write here beats — force the pill back. */
  .cf a.cf-pill { color: inherit !important; text-decoration: none; }

  button.cf-pill { cursor: pointer; }
  button.cf-pill.off { opacity: 0.42; }

  /* dossier header */
  .cf-hero {
    border: 1px solid var(--line); border-left: 4px solid var(--sig);
    border-radius: 4px; padding: 1rem 1.2rem; margin-bottom: 1.2rem;
    background: linear-gradient(180deg, var(--paper2), transparent);
  }
  .cf-hero .tag {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.22em;
    color: var(--sig); text-transform: uppercase;
  }
  .cf-hero h1 {
    margin: 0.25rem 0 0.3rem; font-size: 1.75rem; letter-spacing: 0.02em;
  }
  .cf-hero p { margin: 0; opacity: 0.78; font-size: 0.98rem; line-height: 1.6; }

  .cf-statbar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr));
    gap: 0.5rem; margin-top: 0.9rem;
  }
  .cf-stat {
    background: rgba(0,0,0,0.18); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.5rem 0.4rem; text-align: center;
  }
  .cf-stat b {
    display: block; font-family: var(--mono); font-size: 1.25rem;
    color: var(--amber);
  }
  .cf-stat span { font-size: 0.7rem; opacity: 0.7; letter-spacing: 0.04em; }

  .cf-sect {
    font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.18em;
    text-transform: uppercase; opacity: 0.62;
    margin: 1.6rem 0 0.6rem; display: flex; align-items: baseline;
    gap: 0.6rem; flex-wrap: wrap;
  }
  .cf-sect .n { color: var(--sig); }

  /* signpost training cards */
  .cf-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(174px, 1fr));
    gap: 0.55rem;
  }
  .cf-sp {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.8rem 0.7rem; cursor: pointer;
    color: inherit; text-align: left; line-height: 1.35; position: relative;
  }
  .cf-sp:hover { border-color: var(--sig); }
  .cf-sp .code {
    font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.12em;
    opacity: 0.55; margin-left: 0.4rem; vertical-align: 0.28em;
  }
  .cf-sp .nm { display: block; font-weight: 700; font-size: 0.95rem;
               margin: 0.15rem 0 0.2rem; }
  .cf-sp .em { font-size: 1.3rem; }
  .cf-sp .st {
    font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.1em;
    color: var(--ok);
  }
  .cf-sp.done { border-color: rgba(74,222,128,0.5); }
  .cf-sp.locked { opacity: 0.55; }

  /* case files */
  .cf-case {
    display: block; width: 100%; text-align: left;
    background: var(--paper); border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: 4px; padding: 0.8rem 1rem; cursor: pointer;
    color: inherit; margin-bottom: 0.5rem; line-height: 1.45;
  }
  .cf-case:hover { border-color: var(--sig); border-left-color: var(--sig); }
  .cf-case .row1 {
    display: flex; align-items: center; gap: 0.55rem; flex-wrap: wrap;
  }
  .cf-case .ttl { font-weight: 700; font-size: 1.05rem; }
  .cf-case .by { opacity: 0.65; font-size: 0.88rem; }
  .cf-case .meta {
    font-family: var(--mono); font-size: 0.72rem; opacity: 0.6;
    margin-top: 0.3rem; letter-spacing: 0.05em;
  }
  .cf-case.closed { border-left-color: var(--ok); }
  .cf-stampbox { margin-left: auto; }
  .cf-stamp {
    font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.14em;
    border: 1px solid var(--stamp); color: var(--stamp);
    padding: 0.15rem 0.45rem; border-radius: 3px; transform: rotate(-2deg);
    display: inline-block; white-space: nowrap;
  }
  .cf-stamp.ok { border-color: var(--ok); color: var(--ok); }

  /* generic panel */
  .cf-panel {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 1rem 1.1rem; margin-bottom: 0.9rem;
    line-height: 1.65;
  }
  .cf-panel.quote {
    border-left: 3px solid var(--amber); background: var(--paper2);
    font-size: 1.08rem;
  }
  .cf-label {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em;
    text-transform: uppercase; opacity: 0.6; display: block;
    margin-bottom: 0.35rem;
  }
  .cf-anchor {
    font-size: 1.12rem; font-weight: 700; color: var(--amber);
    line-height: 1.5;
  }

  /* forms */
  .cf-field { margin-bottom: 0.9rem; }
  .cf-field label.lab {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em;
    text-transform: uppercase; opacity: 0.68; display: block;
    margin-bottom: 0.3rem;
  }
  .cf input[type=text], .cf textarea, .cf select {
    width: 100%; background: rgba(0,0,0,0.22); color: inherit;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 0.6rem 0.75rem; font-size: 1.02rem; line-height: 1.6;
  }
  .cf textarea { min-height: 92px; resize: vertical; }
  .cf input[type=text]:focus, .cf textarea:focus, .cf select:focus {
    outline: none; border-color: var(--sig);
  }
  .cf-chiprow { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .cf-chip {
    background: var(--paper); border: 1px solid var(--line); color: inherit;
    border-radius: 999px; padding: 0.4rem 0.8rem; font-size: 0.9rem;
    cursor: pointer;
  }
  .cf-chip:hover { border-color: var(--sig); }
  .cf-chip.on { border-color: var(--sig); background: rgba(34,211,238,0.14);
                color: var(--sig); font-weight: 600; }

  .cf-microw { display: flex; gap: 0.4rem; align-items: center;
               margin-top: 0.35rem; flex-wrap: wrap; }
  .cf-mic {
    background: none; border: 1px solid var(--line); color: inherit;
    border-radius: 999px; padding: 0.32rem 0.8rem; font-size: 0.84rem;
    cursor: pointer;
  }
  .cf-mic:hover { border-color: var(--sig); }
  .cf-mic.live {
    border-color: var(--stamp); color: var(--stamp);
    animation: cfPulse 1.1s infinite;
  }
  .cf-hint { font-size: 0.8rem; opacity: 0.6; line-height: 1.5; }

  .cf-btn {
    background: var(--sig); color: #04212a; border: none;
    border-radius: 4px; padding: 0.7rem 1.6rem; font-size: 1.02rem;
    font-weight: 700; cursor: pointer;
  }
  .cf-btn:hover { opacity: 0.9; }
  .cf-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .cf-btn.ghost {
    background: none; color: inherit; border: 1px solid var(--line);
    font-weight: 400;
  }
  .cf-btn.ghost:hover { border-color: var(--sig); }
  .cf-btn.danger { background: none; border: 1px solid var(--stamp);
                   color: var(--stamp); font-weight: 400; }
  .cf-row { display: flex; gap: 0.5rem; flex-wrap: wrap;
            align-items: center; margin-top: 0.9rem; }

  /* entries */
  .cf-entry {
    background: var(--paper); border: 1px solid var(--line);
    border-left: 3px solid var(--sig); border-radius: 0 4px 4px 0;
    padding: 0.75rem 0.95rem; margin-bottom: 0.5rem; line-height: 1.6;
  }
  .cf-entry .hd {
    display: flex; gap: 0.5rem; align-items: baseline; flex-wrap: wrap;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em;
    opacity: 0.7; margin-bottom: 0.35rem;
  }
  .cf-entry .hd .sp { color: var(--sig); }
  .cf-entry .q { font-size: 0.9rem; color: var(--amber); margin-top: 0.4rem; }
  .cf-entry .a { white-space: pre-wrap; }
  .cf-entry .w { white-space: pre-wrap; opacity: 0.9; }

  /* practice */
  .cf-opts { display: flex; flex-direction: column; gap: 0.5rem; }
  .cf-opt {
    background: var(--paper); border: 2px solid var(--line); color: inherit;
    border-radius: 4px; padding: 0.7rem 0.95rem; font-size: 1.02rem;
    cursor: pointer; text-align: left; line-height: 1.5;
  }
  .cf-opt:hover:not(:disabled) { border-color: var(--sig); }
  .cf-opt:disabled { cursor: default; }
  .cf-opt.dim { opacity: 0.32; }
  .cf-opt.yes { border-color: var(--ok); background: rgba(74,222,128,0.12); }
  .cf-opt.no { border-color: var(--stamp); animation: cfNudge 0.35s; }
  .cf-feedback { margin-top: 0.85rem; font-size: 1.02rem; line-height: 1.6; }
  .cf-feedback .teach {
    display: block; margin-top: 0.4rem; padding: 0.6rem 0.8rem;
    background: rgba(0,0,0,0.2); border-left: 3px solid var(--amber);
    border-radius: 0 4px 4px 0; font-size: 0.98rem;
  }

  .cf-badge {
    text-align: center; padding: 1.5rem 1rem;
  }
  .cf-badge .big { font-size: 3.2rem; }
  .cf-badge h2 { margin: 0.3rem 0; font-size: 1.4rem; }
  .cf-badge .code2 {
    font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.2em;
    color: var(--ok);
  }

  .cf-empty {
    border: 1px dashed var(--line); border-radius: 4px;
    padding: 1.2rem 1rem; text-align: center; opacity: 0.75;
    line-height: 1.6; font-size: 0.96rem;
  }

  .cf-guide details {
    border: 1px solid var(--line); border-radius: 4px; padding: 0.5rem 0.8rem;
    margin-bottom: 0.9rem; background: var(--paper);
  }
  .cf-guide summary {
    cursor: pointer; font-family: var(--mono); font-size: 0.76rem;
    letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75;
  }
  .cf-guide table { width: 100%; margin-top: 0.6rem; font-size: 0.92rem;
                    border-collapse: collapse; }
  .cf-guide td { padding: 0.35rem 0.3rem; vertical-align: top;
                 border-top: 1px solid var(--line); line-height: 1.5; }
  .cf-guide td.k { white-space: nowrap; color: var(--sig); font-weight: 600; }

  @keyframes cfNudge {
    25% { transform: translateX(-4px); } 75% { transform: translateX(4px); }
  }
  @keyframes cfPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.55); }
    50% { box-shadow: 0 0 0 10px rgba(248,113,113,0); }
  }

  @media (max-width: 520px) {
    .cf-hero h1 { font-size: 1.4rem; }
    .cf-panel.quote { font-size: 1rem; }
    .cf-opt { font-size: 0.96rem; }
  }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="cipher-root"><div class="cf" id="cf"></div></div>

<script>
(function () {
  'use strict';

  /* Encrypted blob injected by Jekyll from front matter field `encrypted` */
  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};
  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const key = await deriveKey(passphrase, blob.slice(0, 16));
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: blob.slice(16, 28) }, key, blob.slice(28));
    return new TextDecoder().decode(pt);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('cipher-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }
  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }
  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse training data.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Field.boot(data);
  }
  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) { try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {} }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }
  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true; input.disabled = true;
        try { reveal(await decrypt(cached)); return; }
        catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false; input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }
  btn.addEventListener('click', function () {
    if (!input.value) { input.focus(); return; }
    tryUnlock(input.value, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ═══════════════════ CIPHER · Field Craft ════════════════════════════
     Two phases, and the split is the whole point of this page:

     PHASE A — Signal Training. Six Notice & Note signposts (Beers &
     Probst), one short lesson each, then it ENDS. Comprehension-strategy
     instruction has a ~10 hour ceiling (Willingham); drilling it forever
     is wasted time. Six badges, done.

     PHASE B — Case Files. The part that actually raises reading level:
     a journal over the books he is REALLY reading. He logs a signpost he
     spotted, says where, what happened, and answers that signpost's
     anchor question in his own words — typed or dictated. Closing a book
     opens a debrief of open interpretive questions (Shared Inquiry
     style: more than one defensible answer, evidence required).

     Nothing he writes is auto-graded. The point is that he produces
     reasoning, not that a regex scores it.

     Save: `cipher-v1`, shared with the other CIPHER pages. His entries
     are his own writing and live only in localStorage — the hub page
     owns Export/Import so they can be backed up.
  ═══════════════════════════════════════════════════════════════════════ */

  const Field = (function () {

    const el = document.getElementById('cf');
    let DATA = null;

    /* ── save ─────────────────────────────────────────────────────────── */
    const PKEY = 'cipher-v1';
    let P = {};
    try { P = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.v = P.v || 1;
    P.signposts = P.signposts || {};   /* id -> {done:1, d:'YYYY-MM-DD'} */
    P.books = P.books || [];           /* {id,title,author,emoji,started,closed,debrief} */
    P.entries = P.entries || [];       /* {id,book,sp,where,what,answer,d} */
    P.settings = P.settings || {};
    if (P.settings.voice === undefined) P.settings.voice = true;
    if (P.settings.sound === undefined) P.settings.sound = true;
    if (P.settings.mic === undefined) P.settings.mic = true;
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }
    function today() { return new Date().toISOString().slice(0, 10); }
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    /* ── speech out (same rules as the site's other engines) ──────────── */
    const VOICE_KEY = 'mwestwood-voice-name';
    let voiceName = localStorage.getItem(VOICE_KEY) || '';
    const JOKE_VOICES = ['Albert', 'Bad News', 'Bahh', 'Bells', 'Boing',
      'Bubbles', 'Cellos', 'Good News', 'Jester', 'Organ', 'Superstar',
      'Trinoids', 'Whisper', 'Wobble', 'Zarvox', 'Deranged', 'Hysterical'];
    const NICE_NAMES = /^(Samantha|Ava|Allison|Susan|Zoe|Karen|Daniel|Moira|Tessa|Fiona|Serena|Kate)\b/;
    let VOICES = [], chosenVoice = null;

    function rankVoice(v) {
      const n = v.name;
      let r = 60;
      if (n === 'Google US English') r = -100;
      else if (/natural|neural/i.test(n)) r = 0;
      else if (/enhanced|premium/i.test(n)) r = 10;
      else if (NICE_NAMES.test(n)) r = 20;
      else if (/^Google/i.test(n)) r = 30;
      else if (v.localService) r = 40;
      if (/^en[-_]US/i.test(v.lang)) r -= 5;
      else if (/^en/i.test(v.lang)) r -= 2;
      return r;
    }
    function loadVoices() {
      try {
        if (!window.speechSynthesis) return;
        const all = speechSynthesis.getVoices().filter(function (v) {
          if (!/^en/i.test(v.lang)) return false;
          return JOKE_VOICES.indexOf(v.name.replace(/\s*\(.*\)$/, '')) === -1;
        });
        if (!all.length) return;
        all.sort(function (a, b) {
          return rankVoice(a) - rankVoice(b) || a.name.localeCompare(b.name);
        });
        VOICES = all;
        chosenVoice = voiceName
          ? (all.find(function (v) { return v.name === voiceName; }) || all[0])
          : all[0];
      } catch (_) {}
    }
    loadVoices();
    try { speechSynthesis.onvoiceschanged = loadVoices; } catch (_) {}
    setTimeout(loadVoices, 300);

    /* iOS needs speak() synchronous in the tap handler; Chrome needs a
       small deferral when cancel() interrupts active speech (Chromium
       679437). Same logic as every other engine on this site. */
    const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const CAN_DEFER_SPEECH = !IS_IOS;

    function speak(text) {
      if (!P.settings.voice) return;
      try {
        if (!window.speechSynthesis) return;
        const was = speechSynthesis.speaking;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(
          String(text).replace(/[⚡💡❓🧭🔁🕰️📁🎙️…]/g, ''));
        u.rate = 0.92;
        if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; u.pitch = 1; }
        if (was && CAN_DEFER_SPEECH) {
          setTimeout(function () { try { speechSynthesis.speak(u); } catch (_) {} }, 50);
        } else { speechSynthesis.speak(u); }
      } catch (_) {}
    }

    let audioCtx = null;
    function tone(f, s, d, v) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, audioCtx.currentTime + s);
      g.gain.linearRampToValueAtTime(v, audioCtx.currentTime + s + 0.02);
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + s + d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + s);
      o.stop(audioCtx.currentTime + s + d + 0.05);
    }
    function sfx(kind) {
      if (!P.settings.sound) return;
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (kind === 'good') { tone(523, 0, 0.13, 0.06); tone(784, 0.11, 0.18, 0.06); }
        else if (kind === 'soft') { tone(233, 0, 0.17, 0.04); }
        else if (kind === 'badge') { tone(659, 0, 0.11, 0.055); tone(784, 0.09, 0.11, 0.055); tone(1047, 0.19, 0.24, 0.055); }
      } catch (_) {}
    }

    /* ── speech in (dictation into a textarea) ────────────────────────── */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const MIC_OK = !!SR;

    /* Attaches a dictate button to a textarea. Transcript is APPENDED to
       whatever he already typed, so mic and keyboard mix freely. */
    function attachMic(textarea, host) {
      if (!MIC_OK || !P.settings.mic) return;
      const row = document.createElement('div');
      row.className = 'cf-microw';
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cf-mic';
      b.textContent = '🎙️ Say it instead';
      row.appendChild(b);
      const note = document.createElement('span');
      note.className = 'cf-hint';
      row.appendChild(note);
      host.appendChild(row);

      let rec = null;
      b.addEventListener('click', function () {
        if (rec) { try { rec.stop(); } catch (_) {} return; }
        try { rec = new SR(); } catch (_) { note.textContent = 'Mic unavailable.'; return; }
        rec.lang = 'en-US';
        rec.continuous = true;
        rec.interimResults = true;
        const base = textarea.value ? textarea.value.replace(/\s+$/, '') + ' ' : '';
        let finalText = '';
        b.classList.add('live');
        b.textContent = '⏹ Stop';
        note.textContent = 'listening…';
        rec.onresult = function (e) {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) finalText += r[0].transcript + ' ';
            else interim += r[0].transcript;
          }
          textarea.value = base + finalText + interim;
        };
        function done(msg) {
          rec = null;
          b.classList.remove('live');
          b.textContent = '🎙️ Say it instead';
          note.textContent = msg || '';
          textarea.dispatchEvent(new Event('input'));
        }
        rec.onerror = function (e) {
          const c = (e && e.error) || 'error';
          done(c === 'not-allowed' ? 'Mic blocked — just type it.'
             : c === 'no-speech' ? "Didn't catch that."
             : '');
        };
        rec.onend = function () { done(''); };
        try { rec.start(); } catch (_) { done('Could not start mic.'); }
      });
    }

    /* ── helpers ─────────────────────────────────────────────────────── */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                 '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    /* both toolkits are looked up through one function so entries, the
       field guide and the lesson flow all work regardless of which kind
       of move he logged */
    function allMoves() {
      return DATA.signposts.concat(DATA.sources || []);
    }
    function spById(id) {
      return allMoves().find(function (s) { return s.id === id; }) || null;
    }
    function isSource(id) {
      return (DATA.sources || []).some(function (s) { return s.id === id; });
    }
    function bookById(id) {
      return P.books.find(function (b) { return b.id === id; }) || null;
    }
    function entriesFor(bookId) {
      return P.entries.filter(function (e) { return e.book === bookId; });
    }
    function trainedCount() {
      return DATA.signposts.filter(function (s) {
        return P.signposts[s.id] && P.signposts[s.id].done;
      }).length;
    }
    function sourceTrainedCount() {
      return (DATA.sources || []).filter(function (s) {
        return P.signposts[s.id] && P.signposts[s.id].done;
      }).length;
    }

    /* quick-reference of all six anchor questions — available wherever he
       is writing an entry, so he never has to leave the page to remember
       what a signpost asks */
    function fieldGuide() {
      const wrap = document.createElement('div');
      wrap.className = 'cf-guide';

    /* ── HOME ─────────────────────────────────────────────────────────── */
    function home() {
      el.innerHTML = '';
      el.appendChild(topBar(null, null));

      const trained = trainedCount();
      const srcTrained = sourceTrainedCount();
      const nSrc = (DATA.sources || []).length;
      const open = P.books.filter(function (b) { return !b.closed; });
      const closed = P.books.filter(function (b) { return b.closed; });

      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML =
        '<div class="tag">Cipher // Field Craft</div>' +
        '<h1>📁 Field Craft</h1>' +
        '<p>Signals for stories, source checks for everything else — ' +
        'then take them into whatever you are really reading.</p>' +
        '<div class="cf-statbar">' +
          '<div class="cf-stat"><b>' + trained + '/6</b><span>SIGNALS</span></div>' +
          '<div class="cf-stat"><b>' + srcTrained + '/' + nSrc +
            '</b><span>SOURCE CHECKS</span></div>' +
          '<div class="cf-stat"><b>' + open.length + '</b><span>OPEN CASES</span></div>' +
          '<div class="cf-stat"><b>' + closed.length + '</b><span>CLOSED</span></div>' +
          '<div class="cf-stat"><b>' + P.entries.length + '</b><span>ENTRIES</span></div>' +
        '</div>';
      el.appendChild(hero);

      /* Phase A */
      const h1 = document.createElement('div');
      h1.className = 'cf-sect';
      h1.innerHTML = '<span class="n">01</span> Signal training — for stories ' +
        (trained === 6 ? '— complete ✅' : '— ' + trained + ' of 6 done');
      el.appendChild(h1);

      if (trained === 6 && srcTrained === nSrc) {
        const p = document.createElement('div');
        p.className = 'cf-panel';
        p.innerHTML = '<span class="cf-label">Training status</span>' +
          'Both toolkits trained — six signals and ' + nSrc + ' source ' +
          'checks. That is the whole kit, and there is deliberately no ' +
          'more to grind. From here the work is using them on real books ' +
          'and real articles, down in your case files.';
        el.appendChild(p);
      }

      function trackGrid(list) {
        const grid = document.createElement('div');
        grid.className = 'cf-grid';
        list.forEach(function (sp) {
          const done = !!(P.signposts[sp.id] && P.signposts[sp.id].done);

          b.addEventListener('click', function () { lesson(sp); });
          grid.appendChild(b);
        });

      }
      el.appendChild(trackGrid(DATA.signposts));

      /* Source Check — the second finite toolkit, for non-fiction */
      const h1b = document.createElement('div');
      h1b.className = 'cf-sect';
      h1b.innerHTML = '<span class="n">01b</span> Source check — for ' +
        'articles, websites, anything that wants you to believe it ' +
        (srcTrained === nSrc ? '— complete ✅' : '— ' + srcTrained + ' of ' +
         nSrc + ' done');
      el.appendChild(h1b);
      el.appendChild(trackGrid(DATA.sources || []));

      /* Inspectional reading — one lesson, not a track */
      if (DATA.inspect) {
        const ins = document.createElement('button');
        ins.className = 'cf-sp';
        ins.style.marginTop = '0.55rem';
        ins.style.width = '100%';
        const insDone = !!(P.signposts[DATA.inspect.id] &&
                           P.signposts[DATA.inspect.id].done);
        if (insDone) ins.classList.add('done');
        ins.innerHTML = '<span class="em">' + DATA.inspect.emoji + '</span>' +
          '<span class="code">PRE-READ</span>' +
          '<span class="nm">' + esc(DATA.inspect.name) + '</span>' +
          '<span class="st">' + (insDone ? '✓ LEARNED' : 'START →') +
          '</span>';
        ins.addEventListener('click', inspectLesson);
        el.appendChild(ins);
      }

      /* Phase B */
      const h2 = document.createElement('div');
      h2.className = 'cf-sect';
      h2.innerHTML = '<span class="n">02</span> Case files — books you are reading';
      el.appendChild(h2);

      if (!P.books.length) {
        const e = document.createElement('div');
        e.className = 'cf-empty';
        e.innerHTML = 'No case files open yet.<br>' +
          'Add the book you are reading right now — it does not matter how ' +

        el.appendChild(e);

      open.forEach(function (b) { el.appendChild(caseRow(b)); });
      if (closed.length) {
        const h3 = document.createElement('div');

      const row = document.createElement('div');

      add.addEventListener('click', newBook);
      row.appendChild(add);
      el.appendChild(row);

    function caseRow(b) {

        '</div>' +

    /* ── PHASE A: a signpost lesson ───────────────────────────────────── */
    function lesson(sp) {
      let step = 0;                 /* 0 = teach, then practice items */
      const prac = sp.practice;

      function teach() {
        el.innerHTML = '';
        el.appendChild(topBar('Field Craft', home));

        const hero = document.createElement('div');
        hero.className = 'cf-hero';
        hero.innerHTML =
          '<div class="tag">Signal ' + esc(sp.code) + '</div>' +
          '<h1>' + sp.emoji + ' ' + esc(sp.name) + '</h1>';
        el.appendChild(hero);

        const what = document.createElement('div');
        what.className = 'cf-panel';
        what.innerHTML = '<span class="cf-label">What it is</span>' +
          esc(sp.what);
        el.appendChild(what);

        const anchor = document.createElement('div');
        anchor.className = 'cf-panel quote';
        anchor.innerHTML = '<span class="cf-label">When you spot it, ask</span>' +
          '<div class="cf-anchor">' + esc(sp.anchor) + '</div>';
        el.appendChild(anchor);

        const why = document.createElement('div');
        why.className = 'cf-panel';
        why.innerHTML = '<span class="cf-label">Why it pays off</span>' +
          esc(sp.why);
        el.appendChild(why);

        const exH = document.createElement('div');
        exH.className = 'cf-sect';
        exH.innerHTML = '<span class="n">EX</span> Worked example';
        el.appendChild(exH);

        const ex = document.createElement('div');
        ex.className = 'cf-panel quote';
        ex.textContent = sp.example.text;
        el.appendChild(ex);

        const spot = document.createElement('div');
        spot.className = 'cf-panel';
        spot.innerHTML = '<span class="cf-label">What to notice</span>' +
          esc(sp.example.spot) +
          '<div style="margin-top:0.7rem"><span class="cf-label">' +
          'What it tells you</span>' + esc(sp.example.think) + '</div>';
        el.appendChild(spot);

        const row = document.createElement('div');
        row.className = 'cf-row';
        const go = document.createElement('button');
        go.className = 'cf-btn';
        go.textContent = 'Try spotting it ▸';
        go.addEventListener('click', function () { step = 1; ask(); });
        row.appendChild(go);
        const hear = document.createElement('button');
        hear.className = 'cf-btn ghost';
        hear.textContent = '🔊 Read this to me';
        hear.addEventListener('click', function () {
          speak(sp.name + '. ' + sp.what + ' When you spot it, ask: ' +
                sp.anchor + '. ' + sp.example.text);
        });
        row.appendChild(hear);
        el.appendChild(row);

        window.scrollTo(0, 0);
      }

      function ask() {
        const p = prac[step - 1];
        let tries = 0;

        el.innerHTML = '';
        el.appendChild(topBar('Field Craft', home));

        const hero = document.createElement('div');
        hero.className = 'cf-hero';
        hero.innerHTML =
          '<div class="tag">Signal ' + esc(sp.code) + ' // practice ' +
          step + ' of ' + prac.length + '</div>' +
          '<h1>' + sp.emoji + ' ' + esc(sp.name) + '</h1>' +
          '<p><b>Ask:</b> ' + esc(sp.anchor) + '</p>';
        el.appendChild(hero);

        const text = document.createElement('div');
        text.className = 'cf-panel quote';
        text.textContent = p.text;
        el.appendChild(text);

        const q = document.createElement('div');
        q.style.fontSize = '1.1rem';
        q.style.fontWeight = '700';
        q.style.margin = '0.9rem 0 0.7rem';
        q.textContent = p.q;
        el.appendChild(q);

        const opts = document.createElement('div');
        opts.className = 'cf-opts';
        const fb = document.createElement('div');
        fb.className = 'cf-feedback';

        p.opts.slice().sort(function () { return Math.random() - 0.5; })
          .forEach(function (o) {
            const b = document.createElement('button');
            b.className = 'cf-opt';
            b.textContent = o[0];
            b.addEventListener('click', function () {
              if (o[1]) {
                Array.prototype.forEach.call(opts.children, function (x) { x.disabled = true; });
                b.classList.add('yes');
                sfx('good');
                fb.innerHTML = (tries === 0 ? '✅ <b>Signal confirmed.</b>' :
                                             '✅ <b>Got it.</b>') +
                  '<span class="teach">' + esc(p.teach) + '</span>';
                next(fb);
              } else {
                tries++;
                if (tries === 1) {
                  b.classList.add('no');
                  setTimeout(function () {
                    b.classList.remove('no'); b.classList.add('dim'); b.disabled = true;
                  }, 350);
                  sfx('soft');
                  fb.textContent = 'Not that one — read it again and look for the moment that surprises you.';
                } else {
                  Array.prototype.forEach.call(opts.children, function (x) {
                    x.disabled = true;
                    if (p.opts.some(function (o2) { return o2[1] && o2[0] === x.textContent; })) {
                      x.classList.add('yes');
                    }
                  });
                  sfx('soft');
                  fb.innerHTML = 'Here it is —' +
                    '<span class="teach">' + esc(p.teach) + '</span>';
                  next(fb);
                }
              }
            });
            opts.appendChild(b);
          });
        el.appendChild(opts);
        el.appendChild(fb);
        window.scrollTo(0, 0);
      }

      function next(host) {
        const row = document.createElement('div');
        row.className = 'cf-row';
        const b = document.createElement('button');
        b.className = 'cf-btn';
        b.textContent = step < prac.length ? 'Next ▸' : 'Finish training ▸';
        b.addEventListener('click', function () {
          step++;
          if (step <= prac.length) ask();
          else badge();
        });
        row.appendChild(b);
        host.appendChild(row);
      }

      function badge() {
        const first = !(P.signposts[sp.id] && P.signposts[sp.id].done);
        P.signposts[sp.id] = { done: 1, d: today() };
        save();
        sfx('badge');

        el.innerHTML = '';
        el.appendChild(topBar('Field Craft', home));
        const b = document.createElement('div');
        b.className = 'cf-badge';
        b.innerHTML = '<div class="big">' + sp.emoji + '</div>' +
          '<div class="code2">SIGNAL ' + esc(sp.code) + ' TRAINED</div>' +
          '<h2>' + esc(sp.name) + '</h2>' +
          '<p style="opacity:0.8;line-height:1.6;max-width:38rem;margin:0.6rem auto">' +
          'Now watch for it in whatever you are reading. When you spot one, ' +
          'log it in the case file and answer:<br><b style="color:var(--amber)">' +
          esc(sp.anchor) + '</b></p>';
        el.appendChild(b);

        const trained = trainedCount();
        const row = document.createElement('div');
        row.className = 'cf-row';
        row.style.justifyContent = 'center';
        if (trained === 6) {
          const done = document.createElement('div');
          done.className = 'cf-panel';
          done.style.textAlign = 'center';
          done.innerHTML = '<b>All six signals trained.</b><br>' +
            'That is the complete toolkit. Everything from here happens in ' +
            'real books.';
          el.appendChild(done);
        }
        const openCase = P.books.filter(function (x) { return !x.closed; })[0];
        if (openCase) {
          const g = document.createElement('button');
          g.className = 'cf-btn';
          g.textContent = '📁 Log this in ' + openCase.title;
          g.addEventListener('click', function () { newEntry(openCase.id, sp.id); });
          row.appendChild(g);
        } else {
          const g = document.createElement('button');
          g.className = 'cf-btn';
          g.textContent = '+ Open a case file';
          g.addEventListener('click', newBook);
          row.appendChild(g);
        }
        const back = document.createElement('button');
        back.className = 'cf-btn ghost';
        back.textContent = 'Back to Field Craft';
        back.addEventListener('click', home);
        row.appendChild(back);
        el.appendChild(row);
        if (first) speak('Signal trained. ' + sp.name + '.');
        window.scrollTo(0, 0);
      }

      teach();
    }

    /* ── Inspectional reading (Adler level 2) ─────────────────────────── */
    /* One lesson, no practice bank — it is a habit, not a skill to drill.
       Five minutes of scanning before page one gives every later page
       somewhere to attach itself. */
    function inspectLesson() {
      const ins = DATA.inspect;
      el.innerHTML = '';
      el.appendChild(topBar('Field Craft', home));

      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML = '<div class="tag">Pre-read // before page one</div>' +
        '<h1>' + ins.emoji + ' ' + esc(ins.name) + '</h1>';
      el.appendChild(hero);

      const what = document.createElement('div');
      what.className = 'cf-panel';
      what.innerHTML = '<span class="cf-label">What it is</span>' +
        esc(ins.what);
      el.appendChild(what);

      const why = document.createElement('div');
      why.className = 'cf-panel quote';
      why.innerHTML = '<span class="cf-label">Why it works</span>' +
        esc(ins.why);
      el.appendChild(why);

      const h = document.createElement('div');
      h.className = 'cf-sect';
      h.innerHTML = '<span class="n">▸</span> The five-minute scan';
      el.appendChild(h);

      const list = document.createElement('div');
      ins.steps.forEach(function (s, i) {
        const d = document.createElement('div');
        d.className = 'cf-entry';
        d.innerHTML = '<div class="hd"><span class="sp">STEP ' + (i + 1) +
          '</span></div><div class="w">' + esc(s) + '</div>';
        list.appendChild(d);
      });
      el.appendChild(list);

      const row = document.createElement('div');
      row.className = 'cf-row';
      const done = document.createElement('button');
      done.className = 'cf-btn';
      done.textContent = '✅ Got it';
      done.addEventListener('click', function () {
        P.signposts[ins.id] = { done: 1, d: today() };
        save();
        sfx('badge');
        home();
      });
      row.appendChild(done);
      const hear = document.createElement('button');
      hear.className = 'cf-btn ghost';
      hear.textContent = '🔊 Read this to me';
      hear.addEventListener('click', function () {
        speak(ins.name + '. ' + ins.what + ' ' + ins.why + ' ' +
              ins.steps.join('. '));
      });
      row.appendChild(hear);
      el.appendChild(row);
      window.scrollTo(0, 0);
    }

    /* ── PHASE B: books ───────────────────────────────────────────────── */
    const EMOJI = ['📕', '📗', '📘', '📙', '🕵️', '⚔️', '🏰', '🚀', '🐉',
                   '⚽', '🎸', '🌊', '🗺️', '🔦', '🧭'];

    function newBook() {
      el.innerHTML = '';
      el.appendChild(topBar('Field Craft', home));

      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML = '<div class="tag">New case file</div>' +
        '<h1>📁 Open a case</h1>' +
        '<p>A book you are reading right now — or one you just started.</p>';
      el.appendChild(hero);

      const panel = document.createElement('div');
      panel.className = 'cf-panel';

      const f1 = document.createElement('div');
      f1.className = 'cf-field';
      f1.innerHTML = '<label class="lab" for="cf-t">Title</label>';
      const t = document.createElement('input');
      t.type = 'text'; t.id = 'cf-t'; t.placeholder = 'e.g. Stormbreaker';
      f1.appendChild(t);
      panel.appendChild(f1);

      const f2 = document.createElement('div');
      f2.className = 'cf-field';
      f2.innerHTML = '<label class="lab" for="cf-a">Author (optional)</label>';
      const a = document.createElement('input');
      a.type = 'text'; a.id = 'cf-a'; a.placeholder = 'e.g. Anthony Horowitz';
      f2.appendChild(a);
      panel.appendChild(f2);

      const f3 = document.createElement('div');
      f3.className = 'cf-field';
      f3.innerHTML = '<label class="lab">Cover mark</label>';
      const chips = document.createElement('div');
      chips.className = 'cf-chiprow';
      let picked = EMOJI[0];
      EMOJI.forEach(function (em, i) {
        const c = document.createElement('button');
        c.type = 'button';
        c.className = 'cf-chip' + (i === 0 ? ' on' : '');
        c.textContent = em;
        c.addEventListener('click', function () {
          picked = em;
          Array.prototype.forEach.call(chips.children, function (x) {
            x.classList.remove('on');
          });
          c.classList.add('on');
        });
        chips.appendChild(c);
      });
      f3.appendChild(chips);
      panel.appendChild(f3);
      el.appendChild(panel);

      const err = document.createElement('div');
      err.className = 'cf-hint';
      err.style.color = 'var(--stamp)';
      el.appendChild(err);

      const row = document.createElement('div');
      row.className = 'cf-row';
      const ok = document.createElement('button');
      ok.className = 'cf-btn';
      ok.textContent = 'Open case file';
      ok.addEventListener('click', function () {
        const title = t.value.trim();
        if (!title) { err.textContent = 'A title is needed to open the case.'; t.focus(); return; }
        const b = { id: uid(), title: title, author: a.value.trim(),
                    emoji: picked, started: today(), closed: '', debrief: null };
        P.books.unshift(b);
        save();
        sfx('good');
        caseFile(b.id);
      });
      row.appendChild(ok);
      const cancel = document.createElement('button');
      cancel.className = 'cf-btn ghost';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', home);
      row.appendChild(cancel);
      el.appendChild(row);
      t.focus();
      window.scrollTo(0, 0);
    }

    function caseFile(bookId) {
      const b = bookById(bookId);
      if (!b) { home(); return; }
      const entries = entriesFor(bookId);

      el.innerHTML = '';
      el.appendChild(topBar('Field Craft', home));

      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML =
        '<div class="tag">Case file · ' +
        (b.closed ? 'closed ' + esc(b.closed) : 'active') + '</div>' +
        '<h1>' + (b.emoji || '📕') + ' ' + esc(b.title) + '</h1>' +
        (b.author ? '<p>' + esc(b.author) + '</p>' : '') +
        '<div class="cf-statbar">' +
          '<div class="cf-stat"><b>' + entries.length + '</b><span>ENTRIES</span></div>' +
          '<div class="cf-stat"><b>' +
            new Set(entries.map(function (e) { return e.sp; })).size +
            '</b><span>SIGNALS USED</span></div>' +
          '<div class="cf-stat"><b>' + esc(b.started) + '</b><span>OPENED</span></div>' +
        '</div>';
      el.appendChild(hero);

      el.appendChild(fieldGuide());

      if (!b.closed) {
        const row = document.createElement('div');
        row.className = 'cf-row';
        const add = document.createElement('button');
        add.className = 'cf-btn';
        add.textContent = '+ Log what you spotted';
        add.addEventListener('click', function () { newEntry(bookId, null); });
        row.appendChild(add);
        const close = document.createElement('button');
        close.className = 'cf-btn ghost';
        close.textContent = '🏁 Finished the book — debrief';
        close.addEventListener('click', function () { debrief(bookId); });
        row.appendChild(close);
        el.appendChild(row);
      }

      if (b.debrief) {
        const h = document.createElement('div');
        h.className = 'cf-sect';
        h.innerHTML = '<span class="n">DB</span> Debrief';
        el.appendChild(h);
        DATA.debrief.forEach(function (d) {
          const ans = b.debrief[d.id];
          if (!ans) return;
          const p = document.createElement('div');
          p.className = 'cf-panel';
          p.innerHTML = '<span class="cf-label">' + esc(d.q) + '</span>' +
            '<div style="white-space:pre-wrap">' + esc(ans) + '</div>';
          el.appendChild(p);
        });
      }

      const h = document.createElement('div');
      h.className = 'cf-sect';
      h.innerHTML = '<span class="n">LOG</span> Signals spotted';
      el.appendChild(h);

      if (!entries.length) {
        const e = document.createElement('div');
        e.className = 'cf-empty';
        e.innerHTML = 'Nothing logged yet.<br>Next time a character does ' +
          'something surprising, or the author repeats something, or someone ' +
          'gives advice — stop and log it.';
        el.appendChild(e);
      }

      entries.slice().reverse().forEach(function (en) {
        const sp = spById(en.sp);
        const d = document.createElement('div');
        d.className = 'cf-entry';
        d.innerHTML =
          '<div class="hd"><span class="sp">' +
            (sp ? sp.emoji + ' ' + esc(sp.name) : esc(en.sp)) + '</span>' +
            (en.where ? '<span>· ' + esc(en.where) + '</span>' : '') +
            '<span>· ' + esc(en.d) + '</span></div>' +
          '<div class="w">' + esc(en.what) + '</div>' +
          (sp ? '<div class="q">' + esc(sp.anchor) + '</div>' : '') +
          '<div class="a">' + esc(en.answer) + '</div>';
        const del = document.createElement('button');
        del.className = 'cf-btn danger';
        del.style.marginTop = '0.5rem';
        del.style.padding = '0.25rem 0.7rem';
        del.style.fontSize = '0.8rem';
        del.textContent = 'Delete';
        del.addEventListener('click', function () {
          P.entries = P.entries.filter(function (x) { return x.id !== en.id; });
          save();
          caseFile(bookId);
        });
        d.appendChild(del);
        el.appendChild(d);
      });

      const row2 = document.createElement('div');
      row2.className = 'cf-row';
      const rm = document.createElement('button');
      rm.className = 'cf-btn danger';
      rm.textContent = 'Delete this case file';
      rm.addEventListener('click', function () {
        if (rm.dataset.armed !== '1') {
          rm.dataset.armed = '1';
          rm.textContent = 'Tap again to delete — this cannot be undone';
          return;
        }
        P.books = P.books.filter(function (x) { return x.id !== bookId; });
        P.entries = P.entries.filter(function (x) { return x.book !== bookId; });
        save();
        home();
      });
      row2.appendChild(rm);
      el.appendChild(row2);

      window.scrollTo(0, 0);
    }

    function newEntry(bookId, presetSp) {
      const b = bookById(bookId);
      if (!b) { home(); return; }

      el.innerHTML = '';
      el.appendChild(topBar('Case file', function () { caseFile(bookId); }));

      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML = '<div class="tag">' + esc(b.title) + '</div>' +
        '<h1>📌 Log what you spotted</h1>' +
        '<p>You spotted something. Get it down while it is fresh.</p>';
      el.appendChild(hero);

      let chosen = presetSp || null;

      const panel = document.createElement('div');
      panel.className = 'cf-panel';

      const f1 = document.createElement('div');
      f1.className = 'cf-field';
      f1.innerHTML = '<label class="lab">What did you spot?</label>';
      const chipHosts = [];

      /* two chip groups — story signals and source checks — so the
         journal works for a novel and for a news article alike */
      function chipGroup(list, heading) {
        if (!list || !list.length) return;
        const lab = document.createElement('div');
        lab.className = 'cf-hint';
        lab.style.margin = '0.15rem 0 0.3rem';
        lab.style.fontFamily = 'var(--mono)';
        lab.style.letterSpacing = '0.1em';
        lab.style.textTransform = 'uppercase';
        lab.style.fontSize = '0.66rem';
        lab.textContent = heading;
        f1.appendChild(lab);
        const chips = document.createElement('div');
        chips.className = 'cf-chiprow';
        chips.style.marginBottom = '0.5rem';
        list.forEach(function (sp) {
          const c = document.createElement('button');
          c.type = 'button';
          c.className = 'cf-chip' + (chosen === sp.id ? ' on' : '');
          c.textContent = sp.emoji + ' ' + sp.name;
          c.addEventListener('click', function () {
            chosen = sp.id;
            chipHosts.forEach(function (h) {
              Array.prototype.forEach.call(h.children, function (x) {
                x.classList.remove('on');
              });
            });
            c.classList.add('on');
            paintAnchor();
          });
          chips.appendChild(c);
        });
        f1.appendChild(chips);
        chipHosts.push(chips);
      }
      chipGroup(DATA.signposts, 'In a story');
      chipGroup(DATA.sources, 'In an article or anything factual');
      panel.appendChild(f1);

      const f2 = document.createElement('div');
      f2.className = 'cf-field';
      f2.innerHTML = '<label class="lab" for="cf-w">Where? (chapter or page)</label>';
      const where = document.createElement('input');
      where.type = 'text'; where.id = 'cf-w'; where.placeholder = 'e.g. ch. 7, or p. 112';
      f2.appendChild(where);
      panel.appendChild(f2);

      const f3 = document.createElement('div');
      f3.className = 'cf-field';
      f3.innerHTML = '<label class="lab" for="cf-what">What happened?</label>';
      const what = document.createElement('textarea');
      what.id = 'cf-what';
      what.placeholder = 'A sentence or two — just enough to remember it.';
      f3.appendChild(what);
      attachMic(what, f3);
      panel.appendChild(f3);

      const f4 = document.createElement('div');
      f4.className = 'cf-field';
      const anchorBox = document.createElement('div');
      anchorBox.className = 'cf-panel quote';
      anchorBox.style.marginBottom = '0.5rem';
      f4.appendChild(anchorBox);
      const ans = document.createElement('textarea');
      ans.id = 'cf-ans';
      ans.placeholder = 'Your thinking. There is no right answer here — say what you reckon, and why.';
      f4.appendChild(ans);
      attachMic(ans, f4);
      panel.appendChild(f4);
      el.appendChild(panel);

      function paintAnchor() {
        const sp = chosen ? spById(chosen) : null;
        anchorBox.innerHTML = sp
          ? '<span class="cf-label">Now answer</span>' +
            '<div class="cf-anchor">' + esc(sp.anchor) + '</div>'
          : '<span class="cf-label">Now answer</span>' +
            '<div style="opacity:0.65">Pick a signal above and its question ' +
            'appears here.</div>';
      }
      paintAnchor();

      const err = document.createElement('div');
      err.className = 'cf-hint';
      err.style.color = 'var(--stamp)';
      el.appendChild(err);

      const row = document.createElement('div');
      row.className = 'cf-row';
      const ok = document.createElement('button');
      ok.className = 'cf-btn';
      ok.textContent = 'Save to case file';
      ok.addEventListener('click', function () {
        if (!chosen) { err.textContent = 'Pick what you spotted first.'; return; }
        if (!what.value.trim() && !ans.value.trim()) {
          err.textContent = 'Write what happened, or your thinking — even one line.';
          return;
        }
        P.entries.push({
          id: uid(), book: bookId, sp: chosen,
          where: where.value.trim(), what: what.value.trim(),
          answer: ans.value.trim(), d: today()
        });
        save();
        sfx('good');
        caseFile(bookId);
      });
      row.appendChild(ok);
      const cancel = document.createElement('button');
      cancel.className = 'cf-btn ghost';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', function () { caseFile(bookId); });
      row.appendChild(cancel);
      el.appendChild(row);
      window.scrollTo(0, 0);
    }

    /* ── close a case: open interpretive debrief ──────────────────────── */
    function debrief(bookId) {
      const b = bookById(bookId);
      if (!b) { home(); return; }

      el.innerHTML = '';
      el.appendChild(topBar('Case file', function () { caseFile(bookId); }));

      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML = '<div class="tag">' + esc(b.title) + '</div>' +
        '<h1>🏁 Debrief</h1>' +
        '<p>Four questions. None of them have one right answer — that is the ' +
        'point. Back up what you say with something from the book.</p>';
      el.appendChild(hero);

      const boxes = {};
      DATA.debrief.forEach(function (d) {
        const panel = document.createElement('div');
        panel.className = 'cf-panel';
        panel.innerHTML = '<span class="cf-label">' + esc(d.q) + '</span>' +
          '<div class="cf-hint" style="margin-bottom:0.5rem">' +
          esc(d.hint) + '</div>';
        const ta = document.createElement('textarea');
        ta.placeholder = 'Your answer…';
        if (b.debrief && b.debrief[d.id]) ta.value = b.debrief[d.id];
        panel.appendChild(ta);
        attachMic(ta, panel);
        boxes[d.id] = ta;
        el.appendChild(panel);
      });

      const err = document.createElement('div');
      err.className = 'cf-hint';
      err.style.color = 'var(--stamp)';
      el.appendChild(err);

      const row = document.createElement('div');
      row.className = 'cf-row';
      const ok = document.createElement('button');
      ok.className = 'cf-btn';
      ok.textContent = '🏁 Close the case';
      ok.addEventListener('click', function () {
        const out = {};
        let any = false;
        Object.keys(boxes).forEach(function (k) {
          const v = boxes[k].value.trim();
          if (v) { out[k] = v; any = true; }
        });
        if (!any) { err.textContent = 'Answer at least one before closing.'; return; }
        b.debrief = out;
        b.closed = today();
        save();
        sfx('badge');
        speak('Case closed. ' + b.title + '.');
        caseFile(bookId);
      });
      row.appendChild(ok);
      const later = document.createElement('button');
      later.className = 'cf-btn ghost';
      later.textContent = 'Save and finish later';
      later.addEventListener('click', function () {
        const out = {};
        Object.keys(boxes).forEach(function (k) {
          const v = boxes[k].value.trim();
          if (v) out[k] = v;
        });
        b.debrief = Object.keys(out).length ? out : null;
        save();
        caseFile(bookId);
      });
      row.appendChild(later);
      el.appendChild(row);
      window.scrollTo(0, 0);
    }

    /* ── boot ─────────────────────────────────────────────────────────── */
    function boot(data) { DATA = data; home(); }
    return { boot: boot };
  })();

  init();
})();
</script>
