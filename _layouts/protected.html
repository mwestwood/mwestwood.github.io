---
layout: default
---

<style>
  #protected-gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 40vh;
    padding: 2rem 1rem;
  }

  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px;
    padding: 2.5rem 2rem;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  .gate-lock {
    font-size: 2.5rem;
    margin-bottom: 0.75rem;
    line-height: 1;
  }

  .gate-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--body-text-color, #27262b);
    margin: 0 0 0.5rem 0;
  }

  .gate-subtitle {
    font-size: 0.875rem;
    color: var(--body-text-color, #5c5962);
    opacity: 0.75;
    margin: 0 0 1.5rem 0;
  }

  .gate-input-row {
    display: flex;
    gap: 0.5rem;
    width: 100%;
  }

  #gate-password {
    flex: 1;
    padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0);
    border-radius: 4px;
    font-size: 1rem;
    background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b);
    outline: none;
    transition: border-color 0.15s;
  }

  #gate-password:focus {
    border-color: var(--links-color, #7253ed);
  }

  #gate-submit {
    padding: 0.5rem 1.1rem;
    background: var(--links-color, #7253ed);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  #gate-submit:hover {
    opacity: 0.88;
  }

  #gate-submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #gate-error {
    margin-top: 0.85rem;
    font-size: 0.875rem;
    color: #c0392b;
    min-height: 1.25rem;
    display: none;
  }

  #gate-status {
    margin-top: 0.85rem;
    font-size: 0.875rem;
    color: var(--body-text-color, #5c5962);
    opacity: 0.7;
    min-height: 1.25rem;
    display: none;
  }

  #protected-content {
    display: none;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input
        id="gate-password"
        type="password"
        placeholder="Passphrase"
        autocomplete="off"
        autofocus
      />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<!-- Revealed content goes here -->
<div id="protected-content">
  <!-- decrypted HTML injected by JS -->
</div>

<script>
(function () {
  'use strict';

  /* Encrypted blob injected by Jekyll from front matter field `encrypted` */
  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};

  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Helpers ────────────────────────────────────────────────────────────── */

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      enc.encode(passphrase),
      { name: 'PBKDF2' },
      false,
      ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  async function decrypt(passphrase) {
    /* Blob layout: salt[0..15] + iv[16..27] + ciphertext[28..] */
    const blob   = b64ToBytes(ENCRYPTED_B64);
    const salt   = blob.slice(0, 16);
    const iv     = blob.slice(16, 28);
    const ct     = blob.slice(28);

    const key = await deriveKey(passphrase, salt);
    const plaintext = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: iv },
      key,
      ct
    );
    return new TextDecoder().decode(plaintext);
  }

  /* ── UI ─────────────────────────────────────────────────────────────────── */

  const gate      = document.getElementById('protected-gate');
  const content   = document.getElementById('protected-content');
  const input     = document.getElementById('gate-password');
  const btn       = document.getElementById('gate-submit');
  const errEl     = document.getElementById('gate-error');
  const statusEl  = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }

  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      if (typeof marked !== 'undefined') { resolve(); return; }
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function reveal(markdown) {
    gate.style.display = 'none';
    loadScript('https://cdn.jsdelivr.net/npm/marked@12/marked.min.js').then(function () {
      /* breaks: true preserves the site's intentional single-line breaks
         (one sentence per line) — without it, marked.js collapses them into
         a single wrapped paragraph. See CLAUDE.md §7. */
      content.innerHTML = marked.parse(markdown, { gfm: true, breaks: true });
      content.style.display = 'block';
      enhanceVocab();
    }).catch(function () {
      content.innerHTML = '<pre>' + markdown.replace(/</g, '&lt;') + '</pre>';
      content.style.display = 'block';
    });
  }

  /* On /teaching/vocabulary/ pages: build a floating table of contents from the
     section (H2) headings, wire up smooth-scroll + scrollspy, and honour any
     #word anchor that was followed in from the index (the content only exists
     after decryption, so the browser's own anchor jump happens too early). */
  function enhanceVocab() {
    if (!/\/teaching\/vocabulary\//.test(location.pathname)) return;
    document.body.classList.add('vocab-page');

    var heads = Array.prototype.slice.call(content.querySelectorAll('h2[id]'));
    if (heads.length > 1) {
      var old = document.getElementById('vocab-toc');
      if (old) old.remove();

      var nav = document.createElement('nav');
      nav.id = 'vocab-toc';
      nav.className = 'floating-toc';
      nav.setAttribute('aria-label', 'On this page');

      /* Level pages tag each H2 with data-kind/data-toc, so the ToC can split
         into collapsible "Word families" / "Roots" sections and stay short.
         The index page (no data-kind) falls back to a flat list. */
      var categorized = heads.some(function (h) { return h.dataset && h.dataset.kind; });

      function linkFor(h) {
        var label = (h.dataset && h.dataset.toc) ? h.dataset.toc : h.textContent;
        return '<li><a href="#' + h.id + '">' + label + '</a></li>';
      }
      function section(title, items, open) {
        if (!items.length) return '';
        return '<details class="toc-cat"' + (open ? ' open' : '') + '>' +
          '<summary><span class="toc-cat-name">' + title + '</span>' +
          '<span class="toc-count">' + items.length + '</span></summary>' +
          '<ul>' + items.map(linkFor).join('') + '</ul></details>';
      }

      var html = '<p class="floating-toc-title">On this page</p>';
      if (categorized) {
        var fams = heads.filter(function (h) { return h.dataset.kind !== 'root'; });
        var roots = heads.filter(function (h) { return h.dataset.kind === 'root'; });
        var firstIsRoot = heads[0].dataset.kind === 'root';
        html += section('Word families', fams, !firstIsRoot);
        html += section('Roots', roots, firstIsRoot);
      } else {
        html += '<ul>' + heads.map(linkFor).join('') + '</ul>';
      }
      nav.innerHTML = html;
      document.body.appendChild(nav);

      var links = Array.prototype.slice.call(nav.querySelectorAll('a'));
      var byId = {};
      links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });

      var userToggled = false;
      nav.addEventListener('click', function (e) {
        if (e.target.closest('summary')) { userToggled = true; return; }
        var a = e.target.closest('a');
        if (!a) return;
        e.preventDefault();
        var el = document.getElementById(a.getAttribute('href').slice(1));
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', a.getAttribute('href'));
        }
      });

      function setActive(id) {
        var a = byId[id];
        if (!a) return;
        for (var i = 0; i < links.length; i++) links[i].classList.remove('active');
        a.classList.add('active');
        if (categorized && !userToggled) {
          var det = a.closest('details');
          var cats = nav.querySelectorAll('details.toc-cat');
          for (var c = 0; c < cats.length; c++) cats[c].open = (cats[c] === det);
        }
        var ul = a.closest('ul');
        if (ul && ul.scrollHeight > ul.clientHeight + 4) {
          ul.scrollTop = a.offsetTop - ul.clientHeight / 2;
        }
      }

      if ('IntersectionObserver' in window) {
        var obs = new IntersectionObserver(function (entries) {
          for (var k = 0; k < entries.length; k++) {
            if (entries[k].isIntersecting) setActive(entries[k].target.id);
          }
        }, { rootMargin: '-10% 0px -80% 0px' });
        heads.forEach(function (h) { obs.observe(h); });
      }
    }

    if (location.hash) {
      var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) setTimeout(function () { target.scrollIntoView(); }, 60);
    }
  }

  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const html = await decrypt(passphrase);
      if (cache) {
        try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {}
      }
      reveal(html);
    } catch (e) {
      console.error('[protected] Unlock failed:', e.name, e.message, e);
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message + ' — check browser console.');
      }
    }
  }

  async function init() {
    if (!ENCRYPTED_B64) {
      gate.style.display = 'none';
      content.style.display = 'block';
      return;
    }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true;
        input.disabled = true;
        try {
          const html = await decrypt(cached);
          reveal(html);
          return;
        } catch (_) {
          /* cached passphrase no longer valid — fall through to gate */
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false;
          input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }

  btn.addEventListener('click', function () {
    const pw = input.value;
    if (!pw) { input.focus(); return; }
    tryUnlock(pw, true);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  init();
})();
</script>
