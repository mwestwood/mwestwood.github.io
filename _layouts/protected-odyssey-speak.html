---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 40vh; padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px; padding: 2.5rem 2rem; max-width: 400px; width: 100%;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── Word Odyssey · Speaking Hall (The Agora) ────────────────────────── */
  #odyssey-root { display: none; }

  .wo {
    --sea: #38bdf8; --gold: #fbbf24; --vio: #c084fc;
    --good: #4ade80; --bad: #f87171; --live: #f87171;
    --card: rgba(255,255,255,0.05); --card2: rgba(192,132,252,0.10);
    --line: rgba(255,255,255,0.14);
    max-width: 780px;
  }
  .wo, .wo * { box-sizing: border-box; }
  .wo button {
    font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .wo-top {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .wo-back {
    background: var(--card); border: 1px solid var(--line); color: inherit;
    border-radius: 999px; padding: 0.45rem 1.05rem; font-size: 1rem;
    cursor: pointer;
  }
  .wo-back:hover { border-color: var(--vio); }
  .wo-spacer { flex: 1; }
  .wo-pill {
    font-size: 0.92rem; padding: 0.35rem 0.8rem; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    white-space: nowrap; color: inherit; cursor: default;
  }
  .wo-pill.rank { border-color: var(--gold); color: var(--gold);
                  font-weight: 700; }
  .wo-pill.xp { border-color: var(--sea); color: var(--sea);
                font-weight: 700; }
  button.wo-pill { cursor: pointer; }
  button.wo-pill.off { opacity: 0.42; }

  .wo-hero {
    text-align: center; margin: 0.3rem 0 1.1rem;
    padding: 1.1rem 1rem 1.3rem;
    background: linear-gradient(180deg, var(--card2), transparent);
    border: 1px solid var(--line); border-radius: 16px;
  }
  .wo-hero h1 {
    margin: 0 0 0.25rem; font-size: 1.9rem;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .wo-hero .sub { margin: 0 0 0.9rem; opacity: 0.78; font-size: 1rem; }
  .wo-rank { max-width: 460px; margin: 0.4rem auto 0; }
  .wo-rank .lab {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.88rem; margin-bottom: 0.3rem;
  }
  .wo-rank .lab b { font-size: 1rem; color: var(--gold); }
  .wo-rank .lab span { opacity: 0.7; }
  .wo-bar {
    height: 12px; border-radius: 999px; background: rgba(255,255,255,0.08);
    overflow: hidden; border: 1px solid var(--line);
  }
  .wo-bar > i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--vio), var(--gold));
  }

  .wo-maplink {
    font-size: 0.9rem; opacity: 0.8; text-decoration: none;
    border-bottom: 1px dotted var(--vio);
  }
  .wo-maplink:hover { opacity: 1; text-decoration: none; }

  .wo-sect {
    font-size: 1.05rem; font-weight: 700; margin: 1.4rem 0 0.6rem;
    display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;
  }
  .wo-sect .desc { font-size: 0.82rem; opacity: 0.62; font-weight: 400; }

  .wo-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 0.6rem;
  }
  .wo-game {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 0.85rem 0.7rem; cursor: pointer;
    color: inherit; text-align: center; line-height: 1.3;
    display: flex; flex-direction: column; gap: 0.28rem; align-items: center;
  }
  .wo-game:hover { border-color: var(--vio); transform: translateY(-1px); }
  .wo-game .em { font-size: 1.9rem; }
  .wo-game .nm { font-size: 0.95rem; font-weight: 700; }
  .wo-game .dc { font-size: 0.76rem; opacity: 0.65; }
  .wo-game .st { font-size: 0.78rem; letter-spacing: 0.08em; color: var(--gold); }

  .wo-lesson {
    background: var(--card2); border: 1px solid var(--line);
    border-left: 4px solid var(--vio);
    border-radius: 12px; padding: 0.8rem 1rem; margin-bottom: 1rem;
    font-size: 0.98rem; line-height: 1.6;
  }
  .wo-lesson b { color: var(--vio); }

  .wo-qnum { font-size: 0.85rem; opacity: 0.6; margin-bottom: 0.35rem; }
  .wo-prompt { font-size: 1.28rem; font-weight: 700; line-height: 1.45;
               margin-bottom: 0.7rem; }
  .wo-ctx {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.75rem 0.95rem; margin-bottom: 0.9rem;
    font-size: 1.05rem; line-height: 1.6;
  }
  .wo-ctx ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }
  .wo-ctx li { margin: 0.25rem 0; }
  .wo-frame {
    display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.9rem;
  }
  .wo-frame span {
    font-size: 0.85rem; font-weight: 700; padding: 0.3rem 0.75rem;
    border-radius: 999px; background: rgba(192,132,252,0.14);
    border: 1px solid var(--vio); color: var(--vio);
  }

  /* mic */
  .wo-mic {
    display: block; margin: 0.6rem auto; padding: 1rem 2.2rem;
    background: var(--vio); color: #24103a; border: none;
    border-radius: 999px; font-size: 1.2rem; font-weight: 700;
    cursor: pointer;
  }
  .wo-mic:hover { opacity: 0.9; }
  .wo-mic.live {
    background: var(--live); color: #fff; animation: woPulse 1.1s infinite;
  }
  .wo-mic:disabled { opacity: 0.5; cursor: not-allowed; }
  .wo-heard {
    background: var(--card); border: 1px dashed var(--line);
    border-radius: 12px; padding: 0.8rem 1rem; margin: 0.7rem 0;
    font-size: 1.08rem; line-height: 1.6; min-height: 3rem;
  }
  .wo-heard .lbl { font-size: 0.76rem; opacity: 0.6; display: block;
                   margin-bottom: 0.25rem; }
  .wo-heard.done { border-style: solid; border-color: var(--good); }
  .wo-privacy { font-size: 0.76rem; opacity: 0.55; text-align: center;
                margin-top: 0.3rem; line-height: 1.5; }

  .wo-scores { display: flex; flex-direction: column; gap: 0.4rem;
               margin: 0.8rem 0; }
  .wo-score {
    display: flex; gap: 0.6rem; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.6rem 0.85rem; font-size: 1rem;
    line-height: 1.45;
  }
  .wo-score.ok { border-color: var(--good); background: rgba(74,222,128,0.09); }
  .wo-score.no { border-color: rgba(248,113,113,0.5); }
  .wo-score .ic { flex: none; font-size: 1.05rem; }

  .wo-opts { display: flex; flex-direction: column; gap: 0.55rem; }
  .wo-opt {
    background: var(--card); border: 2px solid var(--line); color: inherit;
    border-radius: 12px; padding: 0.75rem 1rem; font-size: 1.06rem;
    cursor: pointer; text-align: left; line-height: 1.45;
  }
  .wo-opt:hover:not(:disabled) { border-color: var(--vio); }
  .wo-opt:disabled { cursor: default; }
  .wo-opt.dim { opacity: 0.35; }
  .wo-opt.yes { border-color: var(--good); background: rgba(74,222,128,0.12); }
  .wo-opt.no { border-color: var(--bad); animation: woNudge 0.35s; }

  .wo-check { display: flex; flex-direction: column; gap: 0.45rem; }
  .wo-check label {
    display: flex; gap: 0.6rem; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 0.6rem 0.8rem; font-size: 1rem;
    cursor: pointer; line-height: 1.45;
  }
  .wo-check input { margin-top: 0.25rem; flex: none;
                    width: 1.05rem; height: 1.05rem; }
  .wo-check label.on { border-color: var(--good);
                       background: rgba(74,222,128,0.10); }

  .wo-feedback { margin-top: 0.9rem; font-size: 1.05rem; line-height: 1.55; }
  .wo-feedback .teach {
    display: block; margin-top: 0.4rem; padding: 0.6rem 0.8rem;
    background: var(--card); border-left: 3px solid var(--vio);
    border-radius: 0 8px 8px 0; font-size: 1rem;
  }
  .wo-feedback .math { display: block; margin-top: 0.4rem;
                       color: var(--gold); font-weight: 700; }
  .wo-next {
    display: block; margin: 1.1rem auto 0; padding: 0.8rem 2.6rem;
    background: var(--vio); color: #24103a; border: none;
    border-radius: 999px; font-size: 1.15rem; font-weight: 700;
    cursor: pointer;
  }
  .wo-next:hover { opacity: 0.9; }
  .wo-ghost {
    display: block; margin: 0.6rem auto 0; padding: 0.5rem 1.4rem;
    background: none; color: inherit; border: 1px solid var(--line);
    border-radius: 999px; font-size: 0.95rem; cursor: pointer;
  }
  .wo-ghost:hover { border-color: var(--vio); }

  .wo-recap { text-align: center; padding: 1.2rem 0; }
  .wo-recap .big { font-size: 3rem; margin-bottom: 0.3rem; }
  .wo-recap h2 { margin: 0 0 0.3rem; font-size: 1.5rem;
                 font-family: Georgia, serif; }
  .wo-recap .stars { font-size: 2rem; letter-spacing: 0.15em;
                     color: var(--gold); margin: 0.3rem 0; }
  .wo-recap p { opacity: 0.82; margin: 0.3rem 0; }
  .wo-recap .row { display: flex; gap: 0.6rem; justify-content: center;
                   margin-top: 1rem; flex-wrap: wrap; }

  .wo-rankup {
    position: fixed; left: 50%; top: 18%; transform: translateX(-50%);
    z-index: 50; background: #24103a; color: #fff;
    border: 2px solid var(--gold); border-radius: 14px;
    padding: 0.9rem 1.4rem; text-align: center; max-width: 90vw;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5); animation: woPop 0.4s;
  }
  .wo-rankup .r1 { font-size: 0.85rem; opacity: 0.8; }
  .wo-rankup .r2 { font-size: 1.4rem; font-weight: 700; color: var(--gold);
                   font-family: Georgia, serif; margin-top: 0.15rem; }

  @keyframes woNudge {
    25% { transform: translateX(-4px); } 75% { transform: translateX(4px); }
  }
  @keyframes woPop {
    0% { transform: translateX(-50%) scale(0.7); opacity: 0; }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }
  @keyframes woPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.6); }
    50% { box-shadow: 0 0 0 14px rgba(248,113,113,0); }
  }

  @media (max-width: 500px) {
    .wo-prompt { font-size: 1.12rem; }
    .wo-opt { font-size: 0.98rem; }
    .wo-hero h1 { font-size: 1.55rem; }
  }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="odyssey-root"><div class="wo" id="wo"></div></div>

<script>
(function () {
  'use strict';

  /* Encrypted blob injected by Jekyll from front matter field `encrypted` */
  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};

  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const salt = blob.slice(0, 16);
    const iv = blob.slice(16, 28);
    const ct = blob.slice(28);
    const key = await deriveKey(passphrase, salt);
    const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return new TextDecoder().decode(plaintext);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('odyssey-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }
  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }
  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse prompt bank.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Agora.boot(data);
  }
  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) {
        try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {}
      }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }
  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true;
        input.disabled = true;
        try {
          const text = await decrypt(cached);
          reveal(text);
          return;
        } catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false;
          input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }
  btn.addEventListener('click', function () {
    const pw = input.value;
    if (!pw) { input.focus(); return; }
    tryUnlock(pw, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ═══════════════════ Word Odyssey · The Agora ════════════════════════
     The speaking hall — confident, clear, purposeful speech.
     Games: Table Topics (impromptu with P.R.E.P.), Claim-Evidence-
     Reasoning, Accountable Talk stems, Storyteller, Read It Like You
     Mean It, Say It Strong.

     MIC: uses the browser's SpeechRecognition. This page never stores a
     transcript and never sends one anywhere — but note that some
     browsers (Chrome in particular) perform recognition in the cloud, so
     the honest wording in the UI is "your browser may send audio to its
     maker to turn it into text", not "nothing leaves the device".
     Everything degrades gracefully: no API / denied permission / error
     all fall back to a self-rating checklist so a round is never blocked.

     Scoring is deliberately generous and coaching-shaped — this is a
     confidence builder, not a test. No failure state anywhere.
  ═══════════════════════════════════════════════════════════════════════ */

  const Agora = (function () {

    const el = document.getElementById('wo');
    let DATA = null;

    const GAMES = [
      { kind: 'prep', em: '🗣️', name: 'Table Topics',
        desc: 'Speak on a surprise topic',
        lesson: 'A surprise topic, and you speak for about 30 seconds. Use ' +
                'the <b>P.R.E.P.</b> frame so you never ramble: ' +
                '<b>P</b>oint (say your answer) → <b>R</b>eason (why) → ' +
                '<b>E</b>xample (a real moment) → <b>P</b>oint (say it ' +
                'again). This one frame is what makes people sound ' +
                'organised on the spot.' },
      { kind: 'cer', em: '🔬', name: 'Claim · Evidence · Reasoning',
        desc: 'Prove a point out loud',
        lesson: 'The way real arguments are made in school and beyond: ' +
                '<b>Claim</b> (what you think) → <b>Evidence</b> (a fact ' +
                'that backs it) → <b>Reasoning</b> (why that fact proves ' +
                'your claim). Most people forget the third part — that is ' +
                'the part that actually convinces people.' },
      { kind: 'stems', em: '💬', name: 'Talk Moves',
        desc: 'The words that grow a discussion',
        lesson: 'Speaking with purpose means having language ready for the ' +
                'MOVE you want to make: agree and add, disagree kindly, ' +
                'build on someone, ask for evidence, or change your mind ' +
                'out loud. Pick the strong move, then say it aloud.' },
      { kind: 'story', em: '📖', name: 'Storyteller',
        desc: 'Tell a story with a real shape',
        lesson: 'Told out loud, a story still needs a shape: a ' +
                '<b>beginning</b> that sets the scene, a <b>middle</b> ' +
                'with a problem, and an <b>end</b> that finishes it. Hit ' +
                'all three beats and any story lands.' },
      { kind: 'read', em: '🎭', name: 'Read It Like You Mean It',
        desc: 'Expression and emphasis',
        lesson: 'Fluency is not speed — it is <b>expression</b>. The same ' +
                'sentence changes meaning depending on which word you land ' +
                'on and where you pause. This is what makes people listen.' },
      { kind: 'script', em: '🛡️', name: 'Say It Strong',
        desc: 'Real-life confident sentences',
        lesson: 'Confidence is mostly having the right sentence ready. ' +
                'Practise these out loud in a calm, clear voice so they ' +
                'are there when you actually need them.' }
    ];
    const GAME_BY_KIND = {};
    GAMES.forEach(function (g) { GAME_BY_KIND[g.kind] = g; });

    const RANKS = [
      { xp: 0,    em: '🪶', name: 'Apprentice' },
      { xp: 80,   em: '⚓', name: 'Voyager' },
      { xp: 220,  em: '🧭', name: 'Navigator' },
      { xp: 450,  em: '🛡️', name: 'Champion' },
      { xp: 800,  em: '🏛️', name: 'Orator' },
      { xp: 1300, em: '⚔️', name: 'Hero' },
      { xp: 2000, em: '🌟', name: 'Legend' }
    ];
    function rankInfo(xp) {
      let cur = RANKS[0], nxt = null;
      for (let i = 0; i < RANKS.length; i++) {
        if (xp >= RANKS[i].xp) { cur = RANKS[i]; nxt = RANKS[i + 1] || null; }
      }
      const into = xp - cur.xp;
      const span = nxt ? (nxt.xp - cur.xp) : 1;
      const pct = nxt ? Math.max(5, Math.min(100, Math.round(into / span * 100))) : 100;
      return { cur: cur, nxt: nxt, into: into, span: span, pct: pct };
    }

    /* ── shared progress store ────────────────────────────────────────── */
    const PKEY = 'word-odyssey-v1';
    let P = {};
    try { P = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.v = P.v || 1;
    P.xp = P.xp || 0;
    P.skills = P.skills || {};
    P.speak = P.speak || {};
    P.speak.stars = P.speak.stars || {};
    P.speak.talks = P.speak.talks || 0;    /* how many times he has spoken */
    if (P.speak.mic === undefined) P.speak.mic = true;
    if (P.voice === undefined) P.voice = true;
    if (P.sound === undefined) P.sound = true;
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }

    function recordSkill(skill, ok) {
      const rec = P.skills[skill] || { b: 0, s: 0, r: 0, x: 0, due: 0 };
      rec.s++;
      if (ok) { rec.r++; rec.b = Math.min(6, rec.b + 1); }
      else { rec.x++; rec.b = 1; }
      const days = [0, 1, 2, 4, 7, 14, 30][rec.b] || 30;
      rec.due = Date.now() + days * 86400000;
      P.skills[skill] = rec;
      save();
    }
    function medal(skill) {
      const rec = P.skills[skill];
      if (!rec || !rec.s) return '';
      if (rec.b >= 6) return '🥇';
      if (rec.b >= 4) return '🥈';
      if (rec.b >= 2) return '🥉';
      return '';
    }

    const VOICE_KEY = 'mwestwood-voice-name';
    let voiceName = localStorage.getItem(VOICE_KEY) || '';

    /* ── speech OUT (same rules as the other engines) ─────────────────── */
    const JOKE_VOICES = ['Albert', 'Bad News', 'Bahh', 'Bells', 'Boing',
      'Bubbles', 'Cellos', 'Good News', 'Jester', 'Organ', 'Superstar',
      'Trinoids', 'Whisper', 'Wobble', 'Zarvox', 'Deranged', 'Hysterical'];
    const NICE_NAMES = /^(Samantha|Ava|Allison|Susan|Zoe|Karen|Daniel|Moira|Tessa|Fiona|Serena|Kate)\b/;
    let VOICES = [];
    let chosenVoice = null;

    function rankVoice(v) {
      const n = v.name;
      let r = 60;
      if (n === 'Google US English') r = -100;
      else if (/natural|neural/i.test(n)) r = 0;
      else if (/enhanced|premium/i.test(n)) r = 10;
      else if (NICE_NAMES.test(n)) r = 20;
      else if (/^Google/i.test(n)) r = 30;
      else if (v.localService) r = 40;
      if (/^en[-_]US/i.test(v.lang)) r -= 5;
      else if (/^en/i.test(v.lang)) r -= 2;
      return r;
    }
    function loadVoices() {
      try {
        if (!window.speechSynthesis) return;
        const all = speechSynthesis.getVoices().filter(function (v) {
          if (!/^en/i.test(v.lang)) return false;
          return JOKE_VOICES.indexOf(v.name.replace(/\s*\(.*\)$/, '')) === -1;
        });
        if (!all.length) return;
        all.sort(function (a, b) {
          return rankVoice(a) - rankVoice(b) || a.name.localeCompare(b.name);
        });
        VOICES = all;
        chosenVoice = null;
        if (voiceName) {
          chosenVoice = all.find(function (v) { return v.name === voiceName; }) || null;
        }
        if (!chosenVoice) chosenVoice = all[0];
      } catch (_) {}
    }
    loadVoices();
    try { speechSynthesis.onvoiceschanged = loadVoices; } catch (_) {}
    setTimeout(loadVoices, 300);

    const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const CAN_DEFER_SPEECH = !IS_IOS;

    function speak(text) {
      if (!P.voice) return;
      try {
        if (!window.speechSynthesis) return;
        const wasSpeaking = speechSynthesis.speaking;
        speechSynthesis.cancel();
        const clean = String(text).replace(/[🎉⭐🌟💪🎯✨🚀🗣️🔬💬📖🎭🛡️…]/g, '');
        const u = new SpeechSynthesisUtterance(clean);
        u.rate = 0.9;
        if (chosenVoice) {
          u.voice = chosenVoice; u.lang = chosenVoice.lang; u.pitch = 1;
        } else { u.pitch = 1.05; }
        if (wasSpeaking && CAN_DEFER_SPEECH) {
          setTimeout(function () {
            try { speechSynthesis.speak(u); } catch (_) {}
          }, 50);
        } else {
          speechSynthesis.speak(u);
        }
      } catch (_) {}
    }

    let audioCtx = null;
    function tone(freq, start, dur, vol) {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, audioCtx.currentTime + start);
      g.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + start + 0.02);
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + start + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + start);
      o.stop(audioCtx.currentTime + start + dur + 0.05);
    }
    function sfx(kind) {
      if (!P.sound) return;
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (kind === 'good') { tone(523, 0, 0.14, 0.07); tone(784, 0.12, 0.2, 0.07); }
        else if (kind === 'soft') { tone(233, 0, 0.18, 0.045); }
        else if (kind === 'star') { tone(659, 0, 0.12, 0.06); tone(784, 0.1, 0.12, 0.06); tone(1047, 0.2, 0.25, 0.06); }
      } catch (_) {}
    }

    /* ── speech IN (the mic) ──────────────────────────────────────────── */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const MIC_OK = !!SR;

    /* Runs a single listening session. onDone(transcript) always fires
       exactly once — on result, on end, on error, or on manual stop. */
    function listen(onPartial, onDone) {
      if (!MIC_OK) { onDone(null, 'unsupported'); return null; }
      let rec;
      try { rec = new SR(); } catch (_) { onDone(null, 'unsupported'); return null; }
      rec.lang = 'en-US';
      rec.continuous = true;
      rec.interimResults = true;
      let finalText = '';
      let closed = false;
      function finish(err) {
        if (closed) return;
        closed = true;
        try { rec.stop(); } catch (_) {}
        onDone(finalText.trim(), err || null);
      }
      rec.onresult = function (e) {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          if (r.isFinal) finalText += r[0].transcript + ' ';
          else interim += r[0].transcript;
        }
        if (onPartial) onPartial((finalText + interim).trim());
      };
      rec.onerror = function (e) {
        const code = (e && e.error) || 'error';
        if (code === 'no-speech') { finish(null); return; }
        finish(code);
      };
      rec.onend = function () { finish(null); };
      try { rec.start(); } catch (_) { finish('start-failed'); return null; }
      return { stop: function () { try { rec.stop(); } catch (_) { finish(null); } } };
    }

    /* ── helpers ─────────────────────────────────────────────────────── */
    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                 '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function shuffle(a) {
      const arr = a.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    function stars3(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }
    function words(s) {
      return String(s || '').trim().split(/\s+/).filter(Boolean);
    }
    function norm(s) {
      return String(s || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ').trim();
    }
    function hasAny(text, list) {
      const t = norm(text);
      return list.some(function (k) { return t.indexOf(norm(k)) !== -1; });
    }
    /* fraction of `target` content words that appear in `said` */
    function overlap(said, target) {
      const STOP = ' the a an and or of to in is was it that this i you he she '
                 + ' they we my your his her its for on at as be been are were ';
      const tw = norm(target).split(' ')
        .filter(function (w) { return w.length > 2 && STOP.indexOf(' ' + w + ' ') === -1; });
      if (!tw.length) return 1;
      const sw = norm(said).split(' ');
      let hit = 0;
      tw.forEach(function (w) { if (sw.indexOf(w) !== -1) hit++; });
      return hit / tw.length;
    }

    function topBar(backLabel, backFn) {
      const bar = document.createElement('div');
      bar.className = 'wo-top';
      if (backFn) {
        const back = document.createElement('button');
        back.className = 'wo-back';
        back.textContent = '← ' + (backLabel || 'Back');
        back.addEventListener('click', function () {
          try { speechSynthesis.cancel(); } catch (_) {}
          backFn();
        });
        bar.appendChild(back);
      }
      const sp = document.createElement('div');
      sp.className = 'wo-spacer';
      bar.appendChild(sp);

      const ri = rankInfo(P.xp);
      const rank = document.createElement('span');
      rank.className = 'wo-pill rank';
      rank.id = 'wo-rankpill';
      rank.textContent = ri.cur.em + ' ' + ri.cur.name;
      bar.appendChild(rank);

      const xp = document.createElement('span');
      xp.className = 'wo-pill xp';
      xp.id = 'wo-xppill';
      xp.textContent = '⭐ ' + P.xp + ' XP';
      bar.appendChild(xp);

      const mic = document.createElement('button');
      mic.className = 'wo-pill' + (P.speak.mic ? '' : ' off');
      mic.textContent = '🎤';
      mic.title = 'Microphone on/off';
      mic.addEventListener('click', function () {
        P.speak.mic = !P.speak.mic; save();
        mic.classList.toggle('off', !P.speak.mic);
      });
      bar.appendChild(mic);

      const snd = document.createElement('button');
      snd.className = 'wo-pill' + (P.sound ? '' : ' off');
      snd.textContent = '🔔';
      snd.title = 'Sounds on/off';
      snd.addEventListener('click', function () {
        P.sound = !P.sound; save();
        snd.classList.toggle('off', !P.sound);
      });
      bar.appendChild(snd);

      const vc = document.createElement('button');
      vc.className = 'wo-pill' + (P.voice ? '' : ' off');
      vc.textContent = '🗣️';
      vc.title = 'Read-aloud on/off';
      vc.addEventListener('click', function () {
        P.voice = !P.voice; save();
        vc.classList.toggle('off', !P.voice);
        if (!P.voice) { try { speechSynthesis.cancel(); } catch (_) {} }
      });
      bar.appendChild(vc);
      return bar;
    }

    function refreshTopPills() {
      const ri = rankInfo(P.xp);
      const rp = document.getElementById('wo-rankpill');
      const xp = document.getElementById('wo-xppill');
      if (rp) rp.textContent = ri.cur.em + ' ' + ri.cur.name;
      if (xp) xp.textContent = '⭐ ' + P.xp + ' XP';
    }
    function bumpXp(add) {
      const before = P.xp;
      P.xp += add;
      save();
      refreshTopPills();
      const b1 = rankInfo(before).cur.name;
      const b2 = rankInfo(P.xp).cur;
      if (b2.name !== b1) rankUpBanner(b2);
      return before + ' + ' + add + ' = ' + P.xp;
    }
    function rankUpBanner(rank) {
      sfx('star');
      const b = document.createElement('div');
      b.className = 'wo-rankup';
      b.innerHTML = '<div class="r1">⚔️ You ranked up!</div>' +
        '<div class="r2">' + rank.em + ' ' + esc(rank.name) + '</div>';
      document.body.appendChild(b);
      speak('You ranked up to ' + rank.name + '!');
      setTimeout(function () {
        b.style.transition = 'opacity 0.5s';
        b.style.opacity = '0';
        setTimeout(function () { b.remove(); }, 500);
      }, 2400);
    }

    /* ── home ────────────────────────────────────────────────────────── */
    function home() {
      el.innerHTML = '';
      el.appendChild(topBar(null, null));

      const ri = rankInfo(P.xp);
      const hero = document.createElement('div');
      hero.className = 'wo-hero';
      hero.innerHTML =
        '<h1>🏛️ The Agora</h1>' +
        '<p class="sub">The speaking square. Say what you think — clearly, ' +
        'with a reason, in a strong voice.</p>' +
        '<div class="wo-rank">' +
          '<div class="lab"><b>' + ri.cur.em + ' ' + esc(ri.cur.name) +
          '</b><span>' + (ri.nxt
            ? (ri.nxt.xp - P.xp) + ' XP to ' + esc(ri.nxt.name) + ' ' + ri.nxt.em
            : 'Highest rank!') + '</span></div>' +
          '<div class="wo-bar"><i style="width:' + ri.pct + '%"></i></div>' +
        '</div>' +
        '<p style="margin:0.9rem 0 0"><a href="/teaching/english/odyssey/" ' +
        'class="wo-maplink">🗺️ Back to the Voyage Map</a></p>';
      el.appendChild(hero);

      if (P.speak.talks) {
        const t = document.createElement('p');
        t.style.textAlign = 'center';
        t.style.opacity = '0.75';
        t.innerHTML = '🎤 You have spoken out loud <b>' + P.speak.talks +
          '</b> time' + (P.speak.talks === 1 ? '' : 's') + ' in the Agora.';
        el.appendChild(t);
      }

      if (!MIC_OK) {
        const w = document.createElement('div');
        w.className = 'wo-lesson';
        w.innerHTML = '🎤 <b>Heads up:</b> this browser cannot listen to ' +
          'speech, so every game will use a self-check list instead. ' +
          'Everything still works — you just grade your own speaking. ' +
          '(Chrome or Safari support the microphone.)';
        el.appendChild(w);
      }

      const head = document.createElement('div');
      head.className = 'wo-sect';
      head.innerHTML = '🎤 Speaking Games ' +
        '<span class="desc">Say it out loud. Nobody is grading you but you.</span>';
      el.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'wo-grid';
      GAMES.forEach(function (g) {
        const n = DATA.prompts.filter(function (p) { return p.kind === g.kind; }).length;
        if (!n) return;
        const b = document.createElement('button');
        b.className = 'wo-game';
        b.innerHTML = '<span class="em">' + g.em + '</span>' +
          '<span class="nm">' + esc(g.name) + ' ' + medal('s_' + g.kind) + '</span>' +
          '<span class="dc">' + esc(g.desc) + '</span>' +
          '<span class="st">' + stars3(P.speak.stars[g.kind] || 0) + '</span>';
        b.addEventListener('click', function () { playGame(g); });
        grid.appendChild(b);
      });
      el.appendChild(grid);

      window.scrollTo(0, 0);
    }

    /* ── a round: 3 prompts of one kind ──────────────────────────────── */
    function playGame(game) {
      const pool = shuffle(DATA.prompts.filter(function (p) {
        return p.kind === game.kind;
      }));
      const round = pool.slice(0, Math.min(3, pool.length));
      let idx = 0;
      let wins = 0;

      function screen() {
        el.innerHTML = '';
        el.appendChild(topBar('The Agora', home));

        const lesson = document.createElement('div');
        lesson.className = 'wo-lesson';
        lesson.innerHTML = game.em + ' <b>' + esc(game.name) + '</b> — ' +
          game.lesson;
        el.appendChild(lesson);

        const num = document.createElement('div');
        num.className = 'wo-qnum';
        num.textContent = 'Turn ' + (idx + 1) + ' of ' + round.length;
        el.appendChild(num);

        const body = document.createElement('div');
        el.appendChild(body);

        const p = round[idx];
        if (p.kind === 'stems') renderStems(p, body);
        else renderSpoken(p, body);

        window.scrollTo(0, 0);
      }

      function nextButton(host) {
        const next = document.createElement('button');
        next.className = 'wo-next';
        next.textContent = idx + 1 < round.length ? 'Next ▶' : 'Finish 🏁';
        next.addEventListener('click', function () {
          idx++;
          if (idx < round.length) screen();
          else recap();
        });
        host.appendChild(next);
        return next;
      }

      /* — Talk Moves: choose the strong move, then say it — */
      function renderStems(p, host) {
        const q = document.createElement('div');
        q.className = 'wo-prompt';
        q.textContent = 'Which is the strongest thing to say?';
        host.appendChild(q);

        const ctx = document.createElement('div');
        ctx.className = 'wo-ctx';
        ctx.textContent = p.situation;
        host.appendChild(ctx);

        const opts = document.createElement('div');
        opts.className = 'wo-opts';
        const feedback = document.createElement('div');
        feedback.className = 'wo-feedback';
        let tries = 0;

        shuffle(p.opts).forEach(function (o) {
          const b = document.createElement('button');
          b.className = 'wo-opt';
          b.textContent = o[0];
          b.addEventListener('click', function () {
            if (o[1]) {
              const first = tries === 0;
              if (first) wins++;
              Array.prototype.forEach.call(opts.children, function (x) {
                x.disabled = true;
              });
              b.classList.add('yes');
              sfx('good');
              recordSkill('s_stems', first);
              const math = bumpXp(first ? 10 : 5);
              feedback.innerHTML = (first ? '🎉 Strong move! ' : '💪 That is the one. ') +
                '<span class="teach">💡 ' + esc(p.teach) + '</span>' +
                '<span class="math">⭐ ' + esc(math) + ' XP</span>';
              speak(p.teach);
              /* now SAY it out loud */
              sayItStep(feedback, o[0], function () { nextButton(feedback); });
            } else {
              tries++;
              if (tries === 1) {
                b.classList.add('no');
                setTimeout(function () {
                  b.classList.remove('no');
                  b.classList.add('dim');
                  b.disabled = true;
                }, 350);
                sfx('soft');
                feedback.textContent = '🔍 That one stops the conversation. ' +
                  'Which one keeps it going?';
                speak(feedback.textContent);
              } else {
                let correct = '';
                p.opts.forEach(function (o2) { if (o2[1]) correct = o2[0]; });
                Array.prototype.forEach.call(opts.children, function (x) {
                  x.disabled = true;
                  if (x.textContent === correct) x.classList.add('yes');
                });
                sfx('soft');
                recordSkill('s_stems', false);
                const math = bumpXp(5);
                feedback.innerHTML = 'The strong move is highlighted.' +
                  '<span class="teach">💡 ' + esc(p.teach) + '</span>' +
                  '<span class="math">⭐ ' + esc(math) + ' XP</span>';
                speak(p.teach);
                sayItStep(feedback, correct, function () { nextButton(feedback); });
              }
            }
          });
          opts.appendChild(b);
        });
        host.appendChild(opts);
        host.appendChild(feedback);
        speak(p.situation);
      }

      /* small "now say it aloud" step used by Talk Moves */
      function sayItStep(host, line, done) {
        const wrap = document.createElement('div');
        wrap.style.marginTop = '0.8rem';
        const lab = document.createElement('div');
        lab.innerHTML = '🎤 <b>Now say it out loud, in a strong voice:</b>';
        wrap.appendChild(lab);
        const quote = document.createElement('div');
        quote.className = 'wo-ctx';
        quote.style.marginTop = '0.4rem';
        quote.textContent = '"' + line + '"';
        wrap.appendChild(quote);
        host.appendChild(wrap);

        micBlock(wrap, {
          target: line,
          checks: [
            { label: 'You said it out loud', test: function (t) { return words(t).length >= 3; } },
            { label: 'You got the words right',
              test: function (t) { return overlap(t, line) >= 0.4; } }
          ],
          minWords: 3,
          onDone: function () { done(); }
        });
      }

      /* — Spoken games (prep / cer / story / read / script) — */
      function renderSpoken(p, host) {
        const g = GAME_BY_KIND[p.kind];
        const feedback = document.createElement('div');
        feedback.className = 'wo-feedback';

        let title = '';
        let checks = [];
        let minWords = 12;
        let target = '';

        if (p.kind === 'prep') {
          title = p.topic;
          const t = document.createElement('div');
          t.className = 'wo-prompt';
          t.textContent = p.topic;
          host.appendChild(t);
          const fr = document.createElement('div');
          fr.className = 'wo-frame';
          fr.innerHTML = '<span>P — Point</span><span>R — Reason</span>' +
            '<span>E — Example</span><span>P — Point again</span>';
          host.appendChild(fr);
          const h = document.createElement('div');
          h.className = 'wo-ctx';
          h.textContent = '💡 ' + p.hint;
          host.appendChild(h);
          minWords = 25;
          checks = [
            { label: 'You spoke a good long answer (25+ words)',
              test: function (t2) { return words(t2).length >= 25; } },
            { label: 'You gave a REASON ("because", "the reason is")',
              test: function (t2) { return hasAny(t2, ['because', 'reason', 'since', "that's why", 'that is why']); } },
            { label: 'You gave an EXAMPLE ("for example", "one time")',
              test: function (t2) { return hasAny(t2, ['for example', 'for instance', 'one time', 'like when', 'such as', 'when i']); } },
            { label: 'You came back to your POINT at the end',
              test: function (t2) { return hasAny(t2, ['that is why', "that's why", 'so i think', 'this is why', 'that is what', "that's what", 'so yes']); } }
          ];
        } else if (p.kind === 'cer') {
          title = p.question;
          const t = document.createElement('div');
          t.className = 'wo-prompt';
          t.textContent = p.question;
          host.appendChild(t);
          const fr = document.createElement('div');
          fr.className = 'wo-frame';
          fr.innerHTML = '<span>Claim</span><span>Evidence</span>' +
            '<span>Reasoning</span>';
          host.appendChild(fr);
          const facts = document.createElement('div');
          facts.className = 'wo-ctx';
          facts.innerHTML = '<b>What you know:</b><ul>' +
            p.facts.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') +
            '</ul>';
          host.appendChild(facts);
          minWords = 20;
          const factText = p.facts.join(' ');
          checks = [
            { label: 'You stated a CLAIM (what you think)',
              test: function (t2) { return hasAny(t2, ['i think', 'my claim', 'i believe', 'it is', 'the answer is', 'i would say']); } },
            { label: 'You used EVIDENCE from the facts',
              test: function (t2) { return overlap(t2, factText) >= 0.18; } },
            { label: 'You explained your REASONING (why it proves it)',
              test: function (t2) { return hasAny(t2, ['because', 'so ', 'which means', 'this shows', 'that means', 'reasoning']); } },
            { label: 'You spoke a full answer (20+ words)',
              test: function (t2) { return words(t2).length >= 20; } }
          ];
        } else if (p.kind === 'story') {
          title = p.seed;
          const t = document.createElement('div');
          t.className = 'wo-prompt';
          t.textContent = p.seed;
          host.appendChild(t);
          const m = document.createElement('div');
          m.className = 'wo-ctx';
          m.innerHTML = '<b>Hit all three beats:</b><ul>' +
            p.must.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') +
            '</ul>';
          host.appendChild(m);
          minWords = 30;
          checks = [
            { label: 'You told a good long story (30+ words)',
              test: function (t2) { return words(t2).length >= 30; } },
            { label: 'You set the scene at the start',
              test: function (t2) { return hasAny(t2, ['one day', 'last', 'when i', 'there was', 'it was', 'i was', 'once']); } },
            { label: 'Something HAPPENED (a problem in the middle)',
              test: function (t2) { return hasAny(t2, ['but', 'suddenly', 'then', 'until', 'problem', 'wrong', 'could not', "couldn't"]); } },
            { label: 'You finished it properly',
              test: function (t2) { return hasAny(t2, ['finally', 'in the end', 'at last', 'so ', 'after that', 'ever since', 'and that']); } }
          ];
        } else if (p.kind === 'read') {
          title = p.line;
          const t = document.createElement('div');
          t.className = 'wo-prompt';
          t.textContent = 'Read this ' + p.how + ':';
          host.appendChild(t);
          const q = document.createElement('div');
          q.className = 'wo-ctx';
          q.style.fontSize = '1.25rem';
          q.textContent = '"' + p.line + '"';
          host.appendChild(q);
          const hear = document.createElement('button');
          hear.className = 'wo-ghost';
          hear.textContent = '🔊 Hear it first';
          hear.addEventListener('click', function () { speak(p.line); });
          host.appendChild(hear);
          target = p.line;
          minWords = 3;
          checks = [
            { label: 'You read the whole line',
              test: function (t2) { return overlap(t2, p.line) >= 0.45; } },
            { label: 'You said it out loud clearly',
              test: function (t2) { return words(t2).length >= 4; } }
          ];
        } else if (p.kind === 'script') {
          title = p.say;
          const t = document.createElement('div');
          t.className = 'wo-prompt';
          t.textContent = p.situation;
          host.appendChild(t);
          const q = document.createElement('div');
          q.className = 'wo-ctx';
          q.style.fontSize = '1.2rem';
          q.textContent = '"' + p.say + '"';
          host.appendChild(q);
          const hear = document.createElement('button');
          hear.className = 'wo-ghost';
          hear.textContent = '🔊 Hear it first';
          hear.addEventListener('click', function () { speak(p.say); });
          host.appendChild(hear);
          target = p.say;
          minWords = 4;
          checks = [
            { label: 'You said the whole sentence',
              test: function (t2) { return overlap(t2, p.say) >= 0.4; } },
            { label: 'You spoke it clearly',
              test: function (t2) { return words(t2).length >= 4; } }
          ];
        }

        host.appendChild(feedback);

        micBlock(host, {
          target: target,
          checks: checks,
          minWords: minWords,
          onDone: function (passed) {
            if (passed) wins++;
            recordSkill('s_' + p.kind, passed);
            P.speak.talks++;
            save();
            const math = bumpXp(passed ? 15 : 8);
            const fb = document.createElement('div');
            fb.className = 'wo-feedback';
            fb.innerHTML = (passed
              ? '🎉 <b>Strong speaking!</b>'
              : '💪 <b>Good try — you spoke, and that is the hard part.</b>') +
              '<span class="math">⭐ ' + esc(math) + ' XP</span>';
            host.appendChild(fb);

            if (p.model) {
              const mb = document.createElement('button');
              mb.className = 'wo-ghost';
              mb.textContent = '👂 Hear a strong answer';
              mb.addEventListener('click', function () { speak(p.model); });
              fb.appendChild(mb);
              const mt = document.createElement('div');
              mt.className = 'wo-ctx';
              mt.style.marginTop = '0.6rem';
              mt.innerHTML = '<b>One strong way to say it:</b><br>' +
                esc(p.model);
              fb.appendChild(mt);
            }
            if (p.teach) {
              const th = document.createElement('span');
              th.className = 'teach';
              th.innerHTML = '💡 ' + esc(p.teach);
              fb.appendChild(th);
            }
            nextButton(fb);
            sfx(passed ? 'good' : 'soft');
          }
        });
      }

      /* Shared mic UI + scoring. Falls back to a self-check list whenever
         the mic is off, unsupported, denied, or returns nothing. */
      function micBlock(host, cfg) {
        const wrap = document.createElement('div');
        host.appendChild(wrap);

        /* onDone must fire exactly ONCE per turn — otherwise "try again"
           after a scored attempt would award XP and append a second Next
           button. Retries are still allowed (and encouraged); they just
           re-score the display without re-paying. */
        let doneFired = false;
        function fireDone(passed) {
          if (doneFired) return;
          doneFired = true;
          cfg.onDone(passed);
        }

        function selfCheck(reason) {
          wrap.innerHTML = '';
          if (reason) {
            const r = document.createElement('p');
            r.className = 'wo-privacy';
            r.textContent = reason;
            wrap.appendChild(r);
          }
          const lab = document.createElement('div');
          lab.className = 'wo-sect';
          lab.innerHTML = '✅ Say it out loud, then tick what you did';
          wrap.appendChild(lab);
          const box = document.createElement('div');
          box.className = 'wo-check';
          cfg.checks.forEach(function (c) {
            const l = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            const sp = document.createElement('span');
            sp.textContent = c.label;
            l.appendChild(cb); l.appendChild(sp);
            cb.addEventListener('change', function () {
              l.classList.toggle('on', cb.checked);
            });
            box.appendChild(l);
          });
          wrap.appendChild(box);
          const done = document.createElement('button');
          done.className = 'wo-next';
          done.textContent = '✅ I said it';
          done.addEventListener('click', function () {
            const ticked = Array.prototype.filter.call(
              box.querySelectorAll('input'), function (c) { return c.checked; }
            ).length;
            done.disabled = true;
            wrap.querySelectorAll('input').forEach(function (c) { c.disabled = true; });
            fireDone(ticked >= Math.ceil(cfg.checks.length / 2));
          });
          wrap.appendChild(done);
        }

        if (!MIC_OK || !P.speak.mic) {
          selfCheck(MIC_OK
            ? '🎤 Microphone is switched off — using the self-check list.'
            : '🎤 This browser cannot listen — using the self-check list.');
          return;
        }

        const micBtn = document.createElement('button');
        micBtn.className = 'wo-mic';
        micBtn.textContent = '🎤 Tap to speak';
        wrap.appendChild(micBtn);

        const priv = document.createElement('p');
        priv.className = 'wo-privacy';
        priv.innerHTML = 'Your voice is turned into text just to give you ' +
          'feedback. Nothing is saved and nothing is sent by this page. ' +
          '(Your browser itself may use its maker\'s speech service to do ' +
          'the conversion.)';
        wrap.appendChild(priv);

        const heard = document.createElement('div');
        heard.className = 'wo-heard';
        heard.innerHTML = '<span class="lbl">What I hear:</span>' +
          '<span class="t" style="opacity:0.55">…tap the button and start talking</span>';
        wrap.appendChild(heard);

        const skip = document.createElement('button');
        skip.className = 'wo-ghost';
        skip.textContent = 'Rather not use the mic — let me tick a list';
        skip.addEventListener('click', function () { selfCheck(null); });
        wrap.appendChild(skip);

        let session = null;

        micBtn.addEventListener('click', function () {
          if (session) {   /* stop */
            session.stop();
            session = null;
            return;
          }
          heard.querySelector('.t').textContent = '…listening';
          heard.querySelector('.t').style.opacity = '0.55';
          micBtn.classList.add('live');
          micBtn.textContent = '⏹ Tap when finished';
          skip.style.display = 'none';

          session = listen(function (partial) {
            const t = heard.querySelector('.t');
            t.textContent = partial || '…listening';
            t.style.opacity = partial ? '1' : '0.55';
          }, function (transcript, err) {
            session = null;
            micBtn.classList.remove('live');
            micBtn.textContent = '🎤 Tap to speak';
            if (err === 'not-allowed' || err === 'service-not-allowed') {
              selfCheck('🎤 The microphone was blocked, so here is the ' +
                        'self-check list instead.');
              return;
            }
            if (err === 'unsupported' || err === 'start-failed') {
              selfCheck('🎤 The microphone could not start — using the ' +
                        'self-check list.');
              return;
            }
            if (!transcript || words(transcript).length < 2) {
              heard.querySelector('.t').textContent =
                'I did not catch that — tap and try again, a bit louder.';
              heard.querySelector('.t').style.opacity = '1';
              skip.style.display = '';
              return;
            }
            score(transcript);
          });
        });

        function score(transcript) {
          micBtn.disabled = true;
          skip.style.display = 'none';
          heard.classList.add('done');
          heard.querySelector('.t').textContent = transcript;
          heard.querySelector('.t').style.opacity = '1';

          const results = cfg.checks.map(function (c) {
            let ok = false;
            try { ok = !!c.test(transcript); } catch (_) {}
            return { label: c.label, ok: ok };
          });
          const list = document.createElement('div');
          list.className = 'wo-scores';
          results.forEach(function (r) {
            const d = document.createElement('div');
            d.className = 'wo-score ' + (r.ok ? 'ok' : 'no');
            d.innerHTML = '<span class="ic">' + (r.ok ? '✅' : '➖') +
              '</span><span>' + esc(r.label) + '</span>';
            list.appendChild(d);
          });
          wrap.appendChild(list);

          const nWords = words(transcript).length;
          const stat = document.createElement('p');
          stat.className = 'wo-privacy';
          stat.textContent = 'You spoke ' + nWords + ' word' +
            (nWords === 1 ? '' : 's') + '.';
          wrap.appendChild(stat);

          const passedCount = results.filter(function (r) { return r.ok; }).length;
          const passed = nWords >= cfg.minWords &&
                         passedCount >= Math.ceil(results.length / 2);

          /* Retrying is free and encouraged — saying it a second time is
             the actual practice. It re-opens the mic in place; XP was
             already paid by fireDone() below and is not paid twice. */
          const again = document.createElement('button');
          again.className = 'wo-ghost';
          again.textContent = '↻ Try saying it again';
          again.addEventListener('click', function () {
            again.remove();
            list.remove();
            stat.remove();
            heard.classList.remove('done');
            heard.querySelector('.t').textContent =
              '…tap the button and start talking';
            heard.querySelector('.t').style.opacity = '0.55';
            micBtn.disabled = false;
          });
          wrap.appendChild(again);

          fireDone(passed);
        }
      }

      function recap() {
        const total = round.length;
        const ratio = wins / total;
        const starsEarned = ratio >= 0.85 ? 3 : ratio >= 0.5 ? 2 : 1;
        const best = P.speak.stars[game.kind] || 0;
        if (starsEarned > best) P.speak.stars[game.kind] = starsEarned;
        save();
        sfx('star');

        el.innerHTML = '';
        el.appendChild(topBar('The Agora', home));
        const r = document.createElement('div');
        r.className = 'wo-recap';
        r.innerHTML = '<div class="big">' + game.em + '</div>' +
          '<h2>' + esc(game.name) + ' — spoken!</h2>' +
          '<div class="stars">' + stars3(starsEarned) + '</div>' +
          '<p>You spoke ' + total + ' time' + (total === 1 ? '' : 's') +
          ' out loud. That is how confidence gets built.</p>';
        const row = document.createElement('div');
        row.className = 'row';
        const again = document.createElement('button');
        again.className = 'wo-back';
        again.textContent = '↻ Speak again';
        again.addEventListener('click', function () { playGame(game); });
        row.appendChild(again);
        const back = document.createElement('button');
        back.className = 'wo-back';
        back.textContent = '🏛️ Other games';
        back.addEventListener('click', home);
        row.appendChild(back);
        r.appendChild(row);
        el.appendChild(r);
        speak('Great speaking! You spoke ' + total + ' times.');
        window.scrollTo(0, 0);
      }

      screen();
    }

    /* ── boot ─────────────────────────────────────────────────────────── */
    function boot(data) {
      DATA = data;
      home();
    }

    return { boot: boot };
  })();

  init();
})();
</script>
