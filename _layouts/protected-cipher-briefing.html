---
layout: default
---

<style>
  /* ── Password gate (same look as protected.html) ─────────────────────── */
  #protected-gate {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 40vh; padding: 2rem 1rem;
  }
  .gate-card {
    background: var(--sidebar-color, #f5f6fa);
    border: 1px solid var(--border-color, #e0e0e0);
    border-radius: 8px; padding: 2.5rem 2rem; max-width: 400px; width: 100%;
    text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  .gate-lock { font-size: 2.5rem; margin-bottom: 0.75rem; line-height: 1; }
  .gate-title {
    font-size: 1.25rem; font-weight: 600;
    color: var(--body-text-color, #27262b); margin: 0 0 0.5rem 0;
  }
  .gate-subtitle {
    font-size: 0.875rem; color: var(--body-text-color, #5c5962);
    opacity: 0.75; margin: 0 0 1.5rem 0;
  }
  .gate-input-row { display: flex; gap: 0.5rem; width: 100%; }
  #gate-password {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid var(--border-color, #d0d0d0); border-radius: 4px;
    font-size: 1rem; background: var(--body-background-color, #fff);
    color: var(--body-text-color, #27262b); outline: none;
    transition: border-color 0.15s;
  }
  #gate-password:focus { border-color: var(--links-color, #7253ed); }
  #gate-submit {
    padding: 0.5rem 1.1rem; background: var(--links-color, #7253ed);
    color: #fff; border: none; border-radius: 4px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer; transition: opacity 0.15s;
    white-space: nowrap;
  }
  #gate-submit:hover { opacity: 0.88; }
  #gate-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  #gate-error {
    margin-top: 0.85rem; font-size: 0.875rem; color: #c0392b;
    min-height: 1.25rem; display: none;
  }
  #gate-status {
    margin-top: 0.85rem; font-size: 0.875rem;
    color: var(--body-text-color, #5c5962); opacity: 0.7;
    min-height: 1.25rem; display: none;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }

  /* ── CIPHER · Briefing Room ──────────────────────────────────────────── */
  #cipher-root { display: none; }

  .cf {
    --sig: #22d3ee; --amber: #fbbf24; --stamp: #f87171; --ok: #4ade80;
    --vio: #c084fc;
    --paper: rgba(255,255,255,0.045); --paper2: rgba(192,132,252,0.08);
    --line: rgba(255,255,255,0.15);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    max-width: 820px;
  }
  .cf, .cf * { box-sizing: border-box; }
  .cf button, .cf input, .cf textarea {
    font-family: inherit; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .cf-top {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 1rem; flex-wrap: wrap;
  }
  .cf-back {
    background: var(--paper); border: 1px solid var(--line); color: inherit;
    border-radius: 6px; padding: 0.45rem 1rem; font-size: 0.95rem;
    cursor: pointer;
  }
  .cf-back:hover { border-color: var(--vio); }
  .cf-spacer { flex: 1; }
  .cf-pill {
    font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em;
    padding: 0.35rem 0.7rem; border-radius: 4px;
    background: var(--paper); border: 1px solid var(--line);
    white-space: nowrap; color: inherit;
  }
  /* Just the Docs colours every .main-content anchor via
     `.main-content a:not(.btn):not(.anchor-heading)` (specificity 0,3,1),
     which nothing we can write here beats — force the pill back. */
  .cf a.cf-pill { color: inherit !important; text-decoration: none; }

  button.cf-pill { cursor: pointer; }
  button.cf-pill.off { opacity: 0.42; }

  .cf-hero {
    border: 1px solid var(--line); border-left: 4px solid var(--vio);
    border-radius: 4px; padding: 1rem 1.2rem; margin-bottom: 1.2rem;
    background: linear-gradient(180deg, var(--paper2), transparent);
  }
  .cf-hero .tag {
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.22em;
    color: var(--vio); text-transform: uppercase;
  }
  .cf-hero h1 { margin: 0.25rem 0 0.3rem; font-size: 1.75rem; }
  .cf-hero p { margin: 0; opacity: 0.78; font-size: 0.98rem; line-height: 1.6; }

  .cf-statbar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(94px, 1fr));
    gap: 0.5rem; margin-top: 0.9rem;
  }
  .cf-stat {
    background: rgba(0,0,0,0.18); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.5rem 0.4rem; text-align: center;
  }
  .cf-stat b { display: block; font-family: var(--mono); font-size: 1.25rem;
               color: var(--vio); }
  .cf-stat span { font-size: 0.7rem; opacity: 0.7; letter-spacing: 0.04em; }

  .cf-sect {
    font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.18em;
    text-transform: uppercase; opacity: 0.62;
    margin: 1.6rem 0 0.6rem; display: flex; align-items: baseline;
    gap: 0.6rem; flex-wrap: wrap;
  }
  .cf-sect .n { color: var(--vio); }

  /* strand board */
  .cf-strands {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.55rem;
  }
  .cf-strand {
    background: var(--paper); border: 1px solid var(--line);
    border-top: 3px solid var(--line);
    border-radius: 4px; padding: 0.75rem 0.7rem; line-height: 1.4;
  }
  .cf-strand .nm { font-weight: 700; font-size: 0.98rem; }
  .cf-strand .bl { font-size: 0.78rem; opacity: 0.65; display: block;
                   margin: 0.2rem 0 0.4rem; }
  .cf-strand .sc { font-family: var(--mono); font-size: 0.72rem;
                   opacity: 0.75; }
  .cf-bar {
    height: 6px; border-radius: 999px; background: rgba(255,255,255,0.09);
    overflow: hidden; margin-top: 0.35rem;
  }
  .cf-bar > i { display: block; height: 100%; }

  .cf-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(184px, 1fr));
    gap: 0.55rem;
  }
  .cf-task {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.8rem 0.7rem; cursor: pointer;
    color: inherit; text-align: left; line-height: 1.35;
  }
  .cf-task:hover { border-color: var(--vio); }
  .cf-task .em { font-size: 1.4rem; }
  .cf-task .nm { display: block; font-weight: 700; font-size: 0.95rem;
                 margin: 0.2rem 0 0.15rem; }
  .cf-task .dc { display: block; font-size: 0.74rem; opacity: 0.6;
                 font-family: var(--mono); letter-spacing: 0.04em; }
  .cf-task .st { font-family: var(--mono); font-size: 0.7rem;
                 letter-spacing: 0.1em; color: var(--ok); }

  .cf-panel {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 1rem 1.1rem; margin-bottom: 0.9rem;
    line-height: 1.65;
  }
  .cf-panel.quote { border-left: 3px solid var(--vio);
                    background: var(--paper2); font-size: 1.08rem; }
  .cf-panel.prep { border-left: 3px solid var(--amber); }
  .cf-label {
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em;
    text-transform: uppercase; opacity: 0.6; display: block;
    margin-bottom: 0.35rem;
  }

  /* mic */
  .cf-mic {
    display: block; margin: 0.8rem auto; padding: 0.95rem 2.2rem;
    background: var(--vio); color: #24103a; border: none;
    border-radius: 999px; font-size: 1.1rem; font-weight: 700;
    cursor: pointer;
  }
  .cf-mic:hover { opacity: 0.9; }
  .cf-mic.live { background: var(--stamp); color: #fff;
                 animation: cfPulse 1.1s infinite; }
  .cf-timer {
    text-align: center; font-family: var(--mono); font-size: 2rem;
    letter-spacing: 0.05em; margin: 0.3rem 0;
  }
  .cf-timer.over { color: var(--amber); }
  .cf-heard {
    background: rgba(0,0,0,0.22); border: 1px dashed var(--line);
    border-radius: 4px; padding: 0.8rem 1rem; margin: 0.7rem 0;
    font-size: 1.04rem; line-height: 1.65; min-height: 3rem;
    white-space: pre-wrap;
  }
  .cf-heard.done { border-style: solid; border-color: var(--ok); }
  .cf-privacy { font-size: 0.76rem; opacity: 0.55; text-align: center;
                line-height: 1.55; margin-top: 0.4rem; }

  /* rating table */
  .cf-rate { margin: 0.6rem 0; }
  .cf-rate .hdr {
    display: flex; gap: 0.5rem; font-family: var(--mono); font-size: 0.66rem;
    letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.55;
    padding: 0 0.6rem 0.3rem;
  }
  .cf-rate .hdr .lbl { flex: 1; }
  .cf-rate .hdr .col { width: 88px; text-align: center; flex: none; }
  .cf-rrow {
    display: flex; gap: 0.5rem; align-items: center;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: 4px; padding: 0.55rem 0.6rem; margin-bottom: 0.4rem;
    line-height: 1.5;
  }
  .cf-rrow .lbl { flex: 1; font-size: 0.96rem; }
  .cf-rrow .grp { width: 88px; flex: none; display: flex; gap: 0.2rem;
                  justify-content: center; }
  .cf-dot {
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); background: none; color: inherit;
    font-size: 0.85rem; line-height: 1; padding: 0;
  }
  .cf-dot:hover { border-color: var(--vio); }
  .cf-dot.on { background: var(--ok); border-color: var(--ok); color: #06280f; }
  .cf-dot.mid.on { background: var(--amber); border-color: var(--amber);
                   color: #2a1c02; }
  .cf-dot.low.on { background: var(--stamp); border-color: var(--stamp);
                   color: #2a0606; }
  .cf-coach {
    display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    font-size: 0.9rem; opacity: 0.85; margin: 0.6rem 0;
  }

  .cf-opts { display: flex; flex-direction: column; gap: 0.5rem; }
  .cf-opt {
    background: var(--paper); border: 2px solid var(--line); color: inherit;
    border-radius: 4px; padding: 0.7rem 0.95rem; font-size: 1.02rem;
    cursor: pointer; text-align: left; line-height: 1.5;
  }
  .cf-opt:hover:not(:disabled) { border-color: var(--vio); }
  .cf-opt:disabled { cursor: default; }
  .cf-opt.dim { opacity: 0.32; }
  .cf-opt.yes { border-color: var(--ok); background: rgba(74,222,128,0.12); }
  .cf-opt.no { border-color: var(--stamp); animation: cfNudge 0.35s; }
  .cf-feedback { margin-top: 0.85rem; font-size: 1.02rem; line-height: 1.6; }
  .cf-feedback .teach {
    display: block; margin-top: 0.4rem; padding: 0.6rem 0.8rem;
    background: rgba(0,0,0,0.2); border-left: 3px solid var(--vio);
    border-radius: 0 4px 4px 0; font-size: 0.98rem;
  }

  .cf-btn {
    background: var(--vio); color: #24103a; border: none;
    border-radius: 4px; padding: 0.7rem 1.6rem; font-size: 1.02rem;
    font-weight: 700; cursor: pointer;
  }
  .cf-btn:hover { opacity: 0.9; }
  .cf-btn.ghost { background: none; color: inherit;
                  border: 1px solid var(--line); font-weight: 400; }
  .cf-btn.ghost:hover { border-color: var(--vio); }
  .cf-row { display: flex; gap: 0.5rem; flex-wrap: wrap;
            align-items: center; margin-top: 0.9rem; }

  .cf-log {
    background: var(--paper); border: 1px solid var(--line);
    border-left: 3px solid var(--vio); border-radius: 0 4px 4px 0;
    padding: 0.7rem 0.9rem; margin-bottom: 0.45rem; line-height: 1.6;
  }
  .cf-log .meta { font-family: var(--mono); font-size: 0.72rem;
                  opacity: 0.6; letter-spacing: 0.05em; }

  .cf-empty {
    border: 1px dashed var(--line); border-radius: 4px;
    padding: 1.2rem 1rem; text-align: center; opacity: 0.75;
    line-height: 1.6; font-size: 0.96rem;
  }

  @keyframes cfNudge {
    25% { transform: translateX(-4px); } 75% { transform: translateX(4px); }
  }
  @keyframes cfPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.55); }
    50% { box-shadow: 0 0 0 12px rgba(248,113,113,0); }
  }

  @media (max-width: 560px) {
    .cf-hero h1 { font-size: 1.4rem; }
    .cf-rrow .grp { width: 76px; }
    .cf-rate .hdr .col { width: 76px; }
    .cf-dot { width: 23px; height: 23px; }
  }
</style>

<!-- Password gate -->
<div id="protected-gate">
  <div class="gate-card">
    <div class="gate-lock" aria-hidden="true">🔒</div>
    <p class="gate-title">{{ page.title | default: "Protected Page" }}</p>
    <p class="gate-subtitle">This page is password-protected. Enter the passphrase to unlock.</p>
    <div class="gate-input-row">
      <label for="gate-password" class="sr-only">Passphrase</label>
      <input id="gate-password" type="password" placeholder="Passphrase" autocomplete="off" autofocus />
      <button id="gate-submit">Unlock</button>
    </div>
    <div id="gate-error" role="alert" aria-live="polite">Incorrect passphrase — please try again.</div>
    <div id="gate-status" role="status" aria-live="polite">Decrypting…</div>
  </div>
</div>

<div id="cipher-root"><div class="cf" id="cf"></div></div>

<script>
(function () {
  'use strict';

  const ENCRYPTED_B64 = {{ page.encrypted | jsonify }};
  const STORAGE_KEY = 'mwestwood-passphrase';

  /* ── Gate (same crypto as protected.html) ───────────────────────────── */
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  async function deriveKey(passphrase, salt) {
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey(
      'raw', enc.encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decrypt(passphrase) {
    const blob = b64ToBytes(ENCRYPTED_B64);
    const key = await deriveKey(passphrase, blob.slice(0, 16));
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: blob.slice(16, 28) }, key, blob.slice(28));
    return new TextDecoder().decode(pt);
  }

  const gate = document.getElementById('protected-gate');
  const rootWrap = document.getElementById('cipher-root');
  const input = document.getElementById('gate-password');
  const btn = document.getElementById('gate-submit');
  const errEl = document.getElementById('gate-error');
  const statusEl = document.getElementById('gate-status');

  function showError(msg) {
    errEl.textContent = msg || 'Incorrect passphrase — please try again.';
    errEl.style.display = 'block';
    statusEl.style.display = 'none';
    btn.disabled = false;
    input.select();
  }
  function showStatus(msg) {
    statusEl.textContent = msg;
    statusEl.style.display = 'block';
    errEl.style.display = 'none';
  }
  function reveal(text) {
    let data;
    try { data = JSON.parse(text); }
    catch (e) { showError('Data error: could not parse briefing bank.'); return; }
    gate.style.display = 'none';
    rootWrap.style.display = 'block';
    Briefing.boot(data);
  }
  async function tryUnlock(passphrase, cache) {
    try {
      showStatus('Decrypting…');
      btn.disabled = true;
      const text = await decrypt(passphrase);
      if (cache) { try { localStorage.setItem(STORAGE_KEY, passphrase); } catch (_) {} }
      reveal(text);
    } catch (e) {
      if (e instanceof DOMException && e.name === 'OperationError') {
        showError('Incorrect passphrase — please try again.');
      } else if (e instanceof TypeError && e.message.includes('subtle')) {
        showError('Error: Web Crypto API unavailable. This page requires HTTPS.');
      } else {
        showError('Error (' + e.name + '): ' + e.message);
      }
    }
  }
  async function init() {
    if (!ENCRYPTED_B64) { showError('No encrypted data on this page.'); return; }
    try {
      const cached = localStorage.getItem(STORAGE_KEY);
      if (cached) {
        showStatus('Unlocking…');
        btn.disabled = true; input.disabled = true;
        try { reveal(await decrypt(cached)); return; }
        catch (_) {
          localStorage.removeItem(STORAGE_KEY);
          btn.disabled = false; input.disabled = false;
          statusEl.style.display = 'none';
        }
      }
    } catch (_) {}
  }
  btn.addEventListener('click', function () {
    if (!input.value) { input.focus(); return; }
    tryUnlock(input.value, true);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') btn.click();
  });

  /* ═══════════════════ CIPHER · Briefing Room ══════════════════════════
     Speaking, on the Oracy Skills Framework (Cambridge + Voice 21) —
     four strands: physical, linguistic, cognitive, social & emotional.
     P.R.E.P. (a Toastmasters device, not a school framework) has been
     removed entirely.

     How a task runs:
       1. read the brief and the prep note
       2. speak — the mic transcribes ONLY so he can see what he said
       3. rate himself against that task's oracy sub-skills, with an
          optional grown-up column beside his own
     No machine scores the speech. A transcript is never stored — only
     the ratings and the task id go into the save.

     Plus Talk Moves: Accountable Talk (Michaels/O'Connor/Resnick) — the
     one part of the previous build that was correctly grounded, kept.

     Save: `cipher-v1` under P.briefing.
  ═══════════════════════════════════════════════════════════════════════ */

  const Briefing = (function () {

    const el = document.getElementById('cf');
    let DATA = null;

    const KIND_LABEL = { briefing: 'BRIEFING', prompt: 'ON THE SPOT',
                         summarise: 'SUMMARISE', reason: 'MAKE A CASE' };

    /* ── save ─────────────────────────────────────────────────────────── */
    const PKEY = 'cipher-v1';
    let P = {};
    try { P = JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (_) {}
    if (!P || typeof P !== 'object') P = {};
    P.v = P.v || 1;
    P.briefing = P.briefing || {};
    P.briefing.log = P.briefing.log || [];    /* {task,d,self:{},coach:{}} */
    P.briefing.moves = P.briefing.moves || {}; /* moveId -> 1 when right */
    P.books = P.books || [];
    P.settings = P.settings || {};
    if (P.settings.voice === undefined) P.settings.voice = true;
    if (P.settings.sound === undefined) P.settings.sound = true;
    if (P.settings.mic === undefined) P.settings.mic = true;
    if (P.settings.coach === undefined) P.settings.coach = false;
    function save() {
      try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) {}
    }
    function today() { return new Date().toISOString().slice(0, 10); }

    /* ── speech out ───────────────────────────────────────────────────── */
    const VOICE_KEY = 'mwestwood-voice-name';
    let voiceName = localStorage.getItem(VOICE_KEY) || '';
    const JOKE_VOICES = ['Albert', 'Bad News', 'Bahh', 'Bells', 'Boing',
      'Bubbles', 'Cellos', 'Good News', 'Jester', 'Organ', 'Superstar',
      'Trinoids', 'Whisper', 'Wobble', 'Zarvox', 'Deranged', 'Hysterical'];
    const NICE_NAMES = /^(Samantha|Ava|Allison|Susan|Zoe|Karen|Daniel|Moira|Tessa|Fiona|Serena|Kate)\b/;
    let VOICES = [], chosenVoice = null;

    function rankVoice(v) {
      const n = v.name;
      let r = 60;
      if (n === 'Google US English') r = -100;
      else if (/natural|neural/i.test(n)) r = 0;
      else if (/enhanced|premium/i.test(n)) r = 10;
      else if (NICE_NAMES.test(n)) r = 20;
      else if (/^Google/i.test(n)) r = 30;
      else if (v.localService) r = 40;
      if (/^en[-_]US/i.test(v.lang)) r -= 5;
      else if (/^en/i.test(v.lang)) r -= 2;
      return r;
    }
    function loadVoices() {
      try {
        if (!window.speechSynthesis) return;
        const all = speechSynthesis.getVoices().filter(function (v) {
          if (!/^en/i.test(v.lang)) return false;
          return JOKE_VOICES.indexOf(v.name.replace(/\s*\(.*\)$/, '')) === -1;
        });
        if (!all.length) return;
        all.sort(function (a, b) {
          return rankVoice(a) - rankVoice(b) || a.name.localeCompare(b.name);
        });
        VOICES = all;
        chosenVoice = voiceName
          ? (all.find(function (v) { return v.name === voiceName; }) || all[0])
          : all[0];
      } catch (_) {}
    }
    loadVoices();
    try { speechSynthesis.onvoiceschanged = loadVoices; } catch (_) {}
    setTimeout(loadVoices, 300);

    const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const CAN_DEFER_SPEECH = !IS_IOS;

    function speak(text) {
      if (!P.settings.voice) return;
      try {
        if (!window.speechSynthesis) return;
        const was = speechSynthesis.speaking;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(
          String(text).replace(/[🎚️🗝️🧠🤝📕🕵️⚖️🎯📜⏱️🧑‍🏫🙋🙂🎤🎭…]/g, ''));
        u.rate = 0.92;
        if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; u.pitch = 1; }
        if (was && CAN_DEFER_SPEECH) {
          setTimeout(function () { try { speechSynthesis.speak(u); } catch (_) {} }, 50);
        } else { speechSynthesis.speak(u); }
      } catch (_) {}
    }

    let audioCtx = null;
    function tone(f, s, d, v) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, audioCtx.currentTime + s);
      g.gain.linearRampToValueAtTime(v, audioCtx.currentTime + s + 0.02);
      g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + s + d);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + s);
      o.stop(audioCtx.currentTime + s + d + 0.05);
    }
    /* iOS only starts an AudioContext from inside a real gesture — the
       mic button calls this before any later tick wants a tone. */
    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (_) {}
    }
    function sfx(kind) {
      if (!P.settings.sound) return;
      try {
        unlockAudio();
        if (!audioCtx) return;
        if (kind === 'good') { tone(523, 0, 0.13, 0.06); tone(784, 0.11, 0.18, 0.06); }
        else if (kind === 'soft') { tone(233, 0, 0.17, 0.04); }
        else if (kind === 'badge') { tone(659, 0, 0.11, 0.055); tone(784, 0.09, 0.11, 0.055); tone(1047, 0.19, 0.24, 0.055); }
      } catch (_) {}
    }

    /* ── speech in ────────────────────────────────────────────────────── */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    /* ── helpers ─────────────────────────────────────────────────────── */
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
                 '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function shuffle(a) {
      const arr = a.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }
    function allSkills() {
      const m = {};
      DATA.strands.forEach(function (s) {
        s.skills.forEach(function (k) { m[k.id] = { skill: k, strand: s }; });
      });
      return m;
    }
    function strandScore(strandId) {
      /* mean of the most recent self-rating for each skill in the strand */
      const strand = DATA.strands.find(function (s) { return s.id === strandId; });
      if (!strand) return null;
      const latest = {};
      P.briefing.log.forEach(function (entry) {
        Object.keys(entry.self || {}).forEach(function (k) { latest[k] = entry.self[k]; });
      });
      const vals = strand.skills
        .map(function (k) { return latest[k.id]; })
        .filter(function (v) { return typeof v === 'number'; });
      if (!vals.length) return null;
      return vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    }

    /* ── a speaking task ──────────────────────────────────────────────── */

      const readBtn = document.createElement('button');

      });

      /* mic + timer */
      const stage = document.createElement('div');

      const timer = document.createElement('div');
      timer.className = 'cf-timer';

      stage.appendChild(mic);

          'conversion.)';

      let rec = null, t0 = 0, tick = null, spoke = false;

      function stopTimer() {
        if (tick) { clearInterval(tick); tick = null; }

        const s = Math.floor(ms / 1000);
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      }

        unlockAudio();
        if (rec || tick) {

          else { stopTimer(); finishSpeaking(); }
          return;
        }
        spoke = true;
        t0 = Date.now();
        mic.classList.add('live');
        mic.textContent = '⏹ Done';
        heard.style.opacity = '1';
        if (MIC_OK) heard.textContent = '…';
        tick = setInterval(function () {
          const ms = Date.now() - t0;
          timer.textContent = fmt(ms);
          timer.classList.toggle('over', ms > t.seconds * 1000);

        if (!MIC_OK) return;

        try { rec = new SR(); } catch (_) { rec = null; return; }

            else interim += r[0].transcript;
          }
          heard.textContent = (finalText + interim).trim() || '…';
        };
        rec.onerror = function (e) {
          const c = (e && e.error) || 'error';
          if (c === 'not-allowed' || c === 'service-not-allowed') {

              'then rate yourself below.';
          }
        };
        rec.onend = function () {
          rec = null;
          stopTimer();
          finishSpeaking();
        };
        try { rec.start(); } catch (_) { rec = null; }
      });

      function finishSpeaking() {

          fb.innerHTML = '🗂️ <b>Logged.</b> ' + strong + ' of ' + n +

      skip.textContent = 'I said it out loud — rate me';
      skip.addEventListener('click', function () {
        stopTimer();
        if (rec) { try { rec.stop(); } catch (_) {} }

    /* ── talk moves round ─────────────────────────────────────────────── */
    function movesRound() {
      const round = shuffle(DATA.moves).slice(0, 4);
      let idx = 0;

      function ask() {
        const m = round[idx];
        let tries = 0;

        el.innerHTML = '';
        el.appendChild(topBar('Briefing Room', home));

        const hero = document.createElement('div');
        hero.className = 'cf-hero';
        hero.innerHTML = '<div class="tag">Talk move ' + (idx + 1) + ' of ' +
          round.length + '</div><h1>💬 What do you say?</h1>';
        el.appendChild(hero);

        const sit = document.createElement('div');
        sit.className = 'cf-panel quote';
        sit.innerHTML = '<span class="cf-label">The situation</span>' +
          esc(m.situation);
        el.appendChild(sit);

        const opts = document.createElement('div');
        opts.className = 'cf-opts';
        const fb = document.createElement('div');
        fb.className = 'cf-feedback';

        shuffle(m.opts).forEach(function (o) {
          const b = document.createElement('button');
          b.className = 'cf-opt';
          b.textContent = o[0];
          b.addEventListener('click', function () {
            if (o[1]) {
              Array.prototype.forEach.call(opts.children, function (x) { x.disabled = true; });
              b.classList.add('yes');
              sfx('good');
              if (tries === 0) { P.briefing.moves[m.id] = 1; save(); }
              fb.innerHTML = '✅ <b>Strong move.</b>' +
                '<span class="teach">' + esc(m.teach) + '</span>';
              sayIt(fb, o[0]);
            } else {
              tries++;
              if (tries === 1) {
                b.classList.add('no');
                setTimeout(function () {
                  b.classList.remove('no'); b.classList.add('dim'); b.disabled = true;
                }, 350);
                sfx('soft');
                fb.textContent = 'That one shuts the conversation down. Which keeps it going?';
              } else {
                let correct = '';
                m.opts.forEach(function (o2) { if (o2[1]) correct = o2[0]; });
                Array.prototype.forEach.call(opts.children, function (x) {
                  x.disabled = true;
                  if (x.textContent === correct) x.classList.add('yes');
                });
                sfx('soft');
                fb.innerHTML = 'Here is the strong one.' +
                  '<span class="teach">' + esc(m.teach) + '</span>';
                sayIt(fb, correct);
              }
            }
          });
          opts.appendChild(b);
        });
        el.appendChild(opts);
        el.appendChild(fb);
        window.scrollTo(0, 0);
      }

      /* saying the move aloud is the point — reading it silently does not
         put it in his mouth for a real conversation */
      function sayIt(host, line) {
        const box = document.createElement('div');
        box.className = 'cf-panel';
        box.innerHTML = '<span class="cf-label">Now say it out loud</span>' +
          '<div style="font-size:1.08rem">"' + esc(line) + '"</div>';
        const row = document.createElement('div');
        row.className = 'cf-row';
        const hear = document.createElement('button');
        hear.className = 'cf-btn ghost';
        hear.textContent = '🔊 Hear it first';
        hear.addEventListener('click', function () { speak(line); });
        row.appendChild(hear);
        const said = document.createElement('button');
        said.className = 'cf-btn';
        said.textContent = idx + 1 < round.length ? 'Said it — next ▸' : 'Said it — finish ▸';
        said.addEventListener('click', function () {
          idx++;
          if (idx < round.length) ask();
          else {
            el.innerHTML = '';
            el.appendChild(topBar('Briefing Room', home));
            const learned = Object.keys(P.briefing.moves).length;
            const r = document.createElement('div');
            r.className = 'cf-hero';
            r.innerHTML = '<div class="tag">Round complete</div>' +
              '<h1>💬 Talk moves</h1>' +
              '<p>You now have <b>' + learned + ' of ' + DATA.moves.length +
              '</b> moves banked. These are the sentences that keep a real ' +
              'discussion alive — use one at dinner tonight.</p>';
            el.appendChild(r);
            const row2 = document.createElement('div');
            row2.className = 'cf-row';
            const again = document.createElement('button');
            again.className = 'cf-btn';
            again.textContent = '↻ Another round';
            again.addEventListener('click', movesRound);
            row2.appendChild(again);
            const back = document.createElement('button');
            back.className = 'cf-btn ghost';
            back.textContent = 'Back';
            back.addEventListener('click', home);
            row2.appendChild(back);
            el.appendChild(row2);
            sfx('badge');
            window.scrollTo(0, 0);
          }
        });
        row.appendChild(said);
        box.appendChild(row);
        host.appendChild(box);
      }

      ask();
    }

    /* ── briefing log ─────────────────────────────────────────────────── */
    function logView() {
      el.innerHTML = '';
      el.appendChild(topBar('Briefing Room', home));
      const hero = document.createElement('div');
      hero.className = 'cf-hero';
      hero.innerHTML = '<div class="tag">Cipher // Log</div>' +
        '<h1>🗂️ Briefing log</h1>' +
        '<p>Every time you spoke, and how you rated it. Watch the ○ turn ' +
        'into ●.</p>';
      el.appendChild(hero);

      const skills = allSkills();
      if (!P.briefing.log.length) {
        const e = document.createElement('div');
        e.className = 'cf-empty';
        e.textContent = 'Nothing logged yet.';
        el.appendChild(e);
      }
      P.briefing.log.forEach(function (entry, i) {
        const vals = Object.keys(entry.self || {});
        const strong = vals.filter(function (k) { return entry.self[k] === 2; }).length;
        const d = document.createElement('div');
        d.className = 'cf-log';
        d.innerHTML = '<div class="meta">' + esc(entry.d) + ' · ' +
          strong + ' / ' + vals.length + ' nailed</div>' +
          '<b>' + esc(entry.title || entry.task) + '</b><br>' +
          vals.map(function (k) {
            const s = skills[k];
            const v = entry.self[k];
            return '<span style="opacity:0.8">' +
              (v === 2 ? '●' : v === 1 ? '◐' : '○') + ' ' +
              esc(s ? s.skill.name : k) + '</span>';
          }).join(' · ');
        const del = document.createElement('button');
        del.className = 'cf-btn ghost';
        del.style.padding = '0.25rem 0.7rem';
        del.style.fontSize = '0.8rem';
        del.style.marginTop = '0.5rem';
        del.textContent = 'Remove';
        del.addEventListener('click', function () {
          P.briefing.log.splice(i, 1); save(); logView();
        });
        d.appendChild(del);
        el.appendChild(d);
      });
      window.scrollTo(0, 0);
    }

    function boot(data) { DATA = data; home(); }
    return { boot: boot };
  })();

  init();
})();
</script>
